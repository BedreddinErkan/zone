name: Feature Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      task:
        description: "Manual agent task"
        required: false
        default: "Analyze the repository changes and produce a CI-safe agent evaluation."
      repo_path:
        description: "Repository path to analyze"
        required: false
        default: "."

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: feature-agent-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feature-agent:
    name: Zone CI
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: production
      AGENT_RESULT_PATH: .agent-cache/last-result.json
      AGENT_LOG_PATH: .agent-cache/ci-output.log
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Prepare CI context
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .agent-cache

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "AGENT_TASK<<EOF"
              echo "Review this pull request and evaluate whether the requested change is safe to apply automatically."
              echo
              echo "PR Title: ${{ github.event.pull_request.title }}"
              echo
              echo "PR Body:"
              printf '%s\n' "${{ github.event.pull_request.body }}"
              echo "EOF"
            } >> "$GITHUB_ENV"

            echo "AGENT_REPO_PATH=." >> "$GITHUB_ENV"
            echo "ZONE_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "ZONE_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
            echo "ZONE_PR_NUMBER=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          else
            {
              echo "AGENT_TASK<<EOF"
              printf '%s\n' "${{ github.event.inputs.task || 'Analyze the repository changes and produce a CI-safe agent evaluation.' }}"
              echo "EOF"
            } >> "$GITHUB_ENV"

            echo "AGENT_REPO_PATH=${{ github.event.inputs.repo_path || '.' }}" >> "$GITHUB_ENV"

            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            git fetch origin "${DEFAULT_BRANCH}" --depth=1
            echo "ZONE_BASE_SHA=$(git rev-parse origin/${DEFAULT_BRANCH})" >> "$GITHUB_ENV"
            echo "ZONE_HEAD_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
            echo "ZONE_PR_NUMBER=" >> "$GITHUB_ENV"
          fi

      - name: Run Zone Agent
        id: agent
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .agent-cache

          npx tsx src/cli/index.ts \
            --task "$AGENT_TASK" \
            --repo "$AGENT_REPO_PATH" \
            --ci \
            --diff-aware \
            --mode preview \
            --output "$AGENT_RESULT_PATH" \
            2>&1 | tee "$AGENT_LOG_PATH"

      - name: Read agent result
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$AGENT_RESULT_PATH" ]; then
            echo "decision=blocked" >> "$GITHUB_OUTPUT"
            echo "confidence=0" >> "$GITHUB_OUTPUT"
            echo "status_line=STATUS: BLOCKED" >> "$GITHUB_OUTPUT"
            echo "summary_line<<EOF" >> "$GITHUB_OUTPUT"
            echo "Agent result file was not produced." >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node <<'EOF'
          const fs = require("fs");

          const path = process.env.AGENT_RESULT_PATH;
          const out = process.env.GITHUB_OUTPUT;

          const data = JSON.parse(fs.readFileSync(path, "utf8"));

          const decision =
            data?.decision?.mode && typeof data.decision.mode === "string"
              ? data.decision.mode
              : "unknown";

          const confidence =
            typeof data?.decision?.confidenceScore === "number"
              ? data.decision.confidenceScore
              : typeof data?.confidence?.finalScore === "number"
                ? data.confidence.finalScore
                : "n/a";

          const reason =
            data?.decision?.reason && typeof data.decision.reason === "string"
              ? data.decision.reason
              : "No decision reason provided.";

          const penalties = Array.isArray(data?.confidenceDetails?.penalties)
            ? data.confidenceDetails.penalties
                .map((item) => item?.label)
                .filter((value) => typeof value === "string" && value.trim().length > 0)
            : [];

          const statusLine =
            decision === "blocked"
              ? "STATUS: BLOCKED"
              : decision === "preview_only"
                ? "STATUS: PREVIEW ONLY"
                : decision === "safe_to_apply"
                  ? "STATUS: SAFE TO APPLY"
                  : "STATUS: UNKNOWN";

          const summaryParts = [
            `decision=${decision}`,
            `confidence=${confidence}`,
            `reason=${reason}`,
            penalties.length > 0
              ? `penalties=${penalties.slice(0, 4).join(" | ")}`
              : "penalties=none"
          ];

          fs.appendFileSync(out, `decision=${decision}\n`);
          fs.appendFileSync(out, `confidence=${confidence}\n`);
          fs.appendFileSync(out, `status_line=${statusLine}\n`);
          fs.appendFileSync(out, `summary_line<<EOF\n${summaryParts.join(" ; ")}\nEOF\n`);
          EOF

      - name: Print CI status line
        if: always()
        shell: bash
        run: |
          echo "${{ steps.result.outputs.status_line }}"
          echo "Confidence: ${{ steps.result.outputs.confidence }}"
          echo "Details: ${{ steps.result.outputs.summary_line }}"

      - name: Write GitHub summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Zone CI Result"
            echo
            echo "- **Decision:** \`${{ steps.result.outputs.decision }}\`"
            echo "- **Confidence:** \`${{ steps.result.outputs.confidence }}\`"
            echo "- **Status line:** \`${{ steps.result.outputs.status_line }}\`"
            echo
            echo "### Notes"
            echo "${{ steps.result.outputs.summary_line }}"
            echo
            echo "### Artifacts"
            echo "- \`.agent-cache/last-result.json\`"
            echo "- \`.agent-cache/ci-output.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload agent artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zone-ci-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: |
            .agent-cache/last-result.json
            .agent-cache/ci-output.log

      - name: Enforce CI decision
        if: always()
        shell: bash
        run: |
          case "${{ steps.result.outputs.decision }}" in
            blocked)
              echo "::error::Zone decision is BLOCKED. Failing workflow."
              exit 1
              ;;
            preview_only)
              echo "::warning::Zone decision is PREVIEW_ONLY. Workflow passes with warning."
              exit 0
              ;;
            safe_to_apply)
              echo "Smile Agent decision is SAFE_TO_APPLY."
              exit 0
              ;;
            *)
              echo "::warning::Unknown decision mode '${{ steps.result.outputs.decision }}'. Workflow will pass, but review is recommended."
              exit 0
              ;;
          esac