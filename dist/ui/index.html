      --surface-alpha-4:rgb(255 255 255 / 0.06);
      --surface-alpha-5:rgb(255 255 255 / 0.08);
      --surface-alpha-6:rgb(255 255 255 / 0.10);
      --surface-alpha-7:rgb(255 255 255 / 0.12);

      /* Spacing scale. */
      --space-xs:4px;
      --space-sm:6px;
      --space-md:8px;
      --space-lg:10px;
      --space-xl:12px;
      --space-2xl:14px;

      /* Border radius scale. */
      --radius-sm:6px;
      --radius-md:8px;
      --radius-lg:10px;
      --radius-pill:999px;

      /* Typography. */
      --font-size-xs:10px;
      --font-size-sm:11px;
      --font-size-base:12px;
      --font-size-md:13px;
      --font-family-sans:'IBM Plex Sans', system-ui, sans-serif;
      --font-family-mono:'JetBrains Mono', 'Fira Code', monospace;

      /* Motion. */
      --transition-fast:150ms ease;
      --transition-base:180ms ease;
      --transition-slow:220ms ease;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; overflow:hidden; min-width:900px;
      background:var(--bg); color:var(--text-1);
      font-family:var(--font-family-sans);
    }
    button,textarea,input{font:inherit}
    button{cursor:pointer}
    button:focus,textarea:focus{outline:none}

    /* Scrollbars */
    *{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.14) transparent}
    *::-webkit-scrollbar{height:6px;width:6px}
    *::-webkit-scrollbar-track{background:transparent}
    *::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:var(--radius-pill)}
    *::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22)}

    .app{height:100%;display:flex}

    /* LEFT */
    .left{
      width:220px;flex:0 0 220px;
      background:var(--bg);border-right:1px solid var(--border);
      display:flex;flex-direction:column;overflow:hidden;position:relative;
      transition:width 180ms ease,flex-basis 180ms ease,border-color 180ms ease
    }
    .left.open{width:var(--sidebar-open-width,220px);flex:0 0 var(--sidebar-open-width,220px);pointer-events:auto}
    .left.compact{width:60px;flex:0 0 60px;pointer-events:auto}
    .left.is-resizing{transition:none}
    .left-top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-xl);border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:var(--space-lg);min-width:0}
    .brand .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .left-actions{display:flex;gap:var(--space-md)}
    .sidebar-toggle{
      position:absolute;right:var(--space-xl);bottom:var(--space-2xl);z-index:35;
      width:28px;height:28px;border-radius:var(--radius-md);border:1px solid var(--border);
      background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;
      transition:background var(--transition-base),border-color var(--transition-base),color var(--transition-base),opacity 180ms ease
    }
    .sidebar-toggle:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}
    .sidebar-toggle svg{width:14px;height:14px}
    .icon-btn{
      width:28px;height:28px;border-radius:var(--radius-md);border:1px solid var(--border);
      background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;
      transition:background var(--transition-base),border-color var(--transition-base),color var(--transition-base);
    }
    .icon-btn:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}
    .icon-btn.violet{background:var(--violet-bg);border-color:var(--violet-bd);color:var(--text-1)}
    .icon-btn.active{background:var(--violet-bg);border-color:var(--violet-bd);color:var(--violet)}
    .dropdown{
      position:absolute;top:54px;right:var(--space-xl);width:196px;z-index:30;
      border:1px solid var(--border);background:var(--surface2);border-radius:var(--radius-lg);
      box-shadow:0 18px 50px rgba(0,0,0,0.55);padding:var(--space-lg);display:none;
    }
    .dropdown.open{display:block}
    .dropdown .label{font-size:var(--font-size-xs);color:var(--text-4);letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--space-md)}
    .repo-row{width:100%;display:flex;gap:var(--space-lg);align-items:center;padding:var(--space-md);border-radius:var(--radius-md);border:1px solid transparent;background:transparent;color:var(--text-1);text-align:left}
    .repo-row:hover{border-color:var(--border2);background:var(--surface-alpha-2)}
    .dot{width:8px;height:8px;border-radius:var(--radius-pill);background:var(--violet);opacity:.9;flex-shrink:0}
    .repo-meta{min-width:0}
    .repo-title{font-size:var(--font-size-base);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .repo-path{font-size:var(--font-size-xs);color:var(--text-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .repo-sep{height:1px;background:var(--surface-alpha-4);margin:var(--space-md) var(--space-sm)}
    .repo-row.add{color:var(--text-4)}
    .repo-row.add .dot{background:rgba(255,255,255,0.22)}
    .repo-form{display:flex;gap:var(--space-md);align-items:center;padding:var(--space-md);border-radius:var(--radius-lg);border:1px solid var(--surface-alpha-6);background:rgba(0,0,0,0.10)}
    .repo-form input{flex:1;min-width:0;background:var(--surface-alpha-2);border:1px solid var(--surface-alpha-6);border-radius:var(--radius-lg);padding:var(--space-lg) var(--space-lg);color:var(--text-1);outline:none;font-size:var(--font-size-base)}
    .repo-form input::placeholder{color:var(--text-5)}
    .repo-form .addbtn{background:rgba(124,58,237,0.18);border:1px solid rgba(124,58,237,0.45);color:var(--violet);padding:var(--space-lg) var(--space-xl);border-radius:var(--radius-lg);font-size:var(--font-size-base);font-weight:700;cursor:pointer}
    .repo-form .addbtn:hover{border-color:rgba(124,58,237,0.70);background:rgba(124,58,237,0.22)}
    .repo-form .browsebtn{background:var(--surface-alpha-3);border:1px solid var(--surface-alpha-7);color:var(--text-3);padding:var(--space-lg) 11px;border-radius:var(--radius-lg);font-size:var(--font-size-base);font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
    .repo-form .browsebtn:hover{border-color:rgba(255,255,255,0.22);background:rgba(255,255,255,0.07)}
    .repo-form .browsebtn:disabled{opacity:.5;cursor:default}
    .repo-form-error{color:var(--color-error);font-size:var(--font-size-sm);padding:var(--space-xs) 2px 0;grid-column:1/-1}

    .tabs{display:flex;padding:var(--space-lg) var(--space-xl) var(--space-md);gap:var(--space-xl);border-bottom:1px solid var(--border)}
    .tab{border:none;background:transparent;color:var(--text-3);font-size:var(--font-size-base);padding:var(--space-sm) 0;position:relative}
    .tab.active{color:var(--violet)}
    .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-var(--space-md);height:2px;background:var(--violet);border-radius:var(--radius-pill)}
    .left-scroll{flex:1;overflow:auto;padding:var(--space-lg) var(--space-md) var(--space-xl)}
    .settings-label{white-space:nowrap}

    .left.compact .left-top{
      height:auto;flex-direction:column;justify-content:flex-start;align-items:center;
      padding:var(--space-2xl) 0 var(--space-lg);border-bottom:none;gap:var(--space-2xl)
    }
    .left.compact .brand{width:100%;justify-content:center}
    .left.compact .brand .name,
    .left.compact .tabs,
    .left.compact .bg-tasks,
    .left.compact .left-scroll,
    .left.compact .settings-label{display:none}
    .left.compact .left-actions{flex-direction:column;gap:var(--space-xl)}
    .left.compact .icon-btn,
    .left.compact .settings-btn{width:36px;height:36px}
    .left.compact .left-bottom{
      margin-top:auto;padding:var(--space-xl) 0 var(--space-2xl);border-top:none;display:flex;justify-content:center
    }
    .left.compact .settings-btn{padding:0;justify-content:center}
    .left.compact .sidebar-toggle{
      top:var(--space-xl);bottom:auto;left:50%;right:auto;transform:translateX(-50%);
      width:32px;height:32px;border-radius:8px
    }
    .left.compact .sidebar-toggle svg{width:12px;height:12px}

    .group{margin-bottom:var(--space-lg)}
    .group-h{
      width:100%;display:flex;align-items:center;gap:var(--space-lg);padding:var(--space-lg);border-radius:var(--radius-lg);
      border:1px solid transparent;background:transparent;color:var(--text-2);text-align:left;
      transition:border-color var(--transition-base),background var(--transition-base),color var(--transition-base);
    }
    .group-h:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}
    .badge{font-size:var(--font-size-sm);color:var(--text-3);border:1px solid var(--border);padding:2px var(--space-md);border-radius:var(--radius-pill);background:var(--surface-alpha-1)}
    .chev{margin-left:auto;transition:transform var(--transition-base);color:var(--text-4)}
    .group.open .chev{transform:rotate(90deg)}
    .gbtn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;color:var(--text-4);padding:0}
    .gbtn:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}
    .gbtn.del{opacity:0;pointer-events:none}
    .group-h:hover .gbtn.del{opacity:1;pointer-events:auto}
    .gconfirm{display:inline-flex;align-items:center;gap:var(--space-sm);margin-left:auto;color:var(--text-4);font-size:var(--font-size-sm)}
    .gconfirm .q{color:var(--text-3)}
    .gconfirm .y,.gconfirm .n{border:1px solid var(--border);background:transparent;color:var(--text-2);border-radius:var(--radius-md);padding:var(--space-xs) var(--space-md);font-size:var(--font-size-sm)}
    .gconfirm .y{border-color:rgba(124,58,237,0.45);color:var(--violet)}
    .gconfirm .y:hover{border-color:rgba(124,58,237,0.70);background:rgba(124,58,237,0.16)}
    .gconfirm .n:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}
    .threads{display:none;padding:var(--space-xs) 2px var(--space-md)}
    .group.open .threads{display:block}
    .thread{
      width:100%;display:grid;grid-template-columns:10px 1fr auto auto;gap:var(--space-lg);align-items:center;
      padding:var(--space-md) var(--space-lg);border-radius:var(--radius-lg);border:1px solid transparent;background:transparent;color:var(--text-2);text-align:left;
      transition:border-color var(--transition-base),background var(--transition-base);
    }
    .thread:hover{border-color:var(--border2);background:var(--surface-alpha-2)}
    .thread.active{background:var(--violet-bg);border-color:var(--violet-bd);box-shadow:inset 2px 0 0 var(--violet);color:var(--text-1)}
    @keyframes pulse-dot{
      0%,100%{opacity:1;transform:scale(1);}
      50%{opacity:0.4;transform:scale(0.7);}
    }
    .tdot{width:5px;height:5px;border-radius:var(--radius-pill);background:rgba(255,255,255,0.18)}
    .thread-running .tdot{
      animation:pulse-dot 1.2s ease-in-out infinite;
      background:#7c3aed;
    }
    .thread.active .tdot{background:var(--violet)}
    .tname{font-size:var(--font-size-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ttime{font-size:var(--font-size-xs);color:var(--text-4)}
    .t-del{opacity:0;pointer-events:none}
    .thread:hover .t-del{opacity:1;pointer-events:auto}

    .left-bottom{border-top:1px solid var(--border);padding:var(--space-lg) var(--space-xl);position:relative}
    .settings-btn{
      width:100%;display:flex;align-items:center;gap:var(--space-lg);padding:var(--space-lg) 46px var(--space-lg) var(--space-lg);border-radius:var(--radius-lg);
      border:1px solid var(--border);background:transparent;color:var(--text-2);
      transition:border-color var(--transition-base),background var(--transition-base),color var(--transition-base);
    }
    .settings-btn:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}
    .sidebar-resizer{
      position:absolute;top:0;right:-2px;bottom:0;width:4px;z-index:40;
      cursor:col-resize;background:transparent
    }
    .left.compact .sidebar-resizer{display:none;pointer-events:none}
    body.sidebar-resizing{cursor:col-resize;user-select:none}

    /* Background tasks */
    .bg-tasks{border-bottom:1px solid var(--border);font-size:var(--font-size-sm);display:none}
    .bg-tasks-header{display:flex;align-items:center;gap:var(--space-sm);padding:5px var(--space-lg);cursor:pointer;color:var(--text-4)}
    .bg-tasks-header:hover{color:var(--text-2)}
    .bg-spinner{width:6px;height:6px;border-radius:50%;background:var(--violet);animation:dotPulse 1.2s ease-in-out infinite}
    .bg-tasks-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bg-chevron{width:10px;height:10px;opacity:.7}
    .bg-tasks-body{padding:0 var(--space-lg) var(--space-sm);display:none}
    .bg-tasks.open .bg-tasks-body{display:block}
    .bg-task-row{display:flex;align-items:center;gap:var(--space-sm);padding:3px 0;font-size:var(--font-size-xs)}
    .bg-task-icon{color:var(--violet);width:10px;flex:0 0 10px}
    .bg-task-icon.queued{color:var(--text-5)}
    .bg-task-text{flex:1;min-width:0;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bg-task-time{color:var(--text-5);font-family:var(--font-family-mono);font-size:var(--font-size-xs);white-space:nowrap}
    /* Queue pills above input */
    .queueBar{display:none;flex-direction:column;gap:var(--space-sm);padding:var(--space-md) var(--space-xl);border:1px solid var(--surface-alpha-4);border-radius:12px;background:rgba(0,0,0,0.16);margin-bottom:var(--space-lg)}
    .queueBar.show{display:flex}
    .queueRow{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-sm) var(--space-md);border:1px solid var(--surface-alpha-4);background:rgba(0,0,0,0.10);border-radius:var(--radius-lg)}
    .queueText{flex:1;min-width:0;color:var(--text-2);font-size:var(--font-size-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .queueRemove{width:22px;height:22px;border-radius:var(--radius-md);border:1px solid var(--surface-alpha-5);background:transparent;color:var(--text-4);display:flex;align-items:center;justify-content:center}
    .queueRemove:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}

    /* CENTER */
    .center{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
    .center::before{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
      background-image:linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size:44px 44px,44px 44px;
      mask-image:radial-gradient(circle at 50% 20%, rgba(0,0,0,1), transparent 60%);
    }
    .center-top{
      height:52px;flex-shrink:0;display:flex;align-items:center;gap:var(--space-xl);padding:0 16px;
      border-bottom:1px solid var(--border);background:rgba(10,10,11,0.92);backdrop-filter:blur(10px);z-index:5;
    }
    .run-dot{width:10px;height:10px;border-radius:var(--radius-pill);background:var(--surface-alpha-7)}
    .run-dot.running{background:var(--violet);animation:dotPulse 1.2s ease-in-out infinite}
    @keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,0.0);opacity:.85}50%{box-shadow:0 0 0 8px rgba(124,58,237,0.10);opacity:1}}
    .thread-title{flex:1;min-width:0;font-weight:700;font-size:var(--font-size-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status-badge{display:none;border:1px solid var(--violet-bd);background:var(--violet-bg);color:var(--violet);padding:5px var(--space-lg);border-radius:var(--radius-pill);font-size:var(--font-size-sm)}
    .status-badge.show{display:inline-flex}
    .status-badge.done{border-color:rgba(34,197,94,0.35);background:rgba(34,197,94,0.10);color:var(--color-success)}

    #chatArea{flex:1;overflow:auto;padding:16px 18px 140px;padding-bottom:80vh;position:relative;z-index:1}
    .empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text-3);padding:40px}
    .empty .logo{width:54px;height:54px;margin:0 auto var(--space-xl);display:flex;align-items:center;justify-content:center;border-radius:14px;border:1px solid var(--violet-bd);background:var(--violet-bg);color:var(--violet)}
    .empty h2{margin:0 0 var(--space-md);font-size:18px;color:var(--text-1)}
    .empty p{margin:0;font-size:var(--font-size-md);color:var(--text-3)}

    .bubble{max-width:720px;margin:var(--space-lg) 0;padding:var(--space-xl);border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface2);position:relative}
    .bubble.user{margin-left:auto;background:#3b1f9e;border-color:#2e2e34;color:#ffffff;border-radius:10px 10px 2px 10px}
    .bubble.agent{margin-right:auto;max-width:85%;background:#0a0a0f;color:var(--text-1);border:1px solid #2e2e34;box-shadow:-2px -2px 0 -1px rgba(59,130,246,0.3);border-radius:10px 2px 10px 10px;padding:18px 20px}
    .bubble .text{font-size:var(--font-size-md);line-height:1.55;white-space:pre-wrap;word-break:break-word}
    .bubble .md{font-size:var(--font-size-md);line-height:1.55;word-break:break-word}
    .bubble.agent .zone-chat-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-xl);margin:0 0 var(--space-2xl)}
    .bubble.agent .zone-chat-brand{display:flex;align-items:center;gap:var(--space-md);min-width:0}
    .bubble.agent .zone-chat-label{font-size:var(--font-size-base);font-weight:500;color:#3b82f6;letter-spacing:.02em}
    .bubble.agent .zone-chat-model{font-size:var(--font-size-sm);color:#6b7280;white-space:nowrap}
    .bubble.agent .zone-chat-icon{width:14px;height:14px;color:#3b82f6;flex:0 0 14px}
    .bubble.agent .chat-body{font-family:var(--font-family-sans);font-size:var(--font-size-md);line-height:1.6;color:#e5e7eb}
    .bubble.agent .chat-body h3{margin:18px 0 var(--space-md);font-size:14px;line-height:1.35;color:#f3f4f6;font-weight:600}
    .bubble.agent .chat-body h3:first-child{margin-top:0}
    .bubble.agent .chat-body p{margin:0 0 var(--space-xl)}
    .bubble.agent .chat-body ul{margin:0 0 var(--space-xl);padding-left:20px;line-height:1.5}
    .bubble.agent .chat-body li{margin:0 0 var(--space-sm)}
    .bubble.agent .chat-body li::marker{color:#6b7280}
    .bubble.agent .chat-body code{font-family:var(--font-family-mono)}
    .bubble.agent .chat-codeblock{background:#050505;border:1px solid #2e2e34;border-radius:var(--radius-md);padding:var(--space-xl) var(--space-2xl);margin:var(--space-lg) 0;overflow-x:auto;font-family:var(--font-family-mono);font-size:var(--font-size-md);line-height:1.5;color:#e5e7eb}
    .bubble.agent .chat-codeblock code{background:transparent;padding:0;display:block}
    .bubble.agent .chat-codeblock.streaming{position:relative}
    .streaming-cursor{display:inline-block;color:#3b82f6;animation:zone-blink 1s step-end infinite;margin-left:2px;font-weight:bold}
    @keyframes zone-blink{50%{opacity:0}}
    .bubble.agent .inline-code{background:#1a1a20;padding:2px var(--space-sm);border-radius:4px;font-family:var(--font-family-mono);font-size:.9em;color:#a78bfa}
    .bubble.agent .chat-body a{color:#93c5fd;text-decoration:none}
    .bubble.agent .chat-body a:hover{text-decoration:underline}
    .bubble.agent .chat-footer{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-xl);margin-top:18px;padding-top:var(--space-2xl);border-top:1px solid #1a1a20}
    .bubble.agent .chat-pills{display:flex;flex-wrap:wrap;gap:var(--space-sm)}
    .bubble.agent .chat-pill{display:inline-flex;align-items:center;padding:3px var(--space-md);border-radius:var(--radius-pill);background:var(--surface-alpha-3);border:1px solid var(--surface-alpha-5);color:#9ca3af;font-size:var(--font-size-sm);line-height:1.2}
    .bubble.agent .chat-continue{border:1px solid var(--surface-alpha-6);background:transparent;color:#cbd5e1;border-radius:var(--radius-pill);padding:var(--space-sm) var(--space-lg);font-size:var(--font-size-sm);font-weight:500;white-space:nowrap}
    .bubble.agent .chat-continue:hover{background:var(--surface-alpha-3);border-color:rgba(59,130,246,0.28);color:#e5e7eb}
    .bubble.agent .chat-typing{display:inline-flex;align-items:center;gap:5px;min-height:18px}
    .bubble.agent .chat-typing span{width:6px;height:6px;border-radius:var(--radius-pill);background:#60a5fa;opacity:.45;animation:chatTyping 1s ease-in-out infinite}
    .bubble.agent .chat-typing span:nth-child(2){animation-delay:.15s}
    .bubble.agent .chat-typing span:nth-child(3){animation-delay:.3s}
    @keyframes chatTyping{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
    .verify-banner{
      display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-lg);margin:var(--space-lg) 0 var(--space-xl);
      padding:var(--space-xl) var(--space-2xl);border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface2)
    }
    .verify-banner-pills{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-md)}
    .verify-pill{
      display:inline-flex;align-items:center;padding:5px var(--space-lg);border-radius:var(--radius-pill);
      font-size:var(--font-size-sm);line-height:1.2;font-weight:600;border:1px solid var(--border);background:var(--surface-alpha-2);color:var(--text-2)
    }
    .verify-pill.safe{background:rgba(34,197,94,0.14);border-color:rgba(34,197,94,0.4);color:#86efac}
    .verify-pill.preview{background:rgba(245,159,11,0.14);border-color:rgba(245,159,11,0.42);color:#fbbf24}
    .verify-pill.blocked{background:rgba(239,68,68,0.14);border-color:rgba(239,68,68,0.4);color:#fca5a5}
    .verify-pill.reason-safe{background:transparent;border-color:rgba(34,197,94,0.35);color:#86efac}
    .verify-pill.reason-warn{background:transparent;border-color:rgba(245,159,11,0.38);color:#fbbf24}
    .verify-pill.reason-bad{background:transparent;border-color:rgba(239,68,68,0.38);color:#fca5a5}
    .verify-pill.reason-neutral{background:transparent;border-color:var(--surface-alpha-7);color:var(--text-3)}
    .verify-note{font-size:var(--font-size-base);color:var(--text-3)}
    .bubble .edit-btn{position:absolute;top:var(--space-md);right:var(--space-md);width:22px;height:22px;border-radius:var(--radius-sm);border:1px solid var(--surface-alpha-7);background:rgba(0,0,0,0.18);color:#9ca3af;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .12s ease}
    .bubble.user .edit-btn{background:rgba(0,0,0,0.14);border-color:rgba(255,255,255,0.18)}
    .bubble:hover .edit-btn{opacity:1}
    .bubble.editing{border-color:#7c3aed;box-shadow:0 0 0 2px rgba(124,58,237,0.18) inset}
    .bubble .edit-area{width:100%;min-height:60px;max-height:120px;resize:vertical;background:transparent;color:inherit;border:none;outline:none;font-family:var(--font-family-mono);font-size:var(--font-size-md);line-height:1.5;white-space:pre-wrap}
    .bubble .edit-actions{display:flex;gap:var(--space-md);justify-content:flex-end;margin-top:var(--space-lg)}
    .bubble .edit-actions button{border:1px solid var(--border);background:var(--surface-alpha-3);color:var(--text-1);padding:var(--space-sm) var(--space-lg);border-radius:var(--radius-md);font-size:var(--font-size-base);cursor:pointer}
    .bubble .edit-actions .primary{border-color:rgba(124,58,237,0.55);background:rgba(124,58,237,0.18)}
    .bubble .md .h{font-weight:700;color:var(--text-1);margin:2px 0 var(--space-md)}
    .bubble .md .p{margin:0 0 var(--space-lg);color:var(--text-2)}
    .bubble .md .li{margin:0 0 var(--space-sm);color:var(--text-2)}
    .bubble .md .code{font-family:var(--font-family-mono);color:var(--violet);background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.28);padding:1px var(--space-sm);border-radius:7px}
    /* Restored turn summaries */
    .turn-restored{border:1px solid var(--border);border-radius:var(--radius-sm);margin:0 0 var(--space-sm);overflow:hidden}
    .turn-restored-header{padding:var(--space-md) var(--space-xl);display:flex;align-items:center;gap:var(--space-md);cursor:pointer;background:var(--surface2);font-size:var(--font-size-base)}
    .turn-restored-header:hover{background:var(--surface-alpha-2)}
    .turn-restored .chevron{width:10px;height:10px;color:var(--text-4);transition:transform var(--transition-fast)}
    .turn-restored.open .chevron{transform:rotate(90deg)}
    .turn-restored-body{padding:var(--space-lg) var(--space-xl);background:var(--surface);font-size:var(--font-size-base);display:none}
    .turn-restored.open .turn-restored-body{display:block}

    /* Virtual history loader */
    .load-older{
      width:100%;
      display:flex;
      justify-content:center;
      padding:var(--space-lg) 0 var(--space-2xl);
    }
    .load-older button{
      border:none;
      background:transparent;
      color:#9ca3af;
      font-size:var(--font-size-base);
      cursor:pointer;
      padding:var(--space-sm) var(--space-lg);
    }
    .load-older button:hover{color:var(--text-2);text-decoration:underline}
    .resume-badge{display:inline-flex;align-items:center;gap:var(--space-sm);font-size:var(--font-size-sm);color:var(--text-4);margin:var(--space-sm) 0 0}
    .resume-badge .dot{width:var(--space-sm);height:6px;border-radius:var(--radius-pill);background:#9ca3af}
    .resume-badge.live{color:#a7f3d0}
    .resume-badge.live .dot{background:var(--color-success)}
    .resume-badge.reconnecting{color:#fde68a}
    .resume-badge.reconnecting .dot{background:var(--color-warning)}
    .resume-badge.interrupted{color:#fca5a5}
    .resume-badge.interrupted .dot{background:var(--color-error)}
    .resume-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:none;
      background:var(--color-brand);
      color:#ffffff;
      border-radius:var(--radius-pill);
      padding:5px var(--space-xl);
      font-size:var(--font-size-sm);
      font-weight:600;
      line-height:1;
      cursor:pointer;
      white-space:nowrap;
      margin-left:var(--space-sm);
      box-shadow:0 1px 2px rgba(0,0,0,.18);
      transition:background var(--transition-fast),opacity var(--transition-fast),transform var(--transition-fast);
    }
    .resume-btn:hover{background:#6d28d9;transform:translateY(-1px)}
    .resume-btn:disabled{opacity:.6;cursor:default}
    .run-group.resumed-from{opacity:.56;filter:saturate(.72)}

    .turn-summary{flex:1;min-width:0;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .turn-meta{font-size:var(--font-size-xs);color:var(--text-5)}
    .turn-badge{font-size:var(--font-size-xs);padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap}
    .turn-badge.safe{background:#0c1c11;color:var(--color-success);border-color:#14532d}
    .turn-badge.preview{background:#1c1407;color:var(--color-warning);border-color:#92400e}
    .turn-badge.blocked{background:#1c0a0a;color:var(--color-error);border-color:#7f1d1d}
    .turn-badge.chat{background:#16101f;color:#a78bfa;border-color:#3b1f6a}

    .log-card{max-width:820px;margin:var(--space-xl) 0;padding:var(--space-xl);border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface2)}
    .exec-header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-lg);margin-bottom:var(--space-xl)}
    .exec-header-title{font-size:var(--font-size-base);font-weight:600;color:var(--text-1)}
    .exec-view-toggle{display:inline-flex;align-items:center;gap:var(--space-xs);padding:var(--space-xs);border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--surface-alpha-2)}
    .exec-view-btn{border:none;background:transparent;color:var(--text-4);padding:var(--space-sm) var(--space-lg);border-radius:var(--radius-pill);font-size:var(--font-size-sm);font-weight:600;transition:background var(--transition-base),color var(--transition-base)}
    .exec-view-btn.active{background:var(--surface-alpha-5);color:var(--text-1)}
    .exec-view-btn:hover{color:var(--text-2)}
    .exec-summary-view,.exec-raw-view{display:block}
    .log-card[data-view-mode="summary"] .exec-raw-view{display:none}
    .log-card[data-view-mode="raw"] .exec-summary-view{display:none}
    .exec-summary-empty{font-size:var(--font-size-base);color:var(--text-4);padding:var(--space-sm) 0}
    .exec-summary-groups{display:flex;flex-direction:column;gap:var(--space-lg)}
    .exec-summary-group{border:1px solid var(--surface-alpha-4);border-radius:var(--radius-lg);background:var(--surface-alpha-1);padding:var(--space-lg) var(--space-xl)}
    .exec-summary-heading{display:flex;align-items:center;gap:var(--space-md);font-size:var(--font-size-md);font-weight:600;color:var(--text-1)}
    .exec-summary-heading .icon{font-size:14px;line-height:1}
    .exec-summary-list{display:flex;flex-direction:column;gap:var(--space-md);margin-top:var(--space-lg)}
    .exec-summary-entry{display:flex;flex-direction:column;gap:var(--space-sm);padding-left:var(--space-2xl)}
    .exec-summary-target{font-size:var(--font-size-base);color:var(--text-2);word-break:break-word}
    .exec-summary-meta{font-size:var(--font-size-sm);color:var(--text-4)}
    .exec-attempts{display:flex;flex-wrap:wrap;gap:var(--space-sm)}
    .exec-attempt{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:32px;padding:2px var(--space-md);border-radius:var(--radius-pill);border:1px solid var(--surface-alpha-6);background:var(--surface-alpha-2);color:var(--text-3);font-size:var(--font-size-xs);font-family:var(--font-family-mono)}
    .exec-attempt.success{border-color:color-mix(in srgb, var(--color-success) 45%, var(--surface-alpha-6));color:color-mix(in srgb, var(--color-success) 85%, var(--text-1))}
    .exec-attempt.reverted{border-color:color-mix(in srgb, var(--color-warning) 50%, var(--surface-alpha-6));color:color-mix(in srgb, var(--color-warning) 95%, var(--text-1))}
    .exec-attempt.find-not-found{border-color:color-mix(in srgb, var(--color-info) 45%, var(--surface-alpha-6));color:color-mix(in srgb, var(--color-info) 85%, var(--text-1))}
    .exec-attempt.failure{border-color:color-mix(in srgb, var(--color-error) 40%, var(--surface-alpha-6));color:color-mix(in srgb, var(--color-error) 85%, var(--text-1))}
    .exec-attempt.reverted .exec-tooltip{display:none;position:absolute;left:0;top:calc(100% + var(--space-sm));width:min(320px, 60vw);padding:var(--space-lg);border-radius:var(--radius-md);border:1px solid var(--surface-alpha-7);background:var(--surface2);box-shadow:0 18px 40px rgb(0 0 0 / 0.35);z-index:12}
    .exec-attempt.reverted:hover .exec-tooltip{display:block}
    .exec-tooltip-title{font-size:var(--font-size-sm);font-weight:700;color:var(--text-1);margin-bottom:var(--space-sm)}
    .exec-tooltip-reason{font-size:var(--font-size-sm);font-family:var(--font-family-mono);color:color-mix(in srgb, var(--color-warning) 95%, var(--text-1));margin-bottom:var(--space-sm);word-break:break-word}
    .exec-tooltip-body,.exec-tooltip-foot{font-size:var(--font-size-sm);color:var(--text-3);line-height:1.5;word-break:break-word}
    .exec-tooltip-foot{margin-top:var(--space-md)}
    .exec-summary-final{margin-top:var(--space-xl);padding-top:var(--space-xl);border-top:1px solid var(--surface-alpha-4);display:flex;flex-direction:column;gap:var(--space-sm)}
    .exec-summary-final-line{font-size:var(--font-size-base);color:var(--text-2);word-break:break-word}
    .exec-summary-final-line.muted{font-size:var(--font-size-sm);color:var(--text-4)}
    .exec-raw-view{margin-top:var(--space-sm)}
    .log-lines{font-family:var(--font-family-mono);font-size:var(--font-size-base);line-height:1.7}
    .log-line{display:flex;gap:var(--space-xl);padding:2px 0;opacity:1;animation:lineIn 150ms ease-out;color:#e0e0e0}
    @keyframes lineIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .log-lines{display:flex;flex-direction:column;gap:var(--space-sm);align-items:stretch}
    .log-ts{min-width:78px;color:#888888}
    .log-msg{flex:1;min-width:0;word-break:break-word;color:var(--text-2)}
    .log-line.active .log-ts{color:var(--violet)}
    .log-line.active .log-msg{color:var(--text-1)}
    .log-line.c-active .log-msg{color:#a78bfa}
    .log-line.c-done .log-msg{color:#4ade80}
    .log-line.success .log-msg{color:color-mix(in srgb, var(--green) 85%, var(--text-1))}
    .log-line.warning .log-msg{color:color-mix(in srgb, var(--amber) 90%, var(--text-1))}
    .log-line.error .log-msg{color:color-mix(in srgb, var(--red) 85%, var(--text-1))}
    .log-line.active .log-msg::after{
      content:"";display:inline-block;width:6px;height:13px;background:var(--violet);
      margin-left:var(--space-sm);transform:translateY(2px);animation:blink 1s step-end infinite;
    }
    .log-card.done .log-line.active .log-msg::after{content:none}
    @keyframes blink{50%{opacity:0}}
    /* ── Run Step Timeline ──────────────────────────────────────────────── */
    .step-timeline{display:flex;flex-direction:column;gap:var(--space-xs);padding:var(--space-sm) 0 2px}
    .run-step{border:1px solid #1a1a20;border-radius:var(--radius-md);background:#0a0a0f;overflow:hidden;margin-bottom:2px}
    .run-step-header{display:flex;align-items:center;gap:var(--space-lg);padding:var(--space-lg) var(--space-2xl);cursor:pointer;font-size:var(--font-size-md);color:#d1d5db;user-select:none}
    .run-step-header:hover{background:#12121a}
    .run-step-icon{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:var(--font-size-xs)}
    .run-step-spinner{width:11px;height:11px;border:2px solid #3d1f7a;border-top-color:#7c3aed;border-radius:50%;animation:zone-spin 0.7s linear infinite;display:inline-block}
    @keyframes zone-spin{to{transform:rotate(360deg)}}
    .run-step[data-status="active"] .run-step-icon{color:var(--color-brand)}
    .run-step[data-status="done"]   .run-step-icon{color:var(--color-success)}
    .run-step[data-status="failed"] .run-step-icon{color:var(--color-error)}
    .run-step[data-status="warning"] .run-step-icon{color:var(--color-warning)}
    .run-step-label{flex:1;font-weight:500;font-size:var(--font-size-md);color:#d1d5db}
    .run-step-toggle{color:#6b7280;font-size:14px;transition:transform 0.15s;flex-shrink:0;padding-left:var(--space-xs)}
    .run-step[data-expanded="true"] .run-step-toggle{transform:rotate(90deg)}
    .run-step-details{border-top:1px solid #1a1a20;padding:var(--space-md) var(--space-2xl) var(--space-lg) 38px;font-family:var(--font-family-mono);font-size:var(--font-size-sm);color:#6b7280;line-height:1.7}
    .run-step-detail{margin:1px 0;white-space:pre-wrap;word-break:break-all}

    /* Live coding / stream preview (compact, 2–3 lines visible) */
    .livecode{
      margin-top:var(--space-lg);border:1px solid var(--surface-alpha-6);border-radius:var(--radius-lg);
      background:rgba(0,0,0,0.18);
      max-height:140px;
      overflow:hidden
    }
    .livecode-h{
      display:flex;align-items:center;gap:var(--space-md);padding:var(--space-xs) var(--space-md);
      border-bottom:1px solid var(--surface-alpha-5);background:rgba(124,58,237,0.06);
      font-family:var(--font-family-sans);font-size:var(--font-size-sm);color:var(--text-2)
    }
    .livecode-h .label{animation:liveHdr 1.0s ease-in-out infinite}
    @keyframes liveHdr{0%,100%{opacity:.40}50%{opacity:1}}
    .livecode-dot{
      width:8px;height:8px;border-radius:var(--radius-pill);background:var(--violet);
      animation:liveDot 1.1s ease-in-out infinite
    }
    @keyframes liveDot{0%,100%{opacity:.55;box-shadow:0 0 0 0 rgba(124,58,237,0.0)}50%{opacity:1;box-shadow:0 0 0 8px rgba(124,58,237,0.10)}}
    .livecode-body{
      padding:var(--space-xs) var(--space-md);font-family:var(--font-family-mono);font-size:var(--font-size-base);line-height:1.4;
      max-height:120px;
      overflow:hidden
    }
    .livecode-body pre,
    .livecode-body pre[id^="streamCode-"]{
      display:block;
      min-height:1.4em;
      margin:0;
      padding:var(--space-xs) var(--space-md);
      white-space:pre-wrap;
      word-break:break-word;
      font-family:var(--font-family-mono);
      font-size:var(--font-size-base);
      line-height:1.4;
      color:var(--text-2);
      background:transparent;
      max-height:120px !important;
      overflow-y:auto !important;
      scroll-behavior:smooth;
    }
    /* Dummy livecode typewriter removed; streaming uses <pre>. */
    /* When streaming owns the block, suppress any dummy animations/lines. */
    .livecode.streaming .livecode-h .label{animation:none;opacity:1}
    .livecode.streaming .livecode-dot{display:none}
    .livecode-static .livecode-h .label{animation:none;opacity:1}
    .livecode-static .livecode-dot{display:none}
    .livecode-static .sd-cursor{display:none!important}
    .livecode-static .livecode-body pre{animation:none}
    .turn-restored .livecode{max-height:140px}
    .turn-restored .livecode-body{max-height:120px}

    .stream-static-diff{margin:0;padding:0}
    .sd-line{padding:1px var(--space-xs);border-radius:4px;margin:0 0 1px 0}
    /* sd-line-add avoids collision with unrelated .add rules elsewhere */
    .stream-static-diff .sd-line.sd-line-add,
    .sd-line.add{background:#1f3f1f;color:#d1fae5}
    .stream-static-diff .sd-line.sd-line-del,
    .sd-line.del{background:#3f1f1f;color:#fee2e2}
    .sd-line.ctx{color:#888888;background:transparent}
    .sd-cursor{color:var(--text-2);padding:2px var(--space-sm)}

    .pills{display:flex;flex-wrap:wrap;gap:var(--space-md);margin-top:var(--space-lg)}
    .pill{display:inline-flex;align-items:center;gap:var(--space-md);padding:var(--space-sm) var(--space-lg);border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--surface-alpha-1);color:var(--text-2);font-size:var(--font-size-sm);opacity:0;transform:translateY(6px);animation:pillIn 150ms ease-out forwards}
    @keyframes pillIn{to{opacity:1;transform:translateY(0)}}
    .pdot{width:7px;height:7px;border-radius:var(--radius-pill);background:var(--blue)}
    .pill.config .pdot{background:var(--violet)}
    .pill.more{color:var(--text-4);border-color:var(--surface-alpha-4)}

    .related-files{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm) var(--space-md);margin-top:var(--space-md)}
    .rf-label{font-size:var(--font-size-xs);color:#3f3f46;flex:0 0 auto}
    .rf-pill{
      display:inline-flex;align-items:center;gap:var(--space-xs);padding:5px 9px;border-radius:var(--radius-pill);
      border:1px solid #111113;background:var(--surface-alpha-1);color:#71717a;font-size:var(--font-size-xs);
      font-family:var(--font-family-mono)
    }
    .rf-rel{font-style:italic;color:#3f3f46;font-size:9px;font-family:var(--font-family-sans);margin-left:5px}
    .planner-dep-warnings{margin-top:var(--space-sm);display:flex;flex-direction:column;gap:var(--space-xs)}
    .rf-warn-line{font-size:var(--font-size-xs);color:#3f3f46;line-height:1.45;opacity:.92}

    .diff-card{max-width:920px;margin:var(--space-2xl) 0;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface2);overflow:hidden}
    .diff-toolbar{display:flex;align-items:center;gap:var(--space-lg);padding:var(--space-lg) var(--space-xl);border-bottom:1px solid var(--border);background:rgba(255,255,255,0.01);position:sticky;top:0;z-index:2}
    .file-ico{width:18px;height:18px;border:1px solid rgba(59,130,246,0.55);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:var(--font-size-sm);flex-shrink:0}
    .diff-fname{flex:1;min-width:0;font-family:var(--font-family-mono);font-size:var(--font-size-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .toggle-tabs{display:flex;border:1px solid var(--border);border-radius:var(--radius-pill);overflow:hidden;background:rgba(0,0,0,0.12)}
    .toggle-tabs button{border:none;background:transparent;padding:5px var(--space-lg);font-size:var(--font-size-sm);color:var(--text-3)}
    .toggle-tabs button.active{color:var(--violet);background:var(--violet-bg)}
    .diff-copy{
      width:26px;height:26px;border-radius:var(--radius-md);border:1px solid var(--border);
      background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;
      transition:border-color var(--transition-base),background var(--transition-base),color var(--transition-base);
      padding:0;
    }
    .diff-copy:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}
    .diff-toggle{
      width:26px;height:26px;border-radius:var(--radius-md);border:1px solid var(--border);
      background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;
      transition:border-color var(--transition-base),background var(--transition-base),color var(--transition-base);
    }
    .diff-toggle:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}
    .diff-card.collapsed .diff-toggle{background:var(--surface-alpha-1)}
    .apply-btn{border:1px solid var(--violet-bd);background:var(--violet-bg);color:var(--text-1);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-lg);font-size:var(--font-size-sm)}
    .apply-btn:hover{filter:brightness(1.06)}
    .diff-toolbar-status{

    .diff-area{max-height:200px;overflow:auto;font-family:var(--font-family-mono);font-size:var(--font-size-sm);line-height:1.65;background:rgba(0,0,0,0.16)}
    .drow{display:grid;grid-template-columns:52px 18px 1fr;gap:var(--space-lg);padding:2px var(--space-xl);border-left:2px solid transparent;white-space:pre-wrap;word-break:break-word}
    .ln{color:var(--text-5);text-align:right}

    .toast{max-width:720px;margin:var(--space-xl) 0;border:1px solid var(--border);background:rgba(0,0,0,0.14);padding:var(--space-lg) var(--space-xl);border-radius:var(--radius-lg);display:flex;align-items:center;gap:var(--space-lg);color:var(--text-2)}

    /* Verification fix loop summary (collapsible) */
    .verify-sum{
      max-width:820px;margin:var(--space-lg) 0;padding:var(--space-lg) var(--space-xl);border-radius:var(--radius-lg);
      border:1px solid #2e2e34;background:#0a0a0f;color:var(--text-2);
    }

      display:flex;align-items:center;gap:var(--space-md);cursor:pointer;user-select:none;
      font-weight:700;color:var(--color-warning);
    }
    .verify-sum-h .chev{margin-left:auto;color:var(--text-4);font-weight:700}
    .verify-sum-b{margin-top:var(--space-md);display:flex;flex-direction:column;gap:var(--space-xs)}

    /* Inline approval widget inside Summary view run entries */
    .exec-summary-approval-widget{margin-top:var(--space-lg);padding-top:var(--space-lg);border-top:1px solid #2e2e34}
    .exec-summary-approval-prompt{font-size:var(--font-size-sm);color:var(--color-warning);margin-bottom:var(--space-md);display:flex;align-items:center;gap:var(--space-sm)}

    /* Command approval card */
    .approval-card{max-width:820px;margin:var(--space-lg) 0;padding:var(--space-xl);border-radius:var(--radius-md);border:1px solid #2e2e34;background:#0a0a0f}

    /* Inline terminal block */

    .inputBar{position:absolute;left:0;right:0;bottom:0;padding:var(--space-xl) 18px var(--space-2xl);border-top:1px solid var(--border);background:rgba(5,5,5,0.92);backdrop-filter:blur(12px);z-index:6}
    .inputWrap{border:1px solid var(--border2);background:var(--surface);border-radius:var(--radius-md);padding:var(--space-lg);display:flex;gap:var(--space-lg);align-items:flex-end;transition:border-color var(--transition-base)}
    .inputWrap:focus-within{border-color:var(--violet-bd)}
    #taskInput{flex:1;min-width:0;background:transparent;border:none;color:var(--text-1);resize:none;max-height:160px;font-size:var(--font-size-md);line-height:1.55;padding:0}

    .mini-btn{width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:border-color var(--transition-base),background var(--transition-base),color var(--transition-base)}

    .send-btn{width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--violet-bd);background:var(--color-brand);color:white;display:flex;align-items:center;justify-content:center;transition:background-color var(--transition-slow),border-color var(--transition-slow),filter var(--transition-base),transform var(--transition-base)}
    .send-btn:hover{filter:brightness(1.06)}
    .send-btn.send-btn--stop{background:var(--color-error);border-color:rgba(239,68,68,0.65);color:#ffffff}

    .send-btn-stop-icon{font-size:var(--font-size-sm);line-height:1;font-weight:700;display:block;transform:translateY(0.5px)}
    .metaRow{display:flex;justify-content:space-between;align-items:center;margin-top:var(--space-lg);color:var(--text-4);font-size:var(--font-size-sm)}
    .repoChip{display:inline-flex;align-items:center;gap:var(--space-lg);border:1px solid var(--border);background:var(--surface-alpha-1);padding:var(--space-sm) var(--space-lg);border-radius:var(--radius-pill);color:var(--text-2);cursor:pointer;transition:border-color var(--transition-base),background var(--transition-base)}
    .repoChip:hover{border-color:var(--border2);background:var(--surface-alpha-2)}
    .cdot{width:8px;height:8px;border-radius:var(--radius-pill);background:var(--violet)}
    .modelLabel{color:var(--text-4)}

    /* SETTINGS */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;padding:24px;z-index:100}
    .overlay.open{display:flex}
    .modal{width:340px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
    .modal-h{display:flex;align-items:center;justify-content:space-between;padding:var(--space-lg) var(--space-xl);border-bottom:1px solid var(--border)}
    .modal-h .t{font-weight:700}
    .modal-h .x{border:1px solid var(--border);background:transparent;color:var(--text-2);border-radius:var(--radius-md);width:28px;height:28px}
    .modal-tabs{display:flex;gap:var(--space-xl);padding:var(--space-lg) var(--space-xl) 0;border-bottom:1px solid var(--border)}
    .mtab{border:none;background:transparent;color:var(--text-3);padding:var(--space-lg) 0;position:relative;font-size:var(--font-size-base)}
    .mtab.active{color:var(--violet)}
    .mtab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--violet);border-radius:var(--radius-pill)}
    .modal-b{padding:var(--space-xl) var(--space-xl) var(--space-2xl)}
    .row{display:flex;justify-content:space-between;gap:var(--space-lg);padding:var(--space-lg) 0;border-bottom:1px solid var(--surface-alpha-3)}
    .row:last-child{border-bottom:none}
    .k{color:var(--text-4);font-size:var(--font-size-sm)}
    .v{color:var(--text-2);font-size:var(--font-size-base);text-align:right;max-width:210px;word-break:break-word}
    .skeleton{height:10px;border-radius:var(--radius-pill);background:var(--surface-alpha-4);overflow:hidden;position:relative}
    .skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, transparent, var(--surface-alpha-5), transparent);transform:translateX(-60%);animation:sk 1.2s ease-in-out infinite}
    @keyframes sk{to{transform:translateX(60%)}}
    .bar{height:8px;border-radius:var(--radius-pill);background:rgba(255,255,255,0.05);overflow:hidden;margin-top:var(--space-sm)}
    .bar>div{height:100%;background:var(--violet);width:0%}

    /* ── BYOK API Key settings ── */
    .apikey-section{padding:var(--space-xl) 0 var(--space-md)}
    .apikey-section-title{color:var(--text-1);font-size:var(--font-size-base);font-weight:600;margin-bottom:var(--space-lg)}
    .apikey-field-label{color:var(--text-4);font-size:var(--font-size-sm);margin-bottom:var(--space-md)}
    .apikey-input-row{display:flex;gap:var(--space-md);align-items:center;margin-bottom:var(--space-md)}
    .apikey-input{flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-md);color:var(--text-1);font-size:var(--font-size-base);padding:var(--space-md) var(--space-lg);outline:none;transition:border-color var(--transition-base);font-family:var(--font-family-mono);min-width:0}
    .apikey-input:focus{border-color:var(--violet)}
    .apikey-btn-show,.apikey-btn-save{border-radius:var(--radius-md);padding:var(--space-md) var(--space-lg);font-size:var(--font-size-sm);font-weight:600;border:1px solid var(--border2);cursor:pointer;white-space:nowrap;transition:opacity var(--transition-base)}
    .apikey-btn-show{background:transparent;color:var(--text-3)}
    .apikey-btn-save{background:var(--color-brand);color:#fff;border-color:transparent}
    .apikey-btn-save:disabled{opacity:0.5;cursor:not-allowed}
    .apikey-status{font-size:var(--font-size-sm);min-height:1.4em;margin-bottom:var(--space-md)}
    .apikey-status.success{color:var(--color-success)}
    .apikey-status.error{color:var(--color-error)}
    .apikey-status.warning{color:var(--color-warning)}
    .apikey-disclaimer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-lg);color:var(--text-4);font-size:var(--font-size-sm);line-height:1.5}
    /* First-run no-key banner in chat */
    .no-apikey-banner{margin:var(--space-xl) auto;max-width:480px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-md);padding:var(--space-xl);text-align:center}
    .no-apikey-banner p{color:var(--text-2);margin:0 0 var(--space-lg)}
    .no-apikey-banner button{background:var(--color-brand);color:#fff;border:none;border-radius:var(--radius-md);padding:var(--space-md) var(--space-xl);font-size:var(--font-size-base);font-weight:600;cursor:pointer;transition:opacity var(--transition-base)}
    .no-apikey-banner button:hover{opacity:0.85}
  </style>
</head>
<body>
  <div class="app" id="appRoot">
    <aside class="left open" id="sidebar">
      <div class="left-top">
        <div class="brand" title="Zone">
          <img src="/zonelogo.png" alt="Zone" style="width:28px;height:28px;object-fit:contain;">

          <div class="label">Select project</div>

      <div class="tabs">
        <button class="tab active" data-tab="byRepo">By Project</button>

          </svg>
        </div>
        <div class="bg-tasks-body" id="bgTasksBody"></div>
      </div>
      <div class="left-scroll" id="leftScroll"></div>
      <div class="left-bottom">
        <button class="settings-btn" id="openSettingsBtn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>

        </svg>

    <main class="center">
      <div class="center-top">
        <div class="run-dot" id="runDot"></div>

      </div>

      <div id="chatArea">
        <div class="empty" id="emptyState">
          <div>
            <div class="logo" aria-hidden="true">
              <img src="/zonelogo.png" alt="Zone" style="width:64px;height:64px;object-fit:contain;">

                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>

  <script>
    // ---- Config ingestion (supports both new and existing server injections) ----
    (function hydrateGlobals(){
      const cfg = (window.__ZONE_PUBLIC_CONFIG__ && typeof window.__ZONE_PUBLIC_CONFIG__ === 'object') ? window.__ZONE_PUBLIC_CONFIG__ : null;
      if (cfg) {
        // best-effort mapping (keeps compatibility with older server shapes)
        if (!window.ZONE_USER_ID && cfg.userId) window.ZONE_USER_ID = cfg.userId;
        if (!window.ZONE_MODEL && (cfg.model || cfg.llmModel)) window.ZONE_MODEL = cfg.model || cfg.llmModel;
        if (!window.ZONE_REPOS && Array.isArray(cfg.repos)) window.ZONE_REPOS = cfg.repos;
      }
      window.ZONE_REPOS = Array.isArray(window.ZONE_REPOS) ? window.ZONE_REPOS : [];
      window.ZONE_USER_ID = window.ZONE_USER_ID || null;
      window.ZONE_MODEL = window.ZONE_MODEL || 'gpt-4o';
    })();

    const state = {
      threads: [],          // { id, repoPath, repoName, title, messages: [], createdAt }
      activeThreadId: null,
      repos: window.ZONE_REPOS || [],
      activeRepo: null,     // { name, path }
      runId: null,
      runningThreadId: null,
      runningThreadSnapshot: null,
      runningThreadBufferedPayloads: [],
      isRunning: false,
      chatScrollFollow: true,
      userId: window.ZONE_USER_ID || null,
      eventSource: null,
      lastPatchResult: null,
      lastTaskText: null,
      runStartedAt: null,
      bgTasksOpen: false,
      taskQueue: [],        // { id, task, repoPath }
      sidebarState: 'open',
      sidebarOpenWidth: 220,
      sidebarResizing: false,
      __resumeScanInProgress: false,
      __sendDebugByRun: {},
      __trustedSession: false,
      __useStepTimeline: true   // flip to false to revert to raw log view
    };

    function getCurrentUserId(){
      const explicitUserId = String(state.userId || '').trim();
      if (explicitUserId) return explicitUserId;
      const cfg = (window.__ZONE_PUBLIC_CONFIG__ && typeof window.__ZONE_PUBLIC_CONFIG__ === 'object')
        ? window.__ZONE_PUBLIC_CONFIG__
        : null;
      const debugFallbackUserId = String(cfg?.debugFallbackUserId || '').trim();

    function nowTs(){ return new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' }); }

    // ---- Storage ----
    const LS_THREADS = 'zone_threads';
    const LS_SB_COLLAPSED = 'zone_sb_collapsed';

    function loadThreads(){
      try {
        const raw = localStorage.getItem(LS_THREADS);
        const arr = raw ? JSON.parse(raw) : [];
        const threads = Array.isArray(arr) ? arr : [];
        // Back-compat migration: older threads stored chat render instructions as {role,...}.
        state.threads = threads.map((t) => {
          if (!t || typeof t !== 'object') return t;
          const thread = t;
          const threadRepoPath = String(thread.repoPath || '').trim();
          const normalizedRepoName = basenameFromPath(threadRepoPath || String(thread.repoName || '').trim());
          if (normalizedRepoName) thread.repoName = normalizedRepoName;
          const msgs = Array.isArray(thread.messages) ? thread.messages : [];
          if (msgs.length > 0 && typeof msgs[0] === 'object' && msgs[0] && 'type' in msgs[0]) {
            return thread;
          }
          const migrated = [];
          for (const m of msgs) {
            if (!m || typeof m !== 'object') continue;
            if (m.role === 'user') {
              migrated.push({ type:'user', text: String(m.content || ''), ts: Number(m.ts || Date.now()) });
            } else if (m.role === 'assistant') {
              migrated.push({
                type:'result',
                ts: Number(m.ts || Date.now()),
                decisionMode:'chat',
                fileDiffs: [],
                appliedFiles: [],
                chatResponse: String(m.content || ''),
                blocked: false,
                summary: String(m.content || '').slice(0,80)
              });
            } else if (m.role === 'diff' && m.fileDiff) {
              migrated.push({
                type:'result',
                ts: Number(m.ts || Date.now()),
                decisionMode:'preview_only',
                fileDiffs: [m.fileDiff],
                appliedFiles: [],
                chatResponse: null,
                blocked: false,
                summary: 'diff'
              });
            }
          }
          thread.messages = migrated;
          return thread;
        });
      } catch { state.threads = []; }
    }
    function saveThreads(){
      try {
        const trimmed = (Array.isArray(state.threads) ? state.threads : []).map((t) => {
          if (!t || typeof t !== 'object') return t;
          const thread = t;
          const msgs = Array.isArray(thread.messages) ? thread.messages : [];
          if (msgs.length > 50) thread.messages = msgs.slice(msgs.length - 50);
          return thread;
        });
        localStorage.setItem(LS_THREADS, JSON.stringify(trimmed));
      } catch {}
    }

    function basenameFromPath(p){
      const s = String(p || '').replace(/\\/g, '/').replace(/\/+$/, '');
      const parts = s.split('/');
      return parts[parts.length - 1] || s || 'Project';
    }

    function normalizeRepoRecord(repo){
      if (!repo) return null;
      if (typeof repo === 'string') {
        const path = String(repo).trim();
        if (!path) return null;
        return { name: basenameFromPath(path), path };
      }
      if (typeof repo !== 'object') return null;
      const path = String(repo.path || repo.repoPath || '').trim();
      if (!path) return null;
      return {
        ...repo,
        name: basenameFromPath(path),
        path
      };
    }

    function normalizeRepoList(repos){
      const list = Array.isArray(repos) ? repos : [];
      const out = [];
      const seen = new Set();
      for (const repo of list) {
        const normalized = normalizeRepoRecord(repo);
        if (!normalized) continue;
        const key = String(normalized.path || '').trim();
        if (!key || seen.has(key)) continue;
        seen.add(key);
        out.push(normalized);
      }
      return out;
    }

    function normalizeSidebarOpenWidth(value){
      const n = Number(value);
      if (!Number.isFinite(n)) return DEFAULT_SIDEBAR_OPEN_WIDTH;
      return clamp(Math.round(n), MIN_SIDEBAR_OPEN_WIDTH, MAX_SIDEBAR_OPEN_WIDTH);
    }

    function loadSidebarOpenWidth(){
      let width = DEFAULT_SIDEBAR_OPEN_WIDTH;
      try {
        const raw = localStorage.getItem(LS_SB_WIDTH);

      return width;
    }

    function applySidebarOpenWidth(nextWidth, opts){

          els.sidebar.style.width = `${width}px`;
          els.sidebar.style.flexBasis = `${width}px`;
        }
      }
      if (options.persist !== false) {
        try { localStorage.setItem(LS_SB_WIDTH, String(width)); } catch {}
      }
      return width;
    }

    function syncSidebarWidthForState(mode){
      if (!els.sidebar) return;
      if (mode === 'open') {
        const width = normalizeSidebarOpenWidth(state.sidebarOpenWidth);

        els.sidebar.style.flexBasis = `${width}px`;
        return;
      }
      els.sidebar.style.width = '60px';
      els.sidebar.style.flexBasis = '60px';

    function normalizeSidebarState(value){

    function renderSidebarToggleIcon(mode){
      const path =
        mode === 'open'
          ? 'M10 3.5L6 8l4 4.5'
          : 'M6 3.5L10 8l-4 4.5';
      return `
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">

        </svg>

    function applySidebarState(nextState){

        els.sidebar.classList.remove('open', 'compact');

            : 'Expand sidebar';
        els.sidebarToggle.title = title;

    function cycleSidebarState(){

    function startSidebarResize(ev){
      if (!els.sidebar || normalizeSidebarState(state.sidebarState) !== 'open') return;
      const startX = Number(ev.clientX || 0);
      const startWidth = normalizeSidebarOpenWidth(state.sidebarOpenWidth);
      state.sidebarResizing = true;
      els.sidebar.classList.add('is-resizing');
      document.body.classList.add('sidebar-resizing');

      const onMove = (moveEv) => {
        const nextWidth = normalizeSidebarOpenWidth(startWidth + (Number(moveEv.clientX || 0) - startX));
        applySidebarOpenWidth(nextWidth);
      };
      const onUp = () => {
        state.sidebarResizing = false;
        els.sidebar.classList.remove('is-resizing');
        document.body.classList.remove('sidebar-resizing');
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);

      window.addEventListener('mousemove', onMove);

    function loadReposFromStorage(){
      // If the server injected repos, keep them.
      if (Array.isArray(state.repos) && state.repos.length) return;

      const repoKeyDump = [];
      try {
        const keys = Object.keys(localStorage).filter(k => String(k).toLowerCase().includes('repo'));
        for (const k of keys) {
          const v = localStorage.getItem(k);
          repoKeyDump.push({ key: k, value: v });
        }
        if (repoKeyDump.length) console.log('[zone-ui] repo localStorage keys', repoKeyDump);
      } catch {}

      /** @type {{name:string,path:string}[]} */
      let repos = [];

      // New UI / future key
      try {
        const raw = localStorage.getItem(LS_REPOS);
        const parsed = raw ? JSON.parse(raw) : null;
        if (Array.isArray(parsed)) {
          repos = parsed
            .map((r) => {
              if (typeof r === 'string') return { name: basenameFromPath(r), path: r };
              if (r && typeof r === 'object') {
                const path = String(r.path || r.repoPath || '').trim();
                const name = String(r.name || r.repoName || basenameFromPath(path)).trim();
                return path ? { name, path } : null;
              }
              return null;
            })
            .filter(Boolean);
        }
      } catch {}

      // Old UI compatibility: repo history was stored as an array of paths.
      // Migrate on first load then delete the old key.
      if (!repos.length) {
        try {
          const raw = localStorage.getItem(LS_REPO_HISTORY);
          const parsed = raw ? JSON.parse(raw) : null;
          if (Array.isArray(parsed)) {
            repos = parsed
              .filter((p) => {
                if (typeof p === 'string') return String(p).trim();
                if (p && typeof p === 'object') return String(p.path || p.repoPath || '').trim();
                return false;
              })
              .map((p) => {
                if (typeof p === 'string') {
                  const pt = String(p).trim();
                  return { id: crypto.randomUUID(), name: basenameFromPath(pt), path: pt, createdAt: Date.now() };
                }
                const pt = String(p.path || p.repoPath || '').trim();
                return pt ? { id: crypto.randomUUID(), name: basenameFromPath(pt), path: pt, createdAt: Date.now() } : null;
              })
              .filter(Boolean);
            if (repos.length) {
              // Migrate: write canonical format and remove the legacy key.
              try { localStorage.setItem(LS_REPOS, JSON.stringify(repos)); } catch {}
              try { localStorage.removeItem(LS_REPO_HISTORY); } catch {}
            }
          }
        } catch {}
      }

      // De-dupe by path.
      repos = normalizeRepoList(repos);

      if (repos.length) {
        state.repos = repos;
        window.ZONE_REPOS = repos;
        try { localStorage.setItem(LS_REPOS, JSON.stringify(repos)); } catch {}
      }
    }

    // ---- UI helpers ----
    const CHAT_SCROLL_BOTTOM_THRESHOLD_PX = 50;
    function isNearBottom(el, px = CHAT_SCROLL_BOTTOM_THRESHOLD_PX){
      if (!el) return true;
      return (el.scrollHeight - el.scrollTop - el.clientHeight) < px;
    }
    function scrollToBottomIfNear(el, wasNear){

        el.scrollTop = el.scrollHeight;

    // Programmatic scrolls should not toggle follow mode.
    state.__isProgrammaticChatScroll = false;
    function scheduleChatScrollToBottom(forceFollow){
      if (!els.chatArea) return;
      if (forceFollow) state.chatScrollFollow = true;
      // Scroll *after* DOM updates; double-rAF handles layout + paint reliably.
      state.__isProgrammaticChatScroll = true;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          try { if (els.chatArea) els.chatArea.scrollTop = els.chatArea.scrollHeight; } catch {}
          // Release guard on next frame so a real user scroll can take over.
          requestAnimationFrame(() => { state.__isProgrammaticChatScroll = false; });
        });
      });
    }

    if (els.chatArea) {
      els.chatArea.addEventListener('scroll', () => {
        if (state.__isProgrammaticChatScroll) return;
        const el = els.chatArea;
        if (!el) return;
        const atBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 50;
        if (!atBottom) state.chatScrollFollow = false;
      });
    }
    function isPatchStreamAnimatingForRun(runId){
      if (!runId) return false;
      state.__streamTypeIvs = state.__streamTypeIvs || {};
      if (state.__streamTypeIvs[runId]) return true;
      const lb = document.getElementById('logBlock-' + runId);
      return !!(lb && lb.querySelector('.livecode.streaming'));
    }
    /** @param {HTMLElement|string|null} [logBlockOrRunId] log card element, runId string, or omit (uses current run). */
    function scrollChatIfFollowing(logBlockOrRunId){
      if (!state.chatScrollFollow) return;
      const el = els.chatArea;
      if (!el) return;
      const lastChild = el.lastElementChild;
      if (!lastChild) return;
      const lastBottom = lastChild.getBoundingClientRect().bottom;
      const areaBottom = el.getBoundingClientRect().bottom;
      if (lastBottom > areaBottom) {
        // content is below viewport — scroll just enough to show it
        state.__isProgrammaticChatScroll = true;
        el.scrollTop += (lastBottom - areaBottom) + 8;
        requestAnimationFrame(() => {
          state.__isProgrammaticChatScroll = false;
        });
      }
    }
    function resetChatScrollFollow(){
      const el = document.getElementById('chatArea');
      if (!el) return;
      state.chatScrollFollow = true;
      state.__isProgrammaticChatScroll = true;  // set BEFORE any scrollTop change
      el.scrollTop = el.scrollHeight + 9999;
      requestAnimationFrame(() => {
        el.scrollTop = el.scrollHeight + 9999;
        requestAnimationFrame(() => {
          state.__isProgrammaticChatScroll = false;  // clear AFTER second frame
        });
      });
    }

    let sendBtnDefaultMarkup = '';
    function updateSendButtonKillMode(kill){
      console.log('[zone-kill-mode]', { kill, btnExists: !!document.querySelector('.send-btn') });

    async function cancelActivePatchRun(){
      const rid = state.currentRunId;
      if (!rid) return;

        await fetch('/api/cancel', {
          method: 'POST',

    }
    function setRunningUI(running){

      updateInputPlaceholder();
      renderQueuePanel();
      renderBgTasks();
      if (state.isRunning) {

        els.statusBadge.textContent = 'done';
        els.statusBadge.classList.add('show','done');

    let bgTasksTimer = null;
    function formatElapsed(ms){
      const s = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m > 0 ? `${m}m ${String(r).padStart(2,'0')}s` : `${r}s`;
    }

    function toggleBgTasks(){
      state.bgTasksOpen = !state.bgTasksOpen;
      renderBgTasks();
    }

    function renderBgTasks(){
      if (!els.bgTasks || !els.bgTasksBody || !els.bgTasksLabel || !els.bgSpinner) return;
      const q = Array.isArray(state.taskQueue) ? state.taskQueue : [];
      const n = (state.isRunning ? 1 : 0) + q.length;
      if (n === 0) {
        els.bgTasks.style.display = 'none';
        els.bgTasksBody.innerHTML = '';
        els.bgTasks.classList.remove('open');
        if (bgTasksTimer) { try { clearInterval(bgTasksTimer); } catch {} bgTasksTimer = null; }
        return;
      }
      els.bgTasks.style.display = '';
      els.bgTasksLabel.textContent = `${n} background task${n === 1 ? '' : 's'}`;
      els.bgSpinner.style.display = state.isRunning ? '' : 'none';
      els.bgTasks.classList.toggle('open', !!state.bgTasksOpen);

      // body rows
      els.bgTasksBody.innerHTML = '';
      if (state.isRunning) {
        const row = document.createElement('div');
        row.className = 'bg-task-row';
        const icon = document.createElement('span');
        icon.className = 'bg-task-icon';
        icon.textContent = '▶';
        const txt = document.createElement('span');
        txt.className = 'bg-task-text';
        txt.textContent = String(state.lastTaskText || '').slice(0,30) + (String(state.lastTaskText||'').length>30?'…':'');
        const time = document.createElement('span');
        time.className = 'bg-task-time';
        const started = typeof state.runStartedAt === 'number' ? state.runStartedAt : null;
        time.textContent = started ? formatElapsed(Date.now() - started) : 'running';
        row.appendChild(icon); row.appendChild(txt); row.appendChild(time);
        els.bgTasksBody.appendChild(row);
      }
      q.forEach((it) => {
        const row = document.createElement('div');
        row.className = 'bg-task-row';
        const icon = document.createElement('span');
        icon.className = 'bg-task-icon queued';
        icon.textContent = '○';
        const txt = document.createElement('span');
        txt.className = 'bg-task-text';
        const t = String(it.task || '');
        txt.textContent = t.slice(0,30) + (t.length>30?'…':'');
        const time = document.createElement('span');
        time.className = 'bg-task-time';
        time.textContent = 'queued';
        row.appendChild(icon); row.appendChild(txt); row.appendChild(time);
        els.bgTasksBody.appendChild(row);
      });

      // elapsed updater
      if (bgTasksTimer) { try { clearInterval(bgTasksTimer); } catch {} bgTasksTimer = null; }
      if (state.isRunning) {
        bgTasksTimer = setInterval(() => {
          // update only the first row time
          const first = els.bgTasksBody.querySelector('.bg-task-row .bg-task-time');
          if (!first) return;
          const started = typeof state.runStartedAt === 'number' ? state.runStartedAt : null;
          if (!started) return;
          first.textContent = formatElapsed(Date.now() - started);
        }, 1000);
      }
    }
    function setIdleUI(){
