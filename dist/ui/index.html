    function syncInterruptedRunsFromCache(activeRunsById){
      const runs = activeRunsById || state.__activeRunsById || {};
      const activeThreadId = String(state.activeThreadId || '').trim();
      Object.values(runs).forEach((run) => {
        const rid = String(run?.runId || '').trim();
        if (!rid || String(run?.status || '') !== 'interrupted') return;
        if (activeThreadId && String(run?.threadId || '').trim() && String(run.threadId).trim() !== activeThreadId) {
          return;
        }
        const g = document.getElementById(`runGroup-${rid}`);
        if (!g) return;
        if (String(g?.dataset?.runStatus || '') === 'running') {
          try { console.log('[resume-debug] deferring interrupted cache render until /api/run-status resolves', { runId: rid }); } catch {}
          return;
        }
        try { g.dataset.runStatus = 'interrupted'; } catch {}
        setResumeButton(rid);
      });
    }

    async function reconnectInProgressRuns(activeRunsById){
      const stats = { lost: 0, recovered: 0 };
      try {
        const cachedRuns = activeRunsById || state.__activeRunsById || {};
        const groups = Array.from(document.querySelectorAll('.run-group[data-run-status="running"][id^="runGroup-"]'));
        for (const g of groups) {
          const rid = String(g.id || '').replace(/^runGroup-/, '');
          if (!rid) continue;
          const logBlock = document.getElementById(`logBlock-${rid}`);
          if (!logBlock) continue;

          setResumeBadge(rid, 'reconnecting', 'Reconnecting…');
          let status = null;
          let statusHttpOk = false;
          let statusHttpCode = null;
          try {
            const r = await fetch(`/api/run-status/${encodeURIComponent(rid)}`);
            statusHttpOk = r.ok;
            statusHttpCode = r.status;
            status = r.ok ? await r.json() : null;
          } catch { status = null; }
          try {
            console.log('[resume-debug] /api/run-status response', {
              runId: rid,
              httpOk: statusHttpOk,
              httpCode: statusHttpCode,
              status,
            });
          } catch {}

          if (!status || !status.ok) {
            const interruptedRun = cachedRuns[rid];
            if (interruptedRun && String(interruptedRun.status || '') === 'interrupted') {
              try { console.log('[resume-debug] branch: interrupted-via-active-runs', { runId: rid, interruptedRun }); } catch {}
              try { g.dataset.runStatus = 'interrupted'; } catch {}
              setResumeButton(rid);
              stats.recovered += 1;
            } else {
              try { console.log('[resume-debug] branch: lost-run', { runId: rid, interruptedRun }); } catch {}
              setResumeBadge(rid, 'interrupted', 'Lost');
              stats.lost += 1;
            }
            if (g.dataset.interruptedLogged !== '1') {
              try { appendLogLine(logBlock, { timestamp: nowTs(), message: 'interrupted — server restarted', status: 'warning' }); } catch {}
              g.dataset.interruptedLogged = '1';
            }
            continue;
          }

          const st = String(status.status || '');
          // restore running UI state for Scenario A
          if (st === 'running') {
            try { console.log('[resume-debug] branch: running-replay', { runId: rid }); } catch {}
            state.runId = rid;
            state.currentRunId = rid;
            state.isRunning = true;
            setRunningUI(true);
            openReplaySSE(rid);
            setResumeBadge(rid, 'live', 'Live');
            stats.recovered += 1;
            return stats; // only one active run supported
          }
          if (st === 'completed' || st === 'cancelled') {
            try { console.log('[resume-debug] branch: replay-final-status', { runId: rid, status: st }); } catch {}
            // Replay once to catch up then mark done
            openReplaySSE(rid);
            setResumeBadge(rid, st === 'completed' ? 'live' : 'interrupted', st === 'completed' ? 'Caught up' : 'Cancelled');
            try { g.dataset.runStatus = st; } catch {}
            try { logBlock.classList.add('done'); } catch {}
            stats.recovered += 1;
            continue;
          }
          if (st === 'interrupted') {
            try { console.log('[resume-debug] branch: interrupted-via-run-status', { runId: rid, status: st }); } catch {}
            try { g.dataset.runStatus = 'interrupted'; } catch {}
            setResumeButton(rid);
            stats.recovered += 1;
            continue;
          }
          try { console.log('[resume-debug] branch: unknown-status', { runId: rid, status: st }); } catch {}
        }
      } catch {}
      return stats;
    }

    async function syncActiveRunUi(){
      const startedAt = Date.now();
      const candidateGroups = Array.from(document.querySelectorAll('.run-group[data-run-status="running"][id^="runGroup-"]'));
      const candidateIds = candidateGroups
        .map((g) => String(g.id || '').replace(/^runGroup-/, ''))
        .filter(Boolean);
      state.__resumeScanInProgress = true;
      try { console.log('[resume-debug] starting resume scan, candidate count=' + candidateIds.length, { candidateIds }); } catch {}
      try {
        const activeRunsById = await fetchActiveRunsForCurrentUser();
        syncInterruptedRunsFromCache(activeRunsById);
        const stats = await reconnectInProgressRuns(activeRunsById);
        try { console.log('[resume-debug] scan complete, ms=' + (Date.now() - startedAt), { lost: Number(stats?.lost || 0), recovered: Number(stats?.recovered || 0) }); } catch {}
      } finally {
        state.__resumeScanInProgress = false;
      }
    }

    function normalizeStatus(s){
      if (s === 'success') return 'success';
      if (s === 'warning') return 'warning';
      if (s === 'error') return 'error';
      if (s === 'done') return 'done';
      return 'active';
    }

    /** Tool stderr/stdout: show first line only in the log preview. */
    function condenseToolOutputForLog(text){
      const raw = String(text || '').replace(/\r\n/g, '\n');
      const lines = raw.split('\n');
      const first = (lines[0] || '').trim();
      const max = 280;
      const head = first.length > max ? (first.slice(0, max) + '...') : first;
      if (lines.length <= 1 && raw.length <= max) return head;
      return head ? (head + ' ...') : '...';
    }

    function handleSSEPayload(payload, runId){
      const termEvt =
        (payload && payload.progress && (payload.progress.type === 'terminal_output' || payload.progress.type === 'terminal_done'))
          ? payload.progress
          : null;
      if (termEvt) {
        const type = String(termEvt.type || '');
        if (type === 'terminal_output') {
          const linesEl = document.getElementById(`terminalLines-${runId}`);
          if (!linesEl) return;
          const line = document.createElement('div');
          line.className = 'term-line' + (String(termEvt.stream || '') === 'stderr' ? ' err' : '');
          line.textContent = String(termEvt.title || '');
          linesEl.appendChild(line);
          scrollChatIfFollowing();
          return;
        }
        if (type === 'terminal_done') {
          const card = document.getElementById(`terminalBlock-${runId}`);
          if (!card) return;
          const exitCode = Number(termEvt.exitCode ?? 1);
          const exit = document.createElement('div');
          exit.className = 'term-exit ' + (exitCode === 0 ? 'ok' : 'bad');
          exit.textContent = exitCode === 0 ? `✓ Exit ${exitCode}` : `✗ Exit ${exitCode}`;
          card.appendChild(exit);
          scrollChatIfFollowing();
          return;
        }
      }
      const approvalEvt =
        (payload && payload.type === 'command_approval_required')
          ? payload
          : (payload && payload.progress && payload.progress.type === 'command_approval_required')
            ? payload.progress
            : null;
      if (approvalEvt) {
        const logBlock = document.getElementById(`logBlock-${runId}`);
        if (!logBlock) return;
        const approvalId = String(approvalEvt.approvalId || '');
        const command = String(approvalEvt.command || '');
        if (!approvalId || !command) return;

        // Let the Summary view record this approval (it normally never reaches line 5186).
        recordExecutionSummaryPayload(logBlock, payload, runId);

        const lines = logBlock.querySelector('.log-lines') || logBlock;
        const existing = document.getElementById(`cmdApproval-${approvalId}`);
        if (existing) return;

        // If user trusted this session, auto-approve without showing the card.
        if (state.__trustedSession) {
          appendLogLine(logBlock, { timestamp: nowTs(), message: `Auto-approved: $ ${command}`, status: 'done' });
          void (async () => {
            try {
              await fetch('/api/approve-command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ approvalId, approved: true, runId, trustSession: true })
              });
            } catch {}
          })();
          scrollChatIfFollowing(logBlock);
          return;
        }

        const card = document.createElement('div');
        card.className = 'approval-card';
        card.id = `cmdApproval-${approvalId}`;

        const title = document.createElement('div');
        title.className = 'approval-title';
        title.innerHTML = `<span class="bolt">$</span><span>Run this command?</span>`;

        const code = document.createElement('code');
        code.className = 'approval-code';
        code.textContent = `$ ${command}`;

        const actions = document.createElement('div');
        actions.className = 'approval-actions';

        const approveBtn = document.createElement('button');
        approveBtn.className = 'approval-approve';
        approveBtn.textContent = '✓ Approve';

        const rejectBtn = document.createElement('button');
        rejectBtn.className = 'approval-reject';
        rejectBtn.textContent = '✗ Reject';

        const trustRow = document.createElement('label');
        trustRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--text-3);user-select:none';
        const trustCb = document.createElement('input');
        trustCb.type = 'checkbox';
        trustCb.style.cssText = 'accent-color:#7c3aed;transform:translateY(1px)';
        const trustTxt = document.createElement('span');
        trustTxt.textContent = 'Trust all commands for this session';
        trustRow.appendChild(trustCb);
        trustRow.appendChild(trustTxt);

        const status = document.createElement('div');
        status.className = 'approval-status';
        status.textContent = '';

        async function sendDecision(approved){
          approveBtn.disabled = true;
          rejectBtn.disabled = true;
          status.textContent = approved ? 'Approved ✓' : 'Rejected ✗';
          if (approved && trustCb && trustCb.checked) {
            state.__trustedSession = true;
          }
          try {
            await fetch('/api/approve-command', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ approvalId, approved: !!approved, runId, trustSession: !!(approved && trustCb && trustCb.checked) })
            });
          } catch {}
        }

        approveBtn.addEventListener('click', () => { void sendDecision(true); });
        rejectBtn.addEventListener('click', () => { void sendDecision(false); });

        actions.appendChild(approveBtn);
        actions.appendChild(rejectBtn);
        actions.appendChild(status);
        actions.appendChild(trustRow);

        card.appendChild(title);
        card.appendChild(code);
        card.appendChild(actions);
        lines.appendChild(card);
        scrollChatIfFollowing(logBlock);
        return;
      }
      if (payload?.lifecycle?.type === 'run_started' || payload?.lifecycle?.type === 'run_completed') {
        console.log('[zone-lifecycle-debug]', {
          lifecycleType: payload.lifecycle.type,
          eventRunId: runId,
          currentRunId: state.currentRunId,
          stateRunId: state.runId,
          idsMatch: runId === state.currentRunId,
          sendBtnHasStopClass: !!document.querySelector('.send-btn')?.classList?.contains('send-btn--stop'),
        });
      }
      const { stage, lifecycle, progress } = payload || {};
      const logBlock = document.getElementById(`logBlock-${runId}`);
      const progressTypeForMissingBlock = String(progress?.type || '');
      const canHandleWithoutLogBlock =
        progressTypeForMissingBlock === 'chat_start' ||
        progressTypeForMissingBlock === 'chat_chunk' ||
        progressTypeForMissingBlock === 'chat_done' ||
        progressTypeForMissingBlock === 'chat_response' ||
        progressTypeForMissingBlock === 'run_completed_with_result';
      if (!logBlock) {
        if (progress && canHandleWithoutLogBlock) {
          if (state.runningThreadId && state.activeThreadId !== state.runningThreadId) {
            state.runningThreadBufferedPayloads = Array.isArray(state.runningThreadBufferedPayloads) ? state.runningThreadBufferedPayloads : [];
            state.runningThreadBufferedPayloads.push(payload);
            if (state.runningThreadBufferedPayloads.length > 500) state.runningThreadBufferedPayloads.shift();
            return;
          }
          // chat runs stream without a log block when the active thread is visible
        } else {
        // User may have switched threads (or the live DOM was re-rendered); don't throw away progress.
          if (state.isRunning && state.runId === runId) {
            if (state.runningThreadId && state.activeThreadId === state.runningThreadId) {
              // Live DOM missing while on running thread: persist whatever is currently on-screen.
              state.runningThreadSnapshot = String(els.chatArea.innerHTML || state.runningThreadSnapshot || '');
            } else if (state.activeThreadId !== state.runningThreadId) {
              // Away from running thread: buffer payloads for replay on restore.
              state.runningThreadBufferedPayloads = Array.isArray(state.runningThreadBufferedPayloads) ? state.runningThreadBufferedPayloads : [];
              state.runningThreadBufferedPayloads.push(payload);
              // Keep memory bounded.
              if (state.runningThreadBufferedPayloads.length > 500) state.runningThreadBufferedPayloads.shift();
            }
          }
          return;
        }
      }

      const shouldSnapshotAfterAppend = !!(state.isRunning && state.runningThreadId && state.activeThreadId === state.runningThreadId && state.runId === runId);

      try {
      // Start/stop live coding animation based on lifecycle/stage/progress.
      const stageText = String(stage || '');
      const lifecycleType = String(lifecycle?.type || '');
      const progressType = String(progress?.type || '');
      const progressTitle = String(progress?.title || '');

      recordExecutionSummaryPayload(logBlock, payload, runId);

      // After refresh-resume, final result arrives via SSE replay (not the orphaned HTTP response).
      if (progress && progressType === 'run_completed_with_result' && progress.result) {
        handlePatchResult(progress.result, runId);
        return;
      }

      if (lifecycle && runId === state.currentRunId) {
        if (lifecycleType === 'run_started') updateSendButtonKillMode(true);
        else if (lifecycleType === 'run_completed' || lifecycleType === 'run_cancelled') {
          updateSendButtonKillMode(false);
        }
      }

      function basenameFromPath(p){
        const s = String(p || '');
        const parts = s.split(/[\\/]/).filter(Boolean);
        return parts.length ? parts[parts.length - 1] : s;
      }

      // Streaming patch -> in-chat livecode only (no right panel)
      if (progress && progressType === 'patch_stream_target') {
        const fp = String(progress.filePath || '');
        const sym = String(progress.targetSymbol || '').trim();
        state.__streamTargetByFile = state.__streamTargetByFile || {};
        if (fp && sym) state.__streamTargetByFile[fp] = sym;
      }
      if (progress && progressType === 'patch_stream_delta') {
        // If backend had to fallback to single-chunk delta, mark so FE can animate locally.
        if (progress.fallback === true) {
          state.__streamFallback = state.__streamFallback || {};
          state.__streamFallback[runId] = true;
        }
        // Start fallback animation immediately on first delta (default duration),
        // so the user sees the streaming block during patch generation.
        state.__streamStartTs = state.__streamStartTs || {};
        state.__streamTargetDurationMs = state.__streamTargetDurationMs || {};
        const firstDeltaForRun = !state.__streamStartTs[runId];
        if (firstDeltaForRun) {
          state.__streamStartTs[runId] = Date.now();
          state.__streamTargetDurationMs[runId] = 2000; // default; max 2s (sync with patch gen)
        }
        const fp = String(progress.filePath || '');
        const d = String(progress.delta || '');
        if (d) {
          state.__streamDeltaBuffer = state.__streamDeltaBuffer || {};
          state.__streamDeltaFlushed = state.__streamDeltaFlushed || {};
          const alreadyFlushed = !!state.__streamDeltaFlushed[runId];

          if (alreadyFlushed) {
            // After flush, stream directly like before.
            appendStreamToLiveCode(logBlock, runId, fp, d);
          } else {
            // Before we see "Generating a localized patch", buffer deltas silently.
            const buf = state.__streamDeltaBuffer[runId] || { filePath: '', deltas: [] };
            if (!buf.filePath && fp) buf.filePath = fp;
            buf.deltas = Array.isArray(buf.deltas) ? buf.deltas : [];
            buf.deltas.push(d);
            state.__streamDeltaBuffer[runId] = buf;
          }
        }
        if (firstDeltaForRun) tryBeginFallbackStreamAnim(runId);
      }
      if (progressType === 'patch_converted') {
        state.__runIsComplete = state.__runIsComplete || {};
        state.__runIsComplete[runId] = true;
        if (state.__streamFallbackPayload && state.__streamFallbackPayload[runId]) {
          snapFallbackStreamAnimToEnd(runId);
        } else {
          applyNonFallbackStreamStatic(runId);
        }
        if (state.__streamLive) delete state.__streamLive[String(runId || '')];
        if (state.__streamRawDeltaConcatByRun && state.__streamRawDeltaConcatByRun[runId]) {
          delete state.__streamRawDeltaConcatByRun[runId];
        }
        if (state.__streamMountedAt && state.__streamMountedAt[runId]) delete state.__streamMountedAt[runId];
        if (state.__streamFallback && state.__streamFallback[runId]) delete state.__streamFallback[runId];
        if (state.__streamStartTs && state.__streamStartTs[runId]) delete state.__streamStartTs[runId];
        if (state.__streamTargetDurationMs && state.__streamTargetDurationMs[runId]) delete state.__streamTargetDurationMs[runId];
        if (state.__streamFallbackPayload && state.__streamFallbackPayload[runId]) delete state.__streamFallbackPayload[runId];
        if (state.__streamTypeIvs && state.__streamTypeIvs[runId]) delete state.__streamTypeIvs[runId];
      }

      // Do not append log lines for streaming events.
      if (progress && (progressType === 'patch_stream_delta' || progressType === 'patch_stream_target')) return;

      // Plan UI in right panel only (transient). Do not show for chat runs.
      state.__runIsChat = state.__runIsChat || {};
      if (progressType === 'chat_start' || progressType === 'chat_chunk' || progressType === 'chat_done' || progressType === 'chat_response') state.__runIsChat[runId] = true;
      if (progressType === 'chat_start') {
        hideEmpty();
        ensureChatBubbleForRun(runId);
        scrollChatIfFollowing();
        return;
      }
      if (progressType === 'chat_chunk') {
        hideEmpty();
        updateStreamingChatBubble(runId, String(progress.delta || ''));
        scrollChatIfFollowing();
        return;
      }
      if (progressType === 'chat_done') {
        hideEmpty();
        finalizeChatBubble(runId, progress);
        upsertChatResponseMessage(runId, progress);
        try {
          const g = document.getElementById(`runGroup-${runId}`);
          if (g) g.dataset.runStatus = 'completed';
        } catch {}
        persistRunGroupHtmlToThread(runId, 'completed');
        scrollChatIfFollowing();
        return;
      }
      if (progress && progressType === 'plan_discard') {
        return;
      }
      if (progress && progressType === 'plan_generated') {
        return; // Do not log "Plan generated" in the chat log.
      }
      if (progress && progressType === 'plan_step_complete') {
        return; // Do not log "Plan step X complete" in the chat log.
      }

      if (lifecycleType === 'run_completed') {
        state.__runIsComplete = state.__runIsComplete || {};
        state.__runIsComplete[runId] = true;
        if (state.__streamFallbackPayload && state.__streamFallbackPayload[runId]) {
          snapFallbackStreamAnimToEnd(runId);
        }
        if (state.__streamLive) delete state.__streamLive[String(runId || '')];
        if (state.__streamRawDeltaConcatByRun && state.__streamRawDeltaConcatByRun[runId]) {
          delete state.__streamRawDeltaConcatByRun[runId];
        }
        if (state.__streamMountedAt && state.__streamMountedAt[runId]) delete state.__streamMountedAt[runId];
        if (state.__streamFallback && state.__streamFallback[runId]) delete state.__streamFallback[runId];
        if (state.__streamStartTs && state.__streamStartTs[runId]) delete state.__streamStartTs[runId];
        if (state.__streamTargetDurationMs && state.__streamTargetDurationMs[runId]) delete state.__streamTargetDurationMs[runId];
        if (state.__streamFallbackPayload && state.__streamFallbackPayload[runId]) delete state.__streamFallbackPayload[runId];
        if (state.__streamTypeIvs && state.__streamTypeIvs[runId]) delete state.__streamTypeIvs[runId];
        state.__streamTargetByFile = {};
        if (state.__streamLogLineIdByRun && state.__streamLogLineIdByRun[runId]) {
          const id = state.__streamLogLineIdByRun[runId];
          const el = document.getElementById(id);
          if (el) { try { el.remove(); } catch {} }
          delete state.__streamLogLineIdByRun[runId];
        }
        // On completion, scroll once to reveal the final output (even if user previously scrolled up).
        try {
          if (els.chatArea) {
            const prevFollow = !!state.chatScrollFollow;
            els.chatArea.scrollTop = els.chatArea.scrollHeight;
            state.chatScrollFollow = prevFollow;
          }
        } catch {}
      }
      // Finalize step timeline on completion / cancellation / ready-stage.
      if (state.__useStepTimeline) {
        if (lifecycleType === 'run_completed') finalizeStepTimeline(runId, 'done');
        else if (lifecycleType === 'run_cancelled') finalizeStepTimeline(runId, 'warning');
        else if (stageText === 'Ready' || progressType === 'run_completed_with_result') {
          // Belt-and-suspenders: 'Ready' stage or a final-result event that slipped through.
          const _pd = String(progress?.decisionMode || progress?.finalState || '');
          finalizeStepTimeline(runId, _pd === 'safe_to_apply' ? 'done' : 'warning');
        }
      }

      if (lifecycle) {
        const lm = lifecycleType === 'run_cancelled'
          ? 'Cancelled'
          : (lifecycle.message || lifecycle.type || 'lifecycle');
        const lst = lifecycle.type === 'run_completed' ? 'done'
          : lifecycle.type === 'run_cancelled' ? 'warning'
          : 'active';
        appendLogLine(logBlock, {
          timestamp: lifecycle.timestamp || nowTs(),
          message: lm,
          status: lst
        });
      }
      if (lifecycleType === 'run_cancelled' && runId === state.currentRunId) {
        try { if (state.eventSource) state.eventSource.close(); } catch {}
        state.eventSource = null;
        completeExecutionSummary(runId);
        setLogBlockDone(runId);
        setRunningUI(false);
        // After cancellation, run the next queued task (if any). This is used by "Save & Run".
        dequeueAndRunNext();
        try {
          const g = document.getElementById(`runGroup-${runId}`);
          if (g) g.dataset.runStatus = 'cancelled';
        } catch {}
        try { persistRunGroupHtmlToThread(runId, 'cancelled'); } catch {}
      }
      const placeholderFilePath =
        (progress && typeof progress.filePath === 'string' && progress.filePath.trim())
          ? progress.filePath.trim()
          : '';
      const shouldShowWriting =
        progressTitle.toLowerCase().includes('generating a localized patch');
      if (shouldShowWriting) showWritingPlaceholder(logBlock, runId, placeholderFilePath);

      if (progress) {
        const type = progress.type;
        const progTitle = String(progress.title || '');
        const stageLower = String(stage || '').toLowerCase();

        if (type === 'handoff_report' && progress.report) {
          state.__handoffReportByRun = state.__handoffReportByRun || {};
          state.__handoffReportByRun[runId] = progress.report;
          return;
        }

        if (type === 'agent_loop_start' || /starting agent tool loop/i.test(progTitle)) {
          appendLogLine(logBlock, {
            timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
            message: 'Agent working...',
            status: 'active'
          });
          return;
        }
        if (type === 'agent_loop_complete') {
          const ok = (progress.status === 'success');
          appendLogLine(logBlock, {
            timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
            message: 'Agent finished',
            status: ok ? 'done' : 'warning'
          });
          return;
        }

        if (type === 'tool_call') {
          if (/\[agent_loop\]\s*iteration\b/i.test(progTitle) || /\[agent_loop\]/i.test(progTitle) && /\biteration\b/i.test(progTitle)) {
            return;
          }
          const humanizeTool = (t) => {
            const s = String(t || '');
            const m = s.match(/^\[tool\]\s*([a-z_]+)(?::\s*(.*))?$/i);
            if (!m) return s;
            const name = String(m[1] || '').toLowerCase();
            const arg = String(m[2] || '').trim();
            const base = arg.split(/[\\/]/).filter(Boolean).pop() || arg;
            if (name === 'read_file') return `Reading ${base || 'file'}...`;
            if (name === 'write_file') return `Fixing ${base || 'file'}...`;
            if (name === 'list_files') return `Exploring directory...`;
            if (name === 'run_command') return `Running ${arg || 'command'}...`;
            if (name === 'search_in_files') return `Searching codebase...`;
            return s;
          };
          appendLogLine(logBlock, {
            timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
            message: humanizeTool(progress.title || '[tool] call'),
            status: 'active'
          });
          // Mark the most recent line as the active tool line.
          const lines = logBlock.querySelectorAll('.log-line');
          const last = lines[lines.length - 1];
          if (last) last.classList.add('tool-line-active');
          return;
        }
        if (type === 'tool_result') {
          const lastToolLine = logBlock.querySelector('.tool-line-active');
          if (lastToolLine) {
            lastToolLine.classList.remove('tool-line-active');
            lastToolLine.classList.add((progress.status === 'success') ? 'c-done' : 'c-error');
            const resultSpan = document.createElement('div');
            resultSpan.className = 'tool-result-output';
            resultSpan.style.cssText = 'font-size:10px;color:#52525b;padding:2px 0 4px 16px;font-family:monospace;white-space:pre-wrap;max-height:60px;overflow:hidden';
            resultSpan.textContent = condenseToolOutputForLog(progress.detail || '');
            lastToolLine.parentNode.insertBefore(resultSpan, lastToolLine.nextSibling);
          }
          return;
        }
        if (type === 'planner_result' && progress.planner) {
          renderPlannerCard(logBlock, progress.planner);
          return;
        }
        if (type === 'chat_response') {
          const chatTitle = String(progress.title || progress.responseText || '');
          hideEmpty();
          finalizeChatBubble(runId, {
            responseText: chatTitle,
            responseHtml: progress.responseHtml,
            contextFiles: progress.contextFiles,
          });
          upsertChatResponseMessage(runId, {
            responseText: chatTitle,
            responseHtml: progress.responseHtml,
            contextFiles: progress.contextFiles,
          });
          scrollChatIfFollowing();
          return;
        }
        if (type === 'verification_investigating') {
          // Start grouped verification summary (replaces noisy iteration/tool lines).
          state.__verifySummary = state.__verifySummary || {};
          if (!state.__verifySummary[runId] || !state.__verifySummary[runId].el) {
            // Create the block in the log stream.
            appendLogLine(logBlock, {
              timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
              message: 'Investigating test failure...',
              status: 'active',
              className: 'c-active'
            });
            // Convert the last appended log line into a summary block (keep ordering).
            const lines = logBlock.querySelector('.log-lines');
            const lastLine = lines ? lines.querySelector('.log-line.active') : null;
            if (lastLine) {
              // Remove the raw line and replace with the summary block.
              try { lastLine.remove(); } catch {}
              // Use appendLogLine's helper by invoking it via a synthetic hidden line:
              // we rely on ensureVerifySummary being defined inside appendLogLine, so recreate here manually.
              const box = document.createElement('div');
              box.className = 'verify-sum collapsed';
              box.dataset.runId = String(runId || '');
              box.innerHTML = `
                <div class="verify-sum-h">
                  <span class="ico">🔍</span>
                  <span class="txt">Investigating test failure...</span>
                  <span class="chev">›</span>
                </div>
                <div class="verify-sum-b"></div>
              `;
              const head = box.querySelector('.verify-sum-h');
              if (head) {
                head.addEventListener('click', () => {
                  const isCollapsed = box.classList.contains('collapsed');
                  box.classList.toggle('collapsed', !isCollapsed);
                  box.classList.toggle('expanded', isCollapsed);
                  const chev = box.querySelector('.verify-sum-h .chev');
                  if (chev) chev.textContent = isCollapsed ? '˅' : '›';
                });
              }
              if (lines) lines.appendChild(box);
              state.__verifySummary[runId] = { el: box };
            }
          }
          return;
        }
        if (type === 'verification_fixing') {
          appendLogLine(logBlock, {
            timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
            message: progress.title || 'Fixing test file...',
            status: 'active',
            className: 'c-active'
          });
          return;
        }
        if (type === 'verification_fixed') {
          // Close summary + show concise follow-up.
          try {
            const vs = state.__verifySummary && state.__verifySummary[runId] && state.__verifySummary[runId].el;
            if (vs) {
              vs.classList.add('collapsed');
              vs.classList.remove('expanded');
              const chev = vs.querySelector('.verify-sum-h .chev');
              if (chev) chev.textContent = '›';
            }
          } catch {}
          appendLogLine(logBlock, {
            timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
            message: '✓ Fix applied — re-running verification',
            status: 'active',
            className: 'c-active'
          });
          return;
        }
        const title = progress.title || progress.type || 'progress';
      if (/^Plan step \d+ complete$/.test(String(title))) return;
      if (String(title) === 'Plan generated') return;
        if (/\[agent_loop\]\s*iteration\b/i.test(String(title)) || (/\[agent_loop\]/i.test(String(title)) && /\biteration\b/i.test(String(title)))) {
          return;
        }
        if (stageLower.includes('agent_loop') && /\biteration\b/i.test(String(title))) {
          return;
        }
        const msg = progress.command ? `${title}: ${progress.command}` : title;
        let st = 'active';
        if (type === 'patch_rejected' || type === 'fallback') st = 'warning';
        if (type === 'validated' || type === 'fallback_success' || type === 'patch_converted') st = 'done';
        st = normalizeStatus(progress.status || st);
        appendLogLine(logBlock, { timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(), message: msg, status: st });
        return;
      }

      if (!lifecycle && !progress && stage && stage !== 'Connected') {
        const stOnly = String(stage);
        if (/\[agent_loop\]\s*iteration\b/i.test(stOnly) || (/\[agent_loop\]/i.test(stOnly) && /\biteration\b/i.test(stOnly))) {
          return;
        }
        if (/starting agent tool loop/i.test(stOnly)) {
          appendLogLine(logBlock, { timestamp: nowTs(), message: 'Agent working...', status: 'active' });
          return;
        }
        if (/agent_loop_complete/i.test(stOnly) || /^agent finished$/i.test(stOnly)) {
          appendLogLine(logBlock, { timestamp: nowTs(), message: 'Agent finished', status: 'done' });
          return;
        }
        appendLogLine(logBlock, { timestamp: nowTs(), message: stage, status: 'active' });
      }
      } finally {
        if (shouldSnapshotAfterAppend) {
          state.runningThreadSnapshot = String(els.chatArea.innerHTML || '');
        }
        // Incremental persistence for refresh-resume: snapshot every ~2s while active.
        try {
          if (state.isRunning && state.currentRunId === runId) {
            schedulePersistRunGroup(runId, 'running');
          }
        } catch {}
        scrollChatIfFollowing(runId);
      }
    }

    async function sendMessage(task){
      const sendTs = Date.now();
      try { console.log('[send-debug] click ts=' + sendTs); } catch {}
      if (state.__resumeScanInProgress) {
        try { console.log('[resume-debug] BLOCKING SEND? scan still running, queued sends=' + ((Array.isArray(state.taskQueue) ? state.taskQueue.length : 0) + 1), { activeThreadId: state.activeThreadId, currentRunId: state.currentRunId }); } catch {}
      }
      try {
        console.log('[send-debug] handler entry, current state:', {
          isStreaming: !!state.eventSource,
          isRunning: !!state.isRunning,
          hasActiveRun: !!state.currentRunId,
          currentRunId: state.currentRunId || null,
          activeThreadId: state.activeThreadId || null,
          activeRepoPath: state.activeRepo?.path || null,
          queueLength: Array.isArray(state.taskQueue) ? state.taskQueue.length : 0,
          resumeScanInProgress: !!state.__resumeScanInProgress,
        });
      } catch {}
      const thread = getActiveThread();
      if (!thread) {
        try { console.log('[send-debug] EARLY RETURN reason=no_active_thread'); } catch {}
        els.chatArea.appendChild(createToast('error', 'Select a project and create a thread first.'));
        scrollChatIfFollowing();
        return;
      }
      if (!state.activeRepo) {
        try { console.log('[send-debug] EARLY RETURN reason=no_active_repo'); } catch {}
        els.chatArea.appendChild(createToast('error', 'No active project selected.'));
        scrollChatIfFollowing();
        return;
      }

      // ── BYOK check: ensure there is an API key available before starting the agent ──
      const _byokKey = (() => { try { return (localStorage.getItem('zoneOpenAIApiKey') || '').trim(); } catch { return ''; } })();
      const _serverHasKey = !!((window.__ZONE_PUBLIC_CONFIG__ || {}).serverHasOpenAIKey);
      if (!_byokKey && !_serverHasKey) {
        try { console.log('[send-debug] EARLY RETURN reason=no_api_key'); } catch {}
        hideEmpty();
        const banner = document.createElement('div');
        banner.className = 'no-apikey-banner';
        banner.innerHTML = `
          <p>You need an OpenAI API key to use Zone.</p>
          <button type="button" id="byokOpenSettingsBtn">Open Settings → API Keys</button>
        `;
        banner.querySelector('#byokOpenSettingsBtn').addEventListener('click', () => {
          banner.remove();
          openSettings('keys');
        });
        els.chatArea.appendChild(banner);
        scrollChatIfFollowing();
        return;
      }

      hideEmpty();
      const runId = crypto.randomUUID();
      state.runId = runId;
      state.currentRunId = runId;
      state.__runIsComplete = state.__runIsComplete || {};
      state.__runIsComplete[runId] = false;
      // Clear any stale streaming UI/state from previous runs.
      state.__streamTargetByFile = {};
      state.__streamLogLineIdByRun = {};
      state.__streamLive = {};
      state.__streamRawDeltaConcatByRun = {};
      state.__streamMountedAt = {};
      state.__streamFallback = {};
      state.__streamTypeIvs = {};
      state.__streamStartTs = {};
      state.__streamTargetDurationMs = {};
      state.__streamFallbackPayload = {};
      state.__streamPreviewPersist = {};
      state.__streamFilePathByRun = {};
      state.runningThreadId = state.activeThreadId;
      state.runningThreadSnapshot = null;
      state.runningThreadBufferedPayloads = [];
      state.lastPatchResult = null;
      state.lastTaskText = task;
      state.runStartedAt = Date.now();
      state.__runStartedAtByRun = state.__runStartedAtByRun || {};
      state.__runStartedAtByRun[runId] = state.runStartedAt;
      renderBgTasks();

      // 1) create a run-group container so we can persist & restore exactly.
      const group = ensureRunGroup(runId);
      if (group && !document.getElementById(`runGroup-${runId}`)) {
        group.dataset.runStatus = 'running';
        els.chatArea.appendChild(group);
      }

      // 2) append user bubble
      const ub = createBubble(task, 'user');
      ub.dataset.runId = runId;
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'edit-btn';
      editBtn.textContent = '✎';
      editBtn.title = 'Edit prompt';
      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        // Only allow edit while run is active for this runId.
        if (state.isRunning && state.currentRunId === runId) {
          void cancelActivePatchRun();
          enableUserBubbleEditing(ub, { mode: 'active', runId });
          return;
        }
        // Completed runs: no edit
      });
      ub.appendChild(editBtn);
      appendToRunGroup(runId, ub);
      thread.messages = thread.messages || [];
      thread.messages.push({ type:'user', text: task, ts: Date.now(), runId });

      const trimmed = String(task || '').trim();
      const isDirectCommand = /^(\$|>|run:)\s+/i.test(trimmed);
      const directCommand = trimmed.replace(/^(\$|>|run:)\s+/i, '').trim();
      const effectiveUserId = getCurrentUserId();
      try {
        console.log('[send-debug] button clicked, threadId=' + String(state.activeThreadId || ''), {
          projectPath: state.activeRepo?.path || '',
          inputText: String(task || ''),
        });
      } catch {}

      if (isDirectCommand) {
        // 2) create terminal output block (distinct from AI log)
        const card = document.createElement('div');
        card.className = 'term-card';
        card.id = `terminalBlock-${runId}`;
        const head = document.createElement('div');
        head.className = 'term-head';
        head.textContent = `$ ${directCommand}`;
        const lines = document.createElement('div');
        lines.className = 'term-lines';
        lines.id = `terminalLines-${runId}`;
        card.appendChild(head);
        card.appendChild(lines);
        appendToRunGroup(runId, card);

        // Bubble to top (existing behavior)
        const runGroup = document.getElementById(`runGroup-${runId}`);
        const userBubble =
          runGroup?.querySelector('.bubble.user') ||
          runGroup?.querySelector('.bubble') ||
          runGroup?.firstElementChild;
        if (userBubble) {
          state.__isProgrammaticChatScroll = true;
          state.chatScrollFollow = true;
          requestAnimationFrame(() => {
            userBubble.scrollIntoView({ behavior: 'smooth', block: 'start' });
            requestAnimationFrame(() => {
              state.__isProgrammaticChatScroll = false;
            });
          });
        }

        // SSE BEFORE post
        state.__streamDeltaBuffer = {};
        state.__streamDeltaFlushed = {};
        openSSE(runId);

        try {
          await fetch('/api/run-command', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({
              command: directCommand,
              repoPath: state.activeRepo.path,
              runId
            })
          });
        } catch (e) {
          const exit = document.createElement('div');
          exit.className = 'term-exit bad';
          exit.textContent = `✗ Request failed: ${e?.message || e}`;
          card.appendChild(exit);
        }
        return;
      }

      let messageType = 'patch_request';
      const classifyStartedAt = Date.now();
      try {
        const classifyRes = await fetch('/api/classify-intent', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ task })
        });
        const classifyBody = await classifyRes.json();
        messageType = String(classifyBody?.messageType || 'patch_request');
        try { console.log('[send-debug] classify-intent resolved', { messageType, msElapsed: Date.now() - classifyStartedAt }); } catch {}
      } catch (e) {
        console.log('[zone-intent-classify] classify request failed', e?.message || e);
        try { console.log('[send-debug] classify-intent failed', { msElapsed: Date.now() - classifyStartedAt, error: e?.message || String(e) }); } catch {}
      }

      if (messageType === 'question' || messageType === 'discussion') {
        hideEmpty();
        const chatBubble = ensureChatBubbleForRun(runId);
        if (chatBubble && !document.getElementById(`chatBubble-${runId}`)) {
          chatBubble.id = `chatBubble-${runId}`;
        }
        persistRunGroupHtmlToThread(runId, 'running');
        if (!thread.title || thread.title.startsWith('New thread for')) {
          thread.title = task.slice(0, 50);
          els.threadTitle.textContent = thread.title;
        }
        saveThreads();
        renderSidebar();
        setRunningUI(true);
        renderSidebar();
        state.__streamDeltaBuffer = {};
        state.__streamDeltaFlushed = {};
        openSSE(runId);
        try {
          const _chatApiKey = (() => { try { return (localStorage.getItem('zoneOpenAIApiKey') || '').trim(); } catch { return ''; } })();
          const _chatHeaders = { 'Content-Type': 'application/json' };
          if (_chatApiKey) _chatHeaders['X-User-OpenAI-Key'] = _chatApiKey;
          const res = await fetch('/api/chat', {
            method:'POST',
            headers: _chatHeaders,
            body: JSON.stringify({
              task,
              repoPath: state.activeRepo.path,
              runId,
              userId: effectiveUserId,
              conversationId: state.activeThreadId,
              threadId: state.activeThreadId
            })
          });
          const result = await res.json();
          handlePatchResult(result, runId);
        } catch (e) {
          setRunningUI(false);
          state.currentRunId = null;
          finalizeChatBubble(runId, {
            responseText: `Request failed: ${e?.message || e}`,
            responseHtml: renderChatMarkdown(`Request failed: ${e?.message || e}`),
            contextFiles: [],
          });
          els.chatArea.appendChild(createToast('error', `Request failed: ${e?.message || e}`));
          scrollChatIfFollowing();
        }
        return;
      }

      // 2) create empty agent log block
      const lb = createLogBlock(runId);
      appendToRunGroup(runId, lb);
      // Persist immediately so refresh can reconnect mid-run.
      persistRunGroupHtmlToThread(runId, 'running');
      const runGroup = document.getElementById(`runGroup-${runId}`);
      const userBubble =
        runGroup?.querySelector('.bubble.user') ||
        runGroup?.querySelector('.bubble') ||
        runGroup?.firstElementChild;
      if (userBubble) {
        state.__isProgrammaticChatScroll = true;
        state.chatScrollFollow = true;
        requestAnimationFrame(() => {
          userBubble.scrollIntoView({ behavior: 'smooth', block: 'start' });
          requestAnimationFrame(() => {
            state.__isProgrammaticChatScroll = false;
          });
        });
      }
      // messages persist only user + result; agent log is ephemeral

      // update title if first message
      if (!thread.title || thread.title.startsWith('New thread for')) {
        thread.title = task.slice(0, 50);
        els.threadTitle.textContent = thread.title;
      }
      saveThreads();
      renderSidebar();

      // 3) running state
      setRunningUI(true);
      // Sidebar indicator for running thread.
      renderSidebar();

      // 4) SSE BEFORE post
      state.__streamDeltaBuffer = {};
      state.__streamDeltaFlushed = {};
      openSSE(runId);
      appendLogLine(lb, { timestamp: nowTs(), message: 'Starting run…', status:'active' });

      // 5) POST /api/patch
      try {
        console.log('[debug-mem] sending lastChangedFiles:', state.__lastChangedFiles);
        console.log('[debug-mem] sending lastAddedFunctions:', state.__lastAddedFunctions);
        const patchPayload = {
          task,
          repoPath: state.activeRepo.path,
          runId,
          userId: effectiveUserId,
          conversationId: state.activeThreadId,
          lastChangedFiles: Array.isArray(state.__lastChangedFiles) ? state.__lastChangedFiles : [],
          lastAddedFunctions: Array.isArray(state.__lastAddedFunctions) ? state.__lastAddedFunctions : []
        };
        state.__sendDebugByRun = state.__sendDebugByRun || {};
        state.__sendDebugByRun[runId] = {
          clickTs: sendTs,
          fetchStartedAt: Date.now(),
          firstEventLogged: false,
        };
        try { console.log('[send-debug] BEFORE fetch /api/patch, payload size=' + JSON.stringify(patchPayload).length + ', runId attempted=' + runId); } catch {}
        const _patchApiKey = (() => { try { return (localStorage.getItem('zoneOpenAIApiKey') || '').trim(); } catch { return ''; } })();
        const _patchHeaders = { 'Content-Type': 'application/json' };
        if (_patchApiKey) _patchHeaders['X-User-OpenAI-Key'] = _patchApiKey;
        const res = await fetch('/api/patch', {
          method:'POST',
          headers: _patchHeaders,
          body: JSON.stringify(patchPayload)
        });
        const result = await res.json();
        try {
          console.log('[send-debug] AFTER fetch /api/patch response, status=' + res.status, {
            runIdReturned: result?.runId || result?.executionId || runId,
            msElapsed: state.__sendDebugByRun?.[runId]?.fetchStartedAt ? (Date.now() - state.__sendDebugByRun[runId].fetchStartedAt) : null,
          });
        } catch {}
        handlePatchResult(result, runId);
      } catch (e) {
        try { console.log('[send-debug] AFTER fetch /api/patch response, status=request_failed', { runIdReturned: runId, msElapsed: state.__sendDebugByRun?.[runId]?.fetchStartedAt ? (Date.now() - state.__sendDebugByRun[runId].fetchStartedAt) : null, error: e?.message || String(e) }); } catch {}
        setRunningUI(false);
        setLogBlockDone(runId);
        state.currentRunId = null;
        els.chatArea.appendChild(createToast('error', `Request failed: ${e?.message || e}`));
        scrollChatIfFollowing();
      }
    }

    function handlePatchResult(result, runId){
      // Idempotent: replay SSE may deliver the final result even if the original fetch returns too.
      state.__runResultProcessed = state.__runResultProcessed || new Set();
      if (state.__runResultProcessed.has(runId)) return;
      state.__runResultProcessed.add(runId);

      if (result && result.ok && result.reason === 'already_implemented') {
        discardStreamUiForRun(runId);
      }
      stopLiveCoding({ runId });
      state.isRunning = false;
      state.runStartedAt = null;
      state.currentRunId = null;
      state.lastPatchResult = result;
      state.runningThreadSnapshot = null;
      state.runningThreadBufferedPayloads = [];
      state.runningThreadId = null;
      try { if (state.eventSource) state.eventSource.close(); } catch {}
      state.eventSource = null;

      setLogBlockDone(runId);
      setRunningUI(false);
      completeExecutionSummary(runId);

      // Finalize step timeline — primary call site (run_completed_with_result path).
      // The lifecycle 'run_completed' event may never arrive because eventSource is
      // already closed above; this ensures the spinner always stops.
      if (state.__useStepTimeline) {
        const _d = (result && (result.decisionMode || result.finalState || result.nextDecision)) || 'preview_only';
        const _outcome = _d === 'safe_to_apply' ? 'done' : 'warning';
        finalizeStepTimeline(runId, _outcome);
      }

      renderSidebar();
      renderBgTasks();

      if (result && result.cancelled) {
        appendToRunGroup(runId, createVerificationBanner({ interrupted: true }));
        scrollChatIfFollowing(runId);
        dequeueAndRunNext();
        return;
      }

      if (!result || !result.ok) {
        const msg = result?.message || result?.reason || 'Run failed';
        showToast('error', msg, 2400);
        scrollChatIfFollowing(runId);
        return;
      }

      // Keep a synchronous hint of what changed last run (for multi-turn memory).
      try {
        const fromDiffs = Array.isArray(result?.fileDiffs)
          ? result.fileDiffs.map((d) => String(d?.filePath ?? '').trim()).filter(Boolean)
          : [];
        const fromPatches = Array.isArray(result?.applyPatches)
          ? result.applyPatches.map((p) => String(p?.filePath ?? '').trim()).filter(Boolean)
          : [];
        state.__lastChangedFiles = (fromDiffs.length ? fromDiffs : fromPatches).slice(0, 20);
      } catch {
        state.__lastChangedFiles = [];
      }

      try {
        state.__lastAddedFunctions = Array.isArray(result?.addedFunctions)
          ? result.addedFunctions.map((s) => String(s ?? '').trim()).filter(Boolean).slice(0, 10)
          : [];
      } catch {
        state.__lastAddedFunctions = [];
      }

      const decision =
        (result && (result.decisionMode || result.finalState || result.nextDecision)) || 'preview_only';

      // Persist result message to the active thread.
      if (decision === 'chat') {
        upsertChatResponseMessage(runId, {
          responseText: result.chatResponse || '',
          responseHtml: result.responseHtml || '',
          contextFiles: result.contextFiles || [],
        });
      } else {
        try {
          const thread = getActiveThread();
          if (thread) {
            thread.messages = Array.isArray(thread.messages) ? thread.messages : [];
            const sp =
              state.__streamPreviewPersist && state.__streamPreviewPersist[runId]
                ? JSON.parse(JSON.stringify(state.__streamPreviewPersist[runId]))
                : null;
            thread.messages.push({
              type: 'result',
              ts: Date.now(),
              decisionMode: result.decisionMode || result.finalState || 'preview_only',
              verificationReason: normalizeVerificationReason(result.verificationReason || extractTrailingVerificationReason(result.chatResponse || '')) || '',
              fileDiffs: result.fileDiffs || [],
              appliedFiles: (result.applyPatches || []).map(p => p.filePath) || [],
              chatResponse: result.chatResponse || null,
              blocked: (result.decisionMode || result.finalState) === 'blocked',
              blockedMessage: result?.reason || result?.message || '',
              summary: String(state.lastTaskText || '').slice(0, 80),
              streamPreview: sp && Array.isArray(sp.lines) && sp.lines.length ? sp : null,
              handoffReport:
                result.reason === 'already_implemented'
                  ? null
                  : result.handoffReport ||
                    (state.__handoffReportByRun && state.__handoffReportByRun[runId]) ||
                    null,
            });
            saveThreads();
            try {
              if (state.__streamPreviewPersist && state.__streamPreviewPersist[runId]) {
                delete state.__streamPreviewPersist[runId];
              }
            } catch {}
          }
        } catch {}
      }

      if (decision === 'blocked') {
        showToast('error', result?.reason || result?.message || 'Blocked for safety.', 2600);
        const lb = document.getElementById(`logBlock-${runId}`);
        if (lb) appendLogLine(lb, { timestamp: nowTs(), message: '✗ Blocked for safety', status:'error' });

        const diffsBlocked = Array.isArray(result.fileDiffs) ? result.fileDiffs : [];
        const blockedMsg = String(result?.reason || result?.message || '✗ Blocked for safety');
        const maxShowBlocked = 3;
        try {
          if (diffsBlocked[0] && diffsBlocked[0].diff && Array.isArray(diffsBlocked[0].diff) && diffsBlocked[0].diff[0]) {
            console.log('[zone-ui][diff-shape]', JSON.stringify(diffsBlocked[0].diff[0]));
          }
        } catch {}
        diffsBlocked.slice(0, maxShowBlocked).forEach((fd, i) => {
          appendToRunGroup(runId,
            renderDiffCard(fd, i, diffsBlocked.length, {
              decisionMode: 'blocked',
              blockedMessage: blockedMsg,
            })
          );
        });
        if (diffsBlocked.length > maxShowBlocked) {
          const moreB = document.createElement('div');
          moreB.className = 'toast';
          moreB.innerHTML = `<div class="ticon" style="background:var(--blue)"></div><div>+${diffsBlocked.length - maxShowBlocked} more diffs in report</div>`;
          appendToRunGroup(runId, moreB);
        }
        scrollChatIfFollowing(runId);
        try {
          const g = document.getElementById(`runGroup-${runId}`);
          if (g) g.dataset.runStatus = 'completed';
        } catch {}
        persistRunGroupHtmlToThread(runId, 'completed');
        dequeueAndRunNext();
        return;
      }
      if (decision === 'chat') {
        hideEmpty();
        try {
          const staleLog = document.getElementById(`logBlock-${runId}`);
          if (staleLog) staleLog.remove();
        } catch {}
        finalizeChatBubble(runId, {
          responseText: String(result.chatResponse || ''),
          responseHtml: result.responseHtml || '',
          contextFiles: result.contextFiles || [],
        });
        scrollChatIfFollowing(runId);
        try {
          const g = document.getElementById(`runGroup-${runId}`);
          if (g) g.dataset.runStatus = 'completed';
        } catch {}
        persistRunGroupHtmlToThread(runId, 'completed');
        dequeueAndRunNext();
        return;
      }

      // After a successful patch run, surface the finalRunReport as an assistant bubble.
      // Only show for safe_to_apply / preview_only (chat runs already have their own bubble).
      try {
        if (decision !== 'chat') {
          appendToRunGroup(runId, createVerificationBanner({
            decisionMode: decision,
            verificationReason: result.verificationReason || extractTrailingVerificationReason(result.chatResponse || ''),
          }));
        }
      } catch {}
      try {
        const fr = result && result.finalRunReport ? result.finalRunReport : null;
        const changes = Array.isArray(fr?.changesMade) ? fr.changesMade.filter(Boolean) : [];
        const nextStep = String(fr?.nextStep || '').trim();
        if (
          (decision === 'safe_to_apply' || decision === 'preview_only') &&
          changes.length > 0
        ) {
          const main = changes.map((s) => String(s).trim()).filter(Boolean).join('\n');
          const text = nextStep ? `${main}\n\nNext: ${nextStep}` : main;
          hideEmpty();
          appendToRunGroup(runId, createBubble(text, 'agent'));
        }
      } catch {}

      // append diff blocks (first 3)
      const diffs = Array.isArray(result.fileDiffs) ? result.fileDiffs : [];
      try {
        if (diffs[0] && diffs[0].diff && Array.isArray(diffs[0].diff) && diffs[0].diff[0]) {
          console.log('[zone-ui][diff-shape]', JSON.stringify(diffs[0].diff[0]));
        }
      } catch {}
      const maxShow = 3;
      const handoffLive =
        result.handoffReport ||
        (state.__handoffReportByRun && state.__handoffReportByRun[runId]);
        const patchesAlreadyApplied = !!(result && result.patchesAlreadyApplied);
    const diffToolbarOpts =
        decision === 'safe_to_apply'
          ? { decisionMode: 'safe_to_apply', applied: patchesAlreadyApplied, handoffReport: handoffLive }
          : { decisionMode: 'preview_only', patchesAlreadyApplied, handoffReport: handoffLive };
      diffs.slice(0, maxShow).forEach((fd, i) => {
        appendToRunGroup(runId, renderDiffCard(fd, i, diffs.length, diffToolbarOpts));
      });
      if (diffs.length > maxShow) {
        const more = document.createElement('div');
        more.className = 'toast';
        more.innerHTML = `<div class="ticon" style="background:var(--blue)"></div><div>+${diffs.length - maxShow} more diffs in report</div>`;
        appendToRunGroup(runId, more);
      }

      try {
        if (state.__handoffReportByRun && state.__handoffReportByRun[runId]) {
          delete state.__handoffReportByRun[runId];
        }
      } catch {}

      if (decision === 'safe_to_apply') {
        if (patchesAlreadyApplied) {
          showToast('success', '✓ Applied by agent', 1600);
        } else {
          showToast('success', 'Applying automatically...', 1100);
          setTimeout(() => applyPatches({ auto: true, runId }), 800);
        }
      } else {
        if (decision === 'preview_only') {
          const lb = document.getElementById(`logBlock-${runId}`);
          if (patchesAlreadyApplied) {
            const vn = result && result.verificationNote ? String(result.verificationNote) : '';
            showToast('warning', vn ? `⚠ ${vn}` : '⚠ Applied but unverified — review diff', 3000);
            if (lb) appendLogLine(lb, { timestamp: nowTs(), message: vn ? `⚠ ${vn}` : '⚠ Applied but unverified — review diff above', status:'warning' });
          } else {
            if (lb) appendLogLine(lb, { timestamp: nowTs(), message: '⚠ Preview only — review diff above', status:'warning' });
          }
        }
      }
      scrollChatIfFollowing(runId);

      try {
        const g = document.getElementById(`runGroup-${runId}`);
        if (g) g.dataset.runStatus = 'completed';
      } catch {}
      persistRunGroupHtmlToThread(runId, 'completed');

      // If user queued tasks while this run was executing, start next automatically.
      dequeueAndRunNext();
    }

    // ---- Apply patches ----
    async function applyPatches(options){
      const patches = state.lastPatchResult?.applyPatches;
      if (!Array.isArray(patches) || !patches.length) {
        showToast('error', 'No applyable patches found in last result.', 2200);
        return;
      }
      const auto = !!options?.auto;
      if (!auto) showToast('', 'Applying patches…');
      try{
        const res = await fetch('/api/apply', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ patches, repoPath: state.activeRepo?.path })
        });
        const data = await res.json();
        const applied = Array.isArray(data?.applied) ? data.applied : [];
        const failed = Array.isArray(data?.failed) ? data.failed : [];
        const ok = res.ok && applied.length > 0 && failed.length === 0;
        const runId = String(options?.runId || state.runId || '');
        const logBlock = runId ? document.getElementById(`logBlock-${runId}`) : null;
        if (ok) {
          try {
            document.querySelectorAll('.diff-toolbar-status.applying').forEach((el) => {
              el.textContent = '✓ Applied';
              el.classList.remove('applying');
              el.classList.add('applied-done');
            });
          } catch {}
          if (logBlock) appendLogLine(logBlock, { timestamp: nowTs(), message: '✓ Applied successfully', status:'success' });
          showToast('success', `✓ Applied to ${applied[0] || 'file'}`, 1600);
        } else {
          if (logBlock) appendLogLine(logBlock, { timestamp: nowTs(), message: '✗ Apply failed', status:'error' });
          showToast('error', data?.message || 'Apply failed.', 2500);
        }
      }catch(e){
        const runId = String(options?.runId || state.runId || '');
        const logBlock = runId ? document.getElementById(`logBlock-${runId}`) : null;
        if (logBlock) appendLogLine(logBlock, { timestamp: nowTs(), message: '✗ Apply failed', status:'error' });
        showToast('error', `Apply request failed: ${e?.message || e}`, 2500);
      }
    }

    // ---- Input behavior ----
    function autosizeTextarea(){
      const ta = els.taskInput;
      ta.style.height = 'auto';
      const maxRows = 5;
      const line = 20;
      ta.style.height = (Math.min(ta.scrollHeight, maxRows*line + 12)) + 'px';
    }

    function maybeSendFromEnter(e){
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const task = String(els.taskInput.value || '').trim();
        if (!task) {
          try { console.log('[send-debug] EARLY RETURN reason=empty_task_enter_submit'); } catch {}
          return;
        }
        try {
          console.log('[send-debug] button clicked, threadId=' + String(state.activeThreadId || ''), {
            projectPath: state.activeRepo?.path || '',
            inputText: task,
            source: 'enter',
          });
        } catch {}
        els.taskInput.value = '';
        autosizeTextarea();
        if (state.isRunning) {
          try { console.log('[send-debug] EARLY RETURN reason=already_running_enqueued_from_enter', { currentRunId: state.currentRunId || null, queueLength: Array.isArray(state.taskQueue) ? state.taskQueue.length : 0 }); } catch {}
          enqueueTask(task);
          return;
        }
        sendMessage(task);
      }
    }

    let activeSettingsTab = 'general';
    let usageLoaded = false;

      els.settingsOverlay.classList.add('open');
      renderSettingsTab(tab || activeSettingsTab);

      els.settingsOverlay.classList.remove('open');

    function renderGeneralSettings(){
      els.settingsBody.innerHTML = `
        <div class="row"><div class="k">Model</div><div class="v">${escapeHtml(window.ZONE_MODEL || 'gpt-4o')}</div></div>
        <div class="row"><div class="k">Max context files</div><div class="v">—</div></div>
        <div class="row"><div class="k">Auto-apply patches</div><div class="v">—</div></div>
        <div class="row"><div class="k">Theme</div><div class="v">Dark</div></div>
      `;
    }

    function renderKeysSettings(){
      const savedKey = (() => { try { return localStorage.getItem('zoneOpenAIApiKey') || ''; } catch { return ''; } })();
      const maskedSaved = savedKey ? savedKey.slice(0, 7) + '•'.repeat(Math.max(0, savedKey.length - 7)) : '';

      els.settingsBody.innerHTML = `
        <div class="apikey-section">
          <div class="apikey-section-title">API Keys</div>
          <div class="apikey-field-label">OpenAI API Key</div>
          <div class="apikey-input-row">
            <input id="apikeyInput" class="apikey-input" type="password"
              placeholder="${savedKey ? maskedSaved : 'sk-…'}"
              autocomplete="off" spellcheck="false" />
            <button id="apikeyShowBtn" class="apikey-btn-show" type="button">Show</button>
            <button id="apikeySaveBtn" class="apikey-btn-save" type="button">Save</button>
          </div>
          <div id="apikeyStatus" class="apikey-status"></div>
          <div class="apikey-disclaimer">
            ⓘ Your key is stored only in your browser (localStorage).
            Zone never sends it to any server other than OpenAI.
            ${(window.__ZONE_PUBLIC_CONFIG__ || {}).serverHasOpenAIKey
              ? '<br><br>A server-side key is also configured. Your browser key takes priority when set.'
              : ''}
          </div>
        </div>
      `;

      const input = document.getElementById('apikeyInput');
      const showBtn = document.getElementById('apikeyShowBtn');
      const saveBtn = document.getElementById('apikeySaveBtn');
      const statusEl = document.getElementById('apikeyStatus');

      showBtn.addEventListener('click', () => {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        showBtn.textContent = isPassword ? 'Hide' : 'Show';
      });

      saveBtn.addEventListener('click', async () => {
        const rawKey = String(input.value || '').trim();
        if (!rawKey) {
          statusEl.textContent = '✗ Please enter a key.';
          statusEl.className = 'apikey-status error';
          return;
        }
        // Handle extra whitespace the user might have pasted
        const key = rawKey.replace(/\s+/g, '');
        // Basic format check: must start with sk- and be at least 40 chars
        if (!key.startsWith('sk-') || key.length < 40) {
          statusEl.textContent = '✗ Invalid format — key must start with sk- and be at least 40 characters.';
          statusEl.className = 'apikey-status error';
          return;
        }
        saveBtn.disabled = true;
        statusEl.textContent = 'Verifying…';
        statusEl.className = 'apikey-status';
        try {
          const resp = await fetch('https://api.openai.com/v1/models', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + key }
          });
          if (resp.ok) {
            try { localStorage.setItem('zoneOpenAIApiKey', key); } catch {}
            statusEl.textContent = '✓ Saved';
            statusEl.className = 'apikey-status success';
            input.value = '';
            input.placeholder = key.slice(0, 7) + '•'.repeat(Math.max(0, key.length - 7));
          } else if (resp.status === 401) {
            statusEl.textContent = '✗ Invalid key — check that it is correct and active.';
            statusEl.className = 'apikey-status error';
          } else {
            // Non-401 error (rate limit, server error) — save with warning
            try { localStorage.setItem('zoneOpenAIApiKey', key); } catch {}
            statusEl.textContent = '⚠ Saved, but OpenAI returned ' + resp.status + '. Verify when you send a task.';
            statusEl.className = 'apikey-status warning';
            input.value = '';
            input.placeholder = key.slice(0, 7) + '•'.repeat(Math.max(0, key.length - 7));
          }
        } catch {
          // Network error or OpenAI unreachable — save anyway
          try { localStorage.setItem('zoneOpenAIApiKey', key); } catch {}
          statusEl.textContent = '⚠ Couldn\'t verify — saved anyway, will retry on first task.';
          statusEl.className = 'apikey-status warning';
          input.value = '';
          input.placeholder = key.slice(0, 7) + '•'.repeat(Math.max(0, key.length - 7));
        } finally {
          saveBtn.disabled = false;
        }
      });
    }

    function renderUsageSettings(){
      // initial skeleton
      els.settingsBody.innerHTML = `
        <div class="row"><div class="k">Runs this month</div><div class="v"><div class="skeleton" style="width:90px"></div></div></div>
        <div class="row"><div class="k">Usage</div><div class="v" style="width:150px"><div class="bar"><div id="usageBarFill"></div></div></div></div>
        <div class="row"><div class="k">API tokens used</div><div class="v"><div class="skeleton" style="width:70px"></div></div></div>
        <div class="row"><div class="k">Plan</div><div class="v" style="color:var(--violet)">Pro</div></div>
      `;

      if (usageLoaded) return;
      usageLoaded = true;
      fetch('/api/billing-summary').then(r => r.json()).then(data => {
        const runsUsed = data?.runsUsed ?? data?.runsThisMonth ?? 0;
        const runsLimit = data?.runsLimit ?? data?.limit ?? 100;
        const tokens = data?.tokensUsed ?? data?.apiTokensUsed ?? 0;
        const pct = runsLimit ? clamp(Math.round((runsUsed / runsLimit) * 100), 0, 100) : 0;
        els.settingsBody.innerHTML = `
          <div class="row"><div class="k">Runs this month</div><div class="v">${escapeHtml(String(runsUsed))} / ${escapeHtml(String(runsLimit))}</div></div>
          <div class="row"><div class="k">Usage</div><div class="v" style="width:150px"><div class="bar"><div style="width:${pct}%"></div></div></div></div>
          <div class="row"><div class="k">API tokens used</div><div class="v">${escapeHtml(String(tokens))}</div></div>
          <div class="row"><div class="k">Plan</div><div class="v" style="color:var(--violet)">${escapeHtml(String(data?.plan || 'Pro'))}</div></div>
        `;
      }).catch(() => {
        usageLoaded = false;
        els.settingsBody.innerHTML = `
          <div class="row"><div class="k">Usage</div><div class="v">Failed to load.</div></div>
        `;
      });
    }

    // ---- Wiring ----
    function init(){
      loadThreads();
      loadReposFromStorage();
      loadSidebarOpenWidth();
      loadSidebarState();
      ensureRepos();
      renderRepoDropdown();
      renderQueuePanel();
      updateInputPlaceholder();
      renderBgTasks();

      if (!state.repos.length) {
        // still allow UI, but guide
      }

      // restore active thread if any
      if (state.threads.length) state.activeThreadId = state.threads[0].id;
      renderSidebar();
      renderActiveThread();

      // filter button no-op active tint
      els.filterBtn.addEventListener('click', () => {
        els.filterBtn.classList.toggle('active');
        closeNewThreadDropdown();
      });

      els.newThreadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openNewThreadDropdown();
      });
      if (els.sidebarToggle) {
        els.sidebarToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          cycleSidebarState();
        });
      }
      if (els.sidebarResizer) {
        els.sidebarResizer.addEventListener('mousedown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          startSidebarResize(e);
        });
      }
      document.addEventListener('click', (e) => {
        const dd = els.newThreadDropdown;
        if (!dd.contains(e.target) && e.target !== els.newThreadBtn) closeNewThreadDropdown();
      });
      document.addEventListener('click', (e) => {
        const btn = e.target instanceof Element ? e.target.closest('.exec-view-btn') : null;
        if (!btn) return;
        e.preventDefault();
        setExecutionViewMode(String(btn.dataset.viewMode || 'summary'));
      });

      document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        renderSidebar(t.dataset.tab);
      }));

      els.repoChip.addEventListener('click', cycleRepo);

      if (els.bgTasksHeader) {
        els.bgTasksHeader.addEventListener('click', toggleBgTasks);
      }

      els.taskInput.addEventListener('input', autosizeTextarea);
      els.taskInput.addEventListener('keydown', maybeSendFromEnter);
      els.sendBtn.addEventListener('click', () => {
        if (els.sendBtn.classList.contains('send-btn--stop')) {
          void cancelActivePatchRun();
          return;
        }
        const task = String(els.taskInput.value || '').trim();
        if (!task) {
          try { console.log('[send-debug] EARLY RETURN reason=empty_task_button_click'); } catch {}
          return;
        }
        try {
          console.log('[send-debug] button clicked, threadId=' + String(state.activeThreadId || ''), {
            projectPath: state.activeRepo?.path || '',
            inputText: task,
            source: 'button',
          });
        } catch {}
        els.taskInput.value = '';
        autosizeTextarea();
        if (state.isRunning) {
          try { console.log('[send-debug] EARLY RETURN reason=already_running_enqueued_from_button', { currentRunId: state.currentRunId || null, queueLength: Array.isArray(state.taskQueue) ? state.taskQueue.length : 0 }); } catch {}
          enqueueTask(task);
          return;
        }
        sendMessage(task);
      });

      els.openSettingsBtn.addEventListener('click', openSettings);
      els.closeSettingsBtn.addEventListener('click', closeSettings);
      els.settingsOverlay.addEventListener('click', (e) => {
        if (e.target === els.settingsOverlay) closeSettings();
      });
      document.querySelectorAll('.mtab').forEach(b => b.addEventListener('click', () => renderSettingsTab(b.dataset.stab)));

      autosizeTextarea();
      setIdleUI();
    }

    init();
  </script>
</body>
</html>
