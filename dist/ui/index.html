    function updateThreadUserMessageText(runId, nextText){
      try {
        const thread = getActiveThread();
        if (!thread) return;
        thread.messages = Array.isArray(thread.messages) ? thread.messages : [];
        const rid = String(runId || '');
        if (!rid) return;
        const msg = thread.messages.find((m) => m && typeof m === 'object' && m.type === 'user' && String(m.runId || '') === rid);
        if (msg) msg.text = String(nextText || '');
        saveThreads();
      } catch {}
    }

    function markRunCancelledForRerun(runId){
      try {
        const lb = document.getElementById(`logBlock-${runId}`);
        if (lb) {
          appendLogLine(lb, { timestamp: nowTs(), message: 'cancelled — re-run with edited prompt', status: 'warning' });
          setLogBlockDone(runId);
        }
      } catch {}
    }

    function enableUserBubbleEditing(bubbleEl, opts){
      const bubble = bubbleEl;
      if (!bubble) return;
      if (bubble.classList.contains('editing')) return;
      const original = String(bubble.querySelector('.text')?.textContent || '');
      bubble.classList.add('editing');
      bubble.dataset.originalText = original;

      const textEl = bubble.querySelector('.text');
      if (textEl) textEl.style.display = 'none';
      const editBtn = bubble.querySelector('.edit-btn');
      if (editBtn) editBtn.style.display = 'none';

      const ta = document.createElement('textarea');
      ta.className = 'edit-area';
      ta.value = original;

      const actions = document.createElement('div');
      actions.className = 'edit-actions';

      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.textContent = 'Cancel';

      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'primary';
      saveBtn.textContent = 'Save & Run';

      actions.appendChild(cancelBtn);
      actions.appendChild(saveBtn);
      bubble.appendChild(ta);
      bubble.appendChild(actions);

      const cleanup = () => {
        try { ta.remove(); } catch {}
        try { actions.remove(); } catch {}
        bubble.classList.remove('editing');
        if (textEl) textEl.style.display = '';
        if (editBtn) editBtn.style.display = '';
      };

      cancelBtn.addEventListener('click', () => {
        cleanup();
      });

      saveBtn.addEventListener('click', async () => {
        const nextText = String(ta.value || '').trim();
        if (!nextText) return;
        // Update DOM bubble text immediately
        if (textEl) textEl.textContent = nextText;
        cleanup();

        if (opts && opts.mode === 'queue') {
          // queued prompt: update queue item only
          try {
            const qid = String(opts.queueId || '');
            state.taskQueue = Array.isArray(state.taskQueue) ? state.taskQueue : [];
            const it = state.taskQueue.find((x) => String(x?.id || '') === qid);
            if (it) it.task = nextText;
            renderQueuePanel();
          } catch {}
          return;
        }

        // active run: cancel + persist edit + re-run edited task as the next queued item
        const rid = String(opts?.runId || '');
        if (rid) {
          try {
            await fetch('/api/cancel', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ runId: rid }),
            });
          } catch {}
          updateThreadUserMessageText(rid, nextText);
          markRunCancelledForRerun(rid);
        }
        // Queue the edited prompt to run immediately after cancellation settles.
        // This prevents overlapping runs and avoids accidentally draining the existing queue.
        try {
          const item = { id: crypto.randomUUID(), task: nextText, repoPath: state.activeRepo?.path || '' };
          state.taskQueue = Array.isArray(state.taskQueue) ? state.taskQueue : [];
          state.taskQueue.unshift(item);
          renderQueuePanel();
          renderBgTasks();
        } catch {}
      });

      // focus
      setTimeout(() => { try { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } catch {} }, 0);
    }

    function createBubble(text, kind){
      const el = document.createElement('div');
      el.className = 'bubble ' + (kind || '');
      const t = document.createElement('div');
      t.className = 'text';
      t.textContent = text;
      el.appendChild(t);
      return el;
    }

    function applyChatLinks(html){
      return String(html || '').replace(
        /(https?:\/\/[^\s<]+)/gi,
        (url) => `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>`
      );
    }

    function renderChatInline(text){
      const raw = String(text || '');
      const codeTokens = [];
      let next = raw.replace(/`([^`]+)`/g, (_m, code) => {
        const token = `__ZONE_INLINE_CODE_${codeTokens.length}__`;
        codeTokens.push(`<code class="inline-code">${escapeHtml(code)}</code>`);
        return token;
      });
      next = escapeHtml(next);
      next = applyChatLinks(next);
      next = next.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      next = next.replace(/\*(.+?)\*/g, '<em>$1</em>');
      for (let i = 0; i < codeTokens.length; i += 1) {
        next = next.replace(`__ZONE_INLINE_CODE_${i}__`, codeTokens[i]);
      }
      return next;
    }

    function extractChatCodeBlocks(text){
      const codeBlocks = [];
      const next = String(text || '').replace(/```(\w+)?\n([\s\S]*?)```/g, (_m, lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push({ lang: String(lang || '').trim(), code: String(code || '') });
        return `\u0000CODEBLOCK${idx}\u0000`;
      });
      return { text: next, codeBlocks };
    }

    function restoreChatCodeBlocks(text, codeBlocks){
      return String(text || '').replace(/\u0000CODEBLOCK(\d+)\u0000/g, (_m, idxText) => {
        const block = codeBlocks[Number.parseInt(idxText, 10)];
        if (!block) return '';
        const dataLang = block.lang ? ` data-lang="${escapeHtml(block.lang)}"` : '';
        const codeClass = block.lang ? ` class="language-${escapeHtml(block.lang)}"` : '';
        return `<pre class="chat-codeblock"${dataLang}><code${codeClass}>${escapeHtml(block.code)}</code></pre>`;
      });
    }

    function stripTrailingVerificationTag(text){
      return String(text || '').replace(/\s*\[ZONE_VERIFICATION:\s*[a-z_]+\]\s*$/i, '').trim();
    }

    function extractTrailingVerificationReason(text){
      const m = String(text || '').match(/\s*\[ZONE_VERIFICATION:\s*([a-z_]+)\]\s*$/i);
      return m ? String(m[1] || '').toLowerCase() : '';
    }

    function normalizeVerificationReason(reason){
      const raw = String(reason || '').trim().toLowerCase();
      if (!raw) return '';
      if (raw === 'tests_failed_by_patch') return 'tests_failed_user_code';
      if (raw === 'tests_failed_user_code') return 'tests_failed_user_code';
      if (raw === 'tests_passed') return 'tests_passed';
      if (raw === 'tests_inconclusive') return 'tests_inconclusive';
      if (raw === 'tests_failed_unrelated') return 'tests_failed_unrelated';
      return raw;
    }

    function getVerificationBannerModel(input){
      const reason = normalizeVerificationReason(
        input?.verificationReason || extractTrailingVerificationReason(input?.chatResponse || input?.text || '')
      );
      const decision = String(input?.decisionMode || input?.finalState || 'preview_only');
      if (input?.interrupted) {
        return {
          decisionClass: 'preview',
          decisionLabel: 'Run interrupted',
          reasonClass: 'reason-neutral',
          reasonLabel: 'No verification',
          note: 'Run interrupted — no verification',
        };
      }
      const decisionLabel =
        decision === 'safe_to_apply' ? 'Safe to apply' :
        decision === 'blocked' ? 'Blocked' :
        'Preview only';
      const decisionClass =
        decision === 'safe_to_apply' ? 'safe' :
        decision === 'blocked' ? 'blocked' :
        'preview';
      const reasonMeta =
        reason === 'tests_passed'
          ? { cls: 'reason-safe', label: 'Tests passed', note: decision === 'safe_to_apply' ? 'Ready to merge' : 'Verification passed' }
          : reason === 'tests_inconclusive'
            ? { cls: 'reason-warn', label: 'Tests inconclusive', note: 'Review diff before applying' }
            : reason === 'tests_failed_unrelated'
              ? { cls: 'reason-warn', label: 'Tests failed (unrelated)', note: 'Review diff before applying' }
              : reason === 'tests_failed_user_code'
                ? { cls: 'reason-bad', label: 'Tests failed (user code)', note: 'Do not apply' }
                : { cls: 'reason-neutral', label: 'Verification: unknown', note: decision === 'blocked' ? 'Do not apply' : 'Review diff before applying' };
      const note =
        decision === 'blocked'
          ? 'Do not apply'
          : decision === 'safe_to_apply' && reason === 'tests_passed'
            ? 'Ready to merge'
            : reasonMeta.note;
      return {
        decisionClass,
        decisionLabel,
        reasonClass: reasonMeta.cls,
        reasonLabel: reasonMeta.label,
        note,
      };
    }

    function createVerificationBanner(input){
      const model = getVerificationBannerModel(input);
      const el = document.createElement('div');
      el.className = 'verify-banner';
      el.innerHTML = `
        <div class="verify-banner-pills">
          <span class="verify-pill ${escapeHtml(model.decisionClass)}">${escapeHtml(model.decisionLabel)}</span>
          <span class="verify-pill ${escapeHtml(model.reasonClass)}">${escapeHtml(model.reasonLabel)}</span>
        </div>
        <div class="verify-note">${escapeHtml(model.note)}</div>
      `;
      return el;
    }

    function renderChatMarkdown(text, isFinal){
      const normalized = stripTrailingVerificationTag(String(text || '').replace(/\r\n/g, '\n')).trim();
      if (!normalized) return '<div class="md"><p></p></div>';

      // Detect an unclosed trailing code fence (odd number of ``` tokens).
      // Split it off so we can render it specially while streaming.
      let mainText = normalized;
      let trailingCodeHtml = '';
      const fenceParts = normalized.split('```');
      if (fenceParts.length % 2 === 0) {
        // Unclosed opening fence at the end.
        const lastFenceIdx = normalized.lastIndexOf('```');
        mainText = normalized.slice(0, lastFenceIdx).trim();
        const tailRaw = normalized.slice(lastFenceIdx);
        const fenceBodyMatch = tailRaw.match(/^```(\w+)?\n?([\s\S]*)$/);
        const tailLang = fenceBodyMatch ? String(fenceBodyMatch[1] || '').trim() : '';
        const tailCode = fenceBodyMatch ? String(fenceBodyMatch[2] || '') : tailRaw.replace(/^```\w*\n?/, '');
        const dataLang = tailLang ? ` data-lang="${escapeHtml(tailLang)}"` : '';
        const codeClass = tailLang ? ` class="language-${escapeHtml(tailLang)}"` : '';
        if (!isFinal) {
          trailingCodeHtml = `<pre class="chat-codeblock streaming"${dataLang}><code${codeClass}>${escapeHtml(tailCode)}<span class="streaming-cursor">&#x25AE;</span></code></pre>`;
        } else {
          trailingCodeHtml = `<pre class="chat-codeblock"${dataLang}><code${codeClass}>${escapeHtml(tailCode)}</code></pre>`;
        }
      }

      const extracted = extractChatCodeBlocks(mainText);
      const lines = extracted.text.split('\n');
      const blocks = [];
      let i = 0;
      while (i < lines.length) {
        const line = String(lines[i] || '');
        if (!line.trim()) { i += 1; continue; }

        if (/^\u0000CODEBLOCK\d+\u0000$/.test(line.trim())) {
          blocks.push(line.trim());
          i += 1;
          continue;
        }

        if (/^\s*-\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*-\s+/.test(String(lines[i] || ''))) {
            items.push(`<li>${renderChatInline(String(lines[i] || '').replace(/^\s*-\s+/, ''))}</li>`);
            i += 1;
          }
          blocks.push(`<ul>${items.join('')}</ul>`);
          continue;
        }

        if (/^\s*#{1,6}\s+/.test(line)) {
          blocks.push(`<h3>${renderChatInline(line.replace(/^\s*#{1,6}\s+/, ''))}</h3>`);
          i += 1;
          continue;
        }

        const paragraphLines = [];
        while (
          i < lines.length &&
          String(lines[i] || '').trim() &&
          !/^\u0000CODEBLOCK\d+\u0000$/.test(String(lines[i] || '').trim()) &&
          !/^\s*-\s+/.test(String(lines[i] || '')) &&
          !/^\s*#{1,6}\s+/.test(String(lines[i] || ''))
        ) {
          paragraphLines.push(String(lines[i] || ''));
          i += 1;
        }
        blocks.push(`<p>${paragraphLines.map((part) => renderChatInline(part)).join('<br>')}</p>`);
      }
      return `<div class="md">${restoreChatCodeBlocks(blocks.join(''), extracted.codeBlocks)}${trailingCodeHtml}</div>`;
    }

    function createZoneBubbleIcon(){
      return `
        <svg class="zone-chat-icon" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="5.5" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.2"></circle>
          <circle cx="7" cy="7" r="2.4" fill="currentColor"></circle>
        </svg>
      `;

    function createChatHeaderMarkup(){

    function createChatFooterMarkup(contextFiles, userText){
      const pills = (Array.isArray(contextFiles) ? contextFiles : [])
        .map((filePath) => `<span class="chat-pill">${escapeHtml(String(filePath || ''))}</span>`)
        .join('');
      const continueAttr = escapeHtml(String(userText || ''));
      return `

    function wireChatBubbleActions(el){
      if (!el) return;
      const btn = el.querySelector('.chat-continue');
      if (!btn || btn.__zoneBound) return;
      btn.__zoneBound = true;
      btn.addEventListener('click', () => {
        const original = String(btn.getAttribute('data-user-text') || '').trim();
        const nextPrompt = original ? `Implement this as a code change: ${original}` : 'Implement this as a code change.';
        try {
          els.task.value = nextPrompt;
          els.task.focus();
          els.task.setSelectionRange(els.task.value.length, els.task.value.length);
        } catch {}
      });
    }

    function setChatBubbleContent(el, text, html, contextFiles, userText, isStreaming){
      if (!el) return;
      const preferRenderedFromText = !!extractTrailingVerificationReason(text);
      const bodyHtml = isStreaming && !String(text || '').trim()
        ? createChatTypingMarkup()
        : `<div class="chat-body">${(!preferRenderedFromText && html) || renderChatMarkdown(text)}</div>`;
      const footerHtml = !isStreaming
        ? createChatFooterMarkup(contextFiles, userText)
        : '<div class="chat-footer"><div class="chat-pills"></div></div>';
      el.innerHTML = `
        ${createChatHeaderMarkup()}
        ${bodyHtml}
        ${footerHtml}
      `;
      wireChatBubbleActions(el);
    }

    function createAgentBubbleFromMarkdown(text, options){
      const opts = options || {};
      const el = document.createElement('div');
      el.className = 'bubble agent';
      if (opts.runId) el.dataset.runId = String(opts.runId);
      setChatBubbleContent(
        el,
        String(text || ''),
        String(opts.html || ''),
        Array.isArray(opts.contextFiles) ? opts.contextFiles : [],

    function createLogBlock(runId){
      const card = document.createElement('div');
      card.className = 'log-card';
      card.id = `logBlock-${runId}`;
      card.dataset.viewMode = getExecutionViewMode();
      const header = document.createElement('div');
      header.className = 'exec-header';
      header.innerHTML = `
        <div class="exec-header-title">Run timeline</div>
        <div class="exec-view-toggle" role="tablist" aria-label="Execution timeline view">
          <button type="button" class="exec-view-btn" data-view-mode="summary">Summary</button>
          <button type="button" class="exec-view-btn" data-view-mode="raw">Raw log</button>
        </div>
      `;
      const summaryView = document.createElement('div');
      summaryView.className = 'exec-summary-view';

        <div class="exec-summary-empty">Waiting for execution events...</div>

    const EXECUTION_VIEW_MODE_KEY = 'zoneExecutionViewMode';
    const EXECUTION_CATEGORY_ORDER = ['read', 'edit', 'run', 'search', 'list'];
    const EXECUTION_CATEGORY_META = {
      read: { icon: '🔍', label: 'Read', noun: 'file' },
      edit: { icon: '✏', label: 'Edited', noun: 'file' },
      run: { icon: '🧪', label: 'Ran', noun: 'command' },
      search: { icon: '🔎', label: 'Searched', noun: 'query' },
      list: { icon: '📁', label: 'Listed', noun: 'directory' },
    };

    function getExecutionViewMode(){
      if (state.__executionViewMode === 'summary' || state.__executionViewMode === 'raw') {
        return state.__executionViewMode;
      }
      try {
        const saved = String(localStorage.getItem(EXECUTION_VIEW_MODE_KEY) || '').trim().toLowerCase();
        state.__executionViewMode = saved === 'raw' ? 'raw' : 'summary';
      } catch {
        state.__executionViewMode = 'summary';
      }
      return state.__executionViewMode;
    }

    function setExecutionViewMode(mode){
      const next = mode === 'raw' ? 'raw' : 'summary';
      state.__executionViewMode = next;
      try { localStorage.setItem(EXECUTION_VIEW_MODE_KEY, next); } catch {}
      applyExecutionViewModeToAll();
    }

    function applyExecutionViewMode(logBlock, mode){
      if (!logBlock) return;
      const next = mode === 'raw' ? 'raw' : 'summary';
      logBlock.dataset.viewMode = next;
      const buttons = logBlock.querySelectorAll('.exec-view-btn');
      buttons.forEach((btn) => {
        const active = String(btn.dataset.viewMode || '') === next;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    function applyExecutionViewModeToAll(root){
      const mode = getExecutionViewMode();
      const scope = root instanceof HTMLElement ? root : document;
      scope.querySelectorAll('.log-card').forEach((card) => applyExecutionViewMode(card, mode));
    }

    function createEmptyExecutionCategory(){
      return {
        entries: {},
        totalCount: 0,
        successCount: 0,
        failureCount: 0,
        revertedCount: 0,
        findNotFoundCount: 0,
      };
    }

    function getRunStartTime(runId){
      state.__runStartedAtByRun = state.__runStartedAtByRun || {};
      return Number(state.__runStartedAtByRun[runId] || Date.now());
    }

    function ensureExecutionSummaryState(runId){
      const rid = String(runId || '');
      state.__executionSummaryByRun = state.__executionSummaryByRun || {};
      if (!state.__executionSummaryByRun[rid]) {
        state.__executionSummaryByRun[rid] = {
          runId: rid,
          startedAt: getRunStartTime(rid),
          completedAt: null,
          validatorCatchCount: 0,
          lastFileHint: '',
          pendingTool: null,
          finalMessage: '',
          categories: {
            read: createEmptyExecutionCategory(),
            edit: createEmptyExecutionCategory(),
            run: createEmptyExecutionCategory(),
            search: createEmptyExecutionCategory(),
            list: createEmptyExecutionCategory(),
          },
        };
      }
      return state.__executionSummaryByRun[rid];
    }

    function ensureExecutionSummaryShell(logBlock){
      if (!logBlock) return null;
      const summaryView = logBlock.querySelector('.exec-summary-view');
      if (!summaryView) return null;
      let empty = summaryView.querySelector('.exec-summary-empty');
      let groups = summaryView.querySelector('.exec-summary-groups');
      let final = summaryView.querySelector('.exec-summary-final');
      if (!empty) {
        empty = document.createElement('div');
        empty.className = 'exec-summary-empty';
        empty.textContent = 'Waiting for execution events...';
        summaryView.appendChild(empty);
      }
      if (!groups) {
        groups = document.createElement('div');
        groups.className = 'exec-summary-groups';
        summaryView.appendChild(groups);
      }
      if (!final) {
        final = document.createElement('div');
        final.className = 'exec-summary-final';
        final.hidden = true;
        summaryView.appendChild(final);
      }
      return { summaryView, empty, groups, final };
    }

    function formatCountLabel(count, noun){
      const n = Number(count || 0);
      return `${n} ${noun}${n === 1 ? '' : 's'}`;
    }

    function trimToolArg(raw){
      return String(raw || '').trim().replace(/^["'`]|["'`]$/g, '');
    }

    function parseToolCallDescriptor(progress, summary){
      const title = String(progress?.title || '');
      const match = title.match(/^\[(?:tool|fix)\]\s*([a-z_]+)(?::\s*(.*))?$/i);
      const progressMatch = title.match(/^\[tool\]\s*(Running|Patching):\s*(.*)$/i);
      const progressVerb = String(progressMatch?.[1] || '').toLowerCase();
      const progressArg = trimToolArg(progressMatch?.[2] || '');
      const name = String(match?.[1] || '').toLowerCase();
      const arg = trimToolArg(match?.[2] || progress?.command || '');
      const fallbackPath = trimToolArg(progress?.filePath || summary?.lastFileHint || '');
      const byTool = {
        read_file: { category: 'read', target: arg || fallbackPath || '(unknown file)' },
        write_file: { category: 'edit', target: arg || fallbackPath || '(unknown file)' },
        apply_patch: { category: 'edit', target: arg || fallbackPath || '(unknown file)' },
        run_command: { category: 'run', target: arg || trimToolArg(progress?.command || '') || '(command)' },
        search_in_files: { category: 'search', target: arg || '(search query)' },
        list_files: { category: 'list', target: arg || '(repository)' },
      };
      if (progressVerb === 'running') {
        return { toolName: 'run_command', category: 'run', target: progressArg || '(command)' };
      }
      if (progressVerb === 'patching') {
        return { toolName: 'apply_patch', category: 'edit', target: progressArg || fallbackPath || '(unknown file)' };
      }
      return name && byTool[name]
        ? { toolName: name, category: byTool[name].category, target: byTool[name].target }
        : null;
    }

    function ensureExecutionEntry(category, target){
      const key = String(target || '(unknown)').trim() || '(unknown)';
      if (!category.entries[key]) {
        category.entries[key] = {
          target: key,
          count: 0,
          successCount: 0,
          failureCount: 0,
          revertedCount: 0,
          findNotFoundCount: 0,
          lastOutcome: '',
          lastTs: Date.now(),
          attempts: [],
          pendingApprovals: [],
        };
      }
      return category.entries[key];
    }

    function parseValidatorInfoFromText(text){
      const raw = String(text || '').trim();
      if (!raw) return null;
      const smellMatch = raw.match(/The smell detected was:\s*([a-z_]+)/i);
      if (smellMatch) {
        const lines = raw.split(/\n+/).map((line) => String(line || '').trim()).filter(Boolean);
        const detailLine = lines.find((line) => /Found `?\$ \{|Template expressions|defined twice|top-level import|pseudo-class key/i.test(line)) || lines[1] || '';
        return {
          title: 'Validator caught broken pattern',
          reason: smellMatch[1],
          body: detailLine,
        };
      }
      if (/broke file syntax|syntax_broken_post_write/i.test(raw)) {
        const firstSentence = raw.split(/\n+/).map((line) => String(line || '').trim()).find(Boolean) || raw;
        return {
          title: 'Validator caught syntax error',
          reason: 'syntax_broken_post_write',
          body: firstSentence,
        };
      }
      return null;
    }

    function parseEditOutcome(resultText, status){
      const text = String(resultText || '');
      const validator = parseValidatorInfoFromText(text);
      if (validator) {
        return { outcome: 'reverted', validator };
      }
      if (/find_not_found|FIND content not found|not found in file within scope/i.test(text)) {
        return { outcome: 'find_not_found', validator: null };
      }
      if (status === 'success') {
        return { outcome: 'success', validator: null };
      }
      return { outcome: 'failure', validator: null };
    }

    function recordExecutionToolResult(runId, progress){
      const summary = ensureExecutionSummaryState(runId);
      const pending = summary.pendingTool;
      if (!pending || !pending.category) return;
      summary.pendingTool = null;
      const category = summary.categories[pending.category];
      if (!category) return;
      const target =
        pending.target && pending.target !== '(unknown file)'
          ? pending.target
          : summary.lastFileHint || pending.target || '(unknown)';
      const entry = ensureExecutionEntry(category, target);
      const text = String(progress?.detail || progress?.title || '');
      const status = String(progress?.status || '').toLowerCase();
      category.totalCount += 1;
      entry.count += 1;
      entry.lastTs = Number(progress?.ts || Date.now());
      if (pending.category === 'edit') {
        const parsed = parseEditOutcome(text, status);
        entry.lastOutcome = parsed.outcome;
        if (parsed.outcome === 'success') {
          category.successCount += 1;
          entry.successCount += 1;
        } else if (parsed.outcome === 'reverted') {
          category.revertedCount += 1;
          entry.revertedCount += 1;
          summary.validatorCatchCount += 1;
        } else if (parsed.outcome === 'find_not_found') {
          category.findNotFoundCount += 1;
          entry.findNotFoundCount += 1;
        } else {
          category.failureCount += 1;
          entry.failureCount += 1;
        }
        entry.attempts.push({
          index: entry.count,
          outcome: parsed.outcome,
          validator: parsed.validator,
        });
      } else {
        const ok = status === 'success';
        entry.lastOutcome = ok ? 'success' : 'failure';
        if (ok) {
          category.successCount += 1;
          entry.successCount += 1;
        } else {
          category.failureCount += 1;
          entry.failureCount += 1;
        }
      }
      renderExecutionSummaryCategory(runId, pending.category);
    }

    function summarizeEditCounts(entry){
      const parts = [];
      if (entry.successCount > 0 || (entry.revertedCount > 0 && entry.successCount === 0)) {
        parts.push(`${entry.successCount} success`);
      }
      if (entry.revertedCount > 0) parts.push(`${entry.revertedCount} reverted`);
      if (entry.findNotFoundCount > 0) parts.push(`${entry.findNotFoundCount} find_not_found`);
      if (entry.failureCount > 0) parts.push(`${entry.failureCount} failure${entry.failureCount === 1 ? '' : 's'}`);
      return `${entry.count} attempt${entry.count === 1 ? '' : 's'}: ${parts.join(', ')}`;
    }

    function describeCategoryHeading(categoryKey, category){
      const meta = EXECUTION_CATEGORY_META[categoryKey];
      const uniqueCount = Object.keys(category.entries).length;
      if (categoryKey === 'edit') {
        if (!category.totalCount) return `${meta.icon} ${meta.label} 0 files`;
        if (category.revertedCount === category.totalCount && category.totalCount > 0) {
          return `${meta.icon} Tried to edit ${formatCountLabel(uniqueCount, meta.noun)} (${category.totalCount} attempt${category.totalCount === 1 ? '' : 's'}, all reverted)`;
        }
        return `${meta.icon} ${meta.label} ${formatCountLabel(uniqueCount, meta.noun)} (${category.totalCount} attempt${category.totalCount === 1 ? '' : 's'})`;
      }
      if (categoryKey === 'run') {
        const runPendingCount = Object.values(category.entries)
          .reduce((sum, e) => sum + (e.pendingApprovals ? e.pendingApprovals.length : 0), 0);
        const runParts = [];
        if (category.totalCount > 0) runParts.push(`${category.totalCount} run${category.totalCount === 1 ? '' : 's'}`);
        if (runPendingCount > 0) runParts.push(`${runPendingCount} awaiting approval`);
        if (!runParts.length) runParts.push('0 runs');
        return `${meta.icon} ${meta.label} ${formatCountLabel(uniqueCount, meta.noun)} (${runParts.join(', ')})`;
      }
      if (categoryKey === 'search') {
        return `${meta.icon} ${meta.label} ${category.totalCount} time${category.totalCount === 1 ? '' : 's'}`;
      }
      if (categoryKey === 'list') {
        return `${meta.icon} ${meta.label} ${category.totalCount} time${category.totalCount === 1 ? '' : 's'}`;
      }
      return `${meta.icon} ${meta.label} ${formatCountLabel(uniqueCount, meta.noun)}`;
    }

    function renderExecutionSummaryCategory(runId, categoryKey){
      const logBlock = document.getElementById(`logBlock-${runId}`);
      if (!logBlock) return;
      const shell = ensureExecutionSummaryShell(logBlock);
      if (!shell) return;
      const summary = ensureExecutionSummaryState(runId);
      const category = summary.categories[categoryKey];
      if (!category) return;
      const pendingRunApprovals = categoryKey === 'run'
        ? Object.values(category.entries).reduce((sum, e) => sum + (e.pendingApprovals ? e.pendingApprovals.length : 0), 0)
        : 0;
      const hasActivity = category.totalCount > 0 || pendingRunApprovals > 0;
      let groupEl = shell.groups.querySelector(`.exec-summary-group[data-category="${categoryKey}"]`);
      if (!hasActivity) {
        if (groupEl) groupEl.remove();
        shell.empty.hidden = shell.groups.children.length > 0;
        return;
      }
      if (!groupEl) {
        groupEl = document.createElement('div');
        groupEl.className = 'exec-summary-group';
        groupEl.dataset.category = categoryKey;
        const nextKey = EXECUTION_CATEGORY_ORDER
          .slice(EXECUTION_CATEGORY_ORDER.indexOf(categoryKey) + 1)
          .find((key) => shell.groups.querySelector(`.exec-summary-group[data-category="${key}"]`));
        const before = nextKey ? shell.groups.querySelector(`.exec-summary-group[data-category="${nextKey}"]`) : null;
        if (before) shell.groups.insertBefore(groupEl, before);
        else shell.groups.appendChild(groupEl);
      }
      const entries = Object.values(category.entries).sort((a, b) => Number(b.lastTs || 0) - Number(a.lastTs || 0));
      const entryHtml = entries.map((entry) => {
        if (categoryKey === 'edit') {
          const attemptHtml = entry.attempts.map((attempt) => {
            const tooltip = attempt.outcome === 'reverted' && attempt.validator
              ? `
                <div class="exec-tooltip">
                  <div class="exec-tooltip-title">${escapeHtml(attempt.validator.title || 'Validator caught broken pattern')}</div>
                  <div class="exec-tooltip-reason">${escapeHtml(attempt.validator.reason || 'semantic_smell')}</div>
                  <div class="exec-tooltip-body">${escapeHtml(attempt.validator.body || 'Patch was reverted automatically.')}</div>
                  <div class="exec-tooltip-foot">Patch was reverted automatically. Your file was not modified.</div>
                </div>
              `
              : '';
            const cls =
              attempt.outcome === 'find_not_found'
                ? 'find-not-found'
                : attempt.outcome === 'reverted'
                  ? 'reverted'
                  : attempt.outcome === 'success'
                    ? 'success'
                    : 'failure';
            return `<span class="exec-attempt ${cls}">#${attempt.index}${tooltip}</span>`;
          }).join('');
          return `
            <div class="exec-summary-entry">
              <div class="exec-summary-target">${escapeHtml(entry.target)}</div>
              <div class="exec-summary-meta">${escapeHtml(summarizeEditCounts(entry))}</div>
              ${attemptHtml ? `<div class="exec-attempts">${attemptHtml}</div>` : ''}
            </div>
          `;
        }
        if (categoryKey === 'run') {
          const outcome =
            entry.failureCount > 0 && entry.failureCount === entry.count
              ? `${entry.count} runs, all failed`
              : `${entry.count} run${entry.count === 1 ? '' : 's'}`;
          return `
            <div class="exec-summary-entry" data-entry-key="${escapeHtml(entry.target)}">
              <div class="exec-summary-target">${escapeHtml(entry.target)}</div>
              ${entry.count > 0 ? `<div class="exec-summary-meta">${escapeHtml(outcome)}</div>` : ''}
            </div>
          `;
        }
        const noun = categoryKey === 'read' ? 'read' : categoryKey === 'search' ? 'search' : 'listing';
        return `
          <div class="exec-summary-entry">
            <div class="exec-summary-target">${escapeHtml(entry.target)}</div>
            <div class="exec-summary-meta">${entry.count} ${noun}${entry.count === 1 ? '' : 's'}</div>
          </div>
        `;
      }).join('');
      groupEl.innerHTML = `
        <div class="exec-summary-heading">${escapeHtml(describeCategoryHeading(categoryKey, category))}</div>
        <div class="exec-summary-list">${entryHtml}</div>
      `;
      // Inject interactive approval widgets for run entries that are awaiting approval.
      // We do this after innerHTML because the widgets need live event listeners.
      if (categoryKey === 'run') {
        const summaryList = groupEl.querySelector('.exec-summary-list');
        if (summaryList) {
          entries.forEach((entry) => {
            if (!entry.pendingApprovals || !entry.pendingApprovals.length) return;
            const entryEl = summaryList.querySelector(`.exec-summary-entry[data-entry-key="${CSS.escape(entry.target)}"]`);
            if (!entryEl) return;
            entry.pendingApprovals.slice().forEach((approvalId) => {
              // Avoid double-injecting if already present (shouldn't happen but be safe)
              if (entryEl.querySelector(`[data-summary-approval-id="${CSS.escape(approvalId)}"]`)) return;
              const widget = document.createElement('div');
              widget.className = 'exec-summary-approval-widget';
              widget.dataset.summaryApprovalId = approvalId;
              const prompt = document.createElement('div');
              prompt.className = 'exec-summary-approval-prompt';
              prompt.textContent = '⏳ Awaiting your approval to run this command';
              const actions = document.createElement('div');
              actions.className = 'approval-actions';
              const approveBtn = document.createElement('button');
              approveBtn.className = 'approval-approve';
              approveBtn.textContent = '✓ Approve';
              const rejectBtn = document.createElement('button');
              rejectBtn.className = 'approval-reject';
              rejectBtn.textContent = '✗ Reject';
              const trustRow = document.createElement('label');
              trustRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--text-3);user-select:none';
              const trustCb = document.createElement('input');
              trustCb.type = 'checkbox';
              trustCb.style.cssText = 'accent-color:#7c3aed;transform:translateY(1px)';
              const trustTxt = document.createElement('span');
              trustTxt.textContent = 'Trust all commands for this session';
              trustRow.appendChild(trustCb);
              trustRow.appendChild(trustTxt);
              const statusEl = document.createElement('div');
              statusEl.className = 'approval-status';
              const sendSummaryDecision = async (approved) => {
                approveBtn.disabled = true;
                rejectBtn.disabled = true;
                statusEl.textContent = approved ? 'Approved ✓' : 'Rejected ✗';
                if (approved && trustCb && trustCb.checked) state.__trustedSession = true;
                const idx = entry.pendingApprovals.indexOf(approvalId);
                if (idx !== -1) entry.pendingApprovals.splice(idx, 1);
                try {
                  await fetch('/api/approve-command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ approvalId, approved: !!approved, runId, trustSession: !!(approved && trustCb && trustCb.checked) })
                  });
                } catch {}
                renderExecutionSummaryCategory(runId, 'run');
              };
              approveBtn.addEventListener('click', () => { void sendSummaryDecision(true); });
              rejectBtn.addEventListener('click', () => { void sendSummaryDecision(false); });
              actions.appendChild(approveBtn);
              actions.appendChild(rejectBtn);
              actions.appendChild(statusEl);
              widget.appendChild(prompt);
              widget.appendChild(actions);
              widget.appendChild(trustRow);
              entryEl.appendChild(widget);
            });
          });
        }
      }
      shell.empty.hidden = true;
    }

    function renderExecutionSummaryFinal(runId){
      const logBlock = document.getElementById(`logBlock-${runId}`);
      if (!logBlock) return;
      const shell = ensureExecutionSummaryShell(logBlock);
      if (!shell) return;
      const summary = ensureExecutionSummaryState(runId);
      if (!summary.completedAt) {
        shell.final.hidden = true;
        return;
      }
      const elapsedMs = Math.max(0, Number(summary.completedAt) - Number(summary.startedAt || summary.completedAt));
      const elapsedSeconds = Math.max(1, Math.round(elapsedMs / 1000));
      const headParts = [`Run completed in ${elapsedSeconds}s.`];
      if (summary.validatorCatchCount > 0) {
        headParts.push(`Validator caught ${summary.validatorCatchCount} broken patch${summary.validatorCatchCount === 1 ? '' : 'es'}.`);
      }
      const editEntries = Object.values(summary.categories.edit.entries).sort((a, b) => Number(b.lastTs || 0) - Number(a.lastTs || 0));
      let fileLine = 'No files were edited.';
      if (editEntries.length === 1) {
        const entry = editEntries[0];
        const changed = entry.successCount > 0;
        const lastOutcome =
          entry.lastOutcome === 'reverted'
            ? 'reverted'
            : entry.lastOutcome === 'success'
              ? 'success'
              : 'no_change';
        fileLine = `Edited 1 file: ${entry.target} (last attempt: ${lastOutcome}, ${changed ? 'file changed' : 'file unchanged'})`;
      } else if (editEntries.length > 1) {
        const changedCount = editEntries.filter((entry) => entry.successCount > 0).length;
        const unchangedCount = editEntries.length - changedCount;
        fileLine = `Edited ${editEntries.length} files (${changedCount} changed, ${unchangedCount} unchanged).`;
      }
      shell.final.hidden = false;
      shell.final.innerHTML = `
        <div class="exec-summary-final-line">${escapeHtml(headParts.join(' '))}</div>
        <div class="exec-summary-final-line muted">${escapeHtml(fileLine)}</div>
      `;
    }

    function recordExecutionSummaryPayload(logBlock, payload, runId){
      if (!logBlock) return;
      const summary = ensureExecutionSummaryState(runId);
      const progress = payload?.progress || null;
      // Detect command_approval_required whether it arrives at payload level or inside payload.progress
      const approvalEvtForSummary =
        (payload && payload.type === 'command_approval_required') ? payload
        : (progress && progress.type === 'command_approval_required') ? progress
        : null;
      if (approvalEvtForSummary) {
        const command = String(approvalEvtForSummary.command || '').trim();
        const approvalId = String(approvalEvtForSummary.approvalId || '');
        if (command && approvalId) {
          const entry = ensureExecutionEntry(summary.categories.run, command);
          if (!entry.pendingApprovals.includes(approvalId)) {
            entry.pendingApprovals.push(approvalId);
            entry.lastTs = Date.now();
            renderExecutionSummaryCategory(runId, 'run');
          }
        }
        return;
      }
      if (progress && typeof progress.filePath === 'string' && progress.filePath.trim()) {
        summary.lastFileHint = progress.filePath.trim();
        if (
          summary.pendingTool &&
          summary.pendingTool.category === 'edit' &&
          (!summary.pendingTool.target || summary.pendingTool.target === '(unknown file)')
        ) {
          summary.pendingTool.target = summary.lastFileHint;
        }
      }
      if (!progress) return;
      if (progress.type === 'tool_call') {
        const descriptor = parseToolCallDescriptor(progress, summary);
        if (!descriptor) return;
        summary.pendingTool = {
          toolName: descriptor.toolName,
          category: descriptor.category,
          target: descriptor.target,
          ts: Number(progress.ts || Date.now()),
        };
        return;
      }
      if (progress.type === 'tool_result') {
        recordExecutionToolResult(runId, progress);
      }
    }

    function completeExecutionSummary(runId){
      const summary = ensureExecutionSummaryState(runId);
      summary.completedAt = Date.now();
      EXECUTION_CATEGORY_ORDER.forEach((key) => renderExecutionSummaryCategory(runId, key));
      renderExecutionSummaryFinal(runId);
    }

    function ensureRunGroup(runId){
      const rid = String(runId || '');
      if (!rid) return null;
      let g = document.getElementById(`runGroup-${rid}`);
      if (g) return g;
      g = document.createElement('div');
      g.className = 'run-group';
      g.id = `runGroup-${rid}`;
      return g;
    }

    function appendToRunGroup(runId, el){
      if (!el) return;
      const rid = String(runId || '');
      const g = rid ? document.getElementById(`runGroup-${rid}`) : null;
      if (g) {
        g.appendChild(el);
        return;
      }
      els.chatArea.appendChild(el);
    }

    function findUserTextForRun(runId){
      try {
        const thread = getActiveThread();
        const msgs = Array.isArray(thread?.messages) ? thread.messages : [];
        const msg = msgs.find((m) => m && typeof m === 'object' && m.type === 'user' && String(m.runId || '') === String(runId || ''));
        if (msg && typeof msg.text === 'string' && msg.text.trim()) return msg.text.trim();
      } catch {}
      try {
        const group = document.getElementById(`runGroup-${runId}`);
        const bubble = group?.querySelector('.bubble.user .text');
        const text = String(bubble?.textContent || '').trim();
        if (text) return text;
      } catch {}
      return '';
    }

    function ensureChatBubbleForRun(runId){
      const rid = String(runId || '');
      if (!rid) return null;
      let bubble = document.getElementById(`chatBubble-${rid}`);
      if (bubble) return bubble;
      bubble = createAgentBubbleFromMarkdown('', {
        runId: rid,
        userText: findUserTextForRun(rid),
        streaming: true,
      });
      bubble.id = `chatBubble-${rid}`;
      appendToRunGroup(rid, bubble);
      return bubble;
    }

    function updateStreamingChatBubble(runId, delta){
      const rid = String(runId || '');
      ensureChatBubbleForRun(rid);
      // Buffer incoming deltas. Re-render only every 100 ms to avoid O(n²) DOM churn.
      state.__chatStreamTextByRun = state.__chatStreamTextByRun || {};
      state.__chatBuffers          = state.__chatBuffers          || {};
      state.__chatRenderTimers     = state.__chatRenderTimers     || {};
      state.__chatStreamTextByRun[rid] = String(state.__chatStreamTextByRun[rid] || '') + String(delta || '');
      state.__chatBuffers[rid] = state.__chatStreamTextByRun[rid];
      if (!state.__chatRenderTimers[rid]) {
        state.__chatRenderTimers[rid] = setTimeout(() => {
          const bubble = ensureChatBubbleForRun(rid);
          if (bubble) {
            setChatBubbleContent(
              bubble,
              state.__chatBuffers[rid],
              renderChatMarkdown(state.__chatBuffers[rid], false),
              [],
              findUserTextForRun(rid),
              false
            );
          }
          delete state.__chatRenderTimers[rid];
        }, 100);
      }
    }

    function finalizeChatBubble(runId, payload){
      const rid = String(runId || '');
      const bubble = ensureChatBubbleForRun(rid);
      if (!bubble) return;
      // Cancel any pending throttled render so the final render always wins.
      if (state.__chatRenderTimers && state.__chatRenderTimers[rid]) {
        clearTimeout(state.__chatRenderTimers[rid]);
        delete state.__chatRenderTimers[rid];
      }
      const responseText =
        String(payload?.responseText || state.__chatStreamTextByRun?.[rid] || '').trim();
      const responseHtml =
        (!extractTrailingVerificationReason(responseText) && String(payload?.responseHtml || '').trim()) || renderChatMarkdown(responseText, true);
      const contextFiles = Array.isArray(payload?.contextFiles) ? payload.contextFiles : [];
      setChatBubbleContent(
        bubble,
        responseText,
        responseHtml,
        contextFiles,
        findUserTextForRun(rid),
        false
      );
      state.__chatBubbleFinalized = state.__chatBubbleFinalized || {};
      state.__chatBubbleFinalized[rid] = true;
    }

    function upsertChatResponseMessage(runId, payload){
      try {
        const rid = String(runId || '');
        const thread = getActiveThread();
        if (!thread || !rid) return;
        const userText = findUserTextForRun(rid);
        const responseText = String(payload?.responseText || '').trim();
        const responseHtml = (!extractTrailingVerificationReason(responseText) && String(payload?.responseHtml || '').trim()) || renderChatMarkdown(responseText);
        const contextFiles = Array.isArray(payload?.contextFiles)
          ? payload.contextFiles.map((x) => String(x || '').trim()).filter(Boolean).slice(0, 10)
          : [];
        thread.messages = Array.isArray(thread.messages) ? thread.messages : [];
        const next = {
          type: 'chat_response',
          runId: rid,
          ts: Date.now(),
          userText,
          responseText,
          responseHtml,
          contextFiles,
        };
        const existing = thread.messages.find(
          (m) => m && typeof m === 'object' && m.type === 'chat_response' && String(m.runId || '') === rid
        );
        if (existing) {
          Object.assign(existing, next);
        } else {
          thread.messages.push(next);
        }
        saveThreads();
      } catch {}
    }

    function persistRunGroupHtmlToThread(runId, status){
      try {
        const rid = String(runId || '');
        if (!rid) return;
        const thread = getActiveThread();
        const g = document.getElementById(`runGroup-${rid}`);
        if (!thread || !g) return;
        thread.messages = Array.isArray(thread.messages) ? thread.messages : [];
        const next = {
          type: 'run_group_html',
          ts: Date.now(),
          runId: rid,
          status: String(status || g.dataset.runStatus || 'completed'),
          html: String(g.innerHTML || ''),
        };
        const existing = thread.messages.find(
          (m) => m && typeof m === 'object' && m.type === 'run_group_html' && String(m.runId || '') === rid
        );
        if (existing) {
          existing.ts = next.ts;
          existing.html = next.html;
          existing.status = next.status;
        } else {
          thread.messages.push(next);
        }
        saveThreads();
      } catch {}
    }

    function schedulePersistRunGroup(runId, status){
      try {
        const rid = String(runId || '');
        if (!rid) return;
        state.__runGroupPersistTimers = state.__runGroupPersistTimers || {};
        const existing = state.__runGroupPersistTimers[rid];
        if (existing) return;
        state.__runGroupPersistTimers[rid] = setTimeout(() => {
          try {
            delete state.__runGroupPersistTimers[rid];
          } catch {}
          persistRunGroupHtmlToThread(rid, status || 'running');
        }, 2000);
      } catch {}
    }

    /** Split patch body into lines (no \\r). */
    function patchLines(text){
      return String(text || '').replace(/\r\n/g, '\n').split('\n');
    }
    function trimEmptyEnds(lines){
      const a = Array.isArray(lines) ? lines.slice() : [];
      while (a.length && String(a[a.length - 1] ?? '').trim() === '') a.pop();
      while (a.length && String(a[0] ?? '').trim() === '') a.shift();
      return a;
    }
    /**
     * Line-level diff between FIND and REPLACE: only inserted/deleted lines (no unchanged context).
     */
    function diffFindReplaceToPreviewLines(findText, replaceText){
      let a = trimEmptyEnds(patchLines(findText));
      let b = trimEmptyEnds(patchLines(replaceText));
      const maxOut = 60;
      if (!a.length && !b.length) return [];
      if (!a.length) {
        if (b.length > 25) b = b.slice(-25);
        return b.slice(0, maxOut).map((text) => ({ kind: 'add', text: String(text) }));
      }
      if (!b.length) {
        return a.slice(0, maxOut).map((text) => ({ kind: 'del', text: String(text) }));
      }
      const n = a.length;
      const m = b.length;
      const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
      for (let i = 1; i <= n; i++) {
        for (let j = 1; j <= m; j++) {
          if (a[i - 1] === b[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
          else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }
      const raw = [];
      let i = n;
      let j = m;
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) {
          i--;
          j--;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
          raw.push({ kind: 'add', text: String(b[j - 1]) });
          j--;
        } else if (i > 0) {
          raw.push({ kind: 'del', text: String(a[i - 1]) });
          i--;
        } else break;
      }
      raw.reverse();
      const out = raw.filter((x) => x && (x.kind === 'add' || x.kind === 'del'));
      return out.slice(0, maxOut);
    }

    /** Strip streaming caret from accumulated stream text. */
    function stripStreamCursor(s){
      return String(s || '').replace(/\u258c\s*$/u, '').replace(/\s+$/u, '');
    }
    function looksLikeZonePatchBlob(t){
      return String(t || '').startsWith('--- FILE:');
    }
    function extractReplaceFromZonePatch(patchText){
      const t = String(patchText || '');
      const i = t.lastIndexOf('--- REPLACE ---');
      if (i < 0) return '';
      let after = t.slice(i + '--- REPLACE ---'.length);
      after = after.replace(/^\s*\r?\n/, '');
      const nextFile = after.indexOf('\n--- FILE:');
      if (nextFile >= 0) after = after.slice(0, nextFile);
      return after.trim();
    }
    function extractFindFromZonePatch(patchText){
      const t = String(patchText || '');
      const i = t.lastIndexOf('--- FIND ---');
      if (i < 0) return '';
      const after = t.slice(i + '--- FIND ---'.length);
      const rep = after.indexOf('\n--- REPLACE ---');
      const findBody = rep >= 0 ? after.slice(0, rep) : after;
      return findBody.replace(/^\s*\r?\n/, '').replace(/\s*$/, '');
    }
    /**
     * Build preview line objects (add/del/ctx) from full accumulated stream text.
     */
    function previewLinesFromAccumulatedStream(rawText){
      const raw = stripStreamCursor(String(rawText || ''));
      if (!raw.trim()) return [];
      if (looksLikeZonePatchBlob(raw)) {
        const findText = extractFindFromZonePatch(raw);
        const replaceText = extractReplaceFromZonePatch(raw);
        let lines = diffFindReplaceToPreviewLines(findText, replaceText);
        if ((!lines || !lines.length) && String(replaceText || '').trim()) {
          const tail = trimEmptyEnds(patchLines(replaceText)).slice(-8);
          lines = tail.map((t) => ({ kind: 'add', text: t }));
        }
        return lines || [];
      }
      const unified = [];
      for (const line of patchLines(raw)) {
        const u = line.replace(/\r$/, '');
        if (u.startsWith('+') && !u.startsWith('+++')) unified.push({ kind: 'add', text: u.slice(1) });
        else if (u.startsWith('-') && !u.startsWith('---')) unified.push({ kind: 'del', text: u.slice(1) });
        else unified.push({ kind: 'ctx', text: u });
      }
      const onlyChange = unified.filter((x) => x.kind === 'add' || x.kind === 'del');
      if (onlyChange.length) return onlyChange.slice(0, 60);
      const pl = trimEmptyEnds(patchLines(raw));
      const tail = pl.slice(-12);
      return tail.map((t) => ({ kind: 'ctx', text: t }));
    }
    /** Persisted / API lines may use `kind` or legacy `type`. */
    function normalizeStreamPreviewKind(x){
      if (!x || typeof x !== 'object') return null;
      const k = x.kind != null ? x.kind : x.type;
      if (k === 'add' || k === 'del' || k === 'ctx') return k;
      return null;
    }
    function persistStreamPreviewFromLines(runId, lines){
      const arr = Array.isArray(lines) ? lines : [];
      const rows = arr
        .map((x) => {
          const kind = normalizeStreamPreviewKind(x);
          if (!kind) return null;
          return { kind, text: String(x.text ?? '') };
        })
        .filter(Boolean)
        .slice(0, 48);
      if (!rows.length) return;
      state.__streamPreviewPersist = state.__streamPreviewPersist || {};
      const fp = (state.__streamFilePathByRun && state.__streamFilePathByRun[runId]) || '';
      state.__streamPreviewPersist[runId] = {
        filePath: basenameFromPath(fp) || String(fp || '').trim(),
        lines: rows,
      };
    }

    // ---- Live coding: placeholder + real streaming ----
    function basenameFromPath(p){
      const s = String(p || '').replace(/\\/g, '/').replace(/\/+$/, '');
      const parts = s.split('/');
      return parts[parts.length - 1] || s || 'Project';
    }

    /**
     * Placeholder / stream host: exactly one .livecode, living inside .log-lines so new log rows
     * append after it (correct chronological order).
     * @param {{ preserveStreaming?: boolean }} [opts]
     */
    function showWritingPlaceholder(logBlock, runId, filePath, opts){
      if (!logBlock) return null;
      const base = basenameFromPath(filePath);
      const linesEl = logBlock.querySelector('.log-lines');
      if (!linesEl) return null;

      // Dedupe: keep one .livecode (prefer the one already in .log-lines).
      const allLc = logBlock.querySelectorAll('.livecode');
      if (allLc.length > 1) {
        const inLines = linesEl.querySelector('.livecode');
        const keep = inLines || allLc[0];
        allLc.forEach((n) => {
          if (n !== keep) try { n.remove(); } catch {}
        });
      }

      let livecode = linesEl.querySelector('.livecode') || logBlock.querySelector('.livecode');
      if (!livecode) {
        livecode = document.createElement('div');
        livecode.className = 'livecode';
        livecode.innerHTML = `
          <div class="livecode-h">
            <span class="livecode-dot"></span>
            <span class="label">writing patch… ${escapeHtml(base || '')}</span>
          </div>
          <div class="livecode-body"></div>
        `;
        linesEl.appendChild(livecode);
      } else {
        if (livecode.parentElement !== linesEl) linesEl.appendChild(livecode);
        const label = livecode.querySelector('.livecode-h .label');
        if (label) label.textContent = base ? `writing patch… ${base}` : 'writing patch…';
      }

      // Placeholder (SSE) is not streaming; appendStream passes preserveStreaming so we do not strip mid-stream.
      if (!(opts && opts.preserveStreaming)) {
        livecode.classList.remove('streaming');
      }
      return livecode;
    }

    /** Static red/green line diff inside the stream <pre>. */
    function renderStreamDiffFinal(pre, lines){
      if (!pre) return;
      const esc = (s) => escapeHtml(String(s ?? ''));
      const chunk = (Array.isArray(lines) ? lines : []).map((it) => {
        const kind = normalizeStreamPreviewKind(it) || 'ctx';
        const cls = kind === 'add' ? 'add sd-line-add' : kind === 'del' ? 'del sd-line-del' : 'ctx';
        const prefix = kind === 'add' ? '+' : kind === 'del' ? '-' : ' ';
        return `<div class="sd-line ${cls}">${esc(prefix + ' ' + it.text)}</div>`;
      }).join('');
      pre.innerHTML = chunk;
    }

    function recordStreamPreviewPersist(runId){
      const pl = state.__streamFallbackPayload && state.__streamFallbackPayload[runId];
      if (!pl || !Array.isArray(pl.lines) || !pl.lines.length) return;
      const lines = pl.lines
        .map((x) => {
          const kind = normalizeStreamPreviewKind(x);
          if (kind !== 'add' && kind !== 'del') return null;
          return { kind, text: String(x.text ?? '') };
        })
        .filter(Boolean);
      if (!lines.length) return;
      persistStreamPreviewFromLines(runId, lines);
    }

    function finalizeLivecodeStatic(runId){
      const lb = document.getElementById('logBlock-' + runId);
      const livecode = lb ? lb.querySelector('.livecode') : null;
      if (livecode) {
        livecode.classList.remove('streaming');
        livecode.classList.add('livecode-static');
      }
      recordStreamPreviewPersist(runId);
    }

    /** Non-fallback stream: snap <pre> to highlighted static diff and persist for thread reload. */
    function applyNonFallbackStreamStatic(runId){
      const lb0 = document.getElementById('logBlock-' + runId);
      const pre0 = document.getElementById('streamCode-' + runId);
      const lc0 = lb0 ? lb0.querySelector('.livecode') : null;
      if (!lc0) return;
      if (lc0.classList.contains('livecode-static') && !lc0.classList.contains('streaming')) return;
      const k0 = String(runId || '');
      let raw = '';
      if (state.__streamRawDeltaConcatByRun && state.__streamRawDeltaConcatByRun[k0]) {
        raw = stripStreamCursor(String(state.__streamRawDeltaConcatByRun[k0] || ''));
      }
      if (!raw.trim() && state.__streamLive && state.__streamLive[k0] != null) {
        raw = stripStreamCursor(String(state.__streamLive[k0]));
      }
      if (!raw.trim() && pre0) {
        raw = stripStreamCursor(String(pre0.textContent || ''));
      }
      state.__streamTypeIvs = state.__streamTypeIvs || {};
      if (state.__streamTypeIvs[runId]) {
        try { clearInterval(state.__streamTypeIvs[runId]); } catch {}
        delete state.__streamTypeIvs[runId];
      }
      if (pre0 && raw.trim()) {
        const lines = previewLinesFromAccumulatedStream(raw);
        renderStreamDiffFinal(pre0, lines);
        persistStreamPreviewFromLines(runId, lines);
        pre0.scrollTop = pre0.scrollHeight;
      } else if (pre0) {
        pre0.textContent = '';
      }
      lc0.classList.remove('streaming');
      lc0.classList.add('livecode-static');
    }

    /** Jump char animation to final highlighted diff (e.g. patch_converted while still animating). */
    function snapFallbackStreamAnimToEnd(runId){
      const payload = state.__streamFallbackPayload && state.__streamFallbackPayload[runId];
      if (!payload) return;
      state.__streamTypeIvs = state.__streamTypeIvs || {};
      const iv = state.__streamTypeIvs[runId];
      if (iv) {
        try { clearInterval(iv); } catch {}
        delete state.__streamTypeIvs[runId];
      }
      const pre = document.getElementById('streamCode-' + runId);
      if (pre && payload && Array.isArray(payload.lines)) {
        renderStreamDiffFinal(pre, payload.lines);
        pre.scrollTop = pre.scrollHeight;
      }
      finalizeLivecodeStatic(runId);
    }

    /**
     * Fallback streaming: animates plain text char-by-char; duration capped at 2000ms.
     */
    function tryBeginFallbackStreamAnim(runId){
      state.__streamTargetDurationMs = state.__streamTargetDurationMs || {};
      const targetMs = state.__streamTargetDurationMs[runId];
      if (targetMs == null || targetMs <= 0) return;
      const payload = state.__streamFallbackPayload && state.__streamFallbackPayload[runId];
      if (!payload || typeof payload.fullText !== 'string') return;
      const pre = document.getElementById('streamCode-' + runId);
      if (!pre || !document.body.contains(pre)) return;

      state.__streamTypeIvs = state.__streamTypeIvs || {};
      if (state.__streamTypeIvs[runId]) {
        try { clearInterval(state.__streamTypeIvs[runId]); } catch {}
        delete state.__streamTypeIvs[runId];
      }

      const fullText = String(payload.fullText || '');
      const lines = Array.isArray(payload.lines) ? payload.lines : [];
      const chars = fullText.split('');
      const targetDurationMs = Math.min(2000, Math.max(1, Number(targetMs)));
      const tickMs = Math.max(15, Math.floor(targetDurationMs / Math.max(1, chars.length)));
      const cursor = '▌';
      let i = 0;
      pre.textContent = '';
      if (chars.length === 0) {
        renderStreamDiffFinal(pre, lines);
        pre.scrollTop = pre.scrollHeight;
        finalizeLivecodeStatic(runId);
        return;
      }
      i = 1;
      pre.textContent = chars.slice(0, i).join('') + cursor;
      pre.scrollTop = pre.scrollHeight;
      if (i >= chars.length) {
        renderStreamDiffFinal(pre, lines);
        pre.scrollTop = pre.scrollHeight;
        finalizeLivecodeStatic(runId);
        return;
      }
      const iv = setInterval(() => {
        if (!document.body.contains(pre)) {
          try { clearInterval(iv); } catch {}
          return;
        }
        if (i >= chars.length) {
          try { clearInterval(iv); } catch {}
          try {
            if (state.__streamTypeIvs && state.__streamTypeIvs[runId]) delete state.__streamTypeIvs[runId];
          } catch {}
          renderStreamDiffFinal(pre, lines);
          pre.scrollTop = pre.scrollHeight;
          finalizeLivecodeStatic(runId);
          return;
        }
        i++;
        pre.textContent = chars.slice(0, i).join('') + cursor;
        pre.scrollTop = pre.scrollHeight;
      }, tickMs);
      state.__streamTypeIvs[runId] = iv;
    }

    function appendStreamToLiveCode(logBlock, runId, filePath, delta){
      // Slow down streaming: enqueue deltas and render every ~30ms.
      state.__streamDeltaRenderQueue = state.__streamDeltaRenderQueue || {};
      state.__streamDeltaRenderTimer = state.__streamDeltaRenderTimer || {};
      const rid = String(runId || '');
      if (!rid) return;
      const q = state.__streamDeltaRenderQueue[rid] || [];
      q.push({ filePath: String(filePath || ''), delta: String(delta || '') });
      state.__streamDeltaRenderQueue[rid] = q;

      if (state.__streamDeltaRenderTimer[rid]) {
        return;
      }

      const pump = () => {
        try {
          const qq = state.__streamDeltaRenderQueue && state.__streamDeltaRenderQueue[rid];
          if (!qq || !Array.isArray(qq) || qq.length === 0) {
            if (state.__streamDeltaRenderTimer && state.__streamDeltaRenderTimer[rid]) {
              try { clearTimeout(state.__streamDeltaRenderTimer[rid]); } catch {}
              delete state.__streamDeltaRenderTimer[rid];
            }
            return;
          }
          const item = qq.shift();
          if (!item) return;
          // Render one delta chunk.
          renderOneDelta(item.filePath, item.delta);
        } catch {}

        // Schedule next chunk.
        try {
          state.__streamDeltaRenderTimer[rid] = setTimeout(pump, 30);
        } catch {}
      };

      function renderOneDelta(fpIn, deltaIn){
      function logHasGeneratingLine(lb){
        if (!lb) return false;
        const lines = lb.querySelector('.log-lines');
        if (!lines) return false;
        const msgs = lines.querySelectorAll('.log-line .log-msg');
        for (const el of msgs) {
          const t = String(el && el.textContent ? el.textContent : '');
          if (/generating (file patches|localized patch|full-file)/i.test(t)) return true;
        }
        return false;
      }

      const lbEl = document.getElementById('logBlock-' + runId);
      if (!lbEl) return;
      const livecode = showWritingPlaceholder(lbEl, runId, fpIn, { preserveStreaming: true });
        if (!livecode) return;
      if (fpIn) {
        state.__streamFilePathByRun = state.__streamFilePathByRun || {};
        state.__streamFilePathByRun[runId] = String(fpIn);
      }

      // Track mount time for minimum visible duration.
      state.__streamMountedAt = state.__streamMountedAt || {};
      if (!state.__streamMountedAt[runId]) state.__streamMountedAt[runId] = Date.now();

      // Mark as streaming-owned.
      livecode.classList.add('streaming');

      const body = livecode.querySelector('.livecode-body');
      if (!body) return;

      state.__streamLive = state.__streamLive || {};
      const key = String(runId || '');
      const rawDelta = String(deltaIn || '');

      // If backend sends a full FIND/REPLACE patch blob as a single delta, we can render a small diff-like view.
      const looksLikePatchBlob = looksLikeZonePatchBlob(rawDelta);

      const prev = String(state.__streamLive[key] || '');
      const next = looksLikePatchBlob ? extractReplaceFromZonePatch(rawDelta) : (prev + rawDelta);
      state.__streamLive[key] = next;
      state.__streamRawDeltaConcatByRun = state.__streamRawDeltaConcatByRun || {};
      state.__streamRawDeltaConcatByRun[key] = String(state.__streamRawDeltaConcatByRun[key] || '') + rawDelta;

      // Hard clear: ensure no dummy lines remain.
      body.innerHTML = '';

      let pre = document.getElementById(`streamCode-${runId}`);
      if (!pre) {
        pre = document.createElement('pre');
        pre.id = `streamCode-${runId}`;
        pre.style.cssText = "margin:0;font-family:var(--font-family-mono);font-size:11.5px;line-height:1.5;color:var(--text-2);white-space:pre-wrap;word-break:break-word";
        body.appendChild(pre);
      }
      const isFallback = !!(state.__streamFallback && state.__streamFallback[runId]);
      if (isFallback) {
        // Single-chunk fallback: store payload; animation starts when patch_converted sets duration.
        state.__streamTypeIvs = state.__streamTypeIvs || {};
        if (state.__streamTypeIvs[runId]) {
          try { clearInterval(state.__streamTypeIvs[runId]); } catch {}
          delete state.__streamTypeIvs[runId];
        }
        const findText = looksLikePatchBlob ? extractFindFromZonePatch(rawDelta) : '';
        const replaceText = String(next || '');
        let lines = looksLikePatchBlob
          ? diffFindReplaceToPreviewLines(findText, replaceText)
          : [{ kind: 'add', text: replaceText || '(stream)' }];
        if (looksLikePatchBlob && (!lines || !lines.length) && String(replaceText || '').trim()) {
          const tail = trimEmptyEnds(patchLines(replaceText)).slice(-8);
          lines = tail.map((t) => ({ kind: 'add', text: t }));
        }
        const fullText = lines.map((it) => {
          const prefix = it.kind === 'add' ? '+ ' : it.kind === 'del' ? '- ' : '  ';
          return prefix + String(it.text ?? '');
        }).join('\\n');
        state.__streamFallbackPayload = state.__streamFallbackPayload || {};
        state.__streamFallbackPayload[runId] = { lines, fullText };
        pre.innerHTML = '';
        tryBeginFallbackStreamAnim(runId);
      } else {
        pre.textContent = next + '▌';
        pre.scrollTop = pre.scrollHeight;
      }
      scrollChatIfFollowing(lbEl);
      }

      // Kick off the first pump immediately.
      state.__streamDeltaRenderTimer[rid] = setTimeout(pump, 0);
    }

    function removeLiveCodeBlock(logBlock){
      if (!logBlock) return;
      const box = logBlock.querySelector('.livecode');
      if (box) box.remove();
    }

    function stopLiveCoding(options){
      const rid = options && options.runId ? String(options.runId) : null;
      if (!rid) return;
      try {
        if (state.__streamFallbackPayload && state.__streamFallbackPayload[rid]) {
          snapFallbackStreamAnimToEnd(rid);
        } else {
          applyNonFallbackStreamStatic(rid);
        }
      } catch {}
    }

    /** Tear down streaming / "writing patch…" UI for a run (e.g. already_implemented). */
    function discardStreamUiForRun(runId){
      const rid = String(runId || '');
      if (!rid) return;
      try {
        if (state.__streamTypeIvs && state.__streamTypeIvs[rid]) {
          try { clearInterval(state.__streamTypeIvs[rid]); } catch {}
          delete state.__streamTypeIvs[rid];
        }
      } catch {}
      try {
        if (state.__streamFallbackPayload && state.__streamFallbackPayload[rid]) {
          delete state.__streamFallbackPayload[rid];
        }
      } catch {}
      const lb = document.getElementById('logBlock-' + rid);
      removeLiveCodeBlock(lb);
      try {
        if (state.__streamLive) delete state.__streamLive[rid];
        if (state.__streamRawDeltaConcatByRun && state.__streamRawDeltaConcatByRun[rid]) {
          delete state.__streamRawDeltaConcatByRun[rid];
        }
        if (state.__streamMountedAt && state.__streamMountedAt[rid]) delete state.__streamMountedAt[rid];
        if (state.__streamFallback && state.__streamFallback[rid]) delete state.__streamFallback[rid];
        if (state.__streamStartTs && state.__streamStartTs[rid]) delete state.__streamStartTs[rid];
        if (state.__streamTargetDurationMs && state.__streamTargetDurationMs[rid]) {
          delete state.__streamTargetDurationMs[rid];
        }
        if (state.__streamFilePathByRun && state.__streamFilePathByRun[rid]) {
          delete state.__streamFilePathByRun[rid];
        }
        if (state.__streamLogLineIdByRun && state.__streamLogLineIdByRun[rid]) {
          const id = state.__streamLogLineIdByRun[rid];
          const el = document.getElementById(id);
          if (el) { try { el.remove(); } catch {} }
          delete state.__streamLogLineIdByRun[rid];
        }
      } catch {}
    }

    function setLogBlockDone(runId){
      const card = document.getElementById(`logBlock-${runId}`);
      if (card) card.classList.add('done');
      const lines = card ? card.querySelectorAll('.log-line.active') : [];
      lines.forEach(l => l.classList.remove('active'));
    }

    // ════════════════════════════════════════════════════════════════════
    // Step Timeline — compact collapsible run progress groups
    // ════════════════════════════════════════════════════════════════════

    const STEP_GROUP_ORDER = ['group1','group2','group3','group3_5','group4','group5','group6'];

    const STEP_DEFAULT_LABELS = {
      group1: 'Scanning repo...',
      group2: 'Ranking files...',
      group3: 'Planning approach...',
      group3_5: 'Exploring codebase...',
      group4: 'Generating patch...',
      group5: 'Validating patch...',
      group6: 'Running tests...',
    };

    function classifyLogLine(text) {
      const t = String(text || '');
      if (/starting run|scanning repo|detecting project|repository scanned|monorepo|project structure|unknown project detected/i.test(t)) return 'group1';
      if (/ranking relevant|ranked\s+\d+\s*paths?|finding relevant|zone-rank|zone-embed/i.test(t)) return 'group2';
      if (/planning|strategy:|loaded.*context|patch preview|task intent/i.test(t)) return 'group3';
      if (/agent working|searching codebase|exploring directory|reading file|loading file|agent iteration|fix_attempt|agent_tool|no matches|no files/i.test(t)) return 'group3_5';
      if (/generating.*patch|writing patch|stream-delta|patch matched|generated\s+\d+\s*patch/i.test(t)) return 'group4';
      if (/patch correctness|patch validation|validating developer|building diff/i.test(t)) return 'group5';
      if (/runtime verification|running verif|run finished|verification queued/i.test(t)) return 'group6';
      return null;
    }

    function ensureStepTimeline(logBlock) {
      if (!logBlock) return null;
      let tl = logBlock.querySelector('.step-timeline');
      if (!tl) {
        tl = document.createElement('div');
        tl.className = 'step-timeline';
        const logLines = logBlock.querySelector('.log-lines');
        if (logLines) logBlock.insertBefore(tl, logLines);
        else logBlock.appendChild(tl);
      }
      return tl;
    }

    function ensureStepEl(logBlock, runId, groupId) {
      if (!logBlock || !runId || !groupId) return null;
      const rid = String(runId);
      state.__runSteps = state.__runSteps || {};
      state.__runSteps[rid] = state.__runSteps[rid] || {};
      if (state.__runSteps[rid][groupId] && state.__runSteps[rid][groupId].el) {
        return state.__runSteps[rid][groupId].el;
      }

      // When a new group starts, mark the previous active group as done.
      const idx = STEP_GROUP_ORDER.indexOf(groupId);
      if (idx > 0) {
        for (let i = idx - 1; i >= 0; i--) {
          const prev = state.__runSteps[rid][STEP_GROUP_ORDER[i]];
          if (prev && prev.status === 'active') {
            prev.status = 'done';
            if (prev.el) {
              prev.el.dataset.status = 'done';
              const ico = prev.el.querySelector('.run-step-icon');
              if (ico) ico.innerHTML = '&#x2713;';  // ✓
            }
            break;
          }
        }
      }

      const tl = ensureStepTimeline(logBlock);
      if (!tl) return null;
      const label = STEP_DEFAULT_LABELS[groupId] || groupId;
      const stepEl = document.createElement('div');
      stepEl.className = 'run-step';
      stepEl.dataset.stepId = groupId;
      stepEl.dataset.status = 'active';
      stepEl.innerHTML = [
        '<div class="run-step-header">',
          '<span class="run-step-icon"><span class="run-step-spinner"></span></span>',
          '<span class="run-step-label">' + escapeHtml(label) + '</span>',
          '<span class="run-step-toggle">&#x203A;</span>',
        '</div>',
        '<div class="run-step-details" hidden></div>',
      ].join('');
      const header = stepEl.querySelector('.run-step-header');
      if (header) {
        header.addEventListener('click', () => {
          const expanded = stepEl.dataset.expanded === 'true';
          stepEl.dataset.expanded = expanded ? 'false' : 'true';
          const det = stepEl.querySelector('.run-step-details');
          if (det) det.hidden = expanded;
        });
      }
      tl.appendChild(stepEl);
      state.__runSteps[rid][groupId] = { status: 'active', label, el: stepEl, files: [] };
      return stepEl;
    }

    function addLineToStep(logBlock, runId, groupId, timestamp, message) {
      const stepEl = ensureStepEl(logBlock, runId, groupId);
      if (!stepEl) return;
      const det = stepEl.querySelector('.run-step-details');
      if (det) {
        const d = document.createElement('div');
        d.className = 'run-step-detail';
        d.textContent = (timestamp ? timestamp + '  ' : '') + String(message || '');
        det.appendChild(d);
      }

      // Update step summary label from message content.
      const rid = String(runId);
      const step = state.__runSteps && state.__runSteps[rid] && state.__runSteps[rid][groupId];
      if (!step) return;
      const labelEl = stepEl.querySelector('.run-step-label');
      if (!labelEl) return;
      const t = String(message || '');

      if (groupId === 'group1') {
        const m = t.match(/Repository scanned\s*\((\d+)\s*files?\)/i);
        if (m) { step.label = 'Scanned ' + m[1] + ' files'; labelEl.textContent = step.label; }
      } else if (groupId === 'group2') {
        const m = t.match(/Ranked\s+(\d+)\s+paths?/i);
        if (m) { step.label = 'Ranked ' + m[1] + ' relevant files'; labelEl.textContent = step.label; }
      } else if (groupId === 'group3') {
        const m = t.match(/Planning complete\s*\((\d+)\s*execution\s*step/i);
        if (m) { step.label = 'Planned ' + m[1] + '-step approach'; labelEl.textContent = step.label; }
      } else if (groupId === 'group3_5') {
        // Track action count and update label in real-time.
        step.actionCount = (step.actionCount || 0) + 1;
        step.label = 'Explored codebase (' + step.actionCount + ' action' + (step.actionCount === 1 ? '' : 's') + ')';
        labelEl.textContent = step.label;
      } else if (groupId === 'group4') {
        const mWp = t.match(/writing patch[.\s]*(.+)/i);
        if (mWp) {
          const base = basenamePath(String(mWp[1] || '').trim());
          if (base && !step.files.includes(base)) step.files.push(base);
          step.label = step.files.length === 1
            ? 'Generated patch for ' + step.files[0]
            : 'Generated patch for ' + step.files.length + ' files';
          labelEl.textContent = step.label;
        }
      } else if (groupId === 'group5') {
        if (/warning/i.test(t)) step.warningFlag = true;
      } else if (groupId === 'group6') {
        const mRun = t.match(/Running verification:\s*(.+)/i);
        if (mRun) { step.label = 'Ran: ' + String(mRun[1] || '').trim().slice(0, 45); labelEl.textContent = step.label; }

        // Safety timer: if group6 is still active after 60s, force-finalize as warning
        if (!step.__safetyTimer) {
          step.__safetyTimer = setTimeout(function() {
            const steps = state.__runSteps && state.__runSteps[String(runId || '')];
            const g6 = steps && steps['group6'];
            if (g6 && g6.status === 'active') {
              if (g6.el) {
                const labelEl2 = g6.el.querySelector('.run-step-label');
                if (labelEl2 && g6.label === STEP_DEFAULT_LABELS.group6) {
                  g6.label = 'Tests inconclusive';
                  labelEl2.textContent = g6.label;
                }
              }
              finalizeStepTimeline(String(runId || ''), 'warning');
            }
          }, 60000);
        }
      }
    }

    function finalizeStepTimeline(runId, outcome) {
      const rid = String(runId || '');
      const steps = state.__runSteps && state.__runSteps[rid];
      if (!steps) return;
      STEP_GROUP_ORDER.forEach(gid => {
        const step = steps[gid];
        if (!step || step.status !== 'active') return;
        // For group5 (validation), use warning icon if warnings were seen.
        const finalOutcome = (gid === 'group5' && step.warningFlag) ? 'warning' : (outcome || 'done');
        step.status = finalOutcome;
        if (step.el) {
          step.el.dataset.status = finalOutcome;
          const ico = step.el.querySelector('.run-step-icon');
          if (ico) {
            if (finalOutcome === 'done')    ico.innerHTML = '&#x2713;';  // ✓
            else if (finalOutcome === 'warning') ico.innerHTML = '&#x26A0;'; // ⚠
            else if (finalOutcome === 'failed')  ico.innerHTML = '&#x2717;'; // ✗
          }
          // Finalize label for group5/6 if still at defaults.
          const labelEl = step.el.querySelector('.run-step-label');
          if (labelEl) {
            if (gid === 'group3_5' && step.label === STEP_DEFAULT_LABELS.group3_5) {
              step.label = 'Explored codebase';
              labelEl.textContent = step.label;
            }
            if (gid === 'group5' && step.label === STEP_DEFAULT_LABELS.group5) {
