              step.label = finalOutcome === 'warning' ? 'Validated patch (warnings)' : 'Validated patch';
              labelEl.textContent = step.label;
            }
            if (gid === 'group6' && step.label === STEP_DEFAULT_LABELS.group6) {
              step.label = finalOutcome === 'done' ? 'Tests passed' : finalOutcome === 'failed' ? 'Tests failed' : 'Tests skipped';
              labelEl.textContent = step.label;
            }
          }
        }
      });
    }

    function appendLogLine(logBlock, { timestamp, message, status, className }){
      if (!logBlock) return;
      // NEVER log streaming deltas as separate lines (stream is rendered in livecode block).
      if (String(message || '').toLowerCase().includes('streaming patch')) return;
      const msgText = String(message || '');

      // ── Step timeline routing ─────────────────────────────────────────
      try {
        if (state.__useStepTimeline) {
          const rid = String((logBlock.id || '').replace(/^logBlock-/, '') || '');
          if (rid) {
            // Skip lines that the verify-loop suppressor would absorb.
            const isVerifyLoopLine =
              /^\[agent_loop\]\s*Iteration\s+\d+\/\d+/i.test(msgText) ||
              /^\[fix\]\s*(read_file|list_files|search_in_files):/i.test(msgText) ||
              /^\[tool\]\s*(Reading|Listing|Searching):/i.test(msgText);
            if (!isVerifyLoopLine) {
              const group = classifyLogLine(msgText);
              if (group) {
                addLineToStep(logBlock, rid, group, String(timestamp || ''), msgText);
                scrollChatIfFollowing(logBlock);
                // Group4: also flush any buffered stream deltas as before.
                if (/^Generating a localized patch\b/i.test(msgText)) {
                  try {
                    state.__streamDeltaFlushed = state.__streamDeltaFlushed || {};
                    const buf = state.__streamDeltaBuffer && state.__streamDeltaBuffer[rid];
                    const fp = String(buf?.filePath || '');
                    const ds = Array.isArray(buf?.deltas) ? buf.deltas.slice(0) : [];
                    try { delete state.__streamDeltaBuffer[rid]; } catch {}
                    state.__streamDeltaFlushed[rid] = true;
                    ds.forEach((delta) => appendStreamToLiveCode(logBlock, rid, fp, delta));
                  } catch {}
                }
                return;  // skip the raw log-line append
              }
            }
          }
        }
      } catch {}
      // ─────────────────────────────────────────────────────────────────

      function ensureVerifySummary(lb, runId){
        if (!lb) return null;
        state.__verifySummary = state.__verifySummary || {};
        if (state.__verifySummary[runId] && state.__verifySummary[runId].el) {
          return state.__verifySummary[runId].el;
        }
        const linesEl = lb.querySelector('.log-lines');
        if (!linesEl) return null;
        const box = document.createElement('div');
        box.className = 'verify-sum collapsed';
        box.dataset.runId = String(runId || '');
        box.innerHTML = `
          <div class="verify-sum-h">
            <span class="ico">🔍</span>
            <span class="txt">Investigating test failure...</span>
            <span class="chev">›</span>
          </div>
          <div class="verify-sum-b"></div>
        `;
        const head = box.querySelector('.verify-sum-h');
        if (head) {
          head.addEventListener('click', () => {
            const isCollapsed = box.classList.contains('collapsed');
            box.classList.toggle('collapsed', !isCollapsed);
            box.classList.toggle('expanded', isCollapsed);
            const chev = box.querySelector('.verify-sum-h .chev');
            if (chev) chev.textContent = isCollapsed ? '˅' : '›';
          });
        }
        // Append in-order where log lines are appended.
        linesEl.appendChild(box);
        state.__verifySummary[runId] = { el: box };
        return box;
      }

      function addVerifySummaryLine(lb, runId, compactText, fullText){
        const box = ensureVerifySummary(lb, runId);
        if (!box) return;
        const body = box.querySelector('.verify-sum-b');
        if (!body) return;
        const line = document.createElement('div');
        line.className = 'verify-sum-line';
        line.innerHTML = `<span class="compact">• ${escapeHtml(compactText)}</span><span class="full">• ${escapeHtml(fullText)}</span>`;
        body.appendChild(line);
      }

      // Hide noisy fix-loop lines and fold them into the verification summary (if active).
      try {
        const rid = String((logBlock.id || '').replace(/^logBlock-/, '') || '');
        const hideAgentIter = /^\[agent_loop\]\s*Iteration\s+\d+\/\d+/i.test(msgText);
        const hideFixTool = /^\[fix\]\s*(read_file|list_files|search_in_files):/i.test(msgText);
        const hideTool = /^\[tool\]\s*(Reading|Listing|Searching):/i.test(msgText);
        if (hideAgentIter || hideFixTool || hideTool) {
          const vs = state.__verifySummary && state.__verifySummary[rid] && state.__verifySummary[rid].el;
          if (vs) {
            // Condense common tool lines.
            const mTool = msgText.match(/^\[(?:tool|fix)\]\s*(Reading|Listing|Searching|read_file|list_files|search_in_files):\s*(.*)$/i);
            if (mTool) {
              const kindRaw = String(mTool[1] || '').toLowerCase();
              const arg = String(mTool[2] || '').trim();
              const base = basenamePath(arg);
              if (kindRaw === 'reading' || kindRaw === 'read_file') {
                addVerifySummaryLine(logBlock, rid, `Reading ${base || 'file'}`, `Reading ${arg || base || 'file'}`);
              } else if (kindRaw === 'listing' || kindRaw === 'list_files') {
                addVerifySummaryLine(logBlock, rid, `Listed ${base || 'dir/'}`, `Listed ${arg || base || 'dir/'}`);
              } else if (kindRaw === 'searching' || kindRaw === 'search_in_files') {
                const term = arg || '';
                addVerifySummaryLine(logBlock, rid, `Searching for ${term}`, `Searching for ${term}`);
              }
            }
          }
          return;
        }
      } catch {}
      const lines = logBlock.querySelector('.log-lines');
      if (!lines) return;
      // mark previous active as done-ish
      const prev = lines.querySelector('.log-line.active');
      if (prev) prev.classList.remove('active');

      const row = document.createElement('div');
      row.className = `log-line ${status || 'active'}`;
      row.classList.add('active');
      if (status === 'done') row.classList.add('done');
      if (status === 'success') row.classList.add('success');
      if (status === 'warning') row.classList.add('warning');
      if (status === 'error') row.classList.add('error');
      // Allow callers to force design-system color classes (e.g. c-active, c-done).
      if (className) row.classList.add(String(className));
      const ts = document.createElement('div');
      ts.className = 'log-ts';
      ts.textContent = timestamp || nowTs();
      const msg = document.createElement('div');
      msg.className = 'log-msg';
      msg.textContent = msgText || '';
      row.appendChild(ts);
      row.appendChild(msg);
      // Always append at bottom so log reads chronologically (top → bottom).
      lines.appendChild(row);
      scrollChatIfFollowing(logBlock);

      // Flush buffered stream deltas once "Generating a localized patch" is logged.
      try {
        const rid = String((logBlock.id || '').replace(/^logBlock-/, '') || '');
        const text = String(message || '');
        if (/^Generating a localized patch\b/i.test(text)) {
          state.__streamDeltaFlushed = state.__streamDeltaFlushed || {};
          const buf = state.__streamDeltaBuffer && state.__streamDeltaBuffer[rid];
          const fp = String(buf?.filePath || '');
          const ds = Array.isArray(buf?.deltas) ? buf.deltas.slice(0) : [];
          try { delete state.__streamDeltaBuffer[rid]; } catch {}
          state.__streamDeltaFlushed[rid] = true;
          ds.forEach((delta) => appendStreamToLiveCode(logBlock, rid, fp, delta));
        }
      } catch {}
    }

    function basenamePath(p){
      const s = String(p || '');
      const i = Math.max(s.lastIndexOf('/'), s.lastIndexOf('\\'));
      return i >= 0 ? s.slice(i + 1) : s;
    }

    function classifyPill(filePath){
      const low = String(filePath||'').toLowerCase();
      const config = low.endsWith('.json') || low.endsWith('.yml') || low.endsWith('.yaml') || low.endsWith('.toml') || low.endsWith('.env') || low.endsWith('.config.js') || low.endsWith('.config.ts');
      const dot = config ? 'config' : '';
      const ext = (low.split('.').pop() || '');
      const isTs = ['ts','tsx','js','jsx','mjs','cjs'].includes(ext);
      return { className: dot, dotColor: config ? 'violet' : (isTs ? 'blue' : 'blue') };
    }

    function renderPlannerCard(logBlock, planner){
      if (!logBlock || !planner) return;
      const oldRf = logBlock.querySelector('.related-files');
      if (oldRf) oldRf.remove();
      const oldRw = logBlock.querySelector('.planner-dep-warnings');
      if (oldRw) oldRw.remove();
      let pills = logBlock.querySelector('.pills');
      if (!pills) {
        pills = document.createElement('div');
        pills.className = 'pills';
        logBlock.appendChild(pills);
      } else {
        pills.innerHTML = '';
      }
      const files = Array.isArray(planner.filesToEdit) ? planner.filesToEdit : [];
      const max = 8;
      files.slice(0, max).forEach((fp, idx) => {
        const p = document.createElement('div');
        const cls = classifyPill(fp);
        p.className = 'pill ' + (cls.className || '');
        p.style.animationDelay = `${idx*45}ms`;
        const d = document.createElement('span');
        d.className = 'pdot';
        p.appendChild(d);
        const name = document.createElement('span');
        name.textContent = fp;
        p.appendChild(name);
        pills.appendChild(p);
      });
      if (files.length > max) {
        const more = document.createElement('div');
        more.className = 'pill more';
        more.style.animationDelay = `${max*45}ms`;
        more.textContent = `+${files.length - max} files`;
        pills.appendChild(more);
      }
      const related = Array.isArray(planner.relatedFiles) ? planner.relatedFiles : [];
      if (related.length > 0) {
        const rfWrap = document.createElement('div');
        rfWrap.className = 'related-files';
        const lbl = document.createElement('span');
        lbl.className = 'rf-label';
        lbl.textContent = 'Also analyzing:';
        rfWrap.appendChild(lbl);
        related.forEach((f) => {
          const fp = f && (f.filePath || f.path);
          if (!fp) return;
          const pill = document.createElement('span');
          pill.className = 'rf-pill';
          const nm = document.createElement('span');
          nm.textContent = basenamePath(fp);
          const rel = document.createElement('span');
          rel.className = 'rf-rel';
          rel.textContent = f.relationship || '';
          pill.appendChild(nm);
          pill.appendChild(rel);
          rfWrap.appendChild(pill);
        });
        logBlock.appendChild(rfWrap);
      }
      const warns = Array.isArray(planner.warnings) ? planner.warnings : [];
      if (warns.length > 0) {
        const wBox = document.createElement('div');
        wBox.className = 'planner-dep-warnings';
        warns.forEach((w) => {
          if (!w) return;
          const line = document.createElement('div');
          line.className = 'rf-warn-line';
          line.textContent = String(w);
          wBox.appendChild(line);
        });
        if (wBox.childNodes.length) logBlock.appendChild(wBox);
      }
      if (planner.strategy) appendLogLine(logBlock, { timestamp: nowTs(), message: `Strategy: ${planner.strategy}`, status: 'done' });
      if (planner.changeDescription) appendLogLine(logBlock, { timestamp: nowTs(), message: planner.changeDescription, status: 'done' });
      scrollChatIfFollowing(logBlock);
    }

    function createToast(kind, text){
      const t = document.createElement('div');
      t.className = 'toast ' + (kind || '');
      const i = document.createElement('div');
      i.className = 'ticon';
      t.appendChild(i);
      const m = document.createElement('div');
      m.textContent = text;
      t.appendChild(m);
      return t;
    }

    function showToast(kind, text, ms){
      const t = createToast(kind, text);
      els.chatArea.appendChild(t);
      scrollChatIfFollowing();
      if (typeof ms === 'number' && ms > 0) {
        setTimeout(() => { try { t.remove(); } catch {} }, ms);
      }
      return t;
    }

    function updateInputPlaceholder(){
      try {
        if (state.isRunning) {
          els.taskInput.placeholder = "Running... type to queue next task";
          return;
        }
        if (state.taskQueue && state.taskQueue.length > 0) {
          els.taskInput.placeholder = `${state.taskQueue.length} queued — type to add more`;
          return;
        }
        els.taskInput.placeholder = "Ask Zone anything...";
      } catch {}
    }

    function renderQueuePanel(){
      const q = Array.isArray(state.taskQueue) ? state.taskQueue : [];
      if (!els.queueBar) return;
      if (q.length === 0) {
        els.queueBar.classList.remove('show');
        els.queueBar.innerHTML = '';
        updateInputPlaceholder();
        return;
      }
      els.queueBar.classList.add('show');
      els.queueBar.innerHTML = '';
      q.forEach((it) => {
        const row = document.createElement('div');
        row.className = 'queueRow';
        const txt = document.createElement('div');
        txt.className = 'queueText';
        const full = String(it.task || '');
        txt.textContent = full;
        txt.title = full;
        txt.style.cursor = 'text';
        txt.addEventListener('click', () => {
          // Edit queued prompt (no cancel).
          const bubbleLike = document.createElement('div');
          bubbleLike.className = 'bubble user';
          const inner = document.createElement('div');
          inner.className = 'text';
          inner.textContent = full;
          bubbleLike.appendChild(inner);
          const placeholder = document.createElement('div');
          placeholder.style.width = '100%';
          placeholder.appendChild(bubbleLike);
          row.innerHTML = '';
          row.appendChild(placeholder);
          enableUserBubbleEditing(bubbleLike, { mode: 'queue', queueId: it.id });
        });
        const x = document.createElement('button');
        x.type = 'button';
        x.className = 'queueRemove';
        x.textContent = '✕';
        x.title = 'Remove';
        x.addEventListener('click', () => cancelQueuedTask(it.id));
        row.appendChild(txt);
        row.appendChild(x);
        els.queueBar.appendChild(row);
      });
      updateInputPlaceholder();
    }

    function enqueueTask(task){
      const id = crypto.randomUUID();
      const item = { id, task, repoPath: state.activeRepo?.path || '' };
      state.taskQueue = Array.isArray(state.taskQueue) ? state.taskQueue : [];
      state.taskQueue.push(item);
      renderQueuePanel();
      renderBgTasks();
      return item;
    }

    function cancelQueuedTask(id){
      state.taskQueue = Array.isArray(state.taskQueue) ? state.taskQueue : [];
      state.taskQueue = state.taskQueue.filter((t) => t.id !== id);
      renderQueuePanel();
      renderBgTasks();
    }

    function dequeueAndRunNext(){
      state.taskQueue = Array.isArray(state.taskQueue) ? state.taskQueue : [];
      if (state.isRunning) {
        try { console.log('[send-debug] EARLY RETURN reason=dequeue_skipped_still_running', { currentRunId: state.currentRunId, queueLength: state.taskQueue.length }); } catch {}
        return;
      }
      if (state.taskQueue.length === 0) {
        renderQueuePanel();
        renderBgTasks();
        return;
      }
      const next = state.taskQueue.shift();
      renderQueuePanel();
      renderBgTasks();
      try { console.log('[send-debug] dequeued queued run', { queuedTaskId: next?.id || null, queueLengthAfterShift: state.taskQueue.length, task: String(next?.task || '').slice(0, 120) }); } catch {}
      setTimeout(() => sendMessage(next.task), 600);
    }

    function syntaxLite(line){
      // IMPORTANT: this output is later inserted via innerHTML. Escape first, then add spans.
      let s = escapeHtml(line);
      s = s.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="str">$1</span>');
      s = s.replace(/\b(function|const|let|var|return|if|else|for|while|try|catch|throw|class|new|import|export|async|await)\b/g, '<span class="kw">$1</span>');
      s = s.replace(/\b([A-Za-z_$][A-Za-z0-9_$]*)\s*\(/g, '<span class="fn">$1</span>(');
      return s;
    }

    function sanitizeDiffHtml(html){
      const allowed = new Set(['kw','fn','str','cm']);
      const t = document.createElement('template');
      t.innerHTML = String(html || '');
      const nodes = Array.from(t.content.querySelectorAll('*'));
      nodes.forEach((el) => {
        if (el.tagName !== 'SPAN') {
          el.replaceWith(document.createTextNode(el.textContent || ''));
          return;
        }
        const cls = String(el.getAttribute('class') || '').trim();
        if (!allowed.has(cls)) {
          el.replaceWith(document.createTextNode(el.textContent || ''));
          return;
        }
        Array.from(el.attributes).forEach((a) => {
          if (a.name !== 'class') el.removeAttribute(a.name);
        });
      });
      return t.innerHTML;
    }

    function buildDiffRowsUnified(diffText){
      const rows = [];
      const lines = String(diffText||'').split(/\r?\n/);
      let ln = 0;
      for (const raw of lines) {
        if (raw.startsWith('@@') || raw.startsWith('+++') || raw.startsWith('---')) continue;
        if (!raw) continue;
        const pm = raw[0];
        const code = raw.slice(1);
        let kind = 'unchanged';
        let pmChar = ' ';
        if (pm === '+') { kind = 'added'; pmChar = '+'; }
        else if (pm === '-') { kind = 'removed'; pmChar = '-'; }
        else { kind = 'unchanged'; pmChar = ' '; }
        ln += 1;
        rows.push({ ln, pm: pmChar, code, kind });
      }
      return rows;
    }

    function diffToUnifiedText(diff){
      if (!diff) return '';
      if (typeof diff === 'string') return diff;
      if (!Array.isArray(diff)) return String(diff);
      const lines = [];
      for (const it of diff) {
        if (typeof it === 'string') { lines.push(it); continue; }
        if (!it || typeof it !== 'object') { lines.push(String(it)); continue; }
        const t = String(it.type || it.kind || it.op || '').toLowerCase();
        const content = String(it.content ?? it.text ?? it.line ?? '');
        if (!content) continue;
        const pm =
          t === 'add' || t === 'added' || t === '+' ? '+' :
          t === 'remove' || t === 'removed' || t === '-' ? '-' :
          ' ';
        lines.push(pm + content);
      }
      return lines.join('\n');
    }

    function splitDiffToColumns(diffText){
      const left = [];
      const right = [];
      const lines = String(diffText||'').split(/\r?\n/);
      for (const raw of lines) {
        if (raw.startsWith('@@') || raw.startsWith('+++') || raw.startsWith('---')) continue;
        if (!raw) continue;
        const pm = raw[0];
        const code = raw.slice(1);
        if (pm === '+') { left.push({ pm:'', code:'', kind:'unchanged' }); right.push({ pm:'+', code, kind:'added' }); }
        else if (pm === '-') { left.push({ pm:'-', code, kind:'removed' }); right.push({ pm:'', code:'', kind:'unchanged' }); }
        else { left.push({ pm:'', code: raw.startsWith(' ') ? raw.slice(1) : raw, kind:'unchanged' }); right.push({ pm:'', code: raw.startsWith(' ') ? raw.slice(1) : raw, kind:'unchanged' }); }
      }
      return { left, right };
    }

    /**
     * @param {object} fileDiff
     * @param {number} idx
     * @param {number} total
     * @param {{ decisionMode?: string, applied?: boolean, blockedMessage?: string, handoffReport?: any }|undefined} options
     */
    function renderDiffCard(fileDiff, idx, total, options){
      const opts = options && typeof options === 'object' ? options : {};
      const decisionMode = String(opts.decisionMode || 'preview_only');
      const applied = !!opts.applied;
      const blockedMessage = String(opts.blockedMessage || '').trim() || '✗ Blocked for safety';
      const handoffPrompt = String(opts?.handoffReport?.suggestedNextPrompt || '').trim();

      const filePath = fileDiff.filePath || fileDiff.path || fileDiff.file || `file-${idx+1}`;
      const diffText = diffToUnifiedText(fileDiff.diff || fileDiff.unifiedDiff || fileDiff.patch || '');

      const card = document.createElement('div');
      card.className = 'diff-card';
      card.dataset.filePath = filePath;

      const tb = document.createElement('div');
      tb.className = 'diff-toolbar';

      const ico = document.createElement('div');
      ico.className = 'file-ico';
      ico.textContent = '≡';
      tb.appendChild(ico);

      const fn = document.createElement('div');
      fn.className = 'diff-fname';
      fn.textContent = filePath;
      tb.appendChild(fn);

      const tabs = document.createElement('div');
      tabs.className = 'toggle-tabs';
      const b1 = document.createElement('button');
      const b2 = document.createElement('button');
      b1.textContent = 'diff';
      b2.textContent = 'split';
      b1.className = 'active';
      tabs.appendChild(b1);
      tabs.appendChild(b2);
      tb.appendChild(tabs);

      if (handoffPrompt) {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'diff-copy';
        copyBtn.type = 'button';
        copyBtn.title = 'Copy prompt';
        copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="8" y="2" width="8" height="4" rx="1" stroke="currentColor" stroke-width="1.6"/></svg>`;
        const doCopy = () => {
          const t = String(handoffPrompt);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard
              .writeText(t)
              .then(() => showToast('success', 'Copied to clipboard', 1400))
              .catch(() => showToast('error', 'Copy failed', 1600));
          } else {
            try {
              const ta = document.createElement('textarea');
              ta.value = t;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              ta.remove();
              showToast('success', 'Copied to clipboard', 1400);
            } catch {
              showToast('error', 'Copy failed', 1600);
            }
          }
        };
        copyBtn.addEventListener('click', (e) => { e.stopPropagation(); doCopy(); });
        tb.appendChild(copyBtn);
      }

      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'diff-toggle';
      toggleBtn.type = 'button';
      toggleBtn.title = 'Collapse';
      toggleBtn.textContent = '˄';
      tb.appendChild(toggleBtn);

      if (applied) {
        const badge = document.createElement('div');
        badge.className = 'diff-applied-badge';
        badge.textContent = '✓ Applied';
        tb.appendChild(badge);
      } else if (decisionMode === 'safe_to_apply') {
        const st = document.createElement('div');
        st.className = 'diff-toolbar-status applying';
        st.textContent = '✓ Applying...';
        tb.appendChild(st);
      } else if (decisionMode === 'preview_only' && options && options.patchesAlreadyApplied) {
        const st = document.createElement('div');
        st.className = 'diff-toolbar-status applying';
        st.style.background = 'var(--yellow, #b8860b)';
        st.textContent = '⚠ Applied (review recommended)';
        tb.appendChild(st);
      } else if (decisionMode === 'blocked') {
        const st = document.createElement('div');
        st.className = 'diff-toolbar-status blocked-toolbar';
        st.textContent = blockedMessage;
        st.title = blockedMessage;
        tb.appendChild(st);
      } else if (decisionMode === 'preview_only') {
        const applyBtn = document.createElement('button');
        applyBtn.className = 'apply-btn';
        applyBtn.type = 'button';
        applyBtn.textContent = 'Apply';
        applyBtn.addEventListener('click', () => applyPatches());
        tb.appendChild(applyBtn);
      }
      /* decisionMode === 'chat': no apply control */

      const area = document.createElement('div');
      area.className = 'diff-area';

      toggleBtn.addEventListener('click', () => {
        const nextCollapsed = !card.classList.contains('collapsed');
        card.classList.toggle('collapsed', nextCollapsed);
        toggleBtn.textContent = nextCollapsed ? '˅' : '˄';
        toggleBtn.title = nextCollapsed ? 'Expand' : 'Collapse';
      });

      function renderUnified(){
        area.innerHTML = '';
        const rows = buildDiffRowsUnified(diffText).slice(0, 240);
        rows.forEach(r => {
          const row = document.createElement('div');
          row.className = `drow ${r.kind}`;
          const ln = document.createElement('div');
          ln.className = 'ln';
          ln.textContent = String(r.ln);
          const pm = document.createElement('div');
          pm.className = 'pm';
          pm.textContent = r.pm;
          const code = document.createElement('div');
          code.className = 'code';
          code.innerHTML = sanitizeDiffHtml(syntaxLite(r.code));
          row.appendChild(ln); row.appendChild(pm); row.appendChild(code);
          area.appendChild(row);
        });
      }

      function renderSplit(){
        // simple split: show right column as "new", left as "old" by concatenating with divider
        area.innerHTML = '';
        const cols = splitDiffToColumns(diffText);
        const max = Math.min(cols.left.length, 240);
        for (let i=0;i<max;i++){
          const L = cols.left[i] || { pm:'', code:'', kind:'unchanged' };
          const R = cols.right[i] || { pm:'', code:'', kind:'unchanged' };
          // left row
          const rowL = document.createElement('div');
          rowL.className = `drow ${L.kind}`;
          rowL.style.gridTemplateColumns = '52px 18px 1fr';
          rowL.style.borderLeftColor = (L.kind === 'removed') ? 'rgba(239,68,68,0.35)' : 'transparent';
          const lnL = document.createElement('div'); lnL.className='ln'; lnL.textContent = String(i+1);
          const pmL = document.createElement('div'); pmL.className='pm'; pmL.textContent = L.pm || ' ';
          const codeL = document.createElement('div'); codeL.className='code'; codeL.innerHTML = sanitizeDiffHtml(syntaxLite(L.code||''));
          rowL.appendChild(lnL); rowL.appendChild(pmL); rowL.appendChild(codeL);
          area.appendChild(rowL);
          // right row
          const rowR = document.createElement('div');
          rowR.className = `drow ${R.kind}`;
          const lnR = document.createElement('div'); lnR.className='ln'; lnR.textContent = String(i+1);
          const pmR = document.createElement('div'); pmR.className='pm'; pmR.textContent = R.pm || ' ';
          const codeR = document.createElement('div'); codeR.className='code'; codeR.innerHTML = sanitizeDiffHtml(syntaxLite(R.code||''));
          rowR.appendChild(lnR); rowR.appendChild(pmR); rowR.appendChild(codeR);
          area.appendChild(rowR);
        }
      }

      b1.addEventListener('click', () => { b1.classList.add('active'); b2.classList.remove('active'); renderUnified(); });
      b2.addEventListener('click', () => { b2.classList.add('active'); b1.classList.remove('active'); renderSplit(); });

      renderUnified();

      card.appendChild(tb);
      card.appendChild(area);
      return card;
    }

    // ---- Threads & sidebar rendering ----
    function fmtRelative(ts){
      const ms = Date.now() - ts;
      const m = Math.floor(ms/60000);
      if (m < 1) return 'now';
      if (m < 60) return `${m}m`;
      const h = Math.floor(m/60);
      if (h < 24) return `${h}h`;
      const d = Math.floor(h/24);
      return `${d}d`;
    }

    function getActiveThread(){
      return state.threads.find(t => t.id === state.activeThreadId) || null;
    }

    function renderSidebar(tab){
      const view = tab || document.querySelector('.tab.active')?.dataset?.tab || 'byRepo';
      els.leftScroll.innerHTML = '';
      if (normalizeSidebarState(state.sidebarState) !== 'open') return;

      const threads = state.threads.slice().sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
      if (view === 'all') {
        const g = document.createElement('div');
        g.className = 'group open';
        const gh = document.createElement('div');
        gh.className = 'group-h';
        gh.innerHTML = `<span style="color:var(--text-4)">All threads</span><span class="badge">${threads.length}</span><span class="chev">›</span>`;
        g.appendChild(gh);
        const list = document.createElement('div');
        list.className = 'threads';
        threads.forEach(t => list.appendChild(renderThreadItem(t)));
        g.appendChild(list);
        els.leftScroll.appendChild(g);
        return;
      }
      if (view === 'recent') {
        const today = [];
        const earlier = [];
        const start = new Date(); start.setHours(0,0,0,0);
        threads.forEach(t => ((t.createdAt||0) >= start.getTime() ? today : earlier).push(t));
        if (today.length) els.leftScroll.appendChild(renderSimpleGroup('Today', today, true));
        if (earlier.length) els.leftScroll.appendChild(renderSimpleGroup('Earlier', earlier, true));
        return;
      }
      // byRepo
      const by = new Map();
      threads.forEach(t => {
        const key = basenameFromPath(t.repoPath || t.repoName || '') || 'Unknown';
        if (!by.has(key)) by.set(key, []);
        by.get(key).push(t);
      });
      const keys = Array.from(by.keys()).sort();
      keys.forEach(k => {
        const list = by.get(k).slice();
        els.leftScroll.appendChild(renderRepoGroup(k, list));
      });
    }

    function renderSimpleGroup(title, threads, openByDefault){
      const g = document.createElement('div');
      g.className = 'group ' + (openByDefault ? 'open' : '');
      const gh = document.createElement('button');
      gh.className = 'group-h';
      gh.type = 'button';
      gh.innerHTML = `
        <span style="color:var(--text-4)">${title}</span>
        <span class="badge">${threads.length}</span>
        <span class="chev">›</span>
      `;
      gh.addEventListener('click', () => g.classList.toggle('open'));
      const list = document.createElement('div');
      list.className = 'threads';
      threads.forEach(t => list.appendChild(renderThreadItem(t)));
      g.appendChild(gh);
      g.appendChild(list);
      return g;
    }

    function renderRepoGroup(repoName, threads){
      const g = document.createElement('div');
      g.className = 'group open';
      const gh = document.createElement('button');
      gh.type = 'button';
      gh.className = 'group-h';
      const repo = (state.repos || []).find(r => (r?.name === repoName) || (r?.path === repoName)) || null;
      const repoPath = repo?.path || repoName;

      const confirming = state.__confirmRemoveProjectPath === repoPath;
      if (confirming) {
        gh.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-4)">
            <path d="M3 7h5l2 2h11v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"></path>
          </svg>
          <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${repoName}</span>
          <span class="gconfirm">
            <span class="q">Remove project?</span>
            <button type="button" class="y">Yes</button>
            <button type="button" class="n">No</button>
          </span>
        `;
      } else {
        gh.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-4)">
            <path d="M3 7h5l2 2h11v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"></path>
          </svg>
          <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${repoName}</span>
          <span class="badge">${threads.length}</span>
          <button type="button" class="gbtn new" title="New chat" aria-label="New chat">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
              <path d="M7.5 1.5l2 2L3 10H1V8L7.5 1.5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button type="button" class="gbtn del" title="Remove project" aria-label="Remove project">×</button>
          <span class="chev">›</span>
        `;
      }

      // default: clicking header toggles open/close (but not when clicking buttons)
      gh.addEventListener('click', (e) => {
        const t = e.target;
        if (t && t.closest && t.closest('button')) return;
        g.classList.toggle('open');
      });

      const newBtn = gh.querySelector('.gbtn.new');
      if (newBtn) {
        newBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.activeRepo = normalizeRepoRecord(repo || { path: repoPath }) || { name: repoName, path: repoPath };
          const thread = {
            id: crypto.randomUUID(),
            repoPath: state.activeRepo.path,
            repoName: state.activeRepo.name,
            title: `New thread for ${state.activeRepo.name}`,
            messages: [],
            createdAt: Date.now()
          };
          state.threads.unshift(thread);
          state.activeThreadId = thread.id;
          saveThreads();
          ensureRepos();
          renderSidebar();
          // show empty state for a new chat
          clearChat();
          els.threadTitle.textContent = thread.title;
          setIdleUI();
          focusInputSoon();
        });
      }

      const delBtn = gh.querySelector('.gbtn.del');
      if (delBtn) {
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.__confirmRemoveProjectPath = repoPath;
          renderSidebar();
        });
      }

      const yesBtn = gh.querySelector('.gconfirm .y');
      const noBtn = gh.querySelector('.gconfirm .n');
      if (noBtn) {
        noBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.__confirmRemoveProjectPath = '';
          renderSidebar();
        });
      }
      if (yesBtn) {
        yesBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          // remove project from state.repos
          state.repos = Array.isArray(state.repos) ? state.repos : [];
          state.repos = state.repos.filter(r => String(r?.path || '') !== String(repoPath));
          window.ZONE_REPOS = state.repos;

          // Persist updated list; also clean up the legacy key if present.
          try { localStorage.setItem(LS_REPOS, JSON.stringify(state.repos)); } catch {}
          try { localStorage.removeItem(LS_REPO_HISTORY); } catch {}

          // remove all threads for that project
          state.threads = (Array.isArray(state.threads) ? state.threads : []).filter(t => String(t?.repoPath || '') !== String(repoPath));
          saveThreads();
          if (state.activeThreadId && !state.threads.some(t => t.id === state.activeThreadId)) {
            state.activeThreadId = state.threads[0]?.id || null;
          }
          if (state.activeRepo && String(state.activeRepo.path) === String(repoPath)) {
            state.activeRepo = state.repos[0] || null;
            els.repoChipName.textContent = state.activeRepo?.name || 'No project';
          }
          state.__confirmRemoveProjectPath = '';
          ensureRepos();
          renderSidebar();
          renderActiveThread();
        });
      }

      const list = document.createElement('div');
      list.className = 'threads';
      threads.forEach(t => list.appendChild(renderThreadItem(t)));
      g.appendChild(gh);
      g.appendChild(list);
      return g;
    }

    function renderThreadItem(t){
      const b = document.createElement('button');
      b.type = 'button';
      const isRunningThread = !!(state.isRunning && state.runningThreadId && t.id === state.runningThreadId);
      b.className = 'thread ' + (t.id === state.activeThreadId ? 'active ' : '') + (isRunningThread ? 'thread-running' : '');
      b.dataset.threadId = String(t.id || '');
      b.innerHTML = `
        <span class="tdot"></span>
        <span class="tname">${escapeHtml(t.title || 'Untitled')}</span>
        <span class="ttime">${fmtRelative(t.createdAt || Date.now())}</span>
        <button type="button" class="gbtn del t-del" title="Delete thread" aria-label="Delete thread">×</button>
      `;
      const delBtn = b.querySelector('.t-del');
      if (delBtn) {
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.threads = (Array.isArray(state.threads) ? state.threads : []).filter(x => x.id !== t.id);
          saveThreads();
          if (state.activeThreadId === t.id) state.activeThreadId = state.threads[0]?.id || null;
          renderSidebar();
          renderActiveThread();
        });
      }
      b.addEventListener('click', () => activateThread(t.id));
      return b;
    }

    function escapeHtml(s){
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ---- Repo management ----
    function ensureRepos(){
      state.repos = normalizeRepoList(state.repos);
      window.ZONE_REPOS = state.repos;
      if (!state.repos.length) {
        state.repos = [];
        state.activeRepo = null;
        els.repoChipName.textContent = 'No project';
        return;
      }
      if (!state.activeRepo) state.activeRepo = state.repos[0];
      else {
        const match = state.repos.find((r) => String(r.path || '') === String(state.activeRepo?.path || ''));
        state.activeRepo = match || normalizeRepoRecord(state.activeRepo) || state.repos[0];
      }
      els.repoChipName.textContent = state.activeRepo?.name || 'Project';
      els.modelLabel.textContent = `model: ${window.ZONE_MODEL || 'gpt-4o'}`;
    }

    function cycleRepo(){
      if (!state.repos.length) return;
      const idx = Math.max(0, state.repos.findIndex(r => r.path === state.activeRepo?.path));
      const next = state.repos[(idx + 1) % state.repos.length];
      state.activeRepo = next;
      els.repoChipName.textContent = state.activeRepo.name;
    }

    function openNewThreadDropdown(){
      els.newThreadDropdown.classList.toggle('open');
      els.filterBtn.classList.remove('active');
    }

    function closeNewThreadDropdown(){
      els.newThreadDropdown.classList.remove('open');
      state.__addingProject = false;
      state.__addingProjectMode = '';
      state.__addingProjectValue = '';
    }

    function renderRepoDropdown(){
      state.repos = normalizeRepoList(state.repos);
      els.repoDropdownList.innerHTML = '';
      state.repos.forEach((r) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'repo-row';
        row.innerHTML = `
          <span class="dot"></span>
          <span class="repo-meta">
            <div class="repo-title">${escapeHtml(r.name || 'Project')}</div>
            <div class="repo-path">${escapeHtml(r.path || '')}</div>
          </span>
        `;
        row.addEventListener('click', () => {
          state.activeRepo = r;
          closeNewThreadDropdown();
          createNewThreadForRepo(r);
        });
        els.repoDropdownList.appendChild(row);
      });

      // separator + add project row / inline form
      const sep = document.createElement('div');
      sep.className = 'repo-sep';
      els.repoDropdownList.appendChild(sep);

      if (state.__addingProject && state.__addingProjectMode === 'manual') {
        const wrap = document.createElement('div');
        wrap.className = 'repo-form';

        // Browse button — calls backend native folder picker, pre-fills input
        const browseBtn = document.createElement('button');
        browseBtn.type = 'button';
        browseBtn.className = 'browsebtn';
        browseBtn.textContent = 'Browse…';
        browseBtn.title = 'Open system folder picker';

        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Project path  e.g. C:\\Users\\...';
        input.value = state.__addingProjectValue || '';
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'addbtn';
        addBtn.textContent = 'Add';

        function cancelAdd(){
          state.__addingProject = false;
          state.__addingProjectMode = '';
          state.__addingProjectValue = '';
          renderRepoDropdown();
        }

        function doAdd(){
          console.log('[zone-add-repo] click handler fired');
          const raw = String(input.value || '').trim();
          console.log('[zone-add-repo] input value:', raw);

          // Validate: must be a non-empty absolute path
          const valid = raw.length > 0 && /^([A-Za-z]:[/\\]|\/)/i.test(raw);
          console.log('[zone-add-repo] validation result:', valid);
          if (!valid) {
            let errEl = wrap.querySelector('.repo-form-error');
            if (!errEl) {
              errEl = document.createElement('div');
              errEl.className = 'repo-form-error';
              wrap.appendChild(errEl);
            }
            errEl.textContent = raw.length === 0
              ? 'Please enter a path'
              : 'Please provide a valid absolute path (e.g. C:\\Users\\... or /home/...)';
            input.focus();
            return;
          }

          // Duplicate detection — just select the existing project
          state.repos = Array.isArray(state.repos) ? state.repos : [];
          const existing = state.repos.find(r => String(r.path || '') === raw);
          if (existing) {
            console.log('[zone-add-repo] duplicate — selecting existing project');
            state.activeRepo = existing;
            state.__addingProject = false;
            state.__addingProjectMode = '';
            state.__addingProjectValue = '';
            closeNewThreadDropdown();
            ensureRepos();
            createNewThreadForRepo(existing);
            return;
          }

          const project = normalizeRepoRecord({ id: crypto.randomUUID(), path: raw, createdAt: Date.now() });
          if (!project) return;
          state.repos.push(project);
          state.activeRepo = project;
          window.ZONE_REPOS = state.repos;

          // Persist — zone_repos only going forward
          console.log('[zone-add-repo] saving to localStorage');
          try { localStorage.setItem(LS_REPOS, JSON.stringify(state.repos)); } catch {}

          state.__addingProject = false;
          state.__addingProjectMode = '';
          state.__addingProjectValue = '';
          closeNewThreadDropdown();
          ensureRepos();
          console.log('[zone-add-repo] state updated, triggering re-render');
          // Create a new thread so the project appears in the sidebar immediately.
          createNewThreadForRepo(project);
        }

        browseBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          browseBtn.textContent = '…';
          browseBtn.disabled = true;
          try {
            const r = await fetch('/api/browse-folder', { method: 'POST' });
            const data = await r.json();
            if (data.ok && data.path) {
              input.value = data.path;
              state.__addingProjectValue = data.path;
              const old = wrap.querySelector('.repo-form-error');
              if (old) old.remove();
              input.focus();
              input.setSelectionRange(input.value.length, input.value.length);
            } else if (!data.cancelled) {
              // API responded but picker unavailable on this platform.
              let errEl = wrap.querySelector('.repo-form-error');
              if (!errEl) { errEl = document.createElement('div'); errEl.className = 'repo-form-error'; wrap.appendChild(errEl); }
              errEl.textContent = data.error || 'Folder picker unavailable — please type the path below';
              input.focus();
            }
            // data.cancelled → user closed dialog, do nothing
          } catch {
            let errEl = wrap.querySelector('.repo-form-error');
            if (!errEl) { errEl = document.createElement('div'); errEl.className = 'repo-form-error'; wrap.appendChild(errEl); }
            errEl.textContent = 'Folder picker unavailable — please type the path below';
            input.focus();
          } finally {
            browseBtn.textContent = 'Browse…';
            browseBtn.disabled = false;
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') { e.preventDefault(); cancelAdd(); }
          if (e.key === 'Enter') { e.preventDefault(); doAdd(); }
        });
        input.addEventListener('input', () => { state.__addingProjectValue = input.value; });
        addBtn.addEventListener('click', doAdd);

        wrap.appendChild(browseBtn);
        wrap.appendChild(input);
        wrap.appendChild(addBtn);
        els.repoDropdownList.appendChild(wrap);
        setTimeout(() => { if (!input.value) browseBtn.focus(); else input.focus(); }, 0);
      } else {
        const addRow = document.createElement('button');
        addRow.type = 'button';
        addRow.className = 'repo-row add';
        addRow.innerHTML = `
          <span class="dot"></span>
          <span class="repo-meta">
            <div class="repo-title">Add project</div>
            <div class="repo-path">Add a project path</div>
          </span>
        `;
        addRow.addEventListener('click', (e) => {
          e.stopPropagation();
          state.__addingProject = true;
          state.__addingProjectMode = 'manual';
          state.__addingProjectValue = '';
          renderRepoDropdown();
        });
        els.repoDropdownList.appendChild(addRow);
      }
    }

    function createNewThreadForRepo(repo){
      const normalizedRepo = normalizeRepoRecord(repo);
      if (!normalizedRepo) return;
      // Reset session trust on new thread creation (in-memory only).
      state.__trustedSession = false;
      const thread = {
        id: crypto.randomUUID(),
        repoPath: normalizedRepo.path,
        repoName: normalizedRepo.name,
        title: `New thread for ${normalizedRepo.name}`,
        messages: [],
        createdAt: Date.now()
      };
      state.activeRepo = normalizedRepo;
      state.threads.unshift(thread);
      state.activeThreadId = thread.id;
      saveThreads();
      renderSidebar();
      renderActiveThread();
      focusInputSoon();
    }

    function activateThread(threadId){
      // If a run is actively streaming on the current thread, preserve live DOM.
      if (state.isRunning && state.runningThreadId && state.activeThreadId === state.runningThreadId) {
        // Switching within the running thread: keep live UI intact.
        if (threadId === state.activeThreadId) {
          renderSidebar();
          return;
        }
        // Switching away from running thread: snapshot current DOM so we can restore it.
        state.runningThreadSnapshot = String(els.chatArea.innerHTML || '');
        state.runningThreadId = state.activeThreadId;
      }

      state.activeThreadId = threadId;
      renderSidebar();

      // Switching back to the running thread: restore live DOM instead of replaying saved messages.
      if (state.isRunning && state.runningThreadId && threadId === state.runningThreadId && state.runningThreadSnapshot) {
        els.chatArea.innerHTML = state.runningThreadSnapshot;

        // Re-apply buffered SSE payloads that arrived while user was away.
        const buffered = Array.isArray(state.runningThreadBufferedPayloads) ? state.runningThreadBufferedPayloads : [];
        state.runningThreadBufferedPayloads = [];
        for (const p of buffered) handleSSEPayload(p, state.runId);

        // Ensure title/repo chip are correct.
        const thread = getActiveThread();
        if (thread) {
          els.threadTitle.textContent = thread.title || 'Thread';
          els.repoChipName.textContent = state.activeRepo?.name || thread.repoName || 'Project';
        }
        return;
      }

      renderActiveThread();
    }

    function focusInputSoon(){
      setTimeout(() => { els.taskInput.focus(); }, 40);
    }

    function renderStaticDiffCard(fileDiff, decisionMode, applied, blockedMessage){
      const dm = String(decisionMode || 'preview_only');
      const toolbarDm = applied
        ? 'preview_only'
        : dm === 'safe_to_apply'
          ? 'preview_only'
          : dm === 'blocked'
            ? 'blocked'
            : dm === 'chat'
              ? 'chat'
              : 'preview_only';
      return renderDiffCard(fileDiff, 0, 0, {
        decisionMode: toolbarDm,
        applied: !!applied,
        blockedMessage: blockedMessage || (dm === 'blocked' ? '✗ Blocked for safety' : ''),
      });
    }

    function toggleRestored(el){
      const root = el && el.closest ? el.closest('.turn-restored') : null;
      if (!root) return;
      root.classList.toggle('open');
    }

    function renderRestoredTurnResult(msg){
      const decision = String(msg?.decisionMode || 'preview_only');
      const summary = String(msg?.summary || '').slice(0, 60);
      const ts = Number(msg?.ts || Date.now());
      const badgeClass =
        decision === 'safe_to_apply' ? 'safe' :
        decision === 'blocked' ? 'blocked' :
        decision === 'chat' ? 'chat' :
        'preview';
      const badgeText =
        badgeClass === 'safe' ? 'Safe' :
        badgeClass === 'blocked' ? 'Blocked' :
        badgeClass === 'chat' ? 'Chat' :
        'Preview';

      const wrap = document.createElement('div');
      wrap.className = 'turn-restored';
      wrap.innerHTML = `
        <div class="turn-restored-header">
          <svg class="chevron" viewBox="0 0 10 10" fill="none" aria-hidden="true">
            <path d="M3 4l2 2 2-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="turn-summary">${escapeHtml(summary || '(result)')}</span>
          <span class="turn-badge ${badgeClass}">${escapeHtml(badgeText)}</span>
          <span class="turn-meta">${escapeHtml(fmtRelative(ts))}</span>
        </div>
        <div class="turn-restored-body">
          <div class="turn-restored-files"></div>
        </div>
      `;
      wrap.querySelector('.turn-restored-header')?.addEventListener('click', (e) => toggleRestored(e.currentTarget));
      const body = wrap.querySelector('.turn-restored-files');
      if (body) {
        if (msg?.verificationReason || msg?.decisionMode) {
          body.appendChild(createVerificationBanner({
            decisionMode: msg?.decisionMode,
            verificationReason: msg?.verificationReason,
          }));
        }
        const statusText = document.createElement('div');
        if (decision === 'safe_to_apply') {
          const applied = Array.isArray(msg?.appliedFiles) ? msg.appliedFiles.filter(Boolean) : [];
          statusText.textContent = applied.length ? `✓ Applied: ${applied.join(', ')}` : '✓ Applied (files unknown)';
        } else if (decision === 'blocked' || msg?.blocked) {
          statusText.textContent = '✗ Blocked for safety';
        } else if (decision === 'preview_only') {
          statusText.textContent = '⚠ Preview only — not applied';
        } else if (decision === 'chat') {
          statusText.textContent = '';
        } else {
          statusText.textContent = 'Result saved.';
        }
        if (statusText.textContent) body.appendChild(statusText);
      }
      const sp = msg && msg.streamPreview;
      // Virtual history: only restore patch preview cards for turns that are currently rendered.
      // Some older UIs restored previews separately; this guard ensures the preview follows the same windowing.
      const turnKey = `result:${String(msg?.ts ?? '')}`;
      const allowPreview =
        !state.__renderedTurnKeys ||
        !state.__renderedTurnKeys.size ||
        state.__renderedTurnKeys.has(turnKey);
      if (allowPreview && sp && Array.isArray(sp.lines) && sp.lines.length) {
        console.log('[zone-preview-restore]', msg.streamPreview?.lines);
        const fp = escapeHtml(String(sp.filePath || '').trim());
        const rows = sp.lines
          .map((it) => {
            const kind = normalizeStreamPreviewKind(it);
            if (!kind) return '';
            const cls = kind === 'add' ? 'add sd-line-add' : kind === 'del' ? 'del sd-line-del' : 'ctx';
            const prefix = kind === 'add' ? '+' : kind === 'del' ? '-' : ' ';
            return `<div class="sd-line ${cls}">${escapeHtml(prefix + ' ' + String(it.text ?? ''))}</div>`;
          })
          .filter(Boolean)
          .join('');
        const box = document.createElement('div');
        box.className = 'livecode livecode-static';
        box.style.marginTop = '10px';
        box.innerHTML = `
          <div class="livecode-h">

          </div>
          <div class="livecode-body"><div class="stream-static-diff">${rows}</div></div>
        `;
        wrap.appendChild(box);
      }
      return wrap;
    }

    function renderRestoredTurnChat(msg){
      const text = String(msg?.chatResponse || msg?.content || msg?.text || '');
      const summary = String(msg?.summary || text).slice(0, 60);
      const ts = Number(msg?.ts || Date.now());
      const wrap = document.createElement('div');
      wrap.className = 'turn-restored';
      wrap.innerHTML = `
        <div class="turn-restored-header">
          <svg class="chevron" viewBox="0 0 10 10" fill="none" aria-hidden="true">
            <path d="M3 4l2 2 2-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="turn-summary">${escapeHtml(summary || '(chat)')}</span>
          <span class="turn-badge chat">Chat</span>
          <span class="turn-meta">${escapeHtml(fmtRelative(ts))}</span>
        </div>
        <div class="turn-restored-body"></div>
      `;
      wrap.querySelector('.turn-restored-header')?.addEventListener('click', (e) => toggleRestored(e.currentTarget));
      const body = wrap.querySelector('.turn-restored-body');
      if (body) body.innerHTML = (!extractTrailingVerificationReason(text) && String(msg?.responseHtml || '').trim()) || renderChatMarkdown(text);
      return wrap;

    function renderActiveThread(){
      clearChat();
      const thread = getActiveThread();
      if (!thread) {
        els.threadTitle.textContent = 'No thread selected';
        setIdleUI();
        return;
      }
      console.log('[render-thread] total turns:', thread.messages?.length, 'rendering last 10');
      console.log('[zone-replay]', thread.messages);
      els.threadTitle.textContent = thread.title || 'Thread';
      if (state.activeRepo?.path !== thread.repoPath) {
        const match = state.repos.find(r => r.path === thread.repoPath);
        if (match) state.activeRepo = match;
      }
      els.repoChipName.textContent = state.activeRepo?.name || thread.repoName || 'Project';

      const wasNear = isNearBottom(els.chatArea);
      hideEmpty();
      // Persistent last-10 history: prefer full HTML run groups when present.
      const allMsgs = Array.isArray(thread.messages) ? thread.messages : [];
      const runGroups = allMsgs.filter((m) => m && typeof m === 'object' && m.type === 'run_group_html' && typeof m.html === 'string');
      const legacyTurns = allMsgs.filter((m) => m && typeof m === 'object' && (m.type === 'result' || m.type === 'assistant' || m.type === 'chat' || m.type === 'chat_response'));
      const turns = runGroups.length ? runGroups : legacyTurns;

      state.__historyShownByThread = state.__historyShownByThread || {};
      const threadId = String(thread.id || state.activeThreadId || '');
      const shown = Number(state.__historyShownByThread[threadId] || 10);
      const showCount = Math.max(10, shown);

      const totalTurns = turns.length;
      const startIdx = Math.max(0, totalTurns - showCount);
      const hasOlder = startIdx > 0;

      // Track which turns are actually rendered so preview restore respects the same window.
      state.__renderedTurnKeys = new Set(
        turns
          .slice(startIdx)
          .map((m) => `result:${String(m?.ts ?? '')}`)
      );

      if (hasOlder) {
        const wrapBtn = document.createElement('div');
        wrapBtn.className = 'load-older';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'Load older conversations';
        btn.addEventListener('click', () => {
          state.__historyShownByThread = state.__historyShownByThread || {};
          state.__historyShownByThread[threadId] = Math.min(totalTurns, showCount + 10);
          renderActiveThread();
        });
        wrapBtn.appendChild(btn);
        els.chatArea.appendChild(wrapBtn);
      }

      turns.slice(startIdx).forEach(m => {
        if (!m || typeof m !== 'object') return;
        if (m.type === 'run_group_html') {
          const rid = String(m.runId || '');
          const g = document.createElement('div');
          g.className = 'run-group restored';
          if (rid) g.id = `runGroup-${rid}`;
          try {
            const st = String(m.status || 'completed');
            g.dataset.runStatus = st;
          } catch {}
          g.innerHTML = String(m.html || '');
          els.chatArea.appendChild(g);
          return;
        }
        // Legacy restore fallback: collapsed cards.
        if (m.type === 'result') {
          const decision = String(m.decisionMode || 'preview_only');
          if (decision === 'chat') els.chatArea.appendChild(renderRestoredTurnChat(m));
          else els.chatArea.appendChild(renderRestoredTurnResult(m));
          return;
        }
        if (m.type === 'assistant' || m.type === 'chat') {
          els.chatArea.appendChild(renderRestoredTurnChat(m));
          return;
        }
        if (m.type === 'chat_response') {
          els.chatArea.appendChild(renderRestoredTurnChat({
            ts: m.ts,
            chatResponse: m.responseText,
            responseHtml: m.responseHtml,
            contextFiles: m.contextFiles,
            summary: String(m.userText || '').slice(0, 80),
          }));
          return;
        }
      });
      applyExecutionViewModeToAll(els.chatArea);
      scrollToBottomIfNear(els.chatArea, wasNear);
      // After rendering thread, refresh interrupted runs and reconnect any run still alive.
      setTimeout(() => { void syncActiveRunUi(); }, 0);
    }

    // ---- SSE + Patch ----
    // thinking block removed (replaced by log-thinking line)

    function openSSE(runId){
      try { console.log('[send-debug] SSE subscription opening for runId=' + String(runId || '')); } catch {}
      try { if (state.eventSource) state.eventSource.close(); } catch {}
      const es = new EventSource(`/api/progress?runId=${encodeURIComponent(runId)}`);
      state.eventSource = es;
      es.onmessage = (e) => {
        let payload = null;
        try { payload = JSON.parse(e.data); } catch { return; }
        try {
          state.__sendDebugByRun = state.__sendDebugByRun || {};
          const meta = state.__sendDebugByRun[runId];
          if (meta && !meta.firstEventLogged) {
            meta.firstEventLogged = true;
            console.log('[send-debug] SSE first event received for runId=' + String(runId || ''), {
              msSinceFetch: meta.fetchStartedAt ? (Date.now() - meta.fetchStartedAt) : null,
              stage: payload?.stage || null,
              progressType: payload?.progress?.type || null,
            });
          }
        } catch {}
        handleSSEPayload(payload, runId);
      };
      es.onerror = () => { try { es.close(); } catch {} };
    }

    function openReplaySSE(runId){
      try { if (state.eventSource) state.eventSource.close(); } catch {}
      const es = new EventSource(`/api/run-replay/${encodeURIComponent(runId)}`);
      state.eventSource = es;
      es.onmessage = (e) => {
        let payload = null;
        try { payload = JSON.parse(e.data); } catch { return; }
        handleSSEPayload(payload, runId);
      };
      es.onerror = () => { try { es.close(); } catch {} };
    }

    async function fetchActiveRunsForCurrentUser(){
      const userId = getCurrentUserId();
      state.__activeRunsById = state.__activeRunsById || {};
      const url = userId
        ? `/api/active-runs?userId=${encodeURIComponent(userId)}`
        : '/api/active-runs';
      try { console.log('[resume-debug] active-runs request', { url, stateUserId: state.userId, effectiveUserId: userId }); } catch {}
      if (!userId) {
        try { console.log('[resume-debug] active-runs request skipped because effectiveUserId is empty'); } catch {}
      }
      try {
        const res = await fetch(url);
        const runs = res.ok ? await res.json() : [];
        try { console.log('[resume-debug] /api/active-runs response', { ok: res.ok, runs }); } catch {}
        const next = {};
        if (Array.isArray(runs)) {
          runs.forEach((run) => {
            const rid = String(run?.runId || '').trim();
            if (!rid) return;
            next[rid] = run;
          });
        }
        state.__activeRunsById = next;
        return next;
      } catch {
        return state.__activeRunsById;
      }
    }

    function getRunTaskText(runId){

    async function resumeInterruptedRun(runId){
      if (state.isRunning) {
        els.chatArea.appendChild(createToast('error', 'Wait for the current run to finish before resuming another one.'));
        scrollChatIfFollowing();
        return;
      }
      const rid = String(runId || '').trim();
      if (!rid) return;
      const activeRun = state.__activeRunsById && state.__activeRunsById[rid]
        ? state.__activeRunsById[rid]
        : null;
      const taskText = getRunTaskText(rid);
      if (!taskText) {
        els.chatArea.appendChild(createToast('error', 'Could not find the original task to resume.'));
        scrollChatIfFollowing();
        return;
      }
      try { console.log('[resume-debug] resume click', { runId: rid, taskText }); } catch {}
      if (activeRun) {
        state.__lastChangedFiles = Array.isArray(activeRun.lastChangedFiles)
          ? activeRun.lastChangedFiles.slice(0, 20)
          : [];
        state.__lastAddedFunctions = Array.isArray(activeRun.lastAddedFunctions)
          ? activeRun.lastAddedFunctions.slice(0, 20)
          : [];
      }
      markRunGroupResumed(rid);
      await sendMessage(taskText);
    }

    function setResumeButton(runId){

    function setResumeBadge(runId, kind, text){

      b.classList.add(kind);
