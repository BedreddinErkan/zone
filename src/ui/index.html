    /**
     * ZoneDropdown — reusable custom <select> replacement (Tur 5a-polish).
     * Replaces native <select> in the footer with a Zone-themed dropdown.
     * Plan-named methods: setOptions, setValue, open, close.
     * Listbox semantics: aria-haspopup, aria-expanded, role="option", aria-selected.
     */
    class ZoneDropdown {
      constructor(rootEl, { onSelect, defaultLabel } = {}){
        this.root = rootEl;
        this.trigger = rootEl.querySelector('.zone-dropdown-trigger');
        this.label = rootEl.querySelector('.zone-dropdown-label');
        this.panel = rootEl.querySelector('.zone-dropdown-panel');
        this.onSelect = onSelect || (() => {});
        this.defaultLabel = defaultLabel || '—';
        this.options = [];
        this.value = null;
        this.isOpen = false;
        this.activeIndex = -1;
        this._outsideClickHandler = (e) => {
          if (!this.root.contains(e.target)) this.close();
        };
        this._keyboardHandler = (e) => {
          if (!this.isOpen) return;
          if (e.key === 'Escape'){
            e.preventDefault();
            this.close();
            this.trigger.focus();
            return;
          }
          if (e.key === 'ArrowDown'){
            e.preventDefault();
            this._moveActive(1);
            return;
          }
          if (e.key === 'ArrowUp'){
            e.preventDefault();
            this._moveActive(-1);
            return;
          }
          if (e.key === 'Enter' || e.key === ' '){
            if (this.activeIndex >= 0 && this.activeIndex < this.options.length){
              e.preventDefault();
              const opt = this.options[this.activeIndex];
              this._select(opt.value);
            }
          }
        };
        this._bind();
      }
      _bind(){
        this.trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          this.isOpen ? this.close() : this.open();
        });
        this.trigger.addEventListener('keydown', (e) => {
          if (!this.isOpen && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown')){
            e.preventDefault();
            this.open();
          }
        });
      }
      setOptions(options){
        this.options = Array.isArray(options) ? options.slice() : [];
        this._renderOptions();
        this._renderLabel();
      }
      setValue(value){
        this.value = (value == null ? '' : String(value));
        this._renderOptions();
        this._renderLabel();
      }
      open(){
        if (this.isOpen) return;
        this.isOpen = true;
        this.panel.hidden = false;
        // Force layout flush before adding the visible class so the transition runs.
        // eslint-disable-next-line no-unused-expressions
        this.panel.offsetHeight;
        this.panel.classList.add('is-open');
        this.trigger.setAttribute('aria-expanded', 'true');
        this.activeIndex = Math.max(0, this.options.findIndex((o) => o.value === this.value));
        this._renderActive();
        document.addEventListener('mousedown', this._outsideClickHandler);
        document.addEventListener('keydown', this._keyboardHandler);
      }
      close(){
        if (!this.isOpen) return;
        this.isOpen = false;
        this.panel.classList.remove('is-open');
        this.trigger.setAttribute('aria-expanded', 'false');
        // Hide after the close transition so screen readers / pointer-events stop seeing it.
        setTimeout(() => { if (!this.isOpen) this.panel.hidden = true; }, 160);
        document.removeEventListener('mousedown', this._outsideClickHandler);
        document.removeEventListener('keydown', this._keyboardHandler);
      }
      setDisabled(disabled, tooltip){
        this.trigger.disabled = !!disabled;
        this.trigger.title = disabled ? (tooltip || '') : '';
        if (disabled) this.close();
      }
      _moveActive(delta){
        if (!this.options.length) return;
        const n = this.options.length;
        this.activeIndex = ((this.activeIndex + delta) % n + n) % n;
        this._renderActive();
      }
      _renderActive(){
        const els = this.panel.querySelectorAll('.zone-dropdown-option');
        els.forEach((el, i) => {
          if (i === this.activeIndex) el.classList.add('is-active');
          else el.classList.remove('is-active');
        });
        if (this.activeIndex >= 0 && els[this.activeIndex]){
          els[this.activeIndex].scrollIntoView({ block: 'nearest' });
        }
      }
      _renderLabel(){
        const opt = this.options.find((o) => o.value === this.value);
        const text = opt ? opt.label : this.defaultLabel;
        this.label.textContent = text;
        this.label.title = text;
      }
      _renderOptions(){
        const html = [];
        for (const opt of this.options){
          const selected = opt.value === this.value ? 'true' : 'false';
          const costAttr = (opt.costNote || opt.workerSuitable === false) ? ' data-cost-warning="true"' : '';
          const titleAttr = opt.workerSuitable === false && opt.workerSuitabilityNote ? ` title="${escapeHtml(opt.workerSuitabilityNote)}"` : '';
          html.push(
            `<div class="zone-dropdown-option" role="option" aria-selected="${selected}" data-value="${escapeHtml(opt.value)}"${costAttr}${titleAttr}>` +
              `<span class="zone-dropdown-option-label">${escapeHtml(opt.label)}</span>` +
              `<span class="zone-dropdown-option-icons">` +
                `<svg class="zone-dropdown-option-warning" viewBox="0 0 12 12" aria-hidden="true">` +
                  `<path d="M6 1.5 L11 10.5 L1 10.5 Z" stroke="currentColor" stroke-width="1" fill="none" stroke-linejoin="round"/>` +
                  `<path d="M6 5 L6 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>` +
                  `<circle cx="6" cy="9.4" r="0.6" fill="currentColor"/>` +
                `</svg>` +
                `<svg class="zone-dropdown-option-check" viewBox="0 0 12 12" aria-hidden="true">` +
                  `<path d="M2 6 L5 9 L10 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` +
                `</svg>` +
              `</span>` +
            `</div>`
          );
        }
        this.panel.innerHTML = html.join('');
        this.panel.querySelectorAll('.zone-dropdown-option').forEach((el) => {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            this._select(el.dataset.value || '');
          });
          el.addEventListener('mouseenter', () => {
            const idx = Array.prototype.indexOf.call(this.panel.children, el);
            if (idx >= 0){
              this.activeIndex = idx;
              this._renderActive();
            }
          });
        });
      }
      _select(value){
        this.setValue(value);
        this.close();
        try { this.onSelect(value); } catch {}
      }
    }

    // ── Model preset helpers ──────────────────────────────────────────────────
    const LS_MODEL_PRESET = 'zone.modelPreset';
    const PRESET_MODELS = {
      anthropic: {
        zone_default: {},
        speed: { high: 'claude-haiku-4-5', standard: 'claude-haiku-4-5' },
        quality: { high: 'claude-sonnet-4-6', standard: 'claude-sonnet-4-6' },
      },
      openai: {
        zone_default: {},
        speed: { high: 'gpt-5.4-mini', standard: 'gpt-5.4-mini' },
        quality: { high: 'gpt-5.4', standard: 'gpt-5.4' },
      },
    };
    function getActivePreset(){
      try {
        const raw = localStorage.getItem(LS_MODEL_PRESET) || '{}';
        const parsed = JSON.parse(raw);
        return (parsed && typeof parsed.preset === 'string') ? parsed.preset : 'zone_default';
      } catch { return 'zone_default'; }
    }
    function setActivePreset(preset){
      try {
        const raw = localStorage.getItem(LS_MODEL_PRESET) || '{}';
        const current = JSON.parse(raw);
        localStorage.setItem(LS_MODEL_PRESET, JSON.stringify({ ...current, preset }));
      } catch {}
      updatePresetBadge();
    }
    function getPresetTierModels(provider, preset){
      const table = PRESET_MODELS[provider] || PRESET_MODELS.openai;
      if (preset === 'custom') return getActiveModels()[provider] || {};
      return table[preset] || {};
    }

    const PRESET_BADGE_LABELS = {
      zone_default: '⚖ Default',
      speed: '⚡ Speed',
      quality: '★ Quality',
      custom: '⚙ Custom',
    };
    function getPresetBadgeLabel(preset, provider){
      if (preset !== 'custom') return PRESET_BADGE_LABELS[preset] || '⚖ Default';
      // For Custom, show the effective models
      const models = getActiveModels()[provider] || {};
      const catalog = ZONE_MODEL_CATALOG[provider] || [];
      function shortLabel(id){ const m = catalog.find(c => c.id === id); return m ? m.label.replace('Claude ','').replace('GPT-','') : (id || 'default'); }
      if (models.high || models.standard) {
        return '⚙ ' + shortLabel(models.high) + (models.standard && models.standard !== models.high ? '/' + shortLabel(models.standard) : '');
      }
      return '⚙ Custom';
    }
    function updatePresetBadge(){
      const badge = document.getElementById('modelPresetBadge');
      if (!badge) return;
      const preset = getActivePreset();
      const provider = getActiveProvider();
      badge.textContent = getPresetBadgeLabel(preset, provider);
      badge.style.display = 'inline-flex';
    }

    function buildAuthHeaders(){
      const provider = getActiveProvider();
      const key = getActiveApiKey();
      const headers = { 'X-Zone-Provider': provider };
      if (key) headers['X-Zone-LLM-Key'] = key;
      const preset = getActivePreset();
      const models = getPresetTierModels(provider, preset);
      if (models.high) headers['X-Zone-LLM-Model-High'] = models.high;
      if (models.standard) headers['X-Zone-LLM-Model-Standard'] = models.standard;
      return headers;
    }
    function migrateLegacyApiKey(){
      let legacyKey = '';
      try { legacyKey = localStorage.getItem('zoneOpenAIApiKey') || ''; } catch {}
      if (!legacyKey) return;
      const trimmed = legacyKey.trim();
      const keys = getApiKeys();
      if (!keys.openai && trimmed) {
        keys.openai = trimmed;
        try { localStorage.setItem('zoneApiKeys', JSON.stringify(keys)); } catch {}
      }
      try {
        if (!localStorage.getItem('zoneActiveProvider')) {
          localStorage.setItem('zoneActiveProvider', 'openai');
        }
      } catch {}
      try { localStorage.removeItem('zoneOpenAIApiKey'); } catch {}
      try { console.log('[zone] migrated legacy zoneOpenAIApiKey → zoneApiKeys.openai'); } catch {}
    }
    migrateLegacyApiKey();
    // Migrate legacy model picker selections to 'custom' preset on first load.
    (function migrateLegacyModelPicker(){
      try {
        if (localStorage.getItem(LS_MODEL_PRESET)) return; // preset already set
        const activeModels = getActiveModels();
        const hasAnyModel = Object.values(activeModels).some(v => v && typeof v === 'object' && (v.high || v.standard));
        if (hasAnyModel) {
          localStorage.setItem(LS_MODEL_PRESET, JSON.stringify({ preset: 'custom' }));
        }
      } catch {}
    })();
    initFooterPickers();
    // Wire preset badge click → open Settings Model tab
    (function initPresetBadge(){
      updatePresetBadge();
      const badge = document.getElementById('modelPresetBadge');
      if (badge) {
        badge.addEventListener('click', () => openSettings('model'));
      }
    })();

    // ---- Repo management ----
    function ensureRepos(){
      state.repos = normalizeRepoList(state.repos);
      window.ZONE_REPOS = state.repos;
      if (!state.repos.length) {
        state.repos = [];
        state.activeRepo = null;
        els.repoChipName.textContent = 'No project';
        updateFooterModelLabel();
        fetchBranchList();
        return;
      }
      if (!state.activeRepo) state.activeRepo = state.repos[0];
      else {
        const match = state.repos.find((r) => String(r.path || '') === String(state.activeRepo?.path || ''));
        state.activeRepo = match || normalizeRepoRecord(state.activeRepo) || state.repos[0];
      }
      els.repoChipName.textContent = state.activeRepo?.name || 'Project';
      updateFooterModelLabel();
      fetchBranchList();
    }

    function cycleRepo(){
      if (!state.repos.length) return;
      const idx = Math.max(0, state.repos.findIndex(r => r.path === state.activeRepo?.path));
      const next = state.repos[(idx + 1) % state.repos.length];
      state.activeRepo = next;
      els.repoChipName.textContent = state.activeRepo.name;
      fetchBranchList();
    }

    // ---- Branch management ----
    // In Tauri, route through local Rust commands (git CLI on the user's
    // machine). In browser, fall back to the hosted /api/branches endpoints.
    async function branchApiList(repoPath){
      if (isTauriRuntime()) {
        const core = getTauriCore();
        if (core?.invoke) {
          return await core.invoke('list_git_branches', { repo: repoPath });
        }
      }
      const res = await apiFetch('/api/branches?repo=' + encodeURIComponent(repoPath));
      return res.ok ? await res.json() : { current: null, detached: false, branches: [] };
    }

    async function branchApiSwitch(repoPath, branch){
      if (isTauriRuntime()) {
        const core = getTauriCore();
        if (core?.invoke) {
          return await core.invoke('switch_git_branch', { repo: repoPath, branch });
        }
      }
      const res = await apiFetch('/api/branches/switch', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ repo: repoPath, branch }),
      });
      return await res.json();
    }

    async function fetchBranchList(){
      if (!state.activeRepo?.path) {
        state.activeBranch = null;
        state.branchList = [];
        renderBranchChip();
        return;
      }
      state.branchLoading = true;
      renderBranchChip();
      try {
        const data = await branchApiList(state.activeRepo.path);
        state.activeBranch = data?.current ?? null;
        state.branchList = Array.isArray(data?.branches) ? data.branches : [];  // BranchInfo[]
      } catch (err) {
        state.activeBranch = null;
        state.branchList = [];
      } finally {
        state.branchLoading = false;
        renderBranchChip();
      }
    }

    function renderBranchChip(){
      if (!els.branchChip) return;
      const hasRepo = !!state.activeRepo?.path;
      const hasBranch = hasRepo && state.activeBranch !== null;
      els.branchChip.style.display = hasRepo ? 'inline-flex' : 'none';
      els.branchChipName.textContent = state.branchLoading
        ? '…'
        : (hasBranch ? state.activeBranch : '(no git)');
      els.branchChip.classList.toggle('disabled', !!state.isRunning || !hasBranch);
    }

    function positionBranchDropdown(){
      const rect = els.branchChip.getBoundingClientRect();
      const dd = els.branchDropdown;
      dd.style.left = rect.left + 'px';
      dd.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
      dd.style.top = 'auto';
      dd.style.minWidth = Math.max(180, rect.width) + 'px';
      dd.style.setProperty('width', 'max-content', 'important');
      dd.style.setProperty('max-width', '400px', 'important');
    }

    function openBranchDropdown(){
      if (state.isRunning) return;
      if (!state.activeRepo?.path || state.activeBranch === null) return;
      state.branchDropdownOpen = true;
      renderBranchDropdown();
      els.branchDropdown.classList.add('open');
      positionBranchDropdown();
      fetchBranchList().then(() => {
        if (state.branchDropdownOpen) {
          renderBranchDropdown();
          positionBranchDropdown();
        }
      });
    }

    function closeBranchDropdown(){
      state.branchDropdownOpen = false;
      els.branchDropdown.classList.remove('open');
      els.branchDropdown.innerHTML = '';
    }

    function renderBranchDropdown(){
      if (!els.branchDropdown) return;
      const dd = els.branchDropdown;
      const html = [];
      for (const b of state.branchList) {
        // b is BranchInfo: { name, current, checkedOutAt }
        const name = typeof b === 'string' ? b : b.name;
        const checkedOutAt = (b && typeof b === 'object') ? (b.checkedOutAt || null) : null;
        const isCurrent = name === state.activeBranch;
        const inUse = !isCurrent && !!checkedOutAt;
        const safe = String(name).replace(/[<>"']/g, c => ({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const safeWt = checkedOutAt ? String(checkedOutAt).replace(/[<>"']/g, c => ({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) : '';
        html.push(
          '<div class="branchDropdownItem ' + (isCurrent ? 'current' : '') + (inUse ? ' in-use-worktree' : '') + '"' +
            ' data-branch="' + safe + '"' +
            (inUse ? ' title="In use by worktree: ' + safeWt + '"' : '') +
          '>' +
            (isCurrent ? '✓ ' : '&nbsp;&nbsp;') + safe +
            (inUse ? ' <span style="opacity:.5;font-size:10px">(worktree)</span>' : '') +
          '</div>'
        );
      }
      dd.innerHTML = html.join('');

      dd.querySelectorAll('.branchDropdownItem').forEach(item => {
        if (item.classList.contains('in-use-worktree')) return; // no-op
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const branch = item.dataset.branch;
          if (branch && branch !== state.activeBranch) {
            doSwitchBranch(branch);
          } else {
            closeBranchDropdown();
          }
        });
      });
    }

    async function doSwitchBranch(branch){
      closeBranchDropdown();
      if (!state.activeRepo?.path) return;
      try {
        const data = await branchApiSwitch(state.activeRepo.path, branch);
        if (data && data.ok) {
          state.activeBranch = branch;
          renderBranchChip();
        } else {
          let msg = 'Failed to switch branch';
          if (data?.error === 'uncommitted_changes') {
            const n = Array.isArray(data.dirtyFiles) ? data.dirtyFiles.length : 0;
            msg = 'Cannot switch: uncommitted changes' + (n > 0 ? ' in ' + n + ' file' + (n === 1 ? '' : 's') : '');
          } else if (data?.error === 'in_use_by_worktree') {
            msg = 'Branch is checked out in another worktree' + (data.worktreePath ? ': ' + data.worktreePath : '');
          } else if (data?.error === 'not_found') {
            msg = 'Branch not found: ' + branch;
          } else if (data?.message) {
            msg = data.message;
          }
          showToast('error', msg, 3500);
        }
      } catch (err) {
        showToast('error', 'Network error switching branch: ' + (err.message || err), 3000);
      }
    }

    function openNewThreadDropdown(){
      els.newThreadDropdown.classList.toggle('open');
      els.filterBtn.classList.remove('active');
    }

    function closeNewThreadDropdown(){
      els.newThreadDropdown.classList.remove('open');

      state.__addingProjectMode = '';
      state.__addingProjectValue = '';
    }

    function renderRepoDropdown(){
      state.repos = normalizeRepoList(state.repos);
      els.repoDropdownList.innerHTML = '';
      state.repos.forEach((r) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'repo-row';
        row.innerHTML = `
          <span class="dot"></span>
          <span class="repo-meta">
            <div class="repo-title">${escapeHtml(r.name || 'Project')}</div>
            <div class="repo-path">${escapeHtml(r.path || '')}</div>

        `;
        if (!r.isDefault) {
          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'repo-remove-btn';
          removeBtn.textContent = '✕';
          removeBtn.title = 'Remove project';
          removeBtn.setAttribute('aria-label', 'Remove ' + (r.name || 'project'));
          removeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            state.repos = (Array.isArray(state.repos) ? state.repos : []).filter(rr => rr.path !== r.path);
            window.ZONE_REPOS = state.repos;
            try { localStorage.setItem(LS_REPOS, JSON.stringify(state.repos)); } catch {}
            if (r.id) apiFetch('/api/repos/' + encodeURIComponent(r.id), { method: 'DELETE' }).catch(() => {});
            if (state.activeRepo && state.activeRepo.path === r.path) {
              state.activeRepo = state.repos[0] || null;
              els.repoChipName.textContent = state.activeRepo?.name || 'No project';
            }
            renderRepoDropdown();
          });
          row.appendChild(removeBtn);
        }
        row.addEventListener('click', () => {
          state.activeRepo = r;
          closeNewThreadDropdown();
          createNewThreadForRepo(r);
        });
        els.repoDropdownList.appendChild(row);
      });

      // separator + add project row / inline form
      const sep = document.createElement('div');
      sep.className = 'repo-sep';
      els.repoDropdownList.appendChild(sep);

      if (state.__addingProject && state.__addingProjectMode === 'manual') {
        const wrap = document.createElement('div');
        wrap.className = 'repo-form';

        // Browse button — calls backend native folder picker, pre-fills input
        const browseBtn = document.createElement('button');
        browseBtn.type = 'button';
        browseBtn.className = 'browsebtn';
        browseBtn.textContent = 'Browse…';
        browseBtn.title = 'Open system folder picker';

        const labelInput = document.createElement('input');
        labelInput.type = 'text';
        labelInput.placeholder = 'Label  e.g. zone-api-dogfood';
        labelInput.className = 'repo-form-label';
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Project path  e.g. C:\\Users\\...';
        input.value = state.__addingProjectValue || '';
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'addbtn';
        addBtn.textContent = 'Add';

        function cancelAdd(){
          state.__addingProject = false;
          state.__addingProjectMode = '';
          state.__addingProjectValue = '';
          renderRepoDropdown();
        }

        function doAdd(){
          console.log('[zone-add-repo] click handler fired');
          const raw = String(input.value || '').trim();
          console.log('[zone-add-repo] input value:', raw);

          // Validate: must be a non-empty absolute path
          const valid = raw.length > 0 && /^([A-Za-z]:[/\\]|\/)/i.test(raw);
          console.log('[zone-add-repo] validation result:', valid);
          if (!valid) {
            let errEl = wrap.querySelector('.repo-form-error');
            if (!errEl) {
              errEl = document.createElement('div');
              errEl.className = 'repo-form-error';
              wrap.appendChild(errEl);
            }
            errEl.textContent = raw.length === 0
              ? 'Please enter a path'
              : 'Please provide a valid absolute path (e.g. C:\\Users\\... or /home/...)';
            input.focus();
            return;
          }

          // Duplicate detection — just select the existing project
          state.repos = Array.isArray(state.repos) ? state.repos : [];
          const existing = state.repos.find(r => String(r.path || '') === raw);
          if (existing) {
            console.log('[zone-add-repo] duplicate — selecting existing project');
            state.activeRepo = existing;
            state.__addingProject = false;
            state.__addingProjectMode = '';
            state.__addingProjectValue = '';
            closeNewThreadDropdown();
            ensureRepos();
            createNewThreadForRepo(existing);
            return;
          }

          const customLabel = String(labelInput.value || '').trim() || null;
          const project = normalizeRepoRecord({ id: crypto.randomUUID(), path: raw, name: customLabel || undefined, createdAt: Date.now() });
          if (!project) return;
          state.repos.push(project);
          state.activeRepo = project;
          window.ZONE_REPOS = state.repos;

          // Persist — zone_repos only going forward
          console.log('[zone-add-repo] saving to localStorage');
          try { localStorage.setItem(LS_REPOS, JSON.stringify(state.repos)); } catch {}

          // Sync to backend (fire-and-forget)
          apiFetch('/api/repos', { method: 'POST', body: JSON.stringify({ label: project.name, path: raw }), headers: { 'Content-Type': 'application/json' } }).catch(() => {});

          state.__addingProject = false;
          state.__addingProjectMode = '';
          state.__addingProjectValue = '';
          closeNewThreadDropdown();
          ensureRepos();
          console.log('[zone-add-repo] state updated, triggering re-render');
          // Create a new thread so the project appears in the sidebar immediately.
          createNewThreadForRepo(project);
        }

        browseBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          browseBtn.textContent = '…';
          browseBtn.disabled = true;
          try {
            // Tauri runtime: use the native dialog plugin directly. The
            // hosted /api/browse-folder route would resolve against the
            // Render BE which has no access to the user's local fs.
            if (isTauriRuntime()) {
              const selectedPath = await selectTauriDirectory();
              console.log('[zone-add-repo] tauri picker returned:', JSON.stringify(selectedPath));
              if (selectedPath) {
                input.value = selectedPath;
                state.__addingProjectValue = selectedPath;
                const old = wrap.querySelector('.repo-form-error');
                if (old) old.remove();
                input.focus();
                input.setSelectionRange(input.value.length, input.value.length);
              } else {
                console.warn('[zone-add-repo] empty path, picker probably failed silently');
              }
              return;
            }
            const r = await apiFetch('/api/browse-folder', { method: 'POST' });
            const data = await r.json();
            if (data.ok && data.path) {
              input.value = data.path;
              state.__addingProjectValue = data.path;
              const old = wrap.querySelector('.repo-form-error');
              if (old) old.remove();
              input.focus();
              input.setSelectionRange(input.value.length, input.value.length);
            } else if (!data.cancelled) {
              // API responded but picker unavailable on this platform.
              let errEl = wrap.querySelector('.repo-form-error');
              if (!errEl) { errEl = document.createElement('div'); errEl.className = 'repo-form-error'; wrap.appendChild(errEl); }
              errEl.textContent = data.error || 'Folder picker unavailable — please type the path below';
              input.focus();
            }
            // data.cancelled → user closed dialog, do nothing
          } catch {
            let errEl = wrap.querySelector('.repo-form-error');
            if (!errEl) { errEl = document.createElement('div'); errEl.className = 'repo-form-error'; wrap.appendChild(errEl); }
            errEl.textContent = 'Folder picker unavailable — please type the path below';
            input.focus();
          } finally {
            browseBtn.textContent = 'Browse…';
            browseBtn.disabled = false;
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') { e.preventDefault(); cancelAdd(); }
          if (e.key === 'Enter') { e.preventDefault(); doAdd(); }
        });
        labelInput.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') { e.preventDefault(); cancelAdd(); }
          if (e.key === 'Enter') { e.preventDefault(); doAdd(); }
        });
        input.addEventListener('input', () => { state.__addingProjectValue = input.value; });
        addBtn.addEventListener('click', doAdd);

        wrap.appendChild(browseBtn);
        wrap.appendChild(labelInput);
        wrap.appendChild(input);
        wrap.appendChild(addBtn);
        els.repoDropdownList.appendChild(wrap);
        setTimeout(() => { if (!input.value) browseBtn.focus(); else input.focus(); }, 0);
      } else {
        const addRow = document.createElement('button');
        addRow.type = 'button';
        addRow.className = 'repo-row add';
        addRow.innerHTML = `
          <span class="dot"></span>
          <span class="repo-meta">
            <div class="repo-title">+ Add custom path…</div>
            <div class="repo-path">Add a git worktree or custom project path</div>
          </span>
        `;
        addRow.addEventListener('click', (e) => {
          e.stopPropagation();
          state.__addingProject = true;
          state.__addingProjectMode = 'manual';
          state.__addingProjectValue = '';
          renderRepoDropdown();
        });
        els.repoDropdownList.appendChild(addRow);
      }
    }

    function createNewThreadForRepo(repo){
      const normalizedRepo = normalizeRepoRecord(repo);
      if (!normalizedRepo) return;
      const thread = {
        id: crypto.randomUUID(),
        repoPath: normalizedRepo.path,
        repoName: normalizedRepo.name,
        title: `New thread for ${normalizedRepo.name}`,
        messages: [],
        createdAt: Date.now()
      };
      state.activeRepo = normalizedRepo;
      fetchBranchList();
      state.threads.unshift(thread);
      state.activeThreadId = thread.id;
      saveThreads();
      renderSidebar();
      renderActiveThread();
      // Multi-active-thread Phase 1a: hide stale sticky band from another thread.
      if (typeof applyStickyBandForActiveThread === 'function') applyStickyBandForActiveThread();
      focusInputSoon();
    }

    function activateThread(threadId){
      // Phase 1b: thread isolation via real per-thread chat containers.
      // Switching threads is now a visibility toggle — no innerHTML
      // rebuild, no snapshot/buffer hack. In-flight runs in other threads
      // stay live in their (hidden) containers and resume visibility on
      // return with their full timeline intact.
      if (threadId === state.activeThreadId) {
        // Same-thread click — just refresh sidebar selection state.
        renderSidebar();
        return;
      }
      state.activeThreadId = threadId;
      try { localStorage.setItem('zone_active_thread_id', state.activeThreadId); } catch {}
      renderSidebar();
      renderActiveThread();
      refreshSidebarRunningStates();
      applyStickyBandForActiveThread();
      // Phase 1b: refresh per-thread queue panel + placeholder for the
      // newly-active thread (each thread has its own queue).
      try { renderQueuePanel(); } catch {}
      updateInputPlaceholder();
      renderTodoSidebar();
    }

    function renderStaticDiffCard(fileDiff, decisionMode, applied, blockedMessage){

    // ────────────────────────────────────────────────────────────────────
    // Zone Background-process aggregated card (read-only).
    // One card per runId, one row per handle. Re-renders on every relevant
    // tool event. Uptime ticks once per second per run.
    //
    // Pairing model: the backend tool_result event does NOT carry the
    // toolName; it only carries `detail` (the JSON-stringified result).
    // We mirror the existing summary.pendingTool pattern — when a bg
    // tool_call arrives we store {kind, target} in __bgPendingByRun, then
    // consume it when the immediately-following tool_result arrives.
    // Read/kill/list don't carry the handle in their result JSON, so we
    // attribute them to the most-recently-active running handle (correct
    // for the typical concurrency cap=3 case; agent multi-bg still gets a
    // best-effort attribution).
    // ────────────────────────────────────────────────────────────────────

    function bgUptimeFmt(ms){
      const s = Math.max(0, Math.floor(ms / 1000));
      if (s < 60) return s + 's';
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m + 'm ' + r + 's';
    }

    function bgFirstNonEmptyLine(text){
      const s = String(text || '');
      const lines = s.split(/\r?\n/);
      for (const raw of lines){
        const line = raw.trim();
        if (line) return line.length > 80 ? line.slice(0, 79) + '…' : line;
      }
      return '';
    }

    function bgEnsureRunState(runId){
      state.bgProcessesByRun = state.bgProcessesByRun || {};
      state.__bgPendingByRun = state.__bgPendingByRun || {};
      state.__bgLastHandleByRun = state.__bgLastHandleByRun || {};
      state.__bgUptimeTicksByRun = state.__bgUptimeTicksByRun || {};
      if (!state.bgProcessesByRun[runId]) state.bgProcessesByRun[runId] = new Map();
      return state.bgProcessesByRun[runId];
    }

    function bgRunningCount(runId){
      const map = state.bgProcessesByRun?.[runId];
      if (!map) return 0;
      let n = 0;
      for (const p of map.values()) if (p.status === 'running') n += 1;
      return n;
    }

    function bgEnsureUptimeTick(runId){
      if (state.__bgUptimeTicksByRun[runId]) return;
      state.__bgUptimeTicksByRun[runId] = setInterval(() => {
        if (bgRunningCount(runId) === 0){
          bgClearUptimeTick(runId);
          renderBgCard(runId); // final paint with header parenthetical hidden
          return;
        }
        renderBgCard(runId);
      }, 1000);
    }

    function bgClearUptimeTick(runId){
      const t = state.__bgUptimeTicksByRun?.[runId];
      if (t){
        try { clearInterval(t); } catch {}
        delete state.__bgUptimeTicksByRun[runId];
      }
    }

    function bgIsBgToolCallTitle(title){
      const s = String(title || '');
      // Match either bare-name form or "Spawning background:" onProgress form.
      if (/^\[tool\]\s*(run_command_background|read_background_output|kill_background|list_background)\b/i.test(s)) return true;
      if (/^\[tool\]\s*Spawning background:/i.test(s)) return true;
      return false;
    }

    function bgClassifyToolCall(title){
      const s = String(title || '');
      if (/^\[tool\]\s*Spawning background:\s*(.*)$/i.test(s)){
        const m = s.match(/^\[tool\]\s*Spawning background:\s*(.*)$/i);
        return { kind: 'start', command: (m && m[1] ? m[1] : '').trim() };
      }
      if (/^\[tool\]\s*run_command_background\b/i.test(s)) return { kind: 'start' };
      if (/^\[tool\]\s*read_background_output\b/i.test(s)) return { kind: 'read' };
      if (/^\[tool\]\s*kill_background\b/i.test(s)) return { kind: 'kill' };
      if (/^\[tool\]\s*list_background\b/i.test(s)) return { kind: 'list' };
      return null;
    }

    function handleBgToolCall(runId, title){
      const cls = bgClassifyToolCall(title);
      if (!cls) return false;
      bgEnsureRunState(runId);
      const prev = state.__bgPendingByRun[runId] || null;
      // Two tool_call events fire per run_command_background (bare-name +
      // Spawning background). Keep the command from whichever arrived second.
      if (cls.kind === 'start'){
        const merged = {
          kind: 'start',
          command: cls.command || (prev && prev.kind === 'start' ? prev.command : ''),
        };
        state.__bgPendingByRun[runId] = merged;
      } else {
        state.__bgPendingByRun[runId] = cls;
      }
      return true;
    }

    function handleBgToolResult(runId, detailText, status){
      const pending = state.__bgPendingByRun?.[runId];
      if (!pending) return false;
      delete state.__bgPendingByRun[runId];
      const map = bgEnsureRunState(runId);
      let parsed = null;
      try { parsed = detailText ? JSON.parse(String(detailText)) : null; } catch { parsed = null; }

      if (pending.kind === 'start'){
        if (status !== 'success' || !parsed || typeof parsed.handle !== 'string'){
          // Failed start (approval rejected, blocked, or non-JSON). Don't render.
          return true;
        }
        const handle = parsed.handle;
        const command = String(pending.command || '');
        const label = command ? null : null; // backend label only known via args; agent passes label but UI doesn't see args
        const proc = {
          handle,
          label,
          command,
          startedAt: Date.now(),
          endedAt: null,
          status: 'running',
          exitCode: null,
          lastOutputPreview: null,
          totalReads: 0,
        };
        map.set(handle, proc);
        state.__bgLastHandleByRun[runId] = handle;
        bgEnsureUptimeTick(runId);
        renderBgCard(runId);
        return true;
      }

      if (pending.kind === 'read'){
        const handle = state.__bgLastHandleByRun?.[runId];
        const proc = handle ? map.get(handle) : null;
        if (!proc) return true;
        proc.totalReads += 1;
        if (parsed && typeof parsed.output === 'string'){
          const line = bgFirstNonEmptyLine(parsed.output);
          if (line) proc.lastOutputPreview = line;
        }
        if (parsed && parsed.eof === true && proc.status === 'running'){
          proc.status = 'exited';
          proc.endedAt = Date.now();
          proc.exitCode = (typeof parsed.exit_code === 'number') ? parsed.exit_code : null;
        }
        renderBgCard(runId);
        return true;
      }

      if (pending.kind === 'kill'){
        const handle = state.__bgLastHandleByRun?.[runId];
        const proc = handle ? map.get(handle) : null;
        if (!proc) return true;
        if (proc.status === 'running'){
          proc.status = 'killed';
          proc.endedAt = Date.now();
        }
        if (parsed && typeof parsed.exit_code === 'number') proc.exitCode = parsed.exit_code;
        renderBgCard(runId);
        return true;
      }

      if (pending.kind === 'list'){
        // Refresh known handles' status from the list payload.
        if (parsed && Array.isArray(parsed.processes)){
          for (const p of parsed.processes){
            const proc = map.get(p?.handle);
            if (!proc) continue;
            if (p.eof === true && proc.status === 'running'){
              proc.status = 'exited';
              proc.endedAt = Date.now();
              proc.exitCode = (typeof p.exit_code === 'number') ? p.exit_code : null;
            }
          }
          renderBgCard(runId);
        }
        return true;
      }
      return true;
    }

    function bgIsActiveRun(runId){
      // Multi-active-thread Phase 1a: visible only when the active thread
      // owns this runId. Reads from per-thread state directly so it stays
      // correct when (Phase 1b) multiple threads can have concurrent runs.
      if (!runId) return false;
      const activeRun = getActiveRun();
      return !!(activeRun && String(activeRun.runId) === String(runId));
    }

    function bgResolveStickyHost(){
      return document.getElementById('zoneBgStickyContainer')
          || null;
    }

    function bgBuildRow(p){
      const row = document.createElement('div');
      row.className = 'zone-bg-row';
      if (p.status === 'running') row.classList.add('zone-bg-row-running');

      const glyph = document.createElement('div');
      glyph.className = 'zone-bg-row-glyph';
      glyph.textContent = p.status === 'running' ? '⏵' : '✓';
      row.appendChild(glyph);

      const body = document.createElement('div');
      body.className = 'zone-bg-row-body';
      const titleRow = document.createElement('div');
      titleRow.className = 'zone-bg-row-title';
      const displayTitle = p.label || (p.command ? p.command.slice(0, 32) : p.handle);
      titleRow.textContent = displayTitle;
      body.appendChild(titleRow);
      if (p.command){
        const cmdRow = document.createElement('div');
        cmdRow.className = 'zone-bg-row-cmd';
        cmdRow.textContent = p.command;
        body.appendChild(cmdRow);
      }
      const metaRow = document.createElement('div');
      metaRow.className = 'zone-bg-row-meta';
      const elapsed = (p.endedAt ?? Date.now()) - p.startedAt;
      let metaText = bgUptimeFmt(elapsed);
      if (p.exitCode !== null && p.status !== 'running') metaText += ` · exit ${p.exitCode}`;
      metaRow.textContent = metaText;
      body.appendChild(metaRow);
      const out = document.createElement('div');
      out.className = 'zone-bg-row-output';
      if (p.lastOutputPreview) out.textContent = p.lastOutputPreview;
      else if (p.totalReads === 0) out.textContent = 'Waiting for output...';
      else out.textContent = '(no output)';
      body.appendChild(out);
      row.appendChild(body);

      const pill = document.createElement('span');
      pill.className = 'zone-bg-pill zone-bg-pill-' + p.status;
      pill.textContent = p.status;
      row.appendChild(pill);
      return row;
    }

    function bgHideStickyPanel(runId){
      const host = bgResolveStickyHost();
      const panel = host?.querySelector('.zone-bg-sticky-panel');
      if (panel) panel.setAttribute('data-state', 'hidden');
      if (runId) bgClearUptimeTick(runId);
    }

    function renderBgCard(runId){
      // Sticky live-indicator panel (sibling of the Plan card). Visible only
      // when (a) this runId is the actively-streamed run AND (b) the user is
      // viewing that run AND (c) at least one bg process is still running.
      const stickyHost = bgResolveStickyHost();
      if (!stickyHost) return;
      let panel = stickyHost.querySelector('.zone-bg-sticky-panel');

      const map = state.bgProcessesByRun?.[runId];
      const procs = map ? Array.from(map.values()).sort((a, b) => a.startedAt - b.startedAt) : [];
      const running = procs.filter((p) => p.status === 'running').length;
      const isActive = bgIsActiveRun(runId);

      // Phase 1b: when a non-active thread's run fires bg events, leave the
      // panel alone (it may be showing the active thread's BG state). Only
      // the active thread's runId may mutate the single sticky panel.
      if (!isActive) {
        bgClearUptimeTick(runId);
        return;
      }
      if (running === 0 || procs.length === 0){
        if (panel) panel.setAttribute('data-state', 'hidden');
        bgClearUptimeTick(runId);
        return;
      }

      if (!panel){
        panel = document.createElement('div');
        panel.className = 'zone-bg-sticky-panel';
        stickyHost.appendChild(panel);
      }
      panel.setAttribute('data-state', 'visible');
      panel.dataset.runId = String(runId);

      const newBody = document.createDocumentFragment();
      const header = document.createElement('div');
      header.className = 'zone-bg-sticky-panel-header';
      const titleEl = document.createElement('span');
      titleEl.textContent = 'Background processes';
      header.appendChild(titleEl);
      const countEl = document.createElement('span');
      countEl.className = 'zone-bg-running-count';
      countEl.textContent = `(${running} running)`;
      header.appendChild(countEl);
      newBody.appendChild(header);

      for (const p of procs) newBody.appendChild(bgBuildRow(p));

      while (panel.firstChild) panel.removeChild(panel.firstChild);
      panel.appendChild(newBody);
    }

    // Zone Undo Tur 2b: per-run revert button + state machine.
    // States: idle → reverting → reverted (terminal) | error → reverting (retry).
    // Renders to a self-contained DOM node returned to the caller; appended
    // to the run group below the diff cards on safe_to_apply runs.
    function renderUndoControl(runId, repoPath){
      const card = document.createElement('div');
      card.className = 'zone-undo-card';
      card.dataset.runId = String(runId || '');
      const rid = String(runId || '');
      const repo = String(repoPath || '');
      let state = 'idle';

      function clear(){ while (card.firstChild) card.removeChild(card.firstChild); }

      function renderIdle(){
        state = 'idle';
        clear();
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'zone-undo-btn';
        btn.textContent = '↶ Undo';
        btn.title = 'Revert the files Zone wrote in this run';
        btn.addEventListener('click', () => doUndo());
        card.appendChild(btn);
      }

      function renderReverting(){
        state = 'reverting';
        clear();
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'zone-undo-btn';
        btn.disabled = true;
        const spin = document.createElement('span');
        spin.className = 'zone-undo-spinner';
        btn.appendChild(spin);
        const txt = document.createElement('span');
        txt.textContent = 'Reverting…';
        btn.appendChild(txt);
        card.appendChild(btn);
      }

      function renderReverted(warnText){
        state = 'reverted';
        clear();
        const label = document.createElement('span');
        label.className = 'zone-undo-done';
        label.textContent = '✓ Reverted';
        card.appendChild(label);
        if (warnText) {
          const warn = document.createElement('span');
          warn.className = 'zone-undo-warn';
          warn.textContent = warnText;
          card.appendChild(warn);
        }
      }

      function renderError(message, terminal){
        state = 'error';
        clear();
        const chip = document.createElement('span');
        chip.className = 'zone-undo-error';
        chip.textContent = message;
        card.appendChild(chip);
        if (!terminal) {
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'zone-undo-btn';
          retry.textContent = 'Retry';
          retry.addEventListener('click', () => doUndo());
          card.appendChild(retry);
        }
      }

      async function doUndo(){
        if (state === 'reverting' || state === 'reverted') return;
        renderReverting();
        let res, body;
        try {
          res = await apiFetch(`/api/runs/${encodeURIComponent(rid)}/undo`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ repoPath: repo }),
          });
          try { body = await res.json(); } catch { body = {}; }
        } catch (err) {
          renderError('Network error reverting run.', false);
          return;
        }
        if (res.status === 200) {
          const files = Array.isArray(body?.files) ? body.files : [];
          const overwritten = files.filter((f) => f && f.diskMatchedPostFlush === false).length;
          const warn = overwritten > 0
            ? `Note: ${overwritten} file${overwritten === 1 ? '' : 's'} had local edits that were overwritten.`
            : '';
          renderReverted(warn);
          return;
        }
        if (res.status === 410) {
          renderReverted('');
          return;
        }
        if (res.status === 404) {
          renderError('No snapshot for this run (likely older than 7 days).', true);
          return;
        }
        if (res.status === 400) {
          renderError(String(body?.error || 'Bad request.'), true);
          return;
        }
        renderError(String(body?.error || 'Undo failed.'), false);
      }

      renderIdle();
      return card;
    }

    function renderRestoredTurnResult(msg){
      const decision = String(msg?.decisionMode || 'preview_only');
      const summary = String(msg?.summary || '').slice(0, 60);
      const ts = Number(msg?.ts || Date.now());
      const badgeClass =
        decision === 'safe_to_apply' ? 'safe' :
        decision === 'blocked' ? 'blocked' :
        decision === 'chat' ? 'chat' :
        'preview';
      const badgeText =
        badgeClass === 'safe' ? 'Safe' :
        badgeClass === 'blocked' ? 'Blocked' :
        badgeClass === 'chat' ? 'Chat' :
        'Preview';

      const wrap = document.createElement('div');
      wrap.className = 'turn-restored';
      wrap.innerHTML = `
        <div class="turn-restored-header">
          <svg class="chevron" viewBox="0 0 10 10" fill="none" aria-hidden="true">
            <path d="M3 4l2 2 2-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="turn-summary">${escapeHtml(summary || '(result)')}</span>
          <span class="turn-badge ${badgeClass}">${escapeHtml(badgeText)}</span>
          <span class="turn-meta">${escapeHtml(fmtRelative(ts))}</span>
        </div>
        <div class="turn-restored-body">
          <div class="turn-restored-files"></div>
        </div>
      `;
      wrap.querySelector('.turn-restored-header')?.addEventListener('click', (e) => toggleRestored(e.currentTarget));
      const body = wrap.querySelector('.turn-restored-files');
      if (body) {
        // Phase J.2: removed verify-banner pill render. Past run state is now
        // conveyed by the simple status line + diff list + undo control.
        const statusText = document.createElement('div');
        if (decision === 'safe_to_apply') {
          const applied = Array.isArray(msg?.appliedFiles) ? msg.appliedFiles.filter(Boolean) : [];
          statusText.textContent = applied.length ? `✓ Applied: ${applied.join(', ')}` : '✓ Applied';
        } else if (decision === 'blocked' || msg?.blocked) {
          statusText.textContent = '✗ Blocked for safety';
        } else if (decision === 'chat') {
          statusText.textContent = '';
        } else {
          // Legacy preview_only or unknown legacy modes from older threads
          // fall through to the success-style indicator (Phase J.1 collapsed
          // these into safe_to_apply).
          statusText.textContent = '✓ Applied';
        }
        if (statusText.textContent) body.appendChild(statusText);
      }
      const sp = msg && msg.streamPreview;
      // Virtual history: only restore patch preview cards for turns that are currently rendered.
      // Some older UIs restored previews separately; this guard ensures the preview follows the same windowing.
      const turnKey = `result:${String(msg?.ts ?? '')}`;
      const allowPreview =
        !state.__renderedTurnKeys ||
        !state.__renderedTurnKeys.size ||
        state.__renderedTurnKeys.has(turnKey);
      if (allowPreview && sp && Array.isArray(sp.lines) && sp.lines.length) {
        console.log('[zone-preview-restore]', msg.streamPreview?.lines);
        const fp = escapeHtml(String(sp.filePath || '').trim());
        const rows = sp.lines
          .map((it) => {
            const kind = normalizeStreamPreviewKind(it);
            if (!kind) return '';
            const cls = kind === 'add' ? 'add sd-line-add' : kind === 'del' ? 'del sd-line-del' : 'ctx';
            const prefix = kind === 'add' ? '+' : kind === 'del' ? '-' : ' ';
            return `<div class="sd-line ${cls}">${escapeHtml(prefix + ' ' + String(it.text ?? ''))}</div>`;
          })
          .filter(Boolean)
          .join('');
        const box = document.createElement('div');
        box.className = 'livecode livecode-static';
        box.style.marginTop = '10px';
        box.innerHTML = `
          <div class="livecode-h">
            <span class="label">${fp ? `Patch preview · ${fp}` : 'Patch preview'}</span>
          </div>
          <div class="livecode-body"><div class="stream-static-diff">${rows}</div></div>
        `;
        wrap.appendChild(box);
      }
      return wrap;
    }

    function renderRestoredTurnChat(msg){
      const text = String(msg?.chatResponse || msg?.content || msg?.text || '');
      const summary = String(msg?.summary || text).slice(0, 60);
      const ts = Number(msg?.ts || Date.now());
      const isInvestigation = msg?.decisionMode === 'investigation';
      const isInvestigationMaxiter = msg?.finalState === 'max_iterations' && isInvestigation;
      const isTokenBudgetExceeded = msg?.finalState === 'token_budget_exceeded' && isInvestigation;
      const wrap = document.createElement('div');
      wrap.className = 'turn-restored';
      wrap.innerHTML = `
        <div class="turn-restored-header">
          <svg class="chevron" viewBox="0 0 10 10" fill="none" aria-hidden="true">
            <path d="M3 4l2 2 2-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="turn-summary">${escapeHtml(summary || '(chat)')}</span>
          <span class="turn-badge chat">Chat</span>
          <span class="turn-meta">${escapeHtml(fmtRelative(ts))}</span>
        </div>
        ${isInvestigationMaxiter ? `<div class="toast" style="margin:4px 0 2px;opacity:0.8"><div class="ticon" style="background:var(--green-dim)"></div><div>Investigation incomplete — iteration budget reached. Findings below are partial.</div></div>` : ''}
        ${isTokenBudgetExceeded ? `<div class="toast warn" style="margin:4px 0 2px;opacity:0.8"><div class="ticon" style="background:var(--amber-dim)"></div><div>Token budget reached — findings below are partial.</div></div>` : ''}
        <div class="turn-restored-body"></div>
      `;
      wrap.querySelector('.turn-restored-header')?.addEventListener('click', (e) => toggleRestored(e.currentTarget));
      const body = wrap.querySelector('.turn-restored-body');
      if (body) body.innerHTML = (!extractTrailingVerificationReason(text) && String(msg?.responseHtml || '').trim()) || renderChatMarkdown(text);
      return wrap;
    }

    function renderActiveThread(){
      // Phase 1b: instead of clearing #chatArea and rebuilding, hide all
      // per-thread containers and lazily populate (or reveal) the active
      // thread's container. In-flight runs in other threads keep their
      // live timeline DOM intact while hidden.
      const thread = getActiveThread();
      if (!thread) {
        // No thread: hide all per-thread containers, show empty state.
        showOnlyActiveThreadContainer();
        if (els.emptyState && els.emptyState.parentElement !== els.chatArea) {
          els.chatArea.appendChild(els.emptyState);
        }
        if (els.emptyState) els.emptyState.style.display = '';
        els.threadTitle.textContent = 'No thread selected';
        setIdleUI();
        return;
      }
      console.log('[render-thread] total turns:', thread.messages?.length, 'rendering last 10');
      console.log('[zone-replay]', thread.messages);
      els.threadTitle.textContent = thread.title || 'Thread';
      if (state.activeRepo?.path !== thread.repoPath) {
        const match = state.repos.find(r => r.path === thread.repoPath);
        if (match) { state.activeRepo = match; fetchBranchList(); }
      }
      els.repoChipName.textContent = state.activeRepo?.name || thread.repoName || 'Project';

      // Hide empty state when a real thread is active.
      hideEmpty();
      const container = getOrCreateThreadContainer(thread.id);
      const needsInitialPopulate = container && container.children.length === 0;
      showOnlyActiveThreadContainer();
      refreshCostStripForActiveRun();
      if (!needsInitialPopulate) {
        // Already populated from a previous activation; just reveal it
        // and let the existing scroll-position be preserved.
        const wasNear = isNearBottom(els.chatArea);
        try { applyExecutionViewModeToAll(container); } catch {}
        scrollToBottomIfNear(els.chatArea, wasNear);
        setTimeout(() => { void syncActiveRunUi(); }, 0);
        return;
      }
      renderThreadIntoContainer(thread, container);
    }

    function renderThreadIntoContainer(thread, container){
      const wasNear = isNearBottom(els.chatArea);
      // Wipe the container before populating (called only when empty,
      // so this is a no-op except for safety).
      container.innerHTML = '';
      // Persistent last-10 history: prefer full HTML run groups when present.
      const allMsgs = Array.isArray(thread.messages) ? thread.messages : [];
      const runGroups = allMsgs.filter((m) => m && typeof m === 'object' && m.type === 'run_group_html' && typeof m.html === 'string');
      const legacyTurns = allMsgs.filter((m) => m && typeof m === 'object' && (m.type === 'result' || m.type === 'assistant' || m.type === 'chat' || m.type === 'chat_response'));
      const turns = runGroups.length ? runGroups : legacyTurns;

      state.__historyShownByThread = state.__historyShownByThread || {};
      const threadId = String(thread.id || state.activeThreadId || '');
      const shown = Number(state.__historyShownByThread[threadId] || 10);
      const showCount = Math.max(10, shown);

      const totalTurns = turns.length;
      const startIdx = Math.max(0, totalTurns - showCount);
      const hasOlder = startIdx > 0;

      // Track which turns are actually rendered so preview restore respects the same window.
      state.__renderedTurnKeys = new Set(
        turns
          .slice(startIdx)
          .map((m) => `result:${String(m?.ts ?? '')}`)
      );

      if (hasOlder) {
        const wrapBtn = document.createElement('div');
        wrapBtn.className = 'load-older';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'Load older conversations';
        btn.addEventListener('click', () => {
          state.__historyShownByThread = state.__historyShownByThread || {};
          state.__historyShownByThread[threadId] = Math.min(totalTurns, showCount + 10);
          // Drop the cached container so the next renderActiveThread rebuilds it.
          container.innerHTML = '';
          renderActiveThread();
        });
        wrapBtn.appendChild(btn);
        container.appendChild(wrapBtn);
      }

      turns.slice(startIdx).forEach(m => {
        if (!m || typeof m !== 'object') return;
        if (m.type === 'run_group_html') {
          const rid = String(m.runId || '');
          const g = document.createElement('div');
          g.className = 'run-group restored';
          if (rid) g.id = `runGroup-${rid}`;
          try {
            const st = String(m.status || 'completed');
            g.dataset.runStatus = st;
          } catch {}
          g.innerHTML = String(m.html || '');
          container.appendChild(g);
          g.querySelectorAll('.zone-reply-pulse.active').forEach(el => el.classList.remove('active'));
          return;
        }
        // Legacy restore fallback: collapsed cards.
        if (m.type === 'result') {
          const decision = String(m.decisionMode || 'preview_only');
          if (decision === 'chat' || decision === 'investigation') container.appendChild(renderRestoredTurnChat(m));
          else container.appendChild(renderRestoredTurnResult(m));
          return;
        }
        if (m.type === 'assistant' || m.type === 'chat') {
          container.appendChild(renderRestoredTurnChat(m));
          return;
        }
        if (m.type === 'chat_response') {
          container.appendChild(renderRestoredTurnChat({
            ts: m.ts,
            chatResponse: m.responseText,
            responseHtml: m.responseHtml,
            contextFiles: m.contextFiles,
            summary: String(m.userText || '').slice(0, 80),
          }));
          return;
        }
      });
      applyExecutionViewModeToAll(container);
      scrollToBottomIfNear(els.chatArea, wasNear);
      // After rendering thread, refresh interrupted runs and reconnect any run still alive.
      setTimeout(() => { void syncActiveRunUi(); }, 0);
    }

    // ---- SSE + Patch ----
    // thinking block removed (replaced by log-thinking line)

    function openSSE(runId, _isRetry){
      try { console.log('[send-debug] SSE subscription opening for runId=' + String(runId || '')); } catch {}
      // Phase 1b: per-runId EventSource. Don't close other threads' streams.
      // If a stream already exists for THIS runId (re-attach scenario), close it first.
      const _existingForThisRun = state.eventSourcesByRunId.get(runId);
      try { _existingForThisRun?.close(); } catch {}
      const es = new EventSource(`/api/run-replay/${encodeURIComponent(runId)}`);
      state.eventSourcesByRunId.set(runId, es);
      state.eventSource = es;
      let _hadMessage = false;
      es.onmessage = (e) => {
        _hadMessage = true;
        let payload = null;
        try { payload = JSON.parse(e.data); } catch { return; }
        try {
          state.__sendDebugByRun = state.__sendDebugByRun || {};
          const meta = state.__sendDebugByRun[runId];
          if (meta && !meta.firstEventLogged) {
            meta.firstEventLogged = true;
            console.log('[send-debug] SSE first event received for runId=' + String(runId || ''), {
              msSinceFetch: meta.fetchStartedAt ? (Date.now() - meta.fetchStartedAt) : null,
              stage: payload?.stage || null,
              progressType: payload?.progress?.type || null,
            });
          }
        } catch {}
        handleSSEPayload(payload, runId);
      };
      // /api/run-replay returns 404 if the run buffer doesn't exist yet (openSSE is called
      // before the POST, so registerRunStart hasn't fired). Retry once after 600ms —
      // by then the POST has been processed and the buffer exists.
      es.onerror = () => {
        try { es.close(); } catch {}
        if (!_hadMessage && !_isRetry) setTimeout(() => openSSE(runId, true), 600);
      };
    }

    function openReplaySSE(runId){
      // Phase 1b: per-runId; close prior stream for THIS runId only.
      const _existingForThisRun = state.eventSourcesByRunId.get(runId);
      try { _existingForThisRun?.close(); } catch {}
      const es = new EventSource(`/api/run-replay/${encodeURIComponent(runId)}`);
      state.eventSourcesByRunId.set(runId, es);
      state.eventSource = es;
      es.onmessage = (e) => {
        let payload = null;
        try { payload = JSON.parse(e.data); } catch { return; }
        handleSSEPayload(payload, runId);
      };
      es.onerror = () => { try { es.close(); } catch {} };
    }

    async function fetchActiveRunsForCurrentUser(){
      const userId = getCurrentUserId();
      state.__activeRunsById = state.__activeRunsById || {};
      const url = userId
        ? `/api/active-runs?userId=${encodeURIComponent(userId)}`
        : '/api/active-runs';
      try { console.log('[resume-debug] active-runs request', { url, stateUserId: state.userId, effectiveUserId: userId }); } catch {}
      if (!userId) {
        try { console.log('[resume-debug] active-runs request skipped because effectiveUserId is empty'); } catch {}
      }
      try {
        const res = await fetch(url);
        const runs = res.ok ? await res.json() : [];
        try { console.log('[resume-debug] /api/active-runs response', { ok: res.ok, runs }); } catch {}
        const next = {};
        if (Array.isArray(runs)) {
          runs.forEach((run) => {
            const rid = String(run?.runId || '').trim();
            if (!rid) return;
            next[rid] = run;
          });
        }
        state.__activeRunsById = next;
        return next;
      } catch {
        return state.__activeRunsById;
      }
    }

    function getRunTaskText(runId){
      const g = document.getElementById(`runGroup-${runId}`);
      if (!g) return '';
      const textEl = g.querySelector('.bubble.user .text');

    async function resumeInterruptedRun(runId){
      if (state.isRunning) {
        els.chatArea.appendChild(createToast('error', 'Wait for the current run to finish before resuming another one.'));
        scrollChatIfFollowing();
        return;
      }
      const rid = String(runId || '').trim();
      if (!rid) return;
      const activeRun = state.__activeRunsById && state.__activeRunsById[rid]
        ? state.__activeRunsById[rid]
        : null;
      const taskText = getRunTaskText(rid);
      if (!taskText) {
        els.chatArea.appendChild(createToast('error', 'Could not find the original task to resume.'));
        scrollChatIfFollowing();
        return;
      }
      try { console.log('[resume-debug] resume click', { runId: rid, taskText }); } catch {}
      if (activeRun) {
        state.__lastChangedFiles = Array.isArray(activeRun.lastChangedFiles)
          ? activeRun.lastChangedFiles.slice(0, 20)
          : [];
        state.__lastAddedFunctions = Array.isArray(activeRun.lastAddedFunctions)
          ? activeRun.lastAddedFunctions.slice(0, 20)
          : [];
      }
      markRunGroupResumed(rid);
      await sendMessage(taskText);
    }

    function ensureResumeBadge(runId){

      badge = document.createElement('div');

    function setResumeButton(runId){

      b.innerHTML = '';

      const label = document.createElement('span');
      label.className = 'txt';

    function setResumeBadge(runId, kind, text){
