            <button id="apikeyShowBtn-${provider}" class="apikey-btn-show" type="button">Show</button>
            <button id="apikeyCopyBtn-${provider}" class="apikey-btn-show" type="button" style="${saved ? '' : 'display:none'}">Copy</button>
            <button id="apikeySaveBtn-${provider}" class="apikey-btn-save" type="button">Save</button>
            <button id="apikeyClearBtn-${provider}" class="apikey-btn-show" type="button" style="${saved ? '' : 'display:none'}">Clear</button>
          </div>
          <div id="apikeyStatus-${provider}" class="apikey-status">${saved ? '<span class="apikey-status success">✓ Saved</span>' : ''}</div>
          ${serverConfigured ? `<div class="apikey-disclaimer">A server-side key is also configured for ${escapeHtml(label)}. Your browser key takes priority when set.</div>` : ''}
        `;
      }

      els.settingsBody.innerHTML = `
        <div class="apikey-section">
          <div class="apikey-section-title">API Keys</div>

          <div class="apikey-disclaimer" style="margin-bottom:14px;padding:10px 12px;background:var(--bg-input,#1e1e1e);border-radius:6px;border:1px solid var(--border,#333)">
            <strong>Recommended:</strong> Use <strong>Anthropic Claude</strong> for best results.
            Zone is optimized for Claude models — tool use, planning, and agent coordination are significantly more reliable than with OpenAI.
            OpenAI is supported but may produce lower-quality runs.
          </div>

          <div class="apikey-field-label">Provider</div>
          <div class="apikey-input-row" style="gap:18px">
            <label style="display:flex;gap:6px;align-items:center;cursor:${_keysRunActive ? 'not-allowed' : 'pointer'};opacity:${_keysRunActive ? '0.5' : '1'}">
              <input type="radio" name="zoneProviderRadio" value="openai" ${activeProvider === 'openai' ? 'checked' : ''} ${_keysRunActive ? 'disabled' : ''} />
              OpenAI
            </label>
            <label style="display:flex;gap:6px;align-items:center;cursor:${_keysRunActive ? 'not-allowed' : 'pointer'};opacity:${_keysRunActive ? '0.5' : '1'}">
              <input type="radio" name="zoneProviderRadio" value="anthropic" ${activeProvider === 'anthropic' ? 'checked' : ''} ${_keysRunActive ? 'disabled' : ''} />
              Anthropic
            </label>
          </div>
          <div class="apikey-disclaimer" style="margin-top:6px">
            Active provider determines which key is used for runs. Both keys can be saved simultaneously.
            ${_keysRunActive ? '<span style="color:var(--color-warning,#e0a000)"> Switch after run completes.</span>' : ''}
          </div>

          <div style="height:14px"></div>

          ${providerSection({ provider: 'openai', label: 'OpenAI', placeholder: 'sk-…', serverConfigured: serverHasOpenAIKey })}

          <div style="height:14px"></div>

          ${providerSection({ provider: 'anthropic', label: 'Anthropic', placeholder: 'sk-ant-…', serverConfigured: serverHasAnthropicKey })}

          <div style="height:14px"></div>

          <div class="apikey-disclaimer">
            <div id="apikeyActiveLine">ⓘ Active provider: ${escapeHtml(activeProvider === 'anthropic' ? 'Anthropic' : 'OpenAI')}</div>
            <br>
            ⓘ Your keys are stored in your browser (localStorage). Zone never sends them
            to any server other than the selected provider's API.
          </div>
        </div>
      `;

      // Provider radio: save active provider on change
      const radios = els.settingsBody.querySelectorAll('input[name="zoneProviderRadio"]');
      radios.forEach((r) => {
        r.addEventListener('change', () => {
          if (!r.checked) return;
          const next = r.value === 'anthropic' ? 'anthropic' : 'openai';
          setActiveProvider(next);
          const line = document.getElementById('apikeyActiveLine');
          if (line) line.textContent = 'ⓘ Active provider: ' + (next === 'anthropic' ? 'Anthropic' : 'OpenAI');
          updateFooterModelLabel();
        });
      });

      function wireProviderRow(provider, validateFn) {
        const input = document.getElementById('apikeyInput-' + provider);
        const showBtn = document.getElementById('apikeyShowBtn-' + provider);
        const copyBtn = document.getElementById('apikeyCopyBtn-' + provider);
        const saveBtn = document.getElementById('apikeySaveBtn-' + provider);
        const clearBtn = document.getElementById('apikeyClearBtn-' + provider);
        const statusEl = document.getElementById('apikeyStatus-' + provider);
        if (!input || !saveBtn) return;

        showBtn.addEventListener('click', () => {
          const isPassword = input.type === 'password';
          if (isPassword) {
            const savedKey = getApiKeys()[provider] || '';
            if (savedKey) input.value = savedKey;
            input.type = 'text';
            showBtn.textContent = 'Hide';
          } else {
            const savedKey = getApiKeys()[provider] || '';
            input.value = '';
            input.placeholder = savedKey ? maskKey(savedKey) : (provider === 'anthropic' ? 'sk-ant-…' : 'sk-…');
            input.type = 'password';
            showBtn.textContent = 'Show';
          }
        });

        if (copyBtn) {
          copyBtn.addEventListener('click', async () => {
            const key = getApiKeys()[provider] || input.value || '';
            if (!key) return;
            try {
              await navigator.clipboard.writeText(key);
            } catch {
              const tmp = document.createElement('textarea');
              tmp.value = key;
              tmp.style.position = 'fixed';
              tmp.style.opacity = '0';
              document.body.appendChild(tmp);
              tmp.select();
              document.execCommand('copy');
              document.body.removeChild(tmp);
            }
            const orig = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            setTimeout(() => { copyBtn.textContent = orig; }, 1500);
          });
        }

        clearBtn.addEventListener('click', () => {
          setApiKey(provider, '');                              // empty save deletes the entry
          input.value = '';
          input.placeholder = provider === 'anthropic' ? 'sk-ant-…' : 'sk-…';
          statusEl.innerHTML = '<span class="apikey-status">Cleared</span>';
          clearBtn.style.display = 'none';
          if (copyBtn) copyBtn.style.display = 'none';
        });

        saveBtn.addEventListener('click', async () => {
          const rawKey = String(input.value || '').trim();
          if (!rawKey) {
            // Empty save = clear the key
            setApiKey(provider, '');
            input.placeholder = provider === 'anthropic' ? 'sk-ant-…' : 'sk-…';
            statusEl.innerHTML = '<span class="apikey-status">Cleared</span>';
            clearBtn.style.display = 'none';
            if (copyBtn) copyBtn.style.display = 'none';
            return;
          }
          const key = rawKey.replace(/\s+/g, '');
          saveBtn.disabled = true;
          statusEl.innerHTML = '<span class="apikey-status">Verifying…</span>';
          try {
            const result = await validateFn(key);
            if (result.status === 'valid') {
              setApiKey(provider, key);
              statusEl.innerHTML = '<span class="apikey-status success">✓ Validated</span>';
              input.value = '';
              input.placeholder = maskKey(key);
              clearBtn.style.display = '';
              if (copyBtn) copyBtn.style.display = '';
            } else if (result.status === 'invalid') {
              statusEl.innerHTML = '<span class="apikey-status error">✗ ' + escapeHtml(result.message || 'Invalid key') + '</span>';
            } else {
              setApiKey(provider, key);
              statusEl.innerHTML = '<span class="apikey-status warning">⚠ ' + escapeHtml(result.message || 'Saved without validation') + '</span>';
              input.value = '';
              input.placeholder = maskKey(key);
              clearBtn.style.display = '';
              if (copyBtn) copyBtn.style.display = '';
            }
          } catch (e) {
            setApiKey(provider, key);
            statusEl.innerHTML = '<span class="apikey-status warning">⚠ Could not validate (network error). Saved anyway.</span>';
            input.value = '';
            input.placeholder = maskKey(key);
            clearBtn.style.display = '';
            if (copyBtn) copyBtn.style.display = '';
          } finally {
            saveBtn.disabled = false;
          }
        });
      }

      async function validateOpenAIKey(key) {
        if (!key.startsWith('sk-') || key.length < 20) {
          return { status: 'invalid', message: 'Invalid format — must start with sk-.' };
        }
        try {
          const resp = await fetch('https://api.openai.com/v1/models', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + key },
          });
          if (resp.ok) return { status: 'valid' };
          if (resp.status === 401) return { status: 'invalid', message: 'Invalid key — 401 from OpenAI.' };
          return { status: 'unknown', message: 'OpenAI returned ' + resp.status + '. Saved; will retry on first task.' };
        } catch {
          return { status: 'unknown', message: 'Network error. Saved; will retry on first task.' };
        }
      }

      async function validateAnthropicKey(key) {
        if (!key.startsWith('sk-ant-') || key.length < 20) {
          return { status: 'invalid', message: 'Invalid format — must start with sk-ant-.' };
        }
        try {
          const resp = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'x-api-key': key,
              'anthropic-version': '2023-06-01',
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              model: 'claude-haiku-4-5',
              max_tokens: 1,
              messages: [{ role: 'user', content: 'hi' }],
            }),
          });
          if (resp.status === 401) return { status: 'invalid', message: 'Invalid key — 401 from Anthropic.' };
          // 200 = ok; 400 with auth-ok = key is valid (just bad request shape).
          // We treat any non-401 JSON response as "auth succeeded".
          const ct = resp.headers.get('content-type') || '';
          if (resp.ok) return { status: 'valid' };
          if (ct.includes('json')) return { status: 'valid' };
          return { status: 'unknown', message: 'Anthropic returned ' + resp.status + '. Saved; will retry on first task.' };
        } catch {
          return { status: 'unknown', message: 'Network error. Saved; will retry on first task.' };
        }
      }

      wireProviderRow('openai', validateOpenAIKey);
      wireProviderRow('anthropic', validateAnthropicKey);
    }

    // Phase I.2: Visual verification settings panel — dev-server URL,
    // viewport defaults, and a placeholder auto-verify toggle (wired in I.3).
    // Phase L.3: tier-based execution limit overrides.
    function renderTierSettings(){
      const inputStyle = 'width:110px;padding:4px 8px;background:var(--bg-input,#1e1e1e);border:1px solid var(--border,#444);border-radius:4px;color:inherit;font-size:var(--font-size-sm,12px)';
      const TIERS = [
        { key: 'simple',  label: 'Simple',  desc: 'Subagent dispatch always disabled — system guarantee.' },
        { key: 'medium',  label: 'Medium',  desc: 'Up to 1 subagent call by default.' },
        { key: 'complex', label: 'Complex', desc: 'Up to 2 subagent calls by default. Highest token budget.' },
      ];

      function tierBlock(tier, label, desc) {
        const showSubagent = tier !== 'simple';
        return `
          <div style="margin-bottom:18px;padding:12px;border:1px solid var(--border,#333);border-radius:6px">
            <div class="apikey-field-label" style="font-size:0.9em;margin-bottom:6px">${label}</div>
            <div class="apikey-disclaimer" style="margin-bottom:10px">${desc}</div>
            <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end">
              <label style="display:flex;flex-direction:column;gap:4px;font-size:var(--font-size-sm,12px)">
                Token budget cap
                <input id="tl-${tier}-tokenBudgetCap" type="number" min="10000" max="2000000" step="1000"
                  style="${inputStyle}" aria-label="${label} token budget cap" />
              </label>
              <label style="display:flex;flex-direction:column;gap:4px;font-size:var(--font-size-sm,12px)">
                Soft iteration warning
                <input id="tl-${tier}-softIterWarn" type="number" min="1" max="100"
                  style="${inputStyle}" aria-label="${label} soft iteration warning" />
              </label>
              ${showSubagent ? `
              <label style="display:flex;flex-direction:column;gap:4px;font-size:var(--font-size-sm,12px)">
                Max subagent calls
                <input id="tl-${tier}-maxSubagentCalls" type="number" min="0" max="5"
                  style="${inputStyle}" aria-label="${label} max subagent calls" />
              </label>` : ''}
            </div>
          </div>`;
      }

      els.settingsBody.innerHTML = `
        <div class="apikey-section">
          <div class="apikey-section-title">Tier-Based Execution Limits</div>
          <div class="apikey-disclaimer" style="margin-bottom:14px">
            Customize per-tier token budgets, iteration caps, and subagent call limits.
            Inputs show the effective value (default or your saved override).
            <strong>Simple tier's subagent dispatch is a system-level guarantee and cannot be changed.</strong>
          </div>
          <div id="tlLoadingState" class="apikey-disclaimer">Loading…</div>
          <div id="tlFormBody" style="display:none">
            ${TIERS.map(t => tierBlock(t.key, t.label, t.desc)).join('')}
            <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
              <button id="tlSaveBtn" style="padding:5px 14px;background:var(--violet,#7a5af8);color:#fff;border:none;border-radius:4px;font-size:var(--font-size-sm,12px);cursor:pointer">Save</button>
              <button id="tlResetBtn" style="padding:5px 14px;background:transparent;color:var(--color-text,#ddd);border:1px solid var(--border,#444);border-radius:4px;font-size:var(--font-size-sm,12px);cursor:pointer">Reset to defaults</button>
              <span id="tlStatus" style="font-size:var(--font-size-sm,12px);opacity:.7"></span>
            </div>
          </div>
        </div>`;

      const loadingEl = document.getElementById('tlLoadingState');
      const formEl = document.getElementById('tlFormBody');
      const saveBtn = document.getElementById('tlSaveBtn');
      const resetBtn = document.getElementById('tlResetBtn');
      const statusEl = document.getElementById('tlStatus');

      function getInput(tier, field){ return document.getElementById('tl-' + tier + '-' + field); }

      function applySettings(settings){
        for (const tier of ['simple','medium','complex']){
          const s = settings[tier] || {};
          const tokEl = getInput(tier, 'tokenBudgetCap');
          const iterEl = getInput(tier, 'softIterWarn');
          const subEl = getInput(tier, 'maxSubagentCalls');
          if (tokEl) tokEl.value = String(s.tokenBudgetCap ?? '');
          if (iterEl) iterEl.value = String(s.softIterWarn ?? '');
          if (subEl) subEl.value = String(s.maxSubagentCalls ?? '');
        }
      }

      function collectOverrides(){
        const result = {};
        for (const tier of ['simple','medium','complex']){
          const tokEl = getInput(tier, 'tokenBudgetCap');
          const iterEl = getInput(tier, 'softIterWarn');
          const subEl = getInput(tier, 'maxSubagentCalls');
          const tierObj = {};
          const tok = tokEl ? parseInt(tokEl.value, 10) : NaN;
          const iter = iterEl ? parseInt(iterEl.value, 10) : NaN;
          const sub = subEl ? parseInt(subEl.value, 10) : NaN;
          if (Number.isFinite(tok)) tierObj.tokenBudgetCap = tok;
          if (Number.isFinite(iter)) tierObj.softIterWarn = iter;
          if (Number.isFinite(sub)) tierObj.maxSubagentCalls = sub;
          if (Object.keys(tierObj).length) result[tier] = tierObj;
        }
        return result;
      }

      fetch('/api/settings/tier-limits').then(r => r.json()).then(data => {
        if (loadingEl) loadingEl.style.display = 'none';
        if (formEl) formEl.style.display = '';
        if (data && data.ok && data.settings) {
          applySettings(data.settings);
        } else {
          if (statusEl) statusEl.textContent = 'Failed to load.';
        }
      }).catch(() => {
        if (loadingEl) loadingEl.textContent = 'Failed to load settings.';
      });

      if (saveBtn) {
        saveBtn.addEventListener('click', () => {
          saveBtn.disabled = true;
          if (statusEl) statusEl.textContent = 'Saving…';
          fetch('/api/settings/tier-limits', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userOverrides: collectOverrides() }),
          }).then(r => r.json()).then(resp => {
            if (resp && resp.ok) {
              if (statusEl) statusEl.textContent = '✓ Saved';
            } else {
              if (statusEl) statusEl.textContent = 'Error: ' + (resp?.error || 'unknown');
            }
          }).catch(err => {
            if (statusEl) statusEl.textContent = 'Failed: ' + (err?.message || err);
          }).finally(() => {
            saveBtn.disabled = false;
          });
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          resetBtn.disabled = true;
          if (statusEl) statusEl.textContent = 'Resetting…';
          fetch('/api/settings/tier-limits/reset', { method: 'POST' })
            .then(r => r.json()).then(resp => {
              if (resp && resp.ok && resp.defaults) {
                applySettings(resp.defaults);
                if (statusEl) statusEl.textContent = '✓ Reset to defaults';
              } else {
                if (statusEl) statusEl.textContent = 'Error resetting.';
              }
            }).catch(err => {
              if (statusEl) statusEl.textContent = 'Failed: ' + (err?.message || err);
            }).finally(() => {
              resetBtn.disabled = false;
            });
        });
      }
    }

    function renderUsageSettings(){
      // BYOK estimated spend. Sourced from /api/usage which aggregates per-run
      // token logs (input_uncached + cache_write + cache_read + output) ×
      // pricing.ts rates. Period toggle: day | week | month | all-time.
      let usagePeriod = 'month';
      let usageBreakdownOpen = false;
      let cachedLimits = { dailyLimit: null, monthlyLimit: null };
      const PROVIDER_LABELS = { anthropic: 'Anthropic', openai: 'OpenAI' };
      const PERIOD_BUTTONS = [
        { key: 'day',   label: 'Today' },
        { key: 'week',  label: 'This week' },
        { key: 'month', label: 'This month' },
        { key: 'all',   label: 'All time' },
      ];
      const PERIOD_RUNS_LABEL = {
        day: 'Runs today',
        week: 'Runs this week',
        month: 'Runs this month',
        all: 'Runs (all time)',
      };
      function renderPeriodButtons(active) {
        return PERIOD_BUTTONS.map(({ key, label }) => {
          const isActive = key === active;
          const bg = isActive ? 'var(--violet,#7a5af8)' : 'transparent';
          const fg = isActive ? '#fff' : 'var(--color-text,#ddd)';
          return `<button class="usage-period-btn${isActive ? ' active' : ''}" data-usage-period="${key}" style="padding:4px 10px;border-radius:var(--radius-sm,6px);border:1px solid var(--color-border,#333);background:${bg};color:${fg};font-size:var(--font-size-sm,12px);cursor:pointer">${escapeHtml(label)}</button>`;
        }).join('');
      }

      function formatTokens(n){
        const x = Number(n) || 0;
        if (x >= 1e9) return (x / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
        if (x >= 1e6) return (x / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
        if (x >= 1e3) return (x / 1e3).toFixed(1).replace(/\.?0+$/, '') + 'K';
        return String(x);
      }
      function formatUsd(n){
        const x = Number(n) || 0;
        return '$' + x.toFixed(2);
      }
      function formatProviders(byProvider){
        const keys = Object.keys(byProvider || {});
        if (keys.length === 0) return '—';
        return keys.map(k => PROVIDER_LABELS[k] || k).join(', ');
      }

      function paintSkeleton(){
        els.settingsBody.innerHTML = `
          <div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap">
            ${renderPeriodButtons(usagePeriod)}
          </div>
          <div class="row"><div class="k">${escapeHtml(PERIOD_RUNS_LABEL[usagePeriod] || 'Runs')}</div><div class="v"><div class="skeleton" style="width:90px"></div></div></div>
          <div class="row"><div class="k">Usage</div><div class="v"><div class="skeleton" style="width:80px"></div></div></div>
          <div class="row"><div class="k">API tokens used</div><div class="v"><div class="skeleton" style="width:70px"></div></div></div>
          <div class="row"><div class="k">Provider</div><div class="v"><div class="skeleton" style="width:90px"></div></div></div>
        `;
        wirePeriodButtons();
      }

      function paintLoaded(data){
        const runsLabel = PERIOD_RUNS_LABEL[usagePeriod] || 'Runs';
        const totalRuns = data?.totalRuns ?? 0;
        const totalTokens = data?.totalTokens ?? 0;
        const totalCostUsd = data?.totalCostUsd ?? 0;
        const providers = formatProviders(data?.byProvider);
        const byModel = data?.byModel || {};
        const modelEntries = Object.keys(byModel).map(m => ({ model: m, ...byModel[m] }));
        const breakdownChevron = usageBreakdownOpen ? '▾' : '▸';
        const breakdownRows = usageBreakdownOpen && modelEntries.length
          ? modelEntries.map(e => `
              <div class="row" style="padding-left:16px;font-size:var(--font-size-sm,12px);opacity:0.85">
                <div class="k" style="font-family:var(--font-mono,monospace)">${escapeHtml(String(e.model))}</div>
                <div class="v">${escapeHtml(String(e.runs))} runs · ${escapeHtml(formatTokens(e.tokens))} · ${escapeHtml(formatUsd(e.costUsd))}</div>
              </div>
            `).join('')
          : (usageBreakdownOpen
              ? `<div class="row" style="padding-left:16px;font-size:var(--font-size-sm,12px);opacity:0.6"><div class="k">No runs yet</div><div class="v"></div></div>`
              : '');

        els.settingsBody.innerHTML = `
          <div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap">
            ${renderPeriodButtons(usagePeriod)}
          </div>
          <div class="row"><div class="k">${escapeHtml(runsLabel)}</div><div class="v">${escapeHtml(String(totalRuns))}</div></div>
          <div class="row"><div class="k">Usage</div><div class="v">${escapeHtml(formatUsd(totalCostUsd))}</div></div>
          <div class="row"><div class="k">API tokens used</div><div class="v">${escapeHtml(formatTokens(totalTokens))}</div></div>
          <div class="row"><div class="k">Provider</div><div class="v">${escapeHtml(providers)}</div></div>
          <div class="row" id="usageBreakdownToggle" style="cursor:pointer;user-select:none">
            <div class="k">${breakdownChevron} Breakdown by model</div>
            <div class="v" style="opacity:0.7;font-size:var(--font-size-sm,12px)">${escapeHtml(String(modelEntries.length))} model${modelEntries.length===1?'':'s'}</div>
          </div>
          ${breakdownRows}
        `;
        wirePeriodButtons();
        const toggle = document.getElementById('usageBreakdownToggle');
        if (toggle) {
          toggle.addEventListener('click', () => {
            usageBreakdownOpen = !usageBreakdownOpen;
            paintLoaded(data);
          });
        }
        appendLimitsSection();
      }

      function appendLimitsSection() {
        const daily = cachedLimits.dailyLimit != null ? String(cachedLimits.dailyLimit) : '';
        const monthly = cachedLimits.monthlyLimit != null ? String(cachedLimits.monthlyLimit) : '';
        const section = document.createElement('div');
        section.id = 'usageLimitsSection';
        section.style.cssText = 'margin-top:20px;padding-top:16px;border-top:1px solid var(--border,#333)';
        section.innerHTML = `
          <div class="apikey-section-title" style="font-size:var(--font-size-sm,12px);text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin-bottom:10px">Spending Limits</div>
          <div class="row" style="align-items:center;gap:10px">
            <div class="k" style="min-width:120px">Daily limit ($)</div>
            <div class="v" style="flex:1">
              <input id="usageLimitDaily" type="number" min="0" step="0.01" value="${escapeHtml(daily)}"
                placeholder="No limit" style="width:100px;padding:4px 8px;background:var(--bg-input,#1e1e1e);border:1px solid var(--border,#444);border-radius:4px;color:inherit;font-size:var(--font-size-sm,12px)" />
            </div>
          </div>
          <div class="row" style="align-items:center;gap:10px;margin-top:6px">
            <div class="k" style="min-width:120px">Monthly limit ($)</div>
            <div class="v" style="flex:1">
              <input id="usageLimitMonthly" type="number" min="0" step="0.01" value="${escapeHtml(monthly)}"
                placeholder="No limit" style="width:100px;padding:4px 8px;background:var(--bg-input,#1e1e1e);border:1px solid var(--border,#444);border-radius:4px;color:inherit;font-size:var(--font-size-sm,12px)" />
            </div>
          </div>
          <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
            <button id="usageLimitSave" style="padding:5px 14px;background:var(--violet,#7a5af8);color:#fff;border:none;border-radius:4px;font-size:var(--font-size-sm,12px);cursor:pointer">Save limits</button>
            <span id="usageLimitStatus" style="font-size:var(--font-size-sm,12px);opacity:.7"></span>
          </div>
          <div style="margin-top:6px;font-size:var(--font-size-sm,12px);opacity:.5">Leave blank to disable. Runs will be blocked once the threshold is reached.</div>
        `;
        els.settingsBody.appendChild(section);
        const saveBtn = document.getElementById('usageLimitSave');
        const statusEl = document.getElementById('usageLimitStatus');
        if (saveBtn) {
          saveBtn.addEventListener('click', () => {
            const dailyVal = parseFloat(document.getElementById('usageLimitDaily').value);
            const monthlyVal = parseFloat(document.getElementById('usageLimitMonthly').value);
            const body = {
              dailyLimit: isFinite(dailyVal) && dailyVal > 0 ? dailyVal : null,
              monthlyLimit: isFinite(monthlyVal) && monthlyVal > 0 ? monthlyVal : null,
            };
            saveBtn.disabled = true;
            if (statusEl) statusEl.textContent = 'Saving…';
            fetch('/api/usage-limits', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            }).then(r => r.json()).then(resp => {
              cachedLimits = body;
              if (statusEl) statusEl.textContent = resp.ok ? 'Saved' : ('Error: ' + (resp.error || 'unknown'));
            }).catch(() => {
              if (statusEl) statusEl.textContent = 'Failed to save';
            }).finally(() => {
              saveBtn.disabled = false;
            });
          });
        }
      }

      function wirePeriodButtons(){
        document.querySelectorAll('.usage-period-btn').forEach(b => {
          b.addEventListener('click', () => {
            const raw = b.dataset.usagePeriod;
            const next =
              raw === 'day' || raw === 'week' || raw === 'month' || raw === 'all'
                ? raw
                : 'month';
            if (next === usagePeriod) return;
            usagePeriod = next;
            usageBreakdownOpen = false;
            loadAndPaint();
          });
        });
      }

      function loadAndPaint(){
        paintSkeleton();
        const userId = getCurrentUserId();
        const url = '/api/usage?period=' + encodeURIComponent(usagePeriod) +
                    '&userId=' + encodeURIComponent(userId);
        fetch('/api/usage-limits').then(r => r.json()).then(d => {
          if (d && ('dailyLimit' in d || 'monthlyLimit' in d)) {
            cachedLimits = {
              dailyLimit: typeof d.dailyLimit === 'number' ? d.dailyLimit : null,
              monthlyLimit: typeof d.monthlyLimit === 'number' ? d.monthlyLimit : null,
            };
          }
        }).catch(() => {});
        fetch(url).then(r => r.json()).then(paintLoaded).catch(() => {
          els.settingsBody.innerHTML = `
            <div class="row"><div class="k">Usage</div><div class="v">Failed to load.</div></div>
          `;
        });
      }

      loadAndPaint();
    }

    function renderMetricsSettings(){
      let metricsPeriod = 'week';
      let lastFetched = null;

      function fmtPct(n){ return typeof n === 'number' ? (n * 100).toFixed(1) + '%' : '—'; }
      function fmtMs(n){ return typeof n === 'number' ? n + 'ms' : '—'; }
      function fmtUsd(n){ return typeof n === 'number' ? '$' + n.toFixed(4) : '—'; }
      function fmtTime(d){ try { return d.toLocaleTimeString(); } catch(e){ return ''; } }

      function getAutoChecked(){
        const el = document.getElementById('metrics-autorefresh');
        return el ? el.checked : false;
      }

      function controlsHtml(lastStr){
        const opts = ['day','week','month'].map(p =>
          `<option value="${p}"${p === metricsPeriod ? ' selected' : ''}>${p.charAt(0).toUpperCase()+p.slice(1)}</option>`
        ).join('');
        const sel = `<select id="metrics-period" style="padding:3px 8px;background:var(--bg-input,#1e1e1e);border:1px solid var(--border,#444);border-radius:4px;color:inherit;font-size:var(--font-size-sm,12px);cursor:pointer">${opts}</select>`;
        return `
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
            <label style="font-size:var(--font-size-sm,12px);color:var(--text-3,#aaa)">Period: ${sel}</label>
            <button id="metrics-refresh" style="padding:3px 10px;background:transparent;border:1px solid var(--border,#444);border-radius:4px;color:inherit;font-size:var(--font-size-sm,12px);cursor:pointer">↻ Refresh</button>
            <label style="display:flex;align-items:center;gap:5px;font-size:var(--font-size-sm,12px);color:var(--text-3,#aaa);cursor:pointer">
              <input type="checkbox" id="metrics-autorefresh"> Auto 60s
            </label>
            ${lastStr ? `<span style="font-size:11px;color:var(--text-4,#666)">Fetched ${escapeHtml(lastStr)}</span>` : ''}
          </div>`;
      }

      function wireControls(){
        const periodEl = document.getElementById('metrics-period');
        const refreshBtn = document.getElementById('metrics-refresh');
        const autoEl = document.getElementById('metrics-autorefresh');
        if (periodEl) {
          periodEl.value = metricsPeriod;
          periodEl.addEventListener('change', () => { metricsPeriod = periodEl.value; load(); });
        }
        if (refreshBtn) refreshBtn.addEventListener('click', load);
        if (autoEl) {
          autoEl.addEventListener('change', () => {
            if (autoEl.checked) {
              if (!_metricsAutoRefreshTimer) _metricsAutoRefreshTimer = setInterval(load, 60_000);
            } else {
              clearInterval(_metricsAutoRefreshTimer);
              _metricsAutoRefreshTimer = null;
            }
          });
        }
      }

      function paintLoading(){
        els.settingsBody.innerHTML = `
          <div class="apikey-section">
            <div class="apikey-section-title">Metrics</div>
            ${controlsHtml(lastFetched ? fmtTime(lastFetched) : '')}
            <div class="metrics-tiles">${Array(7).fill(0).map(() => `
              <div class="metrics-tile">
                <div class="skeleton" style="height:22px;width:70px;margin:0 auto"></div>
                <div class="skeleton" style="height:8px;width:50px;margin:8px auto 0"></div>
              </div>`).join('')}
            </div>
          </div>`;
        wireControls();
      }

      function paintStatus(msg){
        els.settingsBody.innerHTML = `
          <div class="apikey-section">
            <div class="apikey-section-title">Metrics</div>
            ${controlsHtml(lastFetched ? fmtTime(lastFetched) : '')}
            <div style="color:var(--text-3,#aaa);font-size:var(--font-size-sm,12px);padding:10px 0">${escapeHtml(msg)}</div>
          </div>`;
        wireControls();
      }

      function barChart(items, title){
        if (!items.length) return '';
        const top = items.slice(0, 6);
        const restCount = items.slice(6).reduce((s, i) => s + i.count, 0);
        if (restCount > 0) top.push({ label: 'other', count: restCount });
        const total = top.reduce((s, i) => s + i.count, 0) || 1;
        const COLORS = ['#7fd4a4','#e0c585','#4d8f6d','#dd9090','#9d8a58','#96a39a','#647168'];
        const maxBarW = 190;
        const rowH = 28;
        const svgH = top.length * rowH + 4;
        const bars = top.map((item, i) => {
          const w = Math.max(2, Math.round((item.count / total) * maxBarW));
          const y = i * rowH + 4;
          const pct = ((item.count / total) * 100).toFixed(1);
          return [
            `<rect x="90" y="${y}" width="${w}" height="17" fill="${COLORS[i % COLORS.length]}" rx="2"/>`,
            `<text x="84" y="${y+13}" text-anchor="end" font-size="11" fill="rgba(170,170,170,0.9)">${escapeHtml(item.label)}</text>`,
            `<text x="${96+w}" y="${y+13}" font-size="11" fill="rgba(170,170,170,0.9)">${item.count} (${pct}%)</text>`,
          ].join('');
        }).join('');
        return `<div class="metrics-chart-title">${escapeHtml(title)}</div>
          <svg viewBox="0 0 360 ${svgH}" style="display:block;width:100%;max-width:380px;font-family:inherit;overflow:visible;margin-bottom:8px">${bars}</svg>`;
      }

      function gaugeBar(label, value){
        const pct = Math.round(Math.min(1, Math.max(0, value || 0)) * 100);
        return `<div style="margin-bottom:8px">
          <div style="font-size:11px;color:var(--text-4,#888);margin-bottom:3px">${escapeHtml(label)}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="metrics-gauge-track" style="width:120px"><div class="metrics-gauge-fill" style="width:${pct}%"></div></div>
            <span style="font-size:11px;color:var(--text-3,#aaa)">${pct}%</span>
          </div>
        </div>`;
      }

      function paint(data){
        lastFetched = new Date();
        const tiles = [
          { val: data.runs,                                          lbl: 'Runs' },
          { val: fmtUsd(data.usdTotal),                             lbl: 'USD Total' },
          { val: fmtPct(data.cacheHitRatio),                       lbl: 'Cache Hit' },
          { val: fmtPct(data.gracefulDegradeRate),                 lbl: 'Degrade Rate' },
          { val: fmtPct(data.resumableRate),                       lbl: 'Resumable' },
          { val: fmtMs(data.latencyMs && data.latencyMs.p50),      lbl: 'p50 Latency' },
          { val: fmtMs(data.latencyMs && data.latencyMs.p95),      lbl: 'p95 Latency' },
        ];
        const tilesHtml = tiles.map(t =>
          `<div class="metrics-tile"><div class="metrics-tile-val">${escapeHtml(String(t.val))}</div><div class="metrics-tile-lbl">${escapeHtml(t.lbl)}</div></div>`
        ).join('');

        const tierDist = data.tierDistribution || {};
        const tierItems = ['simple','medium','complex']
          .map(t => ({ label: t, count: tierDist[t] || 0 }))
          .filter(i => i.count > 0);

        const termDist = data.terminationDistribution || {};
        const termItems = Object.entries(termDist)
          .map(([label, count]) => ({ label, count }))
          .sort((a, b) => b.count - a.count);

        const chartsHtml = data.runs > 0 ? `
          <div style="margin-top:4px;display:grid;grid-template-columns:1fr 1fr;gap:20px;flex-wrap:wrap">
            <div>${barChart(tierItems, 'Tier Distribution')}</div>
            <div>${barChart(termItems, 'Termination Distribution')}</div>
          </div>
          <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:360px">
            <div>${gaugeBar('Degrade Rate', data.gracefulDegradeRate)}</div>
            <div>${gaugeBar('Resumable (of degraded)', data.resumableRate)}</div>
          </div>` : '';

        els.settingsBody.innerHTML = `
          <div class="apikey-section">
            <div class="apikey-section-title">Metrics</div>
            ${controlsHtml(fmtTime(lastFetched))}
            ${data.runs === 0
              ? `<div style="color:var(--text-4,#888);font-size:var(--font-size-sm,12px);padding:10px 0">No runs in this period.</div>`
              : `<div class="metrics-tiles">${tilesHtml}</div>`}
            ${chartsHtml}
            <div style="opacity:.4;font-size:11px;margin-top:12px">Server cache TTL: 60s · Generated ${escapeHtml(data.generatedAt || '')}</div>
          </div>`;
        wireControls();
      }

      async function load(){
        const adminSecret = localStorage.getItem('zoneAdminSecret');
        const headers = {};
        if (adminSecret) headers['x-admin-secret'] = adminSecret;
        paintLoading();
        try {
          const resp = await fetch('/api/metrics?period=' + encodeURIComponent(metricsPeriod), { headers });
          if (resp.status === 401) {
            paintStatus('Admin secret required. Set "zoneAdminSecret" in localStorage to view metrics.');
            return;
          }
          if (!resp.ok) {
            paintStatus('Error ' + resp.status + ': ' + resp.statusText);
            return;
          }
          const data = await resp.json();
          paint(data);
        } catch(err){
          paintStatus('Fetch failed: ' + ((err && err.message) || 'network error'));
        }
      }

      load();
    }


    // ---- Wiring ----
    function init(){
      loadThreads();
      loadReposFromStorage();
      loadSidebarOpenWidth();
      loadSidebarState();
      ensureRepos();
      // Phase 1b: close all per-runId EventSources on page unload so the
      // browser doesn't keep N HTTP connections open after navigation.
      try {
        window.addEventListener('beforeunload', () => {
          for (const es of state.eventSourcesByRunId.values()) {
            try { es.close(); } catch {}
          }
          state.eventSourcesByRunId.clear();
        });
      } catch {}
      renderRepoDropdown();
      renderQueuePanel();
      updateInputPlaceholder();
      renderBgTasks();

      if (!state.repos.length) {
        // still allow UI, but guide
      }

      // restore active thread if any (Phase 1b+: persist last-active across refresh)
      if (state.threads.length) {
        let savedId = null;
        try { savedId = localStorage.getItem('zone_active_thread_id'); } catch {}
        const matches = savedId && state.threads.find((t) => t && t.id === savedId);
        state.activeThreadId = matches ? savedId : state.threads[0].id;
      }
      renderSidebar();
      renderActiveThread();

      // filter button no-op active tint
      els.filterBtn.addEventListener('click', () => {
        els.filterBtn.classList.toggle('active');
        closeNewThreadDropdown();
      });

      els.newThreadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openNewThreadDropdown();
      });
      if (els.sidebarToggle) {
        els.sidebarToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          cycleSidebarState();
        });
      }
      if (els.sidebarResizer) {
        els.sidebarResizer.addEventListener('mousedown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          startSidebarResize(e);
        });
      }
      document.addEventListener('click', (e) => {
        const dd = els.newThreadDropdown;
        if (!dd.contains(e.target) && e.target !== els.newThreadBtn) closeNewThreadDropdown();
      });
      document.addEventListener('click', (e) => {
        const btn = e.target instanceof Element ? e.target.closest('.exec-view-btn') : null;
        if (!btn) return;
        e.preventDefault();
        setExecutionViewMode(String(btn.dataset.viewMode || 'summary'));
      });

      document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        renderSidebar(t.dataset.tab);
      }));

      els.repoChip.addEventListener('click', cycleRepo);

      els.branchChip.addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.branchDropdownOpen) closeBranchDropdown();
        else openBranchDropdown();
      });

      document.addEventListener('click', (e) => {
        if (!state.branchDropdownOpen) return;
        if (els.branchDropdown.contains(e.target)) return;
        if (els.branchChip.contains(e.target)) return;
        closeBranchDropdown();
      });

      if (els.bgTasksHeader) {
        els.bgTasksHeader.addEventListener('click', toggleBgTasks);
      }

      els.taskInput.addEventListener('input', autosizeTextarea);
      els.taskInput.addEventListener('keydown', maybeSendFromEnter);
      if (els.modeSelector) {
        setSelectedMode(state.selectedMode);
        els.modeSelector.addEventListener('click', (e) => {
          const btn = e.target && e.target.closest ? e.target.closest('.modePill') : null;
          if (!btn) return;
          setSelectedMode(btn.dataset.mode);
        });
      }
      els.sendBtn.addEventListener('click', () => {
        if (els.sendBtn.classList.contains('send-btn--stop')) {
          void cancelActivePatchRun();
          return;
        }
        const task = String(els.taskInput.value || '').trim();
        if (!task) {
          try { console.log('[send-debug] EARLY RETURN reason=empty_task_button_click'); } catch {}
          return;
        }
        try {
          console.log('[send-debug] button clicked, threadId=' + String(state.activeThreadId || ''), {
            projectPath: state.activeRepo?.path || '',
            inputText: task,
            source: 'button',
          });
        } catch {}
        els.taskInput.value = '';
        autosizeTextarea();
        // Phase 1b: gate on ACTIVE thread's run, allowing concurrent dispatch.
        if (getRun(state.activeThreadId)) {
          try { console.log('[send-debug] EARLY RETURN reason=active_thread_running_enqueued_from_button', { activeThreadId: state.activeThreadId, queueLength: (state.taskQueuesByThread.get(state.activeThreadId) || []).length }); } catch {}
          enqueueTask(task);
          return;
        }
        sendMessage(task);
      });

      if (els.attachBtn) {
        els.attachBtn.addEventListener('click', () => { if (els.attachFileInput) els.attachFileInput.click(); });
      }
      if (els.attachFileInput) {
        els.attachFileInput.addEventListener('change', async function() {
          const files = Array.from(this.files || []);
          for (const file of files) {
            if (state.pendingAttachments.length >= 4) break;
            if (!file.type.startsWith('image/')) continue;
            const base64 = await new Promise(resolve => {
              const reader = new FileReader();
              reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
              reader.readAsDataURL(file);
            });
            if (base64) state.pendingAttachments.push({ mediaType: file.type, base64 });
          }
          renderAttachPreviewStrip();
          this.value = '';
        });
      }

      els.openSettingsBtn.addEventListener('click', openSettings);
      els.closeSettingsBtn.addEventListener('click', closeSettings);
      els.settingsOverlay.addEventListener('click', (e) => {
        if (e.target === els.settingsOverlay) closeSettings();
      });
      document.querySelectorAll('.mtab').forEach(b => b.addEventListener('click', () => renderSettingsTab(b.dataset.stab)));

      document.addEventListener('keydown', function(e) {
        if (!(e.metaKey || e.ctrlKey) || !e.shiftKey || e.key.toLowerCase() !== 'c') return;
        const activeTag = String(document.activeElement?.tagName || '').toLowerCase();
        if (activeTag === 'input' || activeTag === 'textarea') return;
        e.preventDefault();
        if (typeof _lastFormatCopyFn === 'function') _lastFormatCopyFn();
      });

      autosizeTextarea();
      setIdleUI();
    }

    init();
  </script>
</body>
</html>
