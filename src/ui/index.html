<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zone</title>
</head>
<body>
<div class="prompt-box">Zone prompt</div>
<script>
let currentPatches = [];
let currentRepoPath = '';
let currentRole = 'developer';
let currentProgressSource = null;
let currentRunId = '';
let currentSummaryState = {};
const RECENT_RUNS_KEY = 'zone_recent_runs';
const MAX_RECENT_RUNS = 6;

function formatMetadataBadge(parts){const safeParts=(parts||[]).filter(Boolean);return safeParts.length>0?safeParts.join(' / '):'';}
function formatRoleLabel(role){const labels={developer:'Developer',test_engineer:'Test Engineer',data_analyst:'Data Analyst'};return labels[role]||'Developer';}
function formatStatusLabel(status){const labels={safe_to_apply:'Safe to Apply',preview_only:'Preview Only',blocked:'Blocked',success:'Success',error:'Error'};return labels[status]||'Ready';}
function formatRecentRunTime(timestamp){if(!timestamp)return 'unknown time';const diffMs=Math.max(0,Date.now()-timestamp);const diffMinutes=Math.floor(diffMs/60000);if(diffMinutes<1)return 'just now';if(diffMinutes<60)return `${diffMinutes}m ago`;const diffHours=Math.floor(diffMinutes/60);if(diffHours<24)return `${diffHours}h ago`;const diffDays=Math.floor(diffHours/24);return `${diffDays}d ago`;}
function escapeHtml(value){return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function formatFileOperation(filePath){return String(filePath||'').includes('[modify]')?'modify':'create';}
function formatFileLabel(filePath,index){return filePath||`generated_file_${index+1}`;}
function buildFilePreviewCards(patches){return (patches||[]).map((patch,index)=>{const filePath=formatFileLabel(patch.filePath,index);const content=escapeHtml(patch.fullContent||'(no content available)');const operation=formatFileOperation(filePath);return `<details class="file-card file-toggle" ${index===0?'open':''}><summary><div class="file-row"><span class="fname">${escapeHtml(filePath)}</span><span class="fop ${operation}">${operation}</span></div></summary><div class="file-content"><pre>${content}</pre></div></details>`;}).join('');}
function renderContextFiles(contextFiles){const box=document.getElementById('contextFilesBox');const list=document.getElementById('contextFilesList');const safeFiles=(contextFiles||[]).filter(Boolean);if(safeFiles.length===0){list.innerHTML='';box.classList.add('hidden');return;}list.innerHTML=safeFiles.map((filePath)=>`<li>${escapeHtml(filePath)}</li>`).join('');box.classList.remove('hidden');}
function getRecentRuns(){try{const parsed=JSON.parse(localStorage.getItem(RECENT_RUNS_KEY)||'[]');return Array.isArray(parsed)?parsed.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)):[];}catch{return [];}}
function saveRecentRuns(runs){localStorage.setItem(RECENT_RUNS_KEY,JSON.stringify(runs.slice(0,MAX_RECENT_RUNS)));}
function renderRecentRuns(){const runs=getRecentRuns();const empty=document.getElementById('recentRunsEmpty');const list=document.getElementById('recentRunsList');if(runs.length===0){empty.classList.remove('hidden');list.classList.add('hidden');list.innerHTML='';return;}empty.classList.add('hidden');list.classList.remove('hidden');list.innerHTML=runs.map((run,index)=>`<button class="recent-run-item" onclick="loadRecentRun(${index})"><div class="recent-run-top"><span class="recent-run-task">${escapeHtml(run.task||'(no task)')}</span><span class="recent-run-status ${run.status==='error'?'error':'success'}">${escapeHtml(run.status||'success')}</span></div><div class="recent-run-meta"><span>${escapeHtml(formatRoleLabel(run.role))}</span><span>${escapeHtml(run.repoPath||'(no repo path)')}</span><span>${escapeHtml(formatRecentRunTime(run.timestamp))}</span></div></button>`).join('');}
function addRecentRun(run){const recentRuns=[{task:run.task||'',role:run.role||'developer',repoPath:run.repoPath||'',status:run.status||'success',timestamp:typeof run.timestamp==='number'?run.timestamp:Date.now()},...getRecentRuns()].slice(0,MAX_RECENT_RUNS);saveRecentRuns(recentRuns);renderRecentRuns();}
function loadRecentRun(index){const run=getRecentRuns()[index];if(!run)return;document.getElementById('task').value=run.task||'';document.getElementById('repoPath').value=run.repoPath||'';const matchingButton=Array.from(document.querySelectorAll('.role-btn')).find((button)=>button.dataset.role===run.role);if(matchingButton){selectRole(matchingButton);}}
function renderResultSummary(){const title=document.getElementById('resultSummaryTitle');const subtitle=document.getElementById('resultSummarySubtitle');const chips=document.getElementById('resultSummaryChips');const roleLabel=formatRoleLabel(currentSummaryState.role||currentRole);const statusLabel=formatStatusLabel(currentSummaryState.status);const warningCount=currentSummaryState.warningCount ?? 0;const fileCount=currentSummaryState.fileCount ?? 0;const summaryChips=[`Status: ${statusLabel}`,fileCount>0?`Files: ${fileCount}`:'',`Warnings: ${warningCount}`,currentSummaryState.contextCount?`Context: ${currentSummaryState.contextCount}`:'',currentSummaryState.framework?`Framework: ${currentSummaryState.framework}`:'',currentSummaryState.complexity?`Complexity: ${currentSummaryState.complexity}`:'',currentSummaryState.dialect?`Dialect: ${currentSummaryState.dialect}`:'',currentSummaryState.migrationFormat?`Format: ${currentSummaryState.migrationFormat}`:''].filter(Boolean);title.textContent=`${roleLabel} Result`;subtitle.textContent=`${roleLabel} run summary`;chips.innerHTML=summaryChips.map((chip)=>`<span class="result-chip">${escapeHtml(chip)}</span>`).join('');}
function updateResultSummary(partialState){currentSummaryState={...currentSummaryState,...partialState};renderResultSummary();}
function closeProgressStream(){if(currentProgressSource){currentProgressSource.close();currentProgressSource=null;}}
function setProgress(stage){const box=document.getElementById('progressBox');const text=document.getElementById('progressText');if(!stage){text.textContent='';box.classList.add('hidden');box.style.display='none';return;}text.textContent='⏳ '+stage;box.classList.remove('hidden');box.style.display='block';}
function startProgress(runId,initialStage){closeProgressStream();currentRunId=runId;setProgress(initialStage);if(typeof EventSource!=='function')return;const source=new EventSource(`/api/progress?runId=${encodeURIComponent(runId)}`);source.onmessage=(event)=>{try{const payload=JSON.parse(event.data);if(payload.stage&&payload.stage!=='Connected'){setProgress(payload.stage);}}catch{if(event.data&&event.data!=='Connected'){setProgress(event.data);}}};source.onerror=()=>{closeProgressStream();};currentProgressSource=source;}
function finishProgress(){setProgress('Ready');closeProgressStream();}
function resetProgress(){closeProgressStream();currentRunId='';setProgress('');}
function getHistory(){try{return JSON.parse(localStorage.getItem('zone_repo_history')||'[]');}catch{return [];}}
function saveToHistory(path){let h=getHistory().filter((p)=>p!==path);h.unshift(path);h=h.slice(0,5);localStorage.setItem('zone_repo_history',JSON.stringify(h));renderHistory();}
function renderHistory(){const h=getHistory();const box=document.getElementById('historyBox');const sel=document.getElementById('historySelect');if(h.length===0){box.classList.add('hidden');return;}box.classList.remove('hidden');sel.innerHTML='<option value="">— select —</option>'+h.map((p)=>`<option value="${p}">${p}</option>`).join('');}
function selectHistory(){const val=document.getElementById('historySelect').value;if(val)document.getElementById('repoPath').value=val;}
function selectRole(btn){document.querySelectorAll('.role-btn').forEach((b)=>b.classList.remove('active'));btn.classList.add('active');currentRole=btn.dataset.role;const placeholder={developer:'add input validation to login form...',test_engineer:'write a cucumber scenario for one-way flight search...',data_analyst:'create a users table with id, email, created_at...'};document.getElementById('task').placeholder=placeholder[currentRole]||'';}
function copyPrompt(){const text=(document.querySelector('.prompt-box').innerText||'').replace('copy','').trim();navigator.clipboard.writeText(text);}
function showError(msg){const box=document.getElementById('errorBox');box.textContent='? '+msg;box.style.display='block';}
function hideError(){document.getElementById('errorBox').style.display='none';}
function setLoading(loading){const btn=document.getElementById('execBtn');const spinner=document.getElementById('spinner');const text=document.getElementById('execText');btn.disabled=loading;spinner.style.display=loading?'block':'none';text.textContent=loading?'Running...':'? Execute';}
async function execute(){const task=document.getElementById('task').value.trim();const repoPath=document.getElementById('repoPath').value.trim();if(!task||!repoPath){showError('Task and repo path are required.');return;}resetProgress();hideError();currentSummaryState={role:currentRole,status:'',fileCount:0,warningCount:0,contextCount:0};renderResultSummary();currentRepoPath=repoPath;saveToHistory(repoPath);setLoading(true);document.getElementById('successBox').style.display='none';document.getElementById('warningsList').classList.add('hidden');const runId=`${Date.now()}-${Math.random().toString(36).slice(2,8)}`;const initialStage=currentRole==='data_analyst'||currentRole==='test_engineer'?'Scanning repo...':'Generating patch...';startProgress(runId,initialStage);try{if(currentRole==='test_engineer'){const r=await fetch('/api/test-engineer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,repoPath,runId})});if(!r.ok)throw new Error('Test engineer flow failed: '+r.status);const result=await r.json();if(!result.ok){showError(result.reason||'Test generation failed.');return;}showDecision({decision:{mode:result.confidence>=70?'safe_to_apply':'preview_only'},confidence:{score:result.confidence},risk:{score:0,breakdown:{}},frameworkBadge:formatMetadataBadge([result.framework,result.language]),complexity:result.complexity});showPatch({ok:true,patchPreview:result.preview,applyPatches:result.applyPatches,warnings:result.warnings});addRecentRun({task,role:currentRole,repoPath,status:'success',timestamp:Date.now()});currentPatches=result.applyPatches||[];finishProgress();}else if(currentRole==='data_analyst'){const r=await fetch('/api/data-analyst',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,repoPath,runId})});if(!r.ok)throw new Error('Data analyst flow failed: '+r.status);const result=await r.json();if(!result.ok){showError(result.reason||'SQL generation failed.');return;}showDecision({decision:{mode:result.confidence>=70?'safe_to_apply':'preview_only'},confidence:{score:result.confidence},risk:{score:0,breakdown:{}},frameworkBadge:formatMetadataBadge([result.dialect,result.migrationFormat])});showPatch({ok:true,patchPreview:result.preview,applyPatches:result.applyPatches,warnings:result.warnings});addRecentRun({task,role:currentRole,repoPath,status:'success',timestamp:Date.now()});currentPatches=result.applyPatches||[];finishProgress();}else{setProgress('Scanning repo...');const r1=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,repoPath,runId})});if(!r1.ok)throw new Error('Analyze failed: '+r1.status);const analyze=await r1.json();showDecision(analyze);setProgress('Generating patch...');const r2=await fetch('/api/patch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,repoPath,runId})});if(!r2.ok)throw new Error('Patch failed: '+r2.status);const patch=await r2.json();showPatch(patch);addRecentRun({task,role:currentRole,repoPath,status:patch.ok===false?'error':'success',timestamp:Date.now()});currentPatches=patch.applyPatches||[];finishProgress();}}catch(e){resetProgress();addRecentRun({task,role:currentRole,repoPath,status:'error',timestamp:Date.now()});showError(e.message);}finally{setLoading(false);}}
function showDecision(data){const mode=data.decision?.mode||'safe_to_apply';const conf=data.confidence?.score ?? 0;const risk=data.risk?.score ?? 0;const bd=data.risk?.breakdown||{};const badge=document.getElementById('decisionBadge');const bdot=document.getElementById('bdot');const badgeText=document.getElementById('badgeText');const cls=mode==='blocked'?'blocked':mode==='preview_only'?'preview':'safe';const dotColor=mode==='blocked'?'#f44747':mode==='preview_only'?'#ce9178':'#4ec9b0';badge.className='decision-badge '+cls;bdot.style.background=dotColor;badgeText.textContent=mode.replace(/_/g,' ');document.getElementById('confVal').textContent=String(conf);document.getElementById('riskVal').textContent=String(risk);const d=bd.destructive||0;const s=bd.schema||0;const m=bd.massScope||bd.mass_scope||0;document.getElementById('rDestructive').style.width=Math.min(d,100)+'%';document.getElementById('rDestructiveVal').textContent=String(d);document.getElementById('rSchema').style.width=Math.min(s,100)+'%';document.getElementById('rSchemaVal').textContent=String(s);document.getElementById('rMass').style.width=Math.min(m,100)+'%';document.getElementById('rMassVal').textContent=String(m);const fb=document.getElementById('frameworkBadge');if(data.frameworkBadge){fb.textContent='🔍 '+data.frameworkBadge;fb.classList.remove('hidden');}else{fb.classList.add('hidden');}const complexityBadge=document.getElementById('complexityBadge');const complexityLabels={simple:'Simple',data_driven:'Data Driven',e2e:'E2E',negative:'Negative',multi_scenario:'Multi Scenario'};if(data.complexity&&complexityLabels[data.complexity]){complexityBadge.textContent=complexityLabels[data.complexity];complexityBadge.className='complexity-badge '+data.complexity;complexityBadge.classList.remove('hidden');}else{complexityBadge.textContent='';complexityBadge.className='complexity-badge hidden';}const frameworkParts=String(data.frameworkBadge||'').replace(/^[^A-Za-z0-9]*\s*/,'').split(' / ');updateResultSummary({role:currentRole,status:mode,framework:currentRole==='test_engineer'?frameworkParts[0]||'':'',complexity:currentRole==='test_engineer'&&data.complexity?complexityLabels[data.complexity]:'',dialect:currentRole==='data_analyst'?frameworkParts[0]||'':'',migrationFormat:currentRole==='data_analyst'?frameworkParts[1]||'':''});document.getElementById('decisionSection').classList.remove('hidden');}
function showPatch(data){if(!data.ok){showError('Patch generation failed.');return;}const warnings=data.warnings||[];const wList=document.getElementById('warningsList');if(warnings.length>0){wList.innerHTML=warnings.map((w)=>`<div class="warning-item">${w}</div>`).join('');wList.classList.remove('hidden');}else{wList.classList.add('hidden');}const preview=data.patchPreview||'';const summaryMatch=preview.match(/Summary: (.+?)(\n|$)/);const summaryText=summaryMatch?summaryMatch[1]:preview;document.getElementById('patchSummary').textContent=summaryText;renderContextFiles(data.contextFiles);const patches=data.applyPatches||[];document.getElementById('filesVal').textContent=String(patches.length);updateResultSummary({role:currentRole,fileCount:patches.length,warningCount:warnings.length,contextCount:Array.isArray(data.contextFiles)?data.contextFiles.filter(Boolean).length:0});document.getElementById('fileList').innerHTML=buildFilePreviewCards(patches);document.getElementById('successBox').style.display='none';document.getElementById('patchSection').classList.remove('hidden');}
async function applyChanges(){if(!currentPatches.length){showError('No patches to apply.');return;}const btn=document.getElementById('applyBtn');const spinner=document.getElementById('applySpinner');const text=document.getElementById('applyText');btn.disabled=true;spinner.style.display='block';text.textContent='Applying...';try{const r=await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patches:currentPatches,repoPath:currentRepoPath})});if(!r.ok)throw new Error('Apply failed: '+r.status);const result=await r.json();const applied=result.applied||[];const failed=result.failed||[];const successBox=document.getElementById('successBox');if(applied.length>0){successBox.innerHTML='? Applied successfully:<br>'+applied.map((f)=>`&nbsp;&nbsp;• ${f}`).join('<br>');if(failed.length>0)successBox.innerHTML+='<br>? Failed: '+failed.join(', ');successBox.style.display='block';}else{showError('No files were applied. Failed: '+failed.join(', '));}}catch(e){showError(e.message);}finally{btn.disabled=false;spinner.style.display='none';text.textContent='? Apply Changes';}}
function resetUI(){document.getElementById('task').value='';document.getElementById('repoPath').value='';document.getElementById('decisionSection').classList.add('hidden');document.getElementById('patchSection').classList.add('hidden');hideError();document.getElementById('warningsList').classList.add('hidden');document.getElementById('successBox').style.display='none';document.getElementById('contextFilesList').innerHTML='';document.getElementById('contextFilesBox').classList.add('hidden');const complexityBadge=document.getElementById('complexityBadge');complexityBadge.textContent='';complexityBadge.className='complexity-badge hidden';currentSummaryState={role:currentRole,status:'',fileCount:0,warningCount:0,contextCount:0};renderResultSummary();resetProgress();currentPatches=[];currentRepoPath='';renderHistory();}
renderHistory();renderRecentRuns();currentSummaryState={role:currentRole,status:'',fileCount:0,warningCount:0,contextCount:0};renderResultSummary();
</script>
</body>
</html>
