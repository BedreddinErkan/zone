    function syncInterruptedRunsFromCache(activeRunsById){
      const runs = activeRunsById || state.__activeRunsById || {};
      const activeThreadId = String(state.activeThreadId || '').trim();
      Object.values(runs).forEach((run) => {
        const rid = String(run?.runId || '').trim();
        if (!rid || String(run?.status || '') !== 'interrupted') return;
        if (activeThreadId && String(run?.threadId || '').trim() && String(run.threadId).trim() !== activeThreadId) {
          return;
        }
        const g = document.getElementById(`runGroup-${rid}`);
        if (!g) return;
        if (String(g?.dataset?.runStatus || '') === 'running') {
          try { console.log('[resume-debug] deferring interrupted cache render until /api/run-status resolves', { runId: rid }); } catch {}
          return;
        }
        try { g.dataset.runStatus = 'interrupted'; } catch {}
        setResumeButton(rid);
      });
    }

    async function reconnectInProgressRuns(activeRunsById){
      const stats = { lost: 0, recovered: 0 };
      // Phase 1c: ensure __activeRunsById is hot before scanning. Without
      // this, a caller that skipped fetchActiveRunsForCurrentUser would
      // miss owning threadIds and SSE events would route to the active
      // thread instead of the run's owning thread.
      if (!activeRunsById) {
        activeRunsById = await fetchActiveRunsForCurrentUser();
      }
      try {
        const cachedRuns = activeRunsById || state.__activeRunsById || {};
        const groups = Array.from(document.querySelectorAll('.run-group[data-run-status="running"][id^="runGroup-"]'));
        for (const g of groups) {
          const rid = String(g.id || '').replace(/^runGroup-/, '');
          if (!rid) continue;
          const logBlock = document.getElementById(`logBlock-${rid}`);
          if (!logBlock) continue;

          setResumeBadge(rid, 'reconnecting', 'Reconnecting…');
          let status = null;
          let statusHttpOk = false;
          let statusHttpCode = null;
          try {
            const r = await apiFetch(`/api/run-status/${encodeURIComponent(rid)}`);
            statusHttpOk = r.ok;
            statusHttpCode = r.status;
            status = r.ok ? await r.json() : null;
          } catch { status = null; }
          try {
            console.log('[resume-debug] /api/run-status response', {
              runId: rid,
              httpOk: statusHttpOk,
              httpCode: statusHttpCode,
              status,
            });
          } catch {}

          // Phase 1d-prep: per-candidate decision log. _runMeta is hoisted
          // here from the running branch so we can report it on every
          // candidate, regardless of which branch fires. No behavior change —
          // the lookup is a pure getter into state.__activeRunsById.
          const _runMeta = state.__activeRunsById?.[rid] || null;
          try {
            console.info('[resume-debug] candidate decision', {
              rid,
              hasMeta: !!_runMeta,
              metaStatus: _runMeta?.status ?? null,
              metaThreadId: _runMeta?.threadId ?? null,
              inActiveRunsById: rid in (state.__activeRunsById || {}),
              activeRunsByIdKeys: Object.keys(state.__activeRunsById || {}),
            });
          } catch {}

          if (!status || !status.ok) {
            const interruptedRun = cachedRuns[rid];
            let _branchReason;
            if (interruptedRun && String(interruptedRun.status || '') === 'interrupted') {
              try { console.log('[resume-debug] branch: interrupted-via-active-runs', { runId: rid, interruptedRun }); } catch {}
              try { g.dataset.runStatus = 'interrupted'; } catch {}
              setResumeButton(rid);
              stats.recovered += 1;
              _branchReason = 'interrupted_from_cache';
            } else {
              try { console.log('[resume-debug] branch: lost-run', { runId: rid, interruptedRun }); } catch {}
              setResumeBadge(rid, 'interrupted', 'Lost');
              stats.lost += 1;
              _branchReason = 'lost';
            }
            if (g.dataset.interruptedLogged !== '1') {
              try { appendLogLine(logBlock, { timestamp: nowTs(), message: 'interrupted — server restarted', status: 'warning' }); } catch {}
              g.dataset.interruptedLogged = '1';
            }
            try { console.info('[resume-debug] candidate routed', { rid, branch: 'fallthrough', reason: _branchReason }); } catch {}
            continue;
          }

          const st = String(status.status || '');
          // restore running UI state for Scenario A
          if (st === 'running') {
            try { console.log('[resume-debug] branch: running-replay', { runId: rid }); } catch {}
            // Phase 1b fix: skip replay if a live SSE stream is already
            // attached for this runId. Per-thread containers preserve
            // in-flight run DOM across thread switches, so re-streaming
            // the event history would duplicate every node. Replay is
            // still needed for page-reload scenarios where no live ES exists.
            if (state.eventSourcesByRunId?.has(rid)) {
              try { console.log('[resume-debug] skipping replay — live SSE already attached', { runId: rid }); } catch {}
              setResumeBadge(rid, 'live', 'Live');
              stats.recovered += 1;
              try { console.info('[resume-debug] candidate routed', { rid, branch: 'running', reason: 'live_es_attached' }); } catch {}
              return stats;
            }
            // Phase 1c: register this run in the per-thread map BEFORE
            // replay opens. Without it, getThreadIdForRunId(rid) returns
            // null and SSE events fall back to the active thread — causing
            // a different thread's run to render in whatever thread the
            // user is viewing. The owning threadId comes from
            // /api/active-runs (cached in state.__activeRunsById, populated
            // at the top of this function). If the meta is still missing
            // post-fetch, skip and warn — never fall through to a legacy
            // state.currentRunId write that would bind the run to the
            // active thread.
            // _runMeta hoisted to the top of the iteration (Phase 1d-prep).
            const _owningThreadId = _runMeta?.threadId || null;
            if (!_owningThreadId) {
              try { console.warn('[resume-debug] runMeta missing post-fetch, skipping', { rid }); } catch {}
              try { console.info('[resume-debug] candidate routed', { rid, branch: 'fallthrough', reason: 'no_meta' }); } catch {}
              continue;
            }
            try { console.info('[resume-debug] registering run with owning thread', { runId: rid, threadId: _owningThreadId }); } catch {}
            setRun(_owningThreadId, { runId: rid, startedAt: Date.now() });
            state.runId = rid;
            setRunningUI(true);
            openReplaySSE(rid);
            setResumeBadge(rid, 'live', 'Live');
            stats.recovered += 1;
            try { console.info('[resume-debug] candidate routed', { rid, branch: 'running' }); } catch {}
            return stats; // only one active run supported
          }
          if (st === 'completed' || st === 'cancelled') {
            try { console.log('[resume-debug] branch: replay-final-status', { runId: rid, status: st }); } catch {}
            // Phase 1b fix: same as above — if live SSE is attached for
            // this runId, all events have already been delivered to the
            // (per-thread) DOM in this session. Skip replay to avoid duplicates.
            if (state.eventSourcesByRunId?.has(rid)) {
              try { console.log('[resume-debug] skipping replay — live SSE already attached', { runId: rid }); } catch {}
              setResumeBadge(rid, st === 'completed' ? 'live' : 'interrupted', st === 'completed' ? 'Caught up' : 'Cancelled');
              try { g.dataset.runStatus = st; } catch {}
              try { logBlock.classList.add('done'); } catch {}
              stats.recovered += 1;
              try { console.info('[resume-debug] candidate routed', { rid, branch: st, reason: 'live_es_attached' }); } catch {}
              continue;
            }
            // Replay once to catch up then mark done (page reload scenario).
            openReplaySSE(rid);
            setResumeBadge(rid, st === 'completed' ? 'live' : 'interrupted', st === 'completed' ? 'Caught up' : 'Cancelled');
            try { g.dataset.runStatus = st; } catch {}
            try { logBlock.classList.add('done'); } catch {}
            stats.recovered += 1;
            try { console.info('[resume-debug] candidate routed', { rid, branch: st, reason: 'replay' }); } catch {}
            continue;
          }
          if (st === 'interrupted') {
            try { console.log('[resume-debug] branch: interrupted-via-run-status', { runId: rid, status: st }); } catch {}
            try { g.dataset.runStatus = 'interrupted'; } catch {}
            setResumeButton(rid);
            stats.recovered += 1;
            try { console.info('[resume-debug] candidate routed', { rid, branch: 'fallthrough', reason: 'interrupted_via_run_status' }); } catch {}
            continue;
          }
          try { console.log('[resume-debug] branch: unknown-status', { runId: rid, status: st }); } catch {}
          try { console.info('[resume-debug] candidate routed', { rid, branch: 'fallthrough', reason: 'unknown_status', st }); } catch {}
        }
      } catch {}
      return stats;
    }

    async function syncActiveRunUi(){
      const startedAt = Date.now();
      const candidateGroups = Array.from(document.querySelectorAll('.run-group[data-run-status="running"][id^="runGroup-"]'));
      const candidateIds = candidateGroups
        .map((g) => String(g.id || '').replace(/^runGroup-/, ''))
        .filter(Boolean);
      state.__resumeScanInProgress = true;
      try { console.log('[resume-debug] starting resume scan, candidate count=' + candidateIds.length, { candidateIds }); } catch {}
      try {
        const activeRunsById = await fetchActiveRunsForCurrentUser();
        syncInterruptedRunsFromCache(activeRunsById);
        const stats = await reconnectInProgressRuns(activeRunsById);
        try { console.log('[resume-debug] scan complete, ms=' + (Date.now() - startedAt), { lost: Number(stats?.lost || 0), recovered: Number(stats?.recovered || 0) }); } catch {}
      } finally {
        state.__resumeScanInProgress = false;
      }
    }

    function normalizeStatus(s){
      if (s === 'success') return 'success';
      if (s === 'warning') return 'warning';
      if (s === 'error') return 'error';
      if (s === 'done') return 'done';
      return 'active';
    }

    /** Tool stderr/stdout: show first line only in the log preview. */
    function condenseToolOutputForLog(text){
      const raw = String(text || '').replace(/\r\n/g, '\n');
      const lines = raw.split('\n');
      const first = (lines[0] || '').trim();
      const max = 280;
      const head = first.length > max ? (first.slice(0, max) + '...') : first;
      if (lines.length <= 1 && raw.length <= max) return head;
      return head ? (head + ' ...') : '...';
    }

    // F1.1: incremental JSON parsing helpers for tool-input typewriter blocks.
    function decodeJsonString(s) {
      return s.replace(/\\(["\\\/bfnrt]|u[0-9a-fA-F]{4})/g, function(m, e) {
        if (e === 'n') return '\n';
        if (e === 't') return '\t';
        if (e === 'r') return '\r';
        if (e === '"') return '"';
        if (e === '\\') return '\\';
        if (e === '/') return '/';
        if (e === 'b') return '\b';
        if (e === 'f') return '\f';
        return String.fromCharCode(parseInt(e.slice(1), 16));
      });
    }
    function tryExtractToolStreamFields(accumJson) {
      var result = { filePath: '', patchRaw: '' };
      var fpMatch = accumJson.match(/"filePath"\s*:\s*"((?:[^"\\]|\\.)*)"/);
      if (fpMatch) result.filePath = decodeJsonString(fpMatch[1]);
      var patchMatch = accumJson.match(/"(?:patch|content)"\s*:\s*"([\s\S]*)$/);
      if (patchMatch) {
        var raw = patchMatch[1];
        var completeMatch = raw.match(/^((?:[^"\\]|\\.)*)"[\s\S]*$/);
        if (completeMatch) {
          result.patchRaw = completeMatch[1];
        } else {
          result.patchRaw = raw.endsWith('\\') ? raw.slice(0, -1) : raw;
        }
      }
      return result;
    }
    function renderToolStreamBody(preEl, decodedPatch) {
      // F1.2: real apply_patch markers are '--- FIND ---' / '--- REPLACE ---'
      // (not the git-merge style '<<<<<<< FIND' F1.1 was looking for).
      var FIND_MARKER = '--- FIND ---';
      var REPLACE_MARKER = '--- REPLACE ---';
      var hasFind = decodedPatch.indexOf(FIND_MARKER) !== -1;
      var hasReplace = decodedPatch.indexOf(REPLACE_MARKER) !== -1;
      // Partial stream (FIND arrived but not REPLACE yet): show plain text and
      // wait for the REPLACE marker before upgrading to diff render.
      if (!hasFind || !hasReplace) { preEl.textContent = decodedPatch; return; }
      preEl.innerHTML = '';
      var lines = decodedPatch.split('\n');
      var section = 'before';
      for (var j = 0; j < lines.length; j++) {
        var line = lines[j];
        var tr = line.trim();
        if (tr === FIND_MARKER) { section = 'find'; continue; }
        if (tr === REPLACE_MARKER) { section = 'replace'; continue; }
        if (section === 'before') continue;
        // Skip empty trailing lines in find/replace sections to avoid blank rows.
        if (!line.length && j === lines.length - 1) continue;
        var span = document.createElement('span');
        // F1.3: spans only use the .stream-diff-* class names; the legacy
        // .ts-del/.ts-add aliases existed for the now-retired chat-embedded
        // block and its diff-stat counter.
        var isFind = section === 'find';
        span.className = 'stream-diff-line ' +
          (isFind ? 'stream-diff-removed' : 'stream-diff-added');
        span.textContent = (isFind ? '- ' : '+ ') + line;
        preEl.appendChild(span);
      }
    }

    function handleSSEPayload(payload, runId){
      const termEvt =
        (payload && payload.progress && (payload.progress.type === 'terminal_output' || payload.progress.type === 'terminal_done'))
          ? payload.progress
          : null;
      if (termEvt) {
        const type = String(termEvt.type || '');
        if (type === 'terminal_output') {
          const linesEl = document.getElementById(`terminalLines-${runId}`);
          if (!linesEl) return;
          const line = document.createElement('div');
          line.className = 'term-line' + (String(termEvt.stream || '') === 'stderr' ? ' err' : '');
          line.textContent = String(termEvt.title || '');
          linesEl.appendChild(line);
          scrollChatIfFollowing();
          return;
        }
        if (type === 'terminal_done') {
          const card = document.getElementById(`terminalBlock-${runId}`);
          if (!card) return;
          const exitCode = Number(termEvt.exitCode ?? 1);
          const exit = document.createElement('div');
          exit.className = 'term-exit ' + (exitCode === 0 ? 'ok' : 'bad');
          exit.textContent = exitCode === 0 ? `✓ Exit ${exitCode}` : `✗ Exit ${exitCode}`;
          card.appendChild(exit);
          scrollChatIfFollowing();
          return;
        }
      }
      const approvalEvt =
        (payload && payload.type === 'command_approval_required')
          ? payload
          : (payload && payload.progress && payload.progress.type === 'command_approval_required')
            ? payload.progress
            : null;
      if (approvalEvt) {
        const logBlock = document.getElementById(`logBlock-${runId}`);
        // Let the Summary view record this approval (it normally never reaches line 5186).
        // logBlock is allowed to be null here — the sticky prompt does not depend on it.
        if (logBlock) recordExecutionSummaryPayload(logBlock, payload, runId);
        // Tur P1-approval: sticky prompt above the chat input, with keyboard
        // navigation + queue. Replaces the prior inline `cmdApproval-${id}` card.
        // Auto-approve (trusted session) is handled inside the sticky handler.
        try { handleZoneApprovalEvent(approvalEvt, runId, logBlock); } catch (err) { try { console.warn('[zone-approval-sticky-error]', err); } catch {} }
        return;
      }
      if (payload?.lifecycle?.type === 'run_started' || payload?.lifecycle?.type === 'run_completed') {
        console.log('[zone-lifecycle-debug]', {
          lifecycleType: payload.lifecycle.type,
          eventRunId: runId,
          currentRunId: state.currentRunId,
          stateRunId: state.runId,
          idsMatch: runId === state.currentRunId,
          sendBtnHasStopClass: !!document.querySelector('.send-btn')?.classList?.contains('send-btn--stop'),
        });
      }
      const { stage, lifecycle, progress } = payload || {};
      const logBlock = document.getElementById(`logBlock-${runId}`);
      const progressTypeForMissingBlock = String(progress?.type || '');
      const canHandleWithoutLogBlock =
        progressTypeForMissingBlock === 'chat_start' ||
        progressTypeForMissingBlock === 'chat_chunk' ||
        progressTypeForMissingBlock === 'chat_done' ||
        progressTypeForMissingBlock === 'chat_response' ||
        progressTypeForMissingBlock === 'iter_cost_update' ||
        progressTypeForMissingBlock === 'token_budget_status' ||
        progressTypeForMissingBlock === 'run_summary' ||
        progressTypeForMissingBlock === 'todos_initialized' ||
        progressTypeForMissingBlock === 'todo_status_changed' ||
        progressTypeForMissingBlock === 'todo_revised' ||
        progressTypeForMissingBlock === 'run_completed_with_result';
      if (!logBlock) {
        if (progress && canHandleWithoutLogBlock) {
          // Phase 1b: chat runs stream without a logBlock; the chat bubble
          // mounts into the owning thread's container regardless of which
          // thread the user is viewing. No buffering needed — per-thread
          // containers persist the bubble across switches.
        } else {
          // No logBlock for a non-chat progress event means the run group
          // for this runId hasn't been built yet (or was destroyed by an
          // older code path). With per-thread containers, the run group
          // lives in the owning thread's container; if it's missing, the
          // run was already finalized and this is a stale event — drop it.
          if (!getThreadIdForRunId(runId)) return;
          // Otherwise: known runId, drop this single event safely; the
          // run group will be (re)built by the next SSE event that goes
          // through the lifecycle path.
          return;
        }
      }

      const shouldSnapshotAfterAppend = false;

      try {
      // Start/stop live coding animation based on lifecycle/stage/progress.
      const stageText = String(stage || '');
      const lifecycleType = String(lifecycle?.type || '');
      const progressType = String(progress?.type || '');
      const progressTitle = String(progress?.title || '');

      if (progress && progressType === 'iter_cost_update') {
        applyIterCostUpdate(progress, runId);
        return;
      }
      if (progress && progressType === 'token_budget_status') {
        updateCostStripFromTokenBudget(progress, runId);
        return;
      }
      if (progress && progressType === 'run_summary') {
        try { setRunSummaryForRun(runId, progress); } catch {}
        return;
      }
      if (progress && (progressType === 'todos_initialized' || progressType === 'todo_revised')) {
        try { setTodosForRun(runId, progress.todos || []); } catch {}
        return;
      }
      if (progress && progressType === 'todo_status_changed') {
        try { updateTodoStatusForRun(runId, progress.todoId, progress.todoStatus); } catch {}
        return;
      }
      if (progress && progressType === 'plan_summary') {
        if (logBlock) {
          try {
            const obj = String(progress.detail || '');
            const files = Array.isArray(progress.planSummaryFiles) ? progress.planSummaryFiles : [];
            const stepCount = Number(progress.planSummaryStepCount) || 0;
            const MAX_FILES = 5;
            const shown = files.slice(0, MAX_FILES).map(function(f) { return String(f).split('/').pop() || f; });
            const extra = files.length > MAX_FILES ? ' (+' + (files.length - MAX_FILES) + ' more)' : '';
            const fileStr = shown.length > 0 ? ' · files: ' + shown.join(', ') + extra : '';
            const msg = 'Plan: ' + (obj || 'task') + ' · ' + stepCount + ' steps' + fileStr;
            appendLogLine(logBlock, { timestamp: nowTs(), message: msg, status: 'success' });
          } catch {}
        }
        return;
      }
      if (progress && progressType === 'scope_revision_proposed') {
        try { handleZoneScopeRevisionEvent(progress, runId, logBlock); } catch (err) { try { console.warn('[zone-scope-revision-error]', err); } catch {} }
        return;
      }
      if (progress && progressType === 'scope_revision_resolved') {
        try { dismissZoneScopeRevisionForRun(runId); } catch {}
        if (logBlock) {
          let revMsg, revStatus;
          if (progress.revisionDecision === 'approve') {
            revMsg = 'Scope revision approved — executing revised plan.';
            revStatus = 'success';
          } else if (progress.revisionDecision === 'auto_apply') {
            revMsg = 'Minor scope adjustment auto-applied.';
            revStatus = 'success';
          } else {
            revMsg = 'Scope revision rejected — proceeding with original plan.';
            revStatus = 'active';
          }
          appendLogLine(logBlock, { timestamp: nowTs(), message: revMsg, status: revStatus });
        }
        return;
      }
      if (progress && progressType === 'compaction_status') {
        const rid = String(progress.runId || runId || '').trim();
        if (rid) {
          const meter = ensureCostMeterState(rid);
          if (meter) {
            meter.compactionCount = Number(progress.count || 0) || 0;
            if (rid === currentDisplayedRunId) refreshCostStripForActiveRun();
          }
        }
        return;
      }
      if (progress && progressType === 'compaction_exhausted') {
        const rid = String(progress.runId || runId || '').trim();
        if (rid) {
          const lb = document.getElementById(`logBlock-${rid}`);
          if (lb) {
            const notice = document.createElement('div');
            notice.className = 'toast warn';
            notice.style.cssText = 'margin:4px 0 2px;opacity:0.9';
            notice.innerHTML = `<div class="ticon"></div><div>${escapeHtml(String(progress.message || 'Context exhausted via compaction.'))}</div>`;
            lb.appendChild(notice);
          }
          state.__compactionExhaustedByRun = state.__compactionExhaustedByRun || {};
          state.__compactionExhaustedByRun[rid] = true;
        }
        return;
      }
      if (progress && progressType === 'loop_warning_emitted') {
        const rid = String(progress.runId || runId || '').trim();
        if (rid) {
          const lb = document.getElementById(`logBlock-${rid}`);
          if (lb) {
            const toolName = escapeHtml(String(progress.toolName || ''));
            const count = Number(progress.count) || 0;
            const notice = document.createElement('div');
            notice.className = 'toast warn';
            notice.style.cssText = 'margin:4px 0 2px;opacity:0.9';
            notice.innerHTML = `<div class="ticon"></div><div>Loop warning: <code>${toolName}</code> called ${count}× with identical args — agent nudged to try a different approach.</div>`;
            lb.appendChild(notice);
          }
        }
        return;
      }

      recordExecutionSummaryPayload(logBlock, payload, runId);

      // After refresh-resume, final result arrives via SSE replay (not the orphaned HTTP response).
      if (progress && progressType === 'run_completed_with_result' && progress.result) {
        handlePatchResult(progress.result, runId);
        return;
      }

      if (lifecycle && runId === state.currentRunId) {
        if (lifecycleType === 'run_started') {
          handleCostStripRunStart(runId);
          updateSendButtonKillMode(true);
        }
        else if (lifecycleType === 'run_completed' || lifecycleType === 'run_cancelled') {
          handleCostStripRunComplete(runId);
          updateSendButtonKillMode(false);
        }
      }

      function basenameFromPath(p){
        const s = String(p || '');
        const parts = s.split(/[\\/]/).filter(Boolean);
        return parts.length ? parts[parts.length - 1] : s;
      }

      // Streaming patch -> in-chat livecode only (no right panel)
      if (progress && progressType === 'patch_stream_target') {
        const fp = String(progress.filePath || '');
        const sym = String(progress.targetSymbol || '').trim();
        state.__streamTargetByFile = state.__streamTargetByFile || {};
        if (fp && sym) state.__streamTargetByFile[fp] = sym;
      }
      if (progress && progressType === 'patch_stream_delta') {
        // If backend had to fallback to single-chunk delta, mark so FE can animate locally.
        if (progress.fallback === true) {
          state.__streamFallback = state.__streamFallback || {};
          state.__streamFallback[runId] = true;
        }
        // Start fallback animation immediately on first delta (default duration),
        // so the user sees the streaming block during patch generation.
        state.__streamStartTs = state.__streamStartTs || {};
        state.__streamTargetDurationMs = state.__streamTargetDurationMs || {};
        const firstDeltaForRun = !state.__streamStartTs[runId];
        if (firstDeltaForRun) {
          state.__streamStartTs[runId] = Date.now();
          state.__streamTargetDurationMs[runId] = 2000; // default; max 2s (sync with patch gen)
        }
        const fp = String(progress.filePath || '');
        const d = String(progress.delta || '');
        if (d) {
          state.__streamDeltaBuffer = state.__streamDeltaBuffer || {};
          state.__streamDeltaFlushed = state.__streamDeltaFlushed || {};
          const alreadyFlushed = !!state.__streamDeltaFlushed[runId];

          if (alreadyFlushed) {
            // After flush, stream directly like before.
            appendStreamToLiveCode(logBlock, runId, fp, d);
          } else {
            // Before we see "Generating a localized patch", buffer deltas silently.
            const buf = state.__streamDeltaBuffer[runId] || { filePath: '', deltas: [] };
            if (!buf.filePath && fp) buf.filePath = fp;
            buf.deltas = Array.isArray(buf.deltas) ? buf.deltas : [];
            buf.deltas.push(d);
            state.__streamDeltaBuffer[runId] = buf;
          }
        }
        if (firstDeltaForRun) tryBeginFallbackStreamAnim(runId);
      }
      if (progressType === 'patch_converted') {
        state.__runIsComplete = state.__runIsComplete || {};
        state.__runIsComplete[runId] = true;
        if (state.__streamFallbackPayload && state.__streamFallbackPayload[runId]) {
          snapFallbackStreamAnimToEnd(runId);
        } else {
          applyNonFallbackStreamStatic(runId);
        }
        if (state.__streamLive) delete state.__streamLive[String(runId || '')];
        if (state.__streamRawDeltaConcatByRun && state.__streamRawDeltaConcatByRun[runId]) {
          delete state.__streamRawDeltaConcatByRun[runId];
        }
        if (state.__streamMountedAt && state.__streamMountedAt[runId]) delete state.__streamMountedAt[runId];
        if (state.__streamFallback && state.__streamFallback[runId]) delete state.__streamFallback[runId];
        if (state.__streamStartTs && state.__streamStartTs[runId]) delete state.__streamStartTs[runId];
        if (state.__streamTargetDurationMs && state.__streamTargetDurationMs[runId]) delete state.__streamTargetDurationMs[runId];
        if (state.__streamFallbackPayload && state.__streamFallbackPayload[runId]) delete state.__streamFallbackPayload[runId];
        if (state.__streamTypeIvs && state.__streamTypeIvs[runId]) delete state.__streamTypeIvs[runId];
      }

      // Do not append log lines for streaming events.
      if (progress && (progressType === 'patch_stream_delta' || progressType === 'patch_stream_target')) return;

      // F1.3: live tool-input typewriter for apply_patch / write_file now
      // routes to the side-panel slot (#zone-live-stream) instead of the
      // chat timeline. Single active stream — a new isFirstDelta replaces
      // the current slot content rather than stacking.
      // F1.4: when progress.subagentId is set, the stream originates from a
      // worker subagent — apply a "↳ worker {id-short} " prefix to the label.
      if (progressType === 'tool_input_delta' && progress) {
        const blockId = String(progress.blockId || '');
        const delta = String(progress.delta || '');
        const titleTsd = String(progress.title || '');
        const subagentId = String(progress.subagentId || '');
        if (!blockId || !delta) return;
        const isFirstDelta = !!progress.isFirstDelta;
        const slot = ensureLiveStreamSlot();
        if (!slot) return;
        const sidebar = document.getElementById('zoneTodoSidebar');
        state.__liveStream = state.__liveStream || { blockId: '', accumJson: '', filePath: '', subagentId: '' };
        const newBlock = isFirstDelta || state.__liveStream.blockId !== blockId;
        if (newBlock) {
          // Cancel any in-flight fade-out from a prior settle.
          if (state.__liveStreamFadeTimer) {
            try { clearTimeout(state.__liveStreamFadeTimer); } catch(e) {}
            state.__liveStreamFadeTimer = null;
          }
          state.__liveStream = { blockId, accumJson: '', filePath: '', subagentId };
          if (sidebar) sidebar.dataset.state = 'visible';
          slot.dataset.state = 'active';
          slot.style.opacity = '';
          const lbl0 = slot.querySelector('.ss-label');
          if (lbl0) lbl0.textContent = titleTsd || '✎ Writing...';
          const body0 = slot.querySelector('.ss-body');
          if (body0) body0.innerHTML = '';
          // F1.2 C2: track user scroll inside the slot. Pause auto-scroll if
          // the user scrolls up; resume when within 16px of the bottom.
          state.__liveStreamScroll = { userScrolled: false };
          try {
            const scrollEl = slot;
            scrollEl.addEventListener('scroll', function() {
              var atBottom = (scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight) < 16;
              state.__liveStreamScroll.userScrolled = !atBottom;
            });
          } catch(e) {}
        }
        const ls = state.__liveStream;
        ls.accumJson = (ls.accumJson || '') + delta;
        const extracted = tryExtractToolStreamFields(ls.accumJson);
        if (extracted.filePath && extracted.filePath !== ls.filePath) {
          ls.filePath = extracted.filePath;
          const fpLbl = slot.querySelector('.ss-label');
          if (fpLbl) {
            // F1.4: keep the "↳ worker {id-short} " prefix on label rebuilds
            // so the worker origin doesn't disappear once filePath parses.
            const workerPrefix = ls.subagentId ? ('↳ worker ' + String(ls.subagentId).slice(0, 6) + ' ') : '';
            fpLbl.textContent = workerPrefix + '✎ Writing ' + extracted.filePath + '...';
          }
        }
        const bodyEl = slot.querySelector('.ss-body');
        if (extracted.patchRaw && bodyEl) {
          renderToolStreamBody(bodyEl, decodeJsonString(extracted.patchRaw));
        }
        // Auto-scroll the slot internal scroll to bottom unless the user
        // has paged up to read earlier content.
        try {
          if (!(state.__liveStreamScroll && state.__liveStreamScroll.userScrolled)) {
            slot.scrollTop = slot.scrollHeight;
          }
        } catch(e) {}
        return;
      }

      // Plan UI in right panel only (transient). Do not show for chat runs.
      state.__runIsChat = state.__runIsChat || {};
      if (progressType === 'chat_start' || progressType === 'chat_chunk' || progressType === 'chat_done' || progressType === 'chat_response') state.__runIsChat[runId] = true;
      if (progressType === 'chat_start') {
        hideEmpty();
        ensureChatBubbleForRun(runId);
        scrollChatIfFollowing();
        return;
      }
      if (progressType === 'chat_chunk') {
        hideEmpty();
        updateStreamingChatBubble(runId, String(progress.delta || ''));
        scrollChatIfFollowing();
        return;
      }
      if (progressType === 'chat_done') {
        hideEmpty();
        finalizeChatBubble(runId, progress);
        upsertChatResponseMessage(runId, progress);
        try {
          const g = document.getElementById(`runGroup-${runId}`);
          if (g) g.dataset.runStatus = 'completed';
        } catch {}
        stopDurationTicker(runId);
        handleCostStripRunComplete(runId);
        persistRunGroupHtmlToThread(runId, 'completed');
        scrollChatIfFollowing();
        return;
      }
      if (lifecycleType === 'run_completed') {
        try { bgHideStickyPanel(runId); } catch {}
        // F1.3: defensive clear of the side-panel live-stream slot.
        // tool_result is the normal path; this catches runs where the final
        // tool_result didn't fire (cancel, error, early exit) and a slot
        // would otherwise stay stuck in "Writing..." forever.
        try {
          const slot = document.getElementById('zone-live-stream');
          if (slot && slot.dataset && slot.dataset.state) {
            if (state.__liveStreamFadeTimer) {
              try { clearTimeout(state.__liveStreamFadeTimer); } catch(e) {}
              state.__liveStreamFadeTimer = null;
            }
            slot.dataset.state = '';
            const b = slot.querySelector('.ss-body');
            if (b) b.innerHTML = '';
            const l = slot.querySelector('.ss-label');
            if (l) l.textContent = '';
            state.__liveStream = { blockId: '', accumJson: '', filePath: '' };
          }
        } catch(e) {}
        state.__runIsComplete = state.__runIsComplete || {};
        state.__runIsComplete[runId] = true;
        if (state.__streamFallbackPayload && state.__streamFallbackPayload[runId]) {
          snapFallbackStreamAnimToEnd(runId);
        }
        if (state.__streamLive) delete state.__streamLive[String(runId || '')];
        if (state.__streamRawDeltaConcatByRun && state.__streamRawDeltaConcatByRun[runId]) {
          delete state.__streamRawDeltaConcatByRun[runId];
        }
        if (state.__streamMountedAt && state.__streamMountedAt[runId]) delete state.__streamMountedAt[runId];
        if (state.__streamFallback && state.__streamFallback[runId]) delete state.__streamFallback[runId];
        if (state.__streamStartTs && state.__streamStartTs[runId]) delete state.__streamStartTs[runId];
        if (state.__streamTargetDurationMs && state.__streamTargetDurationMs[runId]) delete state.__streamTargetDurationMs[runId];
        if (state.__streamFallbackPayload && state.__streamFallbackPayload[runId]) delete state.__streamFallbackPayload[runId];
        if (state.__streamTypeIvs && state.__streamTypeIvs[runId]) delete state.__streamTypeIvs[runId];
        state.__streamTargetByFile = {};
        if (state.__streamLogLineIdByRun && state.__streamLogLineIdByRun[runId]) {
          const id = state.__streamLogLineIdByRun[runId];
          const el = document.getElementById(id);
          if (el) { try { el.remove(); } catch {} }
          delete state.__streamLogLineIdByRun[runId];
        }
        // On completion, scroll once to reveal the final output (even if user previously scrolled up).
        try {
          if (els.chatArea) {
            const prevFollow = !!state.chatScrollFollow;
            els.chatArea.scrollTop = els.chatArea.scrollHeight;
            state.chatScrollFollow = prevFollow;
          }
        } catch {}
      }
      // Finalize step timeline on completion / cancellation / ready-stage.
      if (state.__useStepTimeline) {
        if (lifecycleType === 'run_completed') finalizeStepTimeline(runId, 'done');
        else if (lifecycleType === 'run_cancelled') finalizeStepTimeline(runId, 'warning');
        else if (stageText === 'Ready' || progressType === 'run_completed_with_result') {
          // Belt-and-suspenders: 'Ready' stage or a final-result event that slipped through.
          const _pd = String(progress?.decisionMode || progress?.finalState || '');
          finalizeStepTimeline(runId, _pd === 'safe_to_apply' ? 'done' : 'warning');
        }
      }

      if (lifecycle) {
        const lm = lifecycleType === 'run_cancelled'
          ? 'Cancelled'
          : (lifecycle.message || lifecycle.type || 'lifecycle');
        const lst = lifecycle.type === 'run_completed' ? 'done'
          : lifecycle.type === 'run_cancelled' ? 'warning'
          : 'active';
        appendLogLine(logBlock, {
          timestamp: lifecycle.timestamp || nowTs(),
          message: lm,
          status: lst
        });
      }
      if (lifecycleType === 'run_cancelled' && getThreadIdForRunId(runId)) {
        // Phase 1b: capture the owning thread BEFORE clearRun removes
        // the runId→thread mapping, so the queue drain targets the right
        // thread. Close only this run's EventSource; sibling runs continue.
        const _cancelledThreadId = getThreadIdForRunId(runId);
        const _esForRun = state.eventSourcesByRunId.get(runId);
        try { _esForRun?.close(); } catch {}
        state.eventSourcesByRunId.delete(runId);
        if (state.eventSource === _esForRun) state.eventSource = null;
        if (_cancelledThreadId) clearRun(_cancelledThreadId);
        completeExecutionSummary(runId);
      try { bgHideStickyPanel(runId); } catch {}
        setLogBlockDone(runId);
        setRunningUI(false);
        // Cancelled run → drop any pending sticky approvals for it.
        try { dismissAllZoneApprovalsForRun(runId); } catch {}
        // After cancellation, drain the OWNING thread's queue (per Phase 1b).
        dequeueAndRunNext(_cancelledThreadId);
        try {
          const g = document.getElementById(`runGroup-${runId}`);
          if (g) g.dataset.runStatus = 'cancelled';
        } catch {}
        stopDurationTicker(runId);
        handleCostStripRunComplete(runId);
        try { persistRunGroupHtmlToThread(runId, 'cancelled'); } catch {}
      }
      const placeholderFilePath =
        (progress && typeof progress.filePath === 'string' && progress.filePath.trim())
          ? progress.filePath.trim()
          : '';
      const shouldShowWriting =
        progressTitle.toLowerCase().includes('generating a localized patch');
      if (shouldShowWriting) showWritingPlaceholder(logBlock, runId, placeholderFilePath);

      if (progress) {
        const type = progress.type;
        const progTitle = String(progress.title || '');
        const stageLower = String(stage || '').toLowerCase();
        const subagentId = String(progress.subagentId || '').trim();
        const subagentType = String(progress.subagentType || 'worker').trim() || 'worker';
        const subagentShort = subagentId ? subagentId.slice(0, 6) : '';
        const subagentPrefix = subagentId ? `↳ ${subagentType} ${subagentShort} ` : '';
        const subagentClass = subagentId ? 'subagent-line' : '';
        const subagentMessage = (text) => subagentPrefix ? `${subagentPrefix}${text}` : text;

        if (type === 'command_auto_approved' || type === 'command_trusted') {
          appendCommandAutoApprovedLine(logBlock, {
            timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
            command: String(progress.command || ''),
          });
          return;
        }

        if (type === 'handoff_report' && progress.report) {
          state.__handoffReportByRun = state.__handoffReportByRun || {};
          state.__handoffReportByRun[runId] = progress.report;
          return;
        }

        if (type === 'subagent_started') {
          appendLogLine(logBlock, {
            timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
            message: `↳ worker ${subagentShort || ''} Dispatched: ${progTitle || 'subtask'}`,
            status: 'active',
            className: 'subagent-line c-active'
          });
          try {
            const lines = logBlock.querySelectorAll('.log-line.subagent-line');
            const last = lines[lines.length - 1];
            if (last && subagentId) {
              last.dataset.subagentId = subagentId;
              last.dataset.subagentType = subagentType;
            }
          } catch {}
          return;
        }
        if (type === 'subagent_completed') {
          // Bug E (Phase Q.1): mark this subagent's cost-meter slot as done so it
          // stops contributing to the LIVE-subagent sum — its final cost will be
          // folded into the parent's next iter_cost_update via subagentCostTotal.
          try {
            const subId = String(progress.subagentId || '').trim();
            const meter = subId ? getCostMeterState(runId) : null;
            if (meter && subId) {
              markSubagentCostSourceDone(meter, subId);
              refreshCostStripForActiveRun();
            }
          } catch {}
          const subStatus = String(progress.subagentStatus || progress.status || 'completed').toLowerCase();
          const safeStatus = /^(completed|partial|failed|max_iterations)$/.test(subStatus) ? subStatus : 'completed';
          const rowStatus = safeStatus === 'completed' ? 'done' : safeStatus === 'failed' ? 'error' : 'warning';
          const pillLabel = safeStatus === 'max_iterations' ? 'iter cap' : safeStatus;
          const label = `Worker ${subagentShort || ''}`;
          appendLogLine(logBlock, {
            timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
            message: `${label} ${pillLabel}: ${progTitle || 'completed'}`,
            messageHtml:
              `${escapeHtml(label)} <span class="subagent-pill ${safeStatus}">${escapeHtml(pillLabel)}</span>: ` +
              `${escapeHtml(progTitle || 'completed')}`,
            status: rowStatus,
            className: 'subagent-line'
          });
          return;
        }

        if (type === 'agent_loop_start' || /starting agent tool loop/i.test(progTitle)) {
          const isAuditLane = progress.lane === 'audit';
          appendLogLine(logBlock, {
            timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
            message: isAuditLane ? 'Auditor working...' : subagentMessage(subagentId ? 'Worker working...' : 'Agent working...'),
            status: 'active',
            className: isAuditLane ? 'audit-lane-line' : subagentClass
          });
          if (progress.lane !== 'audit') {
            // isRunning / button-state flip for main-lane start only.
            // Audit-lane agent_loop_start must not toggle the send button —
            // the main run is still active and the UI should stay in Stop mode.
          }
          return;
        }
        if (type === 'agent_loop_complete') {
          const ok = (progress.status === 'success');
          const isAuditLane = progress.lane === 'audit';
          appendLogLine(logBlock, {
            timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
            message: isAuditLane ? 'Audit pass' : subagentMessage(subagentId ? 'Worker finished' : 'Agent finished'),
            status: ok ? 'done' : 'warning',
            className: subagentClass
          });
          if (progress.lane !== 'audit') {
            // UI.5: capture summary text for inline prose bubble at run end.
            // Use summaryPreview if present (test-injectable), fall back to detail.
            // Guard: audit-lane complete must not flip isRunning/button state or
            // overwrite the main agent summary — the main run is still in progress.
            const _cap = String(progress.summaryPreview || progress.detail || '').trim();
            if (_cap && !subagentId) {
              state.__agentSummaryByRun = state.__agentSummaryByRun || {};
              state.__agentSummaryByRun[runId] = _cap;
            }
          }
          return;
        }

        if (type === 'tool_call') {
          if (/\[agent_loop\]\s*iteration\b/i.test(progTitle) || /\[agent_loop\]/i.test(progTitle) && /\biteration\b/i.test(progTitle)) {
            return;
          }
          if (typeof bgIsBgToolCallTitle === 'function' && bgIsBgToolCallTitle(progTitle)) {
            handleBgToolCall(runId, progTitle);
            return;
          }
          const humanizeTool = (t) => {
            const s = String(t || '');
            const m = s.match(/^\[tool\]\s*([a-z_]+)(?::\s*(.*))?$/i);
            if (!m) return s;
            const name = String(m[1] || '').toLowerCase();
            const arg = String(m[2] || '').trim();
            const base = arg.split(/[\\/]/).filter(Boolean).pop() || arg;
            if (name === 'read_file') return `Reading ${base || 'file'}...`;
            if (name === 'write_file') return `Fixing ${base || 'file'}...`;
            if (name === 'apply_patch') return `Patching ${base || 'file'}...`;
            if (name === 'list_files') return `Exploring directory...`;
            if (name === 'run_command') return `Running ${arg || 'command'}...`;
            if (name === 'search_in_files') return `Searching codebase...`;
            if (name === 'find_references') return `Finding references...`;
            return s;
          };
          const humanized = humanizeTool(progress.title || '[tool] call');
          const ts = new Date(progress.ts || Date.now()).toLocaleTimeString();
          const displayHumanized = subagentMessage(humanized);
          const wasCoalesced = subagentId ? false : tryCoalesceToolLine(logBlock, runId, humanized, ts);
          if (!wasCoalesced) {
            appendLogLine(logBlock, {
              timestamp: ts,
              message: displayHumanized,
              status: 'active',
              className: subagentClass
            });
            const lines = logBlock.querySelectorAll('.log-line');
            const last = lines[lines.length - 1];
            if (last) {
              last.classList.add('tool-line-active');
              captureCoalescedLineEl(runId, last);
            }
          }
          return;
        }
        if (type === 'tool_result') {
          maybeAnnotateTaskSubagentResult(progress);
          if (typeof handleBgToolResult === 'function' && state.__bgPendingByRun && state.__bgPendingByRun[runId]){
            const detailText = String(progress?.detail || progress?.title || '');
            const status = String(progress?.status || '').toLowerCase();
            if (handleBgToolResult(runId, detailText, status)) return;
          }
          const lastToolLine = logBlock.querySelector('.tool-line-active');
          if (lastToolLine) {
            lastToolLine.classList.remove('tool-line-active');
            lastToolLine.classList.add((progress.status === 'success') ? 'c-done' : 'c-error');
            // Sub-line preview suppressed — main tool line is sufficient signal.
          }
          // F1.3: fade out and hide the side-panel live-stream slot when an
          // apply_patch / write_file result lands. Chat-side collapse logic
          // from F1.2 C3 is gone — the chat no longer hosts these blocks.
          try {
            const trToolName = String(progress.toolName || '');
            if (trToolName === 'apply_patch' || trToolName === 'write_file') {
              const slot = document.getElementById('zone-live-stream');
              if (slot && slot.dataset && slot.dataset.state === 'active') {
                slot.dataset.state = 'fading';
                state.__liveStreamFadeTimer = setTimeout(function() {
                  slot.dataset.state = '';
                  const b = slot.querySelector('.ss-body');
                  if (b) b.innerHTML = '';
                  const l = slot.querySelector('.ss-label');
                  if (l) l.textContent = '';
                  state.__liveStream = { blockId: '', accumJson: '', filePath: '' };
                  state.__liveStreamFadeTimer = null;
                  // If no todos either, hide the whole sidebar.
                  try {
                    const sb = document.getElementById('zoneTodoSidebar');
                    const planEl = sb && sb.querySelector('.zone-todo-plan');
                    const hasTodos = planEl && planEl.innerHTML && planEl.innerHTML.trim().length > 0;
                    if (sb && !hasTodos) sb.dataset.state = 'hidden';
                  } catch(e3) {}
                }, 150);
              }
            }
          } catch(e) {}
          return;
        }
        if (type === 'llm_retry_in_progress') {
          if (!logBlock) return;
          if (progress.isPerAttempt) {
            appendLogLine(logBlock, {
              timestamp: '',
              message: formatRetryLine(progress),
              status: 'warning',
              className: 'narration-line',
            });
          } else {
            appendLogLine(logBlock, {
              timestamp: '',
              message: 'Upstream API slow, retrying…',
              status: 'warning',
              className: 'narration-line',
            });
          }
          return;
        }
        if (type === 'narration') {
          const text = String(progress.text || progress.title || '').trim();
          if (!text || !logBlock) return;
          state.__lastNarrationByRun = state.__lastNarrationByRun || {};
          if (state.__lastNarrationByRun[runId] === text) return;
          state.__lastNarrationByRun[runId] = text;
          try { finalizeCoalescedLine(runId); } catch {}
          appendLogLine(logBlock, {
            timestamp: '',
            message: text,
            status: 'narration',
            className: 'narration-line',
          });
          return;
        }
        if (type === 'planner_result' && progress.planner) {
          renderPlannerCard(logBlock, progress.planner);
          return;
        }
        if (type === 'chat_response') {
          const chatTitle = String(progress.title || progress.responseText || '');
          hideEmpty();
          finalizeChatBubble(runId, {
            responseText: chatTitle,
            responseHtml: progress.responseHtml,
            contextFiles: progress.contextFiles,
          });
          upsertChatResponseMessage(runId, {
            responseText: chatTitle,
            responseHtml: progress.responseHtml,
            contextFiles: progress.contextFiles,
          });
          scrollChatIfFollowing();
          return;
        }
        if (type === 'verification_investigating') {
          // Start grouped verification summary (replaces noisy iteration/tool lines).
          state.__verifySummary = state.__verifySummary || {};
          if (!state.__verifySummary[runId] || !state.__verifySummary[runId].el) {
            // Create the block in the log stream.
            appendLogLine(logBlock, {
              timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
              message: 'Investigating test failure...',
              status: 'active',
              className: 'c-active'
            });
            // Convert the last appended log line into a summary block (keep ordering).
            const lines = logBlock.querySelector('.log-lines');
            const lastLine = lines ? lines.querySelector('.log-line.active') : null;
            if (lastLine) {
              // Remove the raw line and replace with the summary block.
              try { lastLine.remove(); } catch {}
              // Use appendLogLine's helper by invoking it via a synthetic hidden line:
              // we rely on ensureVerifySummary being defined inside appendLogLine, so recreate here manually.
              const box = document.createElement('div');
              box.className = 'verify-sum collapsed';
              box.dataset.runId = String(runId || '');
              box.innerHTML = `
                <div class="verify-sum-h">
                  <span class="ico">🔍</span>
                  <span class="txt">Investigating test failure...</span>
                  <span class="chev">›</span>
                </div>
                <div class="verify-sum-b"></div>
              `;
              const head = box.querySelector('.verify-sum-h');
              if (head) {
                head.addEventListener('click', () => {
                  const isCollapsed = box.classList.contains('collapsed');
                  box.classList.toggle('collapsed', !isCollapsed);
                  box.classList.toggle('expanded', isCollapsed);
                  const chev = box.querySelector('.verify-sum-h .chev');
                  if (chev) chev.textContent = isCollapsed ? '˅' : '›';
                });
              }
              if (lines) lines.appendChild(box);
              state.__verifySummary[runId] = { el: box };
            }
          }
          return;
        }
        if (type === 'verification_fixing') {
          appendLogLine(logBlock, {
            timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
            message: progress.title || 'Fixing test file...',
            status: 'active',
            className: 'c-active'
          });
          return;
        }
        if (type === 'verification_fixed') {
          // Close summary + show concise follow-up.
          try {
            const vs = state.__verifySummary && state.__verifySummary[runId] && state.__verifySummary[runId].el;
            if (vs) {
              vs.classList.add('collapsed');
              vs.classList.remove('expanded');
              const chev = vs.querySelector('.verify-sum-h .chev');
              if (chev) chev.textContent = '›';
            }
          } catch {}
          appendLogLine(logBlock, {
            timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(),
            message: '✓ Fix applied — re-running verification',
            status: 'active',
            className: 'c-active'
          });
          return;
        }
        const title = progress.title || progress.type || 'progress';
      if (/^Plan step \d+ complete$/.test(String(title))) return;
      if (String(title) === 'Plan generated') return;
        if (/\[agent_loop\]\s*iteration\b/i.test(String(title)) || (/\[agent_loop\]/i.test(String(title)) && /\biteration\b/i.test(String(title)))) {
          return;
        }
        if (stageLower.includes('agent_loop') && /\biteration\b/i.test(String(title))) {
          return;
        }
        const msg = subagentMessage(progress.command ? `${title}: ${progress.command}` : title);
        let st = 'active';
        if (type === 'patch_rejected' || type === 'fallback') st = 'warning';
        if (type === 'validated' || type === 'fallback_success' || type === 'patch_converted') st = 'done';
        st = normalizeStatus(progress.status || st);
        appendLogLine(logBlock, { timestamp: new Date(progress.ts || Date.now()).toLocaleTimeString(), message: msg, status: st, className: subagentClass });
        return;
      }

      if (!lifecycle && !progress && stage && stage !== 'Connected') {
        const stOnly = String(stage);
        if (/\[agent_loop\]\s*iteration\b/i.test(stOnly) || (/\[agent_loop\]/i.test(stOnly) && /\biteration\b/i.test(stOnly))) {
          return;
        }
        if (/starting agent tool loop/i.test(stOnly)) {
          appendLogLine(logBlock, { timestamp: nowTs(), message: 'Agent working...', status: 'active' });
          return;
        }
        if (/agent_loop_complete/i.test(stOnly) || /^agent finished$/i.test(stOnly)) {
          appendLogLine(logBlock, { timestamp: nowTs(), message: 'Agent finished', status: 'done' });
          return;
        }
        appendLogLine(logBlock, { timestamp: nowTs(), message: stage, status: 'active' });
      }
      } finally {
        // Phase 1b: incremental persistence for refresh-resume — snapshot
        // every ~2s while active. Per-thread containers replaced the old
        // runningThreadSnapshot/buffer hack; this localStorage-backed
        // snapshot is the only persistence path now.
        try {
          if (getThreadIdForRunId(runId)) {
            schedulePersistRunGroup(runId, 'running');
          }
        } catch {}
        scrollChatIfFollowing(runId);
      }
    }

    async function sendMessage(task){
      const sendTs = Date.now();
      try { console.log('[send-debug] click ts=' + sendTs); } catch {}
      if (state.__resumeScanInProgress) {
        try { console.log('[resume-debug] BLOCKING SEND? scan still running, queued sends=' + ((Array.isArray(state.taskQueue) ? state.taskQueue.length : 0) + 1), { activeThreadId: state.activeThreadId, currentRunId: state.currentRunId }); } catch {}
      }
      try {
        console.log('[send-debug] handler entry, current state:', {
          isStreaming: !!state.eventSource,
          isRunning: !!state.isRunning,
          hasActiveRun: !!state.currentRunId,
          currentRunId: state.currentRunId || null,
          activeThreadId: state.activeThreadId || null,
          activeRepoPath: state.activeRepo?.path || null,
          queueLength: Array.isArray(state.taskQueue) ? state.taskQueue.length : 0,
          resumeScanInProgress: !!state.__resumeScanInProgress,
        });
      } catch {}
      const thread = getActiveThread();
      if (!thread) {
        try { console.log('[send-debug] EARLY RETURN reason=no_active_thread'); } catch {}
        els.chatArea.appendChild(createToast('error', 'Select a project and create a thread first.'));
        scrollChatIfFollowing();
        return;
      }
      if (!state.activeRepo) {
        try { console.log('[send-debug] EARLY RETURN reason=no_active_repo'); } catch {}
        els.chatArea.appendChild(createToast('error', 'No active project selected.'));
        scrollChatIfFollowing();
        return;
      }

      // ── BYOK check: ensure there is an API key available before starting the agent ──
      const _byokKey = getActiveApiKey();
      const _serverHasKey = !!((window.__ZONE_PUBLIC_CONFIG__ || {}).serverHasOpenAIKey);
      if (!_byokKey && !_serverHasKey) {
        try { console.log('[send-debug] EARLY RETURN reason=no_api_key'); } catch {}
        hideEmpty();
        const banner = document.createElement('div');
        banner.className = 'no-apikey-banner';
        banner.innerHTML = `
          <p>You need an API key for the selected provider (${escapeHtml(getActiveProvider())}) to use Zone.</p>
          <button type="button" id="byokOpenSettingsBtn">Open Settings → API Keys</button>
        `;
        banner.querySelector('#byokOpenSettingsBtn').addEventListener('click', () => {
          banner.remove();
          openSettings('keys');
        });
        els.chatArea.appendChild(banner);
        scrollChatIfFollowing();
        return;
      }

      hideEmpty();
      const runId = crypto.randomUUID();
      state.runId = runId;
      // Multi-active-thread Phase 1c: per-thread map is the only source of
      // truth. Legacy state.currentRunId/runningThreadId writes were removed
      // — the derived getters read from runsByThread.
      setRun(state.activeThreadId, {
        runId,
        startedAt: Date.now(),
      });
      handleCostStripRunStart(runId);
      state.__runIsComplete = state.__runIsComplete || {};
      state.__runIsComplete[runId] = false;
      // Clear any stale streaming UI/state from previous runs.
      state.__streamTargetByFile = {};
      state.__streamLogLineIdByRun = {};
      state.__streamLive = {};
      state.__streamRawDeltaConcatByRun = {};
      state.__streamMountedAt = {};
      state.__streamFallback = {};
      state.__streamTypeIvs = {};
      state.__streamStartTs = {};
      state.__streamTargetDurationMs = {};
      state.__streamFallbackPayload = {};
      state.__streamPreviewPersist = {};
      state.__streamFilePathByRun = {};
      state.lastPatchResult = null;
      state.lastTaskText = task;
      state.runStartedAt = Date.now();
      state.__runStartedAtByRun = state.__runStartedAtByRun || {};
      state.__runStartedAtByRun[runId] = state.runStartedAt;
      renderBgTasks();

      // 1) create a run-group container so we can persist & restore exactly.
      // Multi-active-thread Phase 1a: explicit routing — the run group must
      // land in the active thread's chat container, never in another thread.
      // The dequeue path (Fix 3) activates the origin thread before this
      // runs, so getOrCreateThreadContainer always returns the right node.
      const group = ensureRunGroup(runId);
      if (group && !document.getElementById(`runGroup-${runId}`)) {
        group.dataset.runStatus = 'running';
        const targetContainer = getOrCreateThreadContainer(state.activeThreadId) || els.chatArea;
        targetContainer.appendChild(group);
      }

      // 2) append user bubble
      const ub = createBubble(task, 'user');
      ub.dataset.runId = runId;
      // Render image thumbnails (if any) above the text content.
      if (state.pendingAttachments && state.pendingAttachments.length > 0) {
        const thumbStrip = document.createElement('div');
        thumbStrip.className = 'user-bubble-thumbs';
        state.pendingAttachments.forEach(function(att) {
          const thumb = document.createElement('img');
          thumb.className = 'bubble-thumb';
          thumb.src = 'data:' + att.mediaType + ';base64,' + att.base64;
          thumb.alt = 'Attached image';
          thumb.addEventListener('click', function() {
            openScreenshotModal(thumb.src, 'Attached image');

          thumbStrip.appendChild(thumb);
        });
        ub.insertBefore(thumbStrip, ub.firstChild);
      }
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'edit-btn';
      editBtn.textContent = '✎';
      editBtn.title = 'Edit prompt';
      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        // Only allow edit while run is active for this runId.
        if (state.isRunning && state.currentRunId === runId) {
          void cancelActivePatchRun();
          enableUserBubbleEditing(ub, { mode: 'active', runId });
          return;
        }
        // Completed runs: no edit
      });
      ub.appendChild(editBtn);
      appendToRunGroup(runId, ub);
      thread.messages = thread.messages || [];
      thread.messages.push({ type:'user', text: task, ts: Date.now(), runId });

      const trimmed = String(task || '').trim();
      const runMode = normalizeMode(state.selectedMode);
      const isDirectCommand = /^(\$|>|run:)\s+/i.test(trimmed);
      const directCommand = trimmed.replace(/^(\$|>|run:)\s+/i, '').trim();
      const effectiveUserId = getCurrentUserId();
      try {
        console.log('[send-debug] button clicked, threadId=' + String(state.activeThreadId || ''), {
          projectPath: state.activeRepo?.path || '',
          inputText: String(task || ''),
        });
      } catch {}

      if (isDirectCommand) {
        // 2) create terminal output block (distinct from AI log)
        const card = document.createElement('div');
        card.className = 'term-card';
        card.id = `terminalBlock-${runId}`;
        const head = document.createElement('div');
        head.className = 'term-head';
        head.textContent = `$ ${directCommand}`;
        const lines = document.createElement('div');
        lines.className = 'term-lines';
        lines.id = `terminalLines-${runId}`;
        card.appendChild(head);
        card.appendChild(lines);
        appendToRunGroup(runId, card);

        // Bubble to top (existing behavior)
        const runGroup = document.getElementById(`runGroup-${runId}`);
        const userBubble =
          runGroup?.querySelector('.bubble.user') ||
          runGroup?.querySelector('.bubble') ||
          runGroup?.firstElementChild;
        if (userBubble) {
          state.__isProgrammaticChatScroll = true;
          state.chatScrollFollow = true;
          requestAnimationFrame(() => {
            userBubble.scrollIntoView({ behavior: 'smooth', block: 'start' });
            requestAnimationFrame(() => {
              state.__isProgrammaticChatScroll = false;
            });
          });
        }

        // SSE BEFORE post
        state.__streamDeltaBuffer = {};
        state.__streamDeltaFlushed = {};
        openSSE(runId);

        try {
          await apiFetch('/api/run-command', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({
              command: directCommand,
              repoPath: state.activeRepo.path,
              runId
            })
          });
        } catch (e) {
          const exit = document.createElement('div');
          exit.className = 'term-exit bad';
          exit.textContent = `✗ Request failed: ${e?.message || e}`;
          card.appendChild(exit);
        }
        return;
      }

      let messageType = runMode === 'chat' || runMode === 'investigate' ? 'question' : 'patch_request';
      let intent = runMode === 'chat' ? 'chat' : runMode === 'investigate' ? 'investigation' : 'execute';
      const classifyStartedAt = Date.now();
      if (runMode === 'auto') {
        try {
          const _classifyHeaders = { 'Content-Type': 'application/json', ...buildAuthHeaders() };
          const classifyRes = await apiFetch('/api/classify-intent', {
            method:'POST',
            headers: _classifyHeaders,
            body: JSON.stringify({ task })
          });
          const classifyBody = await classifyRes.json();
          messageType = String(classifyBody?.messageType || 'patch_request');
          intent = String(classifyBody?.intent || (messageType === 'patch_request' ? 'execute' : 'chat'));
          try { console.log('[send-debug] classify-intent resolved', { messageType, intent, msElapsed: Date.now() - classifyStartedAt }); } catch {}
        } catch (e) {
          console.log('[zone-intent-classify] classify request failed', e?.message || e);
          try { console.log('[send-debug] classify-intent failed', { msElapsed: Date.now() - classifyStartedAt, error: e?.message || String(e) }); } catch {}
        }
      } else {
        try { console.log('[send-debug] explicit mode selected', { mode: runMode, intent }); } catch {}
      }

      if (intent === 'chat' || (!intent && (messageType === 'question' || messageType === 'discussion'))) {
        hideEmpty();
        const chatBubble = ensureChatBubbleForRun(runId);
        if (chatBubble && !document.getElementById(`chatBubble-${runId}`)) {
          chatBubble.id = `chatBubble-${runId}`;
        }
        persistRunGroupHtmlToThread(runId, 'running');
        if (!thread.title || thread.title.startsWith('New thread for')) {
          thread.title = task.slice(0, 50);
          els.threadTitle.textContent = thread.title;
        }
        saveThreads();
        renderSidebar();
        setRunningUI(true);
        renderSidebar();
        state.__streamDeltaBuffer = {};
        state.__streamDeltaFlushed = {};
        openSSE(runId);
        try {
          const _chatHeaders = { 'Content-Type': 'application/json', ...buildAuthHeaders() };
          const _chatAttachments = state.pendingAttachments.slice();
          clearAttachments();
          const chatPayload = {
            task,
            repoPath: state.activeRepo.path,
            runId,
            userId: effectiveUserId,
            conversationId: state.activeThreadId,
            threadId: state.activeThreadId,
            mode: runMode,
            ...(_chatAttachments.length > 0 ? { attachments: _chatAttachments } : {})
          };
          let result;
          if (runMode === 'auto') {
            const res = await apiFetch('/api/chat', {
              method:'POST',
              headers: _chatHeaders,
              body: JSON.stringify(chatPayload)
            });
            result = await res.json();
          } else {
            const _postChatOutcome = await postPatchApi(chatPayload, _chatHeaders);
            result = _postChatOutcome.body;
          }
          handlePatchResult(result, runId);
        } catch (e) {
          setRunningUI(false);
          const _owningThreadId = getThreadIdForRunId(runId);
          if (_owningThreadId) clearRun(_owningThreadId);
          finalizeChatBubble(runId, {
            responseText: `Request failed: ${e?.message || e}`,

      const lb = createLogBlock(runId);
      appendToRunGroup(runId, lb);
      // Persist immediately so refresh can reconnect mid-run.
      persistRunGroupHtmlToThread(runId, 'running');
      const runGroup = document.getElementById(`runGroup-${runId}`);
      const userBubble =
        runGroup?.querySelector('.bubble.user') ||
        runGroup?.querySelector('.bubble') ||
        runGroup?.firstElementChild;
      if (userBubble) {
        state.__isProgrammaticChatScroll = true;
        state.chatScrollFollow = true;
        requestAnimationFrame(() => {
          userBubble.scrollIntoView({ behavior: 'smooth', block: 'start' });
          requestAnimationFrame(() => {
            state.__isProgrammaticChatScroll = false;
          });
        });
      }
      // messages persist only user + result; agent log is ephemeral

      // update title if first message
      if (!thread.title || thread.title.startsWith('New thread for')) {
        thread.title = task.slice(0, 50);
        els.threadTitle.textContent = thread.title;
      }
      saveThreads();
      renderSidebar();

      // 3) running state
      setRunningUI(true);
      // Sidebar indicator for running thread.
      renderSidebar();

      // 4) SSE BEFORE post
      state.__streamDeltaBuffer = {};
      state.__streamDeltaFlushed = {};
      openSSE(runId);
      appendLogLine(lb, { timestamp: nowTs(), message: 'Starting run…', status:'active' });

      // 5) POST to route — /api/investigate for investigate mode, /api/patch otherwise
      const _apiPath = runMode === 'investigate' ? '/api/investigate' : '/api/patch';
      try {
        console.log('[debug-mem] sending lastChangedFiles:', state.__lastChangedFiles);
        console.log('[debug-mem] sending lastAddedFunctions:', state.__lastAddedFunctions);
        const patchPayload = {
          task,
          repoPath: state.activeRepo.path,
          runId,
          userId: effectiveUserId,
          conversationId: state.activeThreadId,
          mode: runMode,
          lastChangedFiles: Array.isArray(state.__lastChangedFiles) ? state.__lastChangedFiles : [],
          lastAddedFunctions: Array.isArray(state.__lastAddedFunctions) ? state.__lastAddedFunctions : [],
        };
        state.__sendDebugByRun = state.__sendDebugByRun || {};
        state.__sendDebugByRun[runId] = {
          clickTs: sendTs,

        try { console.log('[send-debug] BEFORE fetch ' + _apiPath + ', payload size=' + JSON.stringify(patchPayload).length + ', runId attempted=' + runId); } catch {}
        try {
