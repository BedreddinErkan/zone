            runId,
            triggerSource: 'sendMessage',
            timestamp: new Date().toISOString(),
            stack: (new Error().stack || '').split('\n').slice(1, 6).map(s => s.trim()).join(' | '),
          });
        } catch {}
        const _patchHeaders = { 'Content-Type': 'application/json', ...buildAuthHeaders() };
        // Investigate mode → /api/investigate (direct, no plan review);
        // all other modes → /api/patch (back-compat path also handles intent=investigation).
        const _postPatchOutcome = await postPatchApi(patchPayload, _patchHeaders, undefined, _apiPath);
        const res = _postPatchOutcome.res;
        const result = _postPatchOutcome.body;
        try {
          console.log('[send-debug] AFTER fetch /api/patch response, status=' + res.status, {
            runIdReturned: result?.runId || result?.executionId || runId,
            msElapsed: state.__sendDebugByRun?.[runId]?.fetchStartedAt ? (Date.now() - state.__sendDebugByRun[runId].fetchStartedAt) : null,
          });
        } catch {}
        handlePatchResult(result, runId);
      } catch (e) {
        try { console.log('[send-debug] AFTER fetch /api/patch response, status=request_failed', { runIdReturned: runId, msElapsed: state.__sendDebugByRun?.[runId]?.fetchStartedAt ? (Date.now() - state.__sendDebugByRun[runId].fetchStartedAt) : null, error: e?.message || String(e) }); } catch {}
        setRunningUI(false);
        setLogBlockDone(runId);
        const _owningThreadId = getThreadIdForRunId(runId);
        if (_owningThreadId) clearRun(_owningThreadId);
        els.chatArea.appendChild(createToast('error', `Request failed: ${e?.message || e}`));
        scrollChatIfFollowing();
      }
    }

    // UI.5: build agent summary bubble — returns null when summaryText is empty.
    function buildRunSummaryBubble(summaryText, runId) {
      try {
        const cleaned = summaryText ? stripTrailingVerificationTag(String(summaryText)).trim() : '';
        if (!cleaned) return null;
        return createAgentBubbleFromMarkdown(cleaned, { runId: runId || null });
      } catch(err) {
        console.warn('[zone-ui-run-summary]', err);
        return null;
      }
    }

    // UI.5: inline status line — {icon} {K.4 userFacingMessage} · N files · $cost · X% cached
    function createRunStatusLine(result) {
      try {
        const terminationReason = String(result?.terminationReason || '');
        const category = getRunCategory(terminationReason || 'natural_completion');
        const ICONS = { success: '✓', warning: '⚠', error: '✗', neutral: '⏸' };
        const icon = ICONS[category] || '✓';
        const msg = String(result?.userFacingMessage || '').trim() || 'Run complete';
        const filesCount = Array.isArray(result?.fileDiffs) ? result.fileDiffs.length : 0;
        const costStr = typeof result?.costUsd === 'number' ? '$' + result.costUsd.toFixed(2) : null;
        const cachePct = typeof result?.cacheHitPct === 'number' ? Math.round(result.cacheHitPct) + '% cached' : null;
        const metricParts = [filesCount === 1 ? '1 file' : filesCount + ' files'];
        if (costStr) metricParts.push(costStr);
        if (cachePct) metricParts.push(cachePct);
        const el = document.createElement('div');
        el.className = 'run-status-line category-' + category;
        el.innerHTML = escapeHtml(icon) + ' ' + escapeHtml(msg) + ' · ' + escapeHtml(metricParts.join(' · '));
        return el;
      } catch(err) {
        console.warn('[zone-ui-status-line]', err);
        return null;
      }
    }

    // UI.5: italic Next hint — null when canResume false or resumeHint absent.
    function createRunNextHint(result) {
      try {
        if (!result?.canResume || !result?.resumeHint) return null;
        const el = document.createElement('div');
        el.className = 'run-next-hint';
        el.textContent = 'Next: ' + String(result.resumeHint);
        return el;
      } catch(err) {
        return null;
      }
    }

    // UI.6: parse agent's structured summary into sections.
    function parseAgentSummary(rawDetail) {
      const raw = String(rawDetail || '');
      const cleaned = raw.replace(/\[ZONE_VERIFICATION:[^\]]*\]/g, '').trim();
      const SECTION_NAMES = ['what changed', 'why', 'tests', 'notes'];
      const sectionContent = {};
      let currentKey = null;
      for (const line of cleaned.split('\n')) {
        const m = line.match(/^##\s+(.+?)\s*$/i);
        if (m) {
          const name = m[1].toLowerCase().trim();
          if (SECTION_NAMES.includes(name)) { currentKey = name; sectionContent[currentKey] = []; continue; }
        }
        if (currentKey !== null) sectionContent[currentKey].push(line);
      }
      const isStructured = Object.keys(sectionContent).length >= 2;
      if (!isStructured) return { what: cleaned, why: '', tests: '', notes: '', isStructured: false, raw };
      return {
        what: (sectionContent['what changed'] || []).join('\n').trim(),
        why: (sectionContent['why'] || []).join('\n').trim(),
        tests: (sectionContent['tests'] || []).join('\n').trim(),
        notes: (sectionContent['notes'] || []).join('\n').trim(),
        isStructured: true, raw,
      };
    }

    // UI.6: category → emoji map.
    function runSummaryCategoryEmoji(category) {
      if (category === 'success') return '✅';
      if (category === 'warning') return '⚠️';
      if (category === 'error') return '🔴';
      return 'ℹ️';
    }

    // UI.6: metrics footer string.
    function runSummaryMetrics(ctx) {
      const n = (ctx.filesChanged || []).length;
      const parts = [n === 1 ? '1 file' : n + ' files'];
      if (ctx.costUsd != null) parts.push('$' + ctx.costUsd.toFixed(2));
      if (ctx.cacheHitPct != null) parts.push(Math.round(ctx.cacheHitPct) + '% cached');
      return parts.join(' · ');
    }

    // UI.6: Brief format — single-line, emoji + first bullet + metrics.
    function formatSummaryBrief(s, ctx) {
      const emoji = runSummaryCategoryEmoji(ctx.category);
      const metrics = runSummaryMetrics(ctx);
      if (!s.isStructured) {
        const plain = s.raw.replace(/```[\s\S]*?```/g, '').replace(/\n+/g, ' ').trim();
        const snippet = plain.length > 220 ? plain.slice(0, 217) + '…' : plain;
        return emoji + ' ' + snippet + ' · ' + metrics;
      }
      const firstLine = s.what.split('\n')[0].replace(/^-\s+/, '').trim();
      const truncated = firstLine.length > 100 ? firstLine.slice(0, 97) + '…' : firstLine;
      return emoji + ' ' + truncated + ' · ' + metrics;
    }

    // UI.6: Detailed format — full sections + metrics footer.
    function formatSummaryDetailed(s, ctx) {
      const footer = '*' + runSummaryMetrics(ctx) + ' · ' + ctx.category + '*';
      if (!s.isStructured) return s.raw + '\n\n---\n' + footer;
      const lines = [
        '## What changed', s.what || '(none)', '',
        '## Why', s.why || '(not specified)', '',
        '## Tests', s.tests || 'not_run',
      ];
      if (s.notes) lines.push('', '## Notes', s.notes);
      lines.push('', '---', footer);
      return lines.join('\n');
    }

    // UI.6: PR Description format — GitHub-flavored markdown.
    function formatSummaryPR(s, ctx) {
      const MAX_INLINE = 3;
      const files = ctx.filesChanged || [];
      const fileLines = files.map(f => '- `' + f.path + '` (+' + f.added + '/-' + f.removed + ')');
      let changesBlock;
      if (fileLines.length === 0) {
        changesBlock = '_None._';
      } else if (fileLines.length <= MAX_INLINE) {
        changesBlock = fileLines.join('\n');
      } else {
        const head = fileLines.slice(0, MAX_INLINE).join('\n');
        const rest = fileLines.slice(MAX_INLINE).join('\n');
        changesBlock = head + '\n<details><summary>' + (fileLines.length - MAX_INLINE) + ' more files</summary>\n\n' + rest + '\n</details>';
      }
      const summary = s.isStructured ? (s.why || s.what) : s.raw;
      const tests = s.isStructured ? s.tests : '';
      const notes = s.isStructured ? s.notes : '';
      const testPassed = /tests_passed|passed/i.test(tests);
      const testCheckbox = tests ? '- [' + (testPassed ? 'x' : ' ') + '] ' + tests : '- [ ] Run tests and verify';
      const statusPrefix = ctx.category === 'success' ? '✅' : ctx.category === 'warning' ? '⚠' : '✗';
      const lines = [
        '## Summary', '', summary, '',
        '## Changes', '', changesBlock, '',
        '## Test plan', '', testCheckbox,
      ];
      if (notes) lines.push('', '## Notes', '', notes);
      lines.push('', statusPrefix + ' ' + ctx.userFacingMessage);
      return lines.join('\n');
    }

    // UI.6: Slack format — mrkdwn-friendly, emoji bullets, no ## headers.
    function formatSummarySlack(s, ctx) {
      const emoji = runSummaryCategoryEmoji(ctx.category);
      const metrics = runSummaryMetrics(ctx);
      const header = emoji + ' *' + ctx.userFacingMessage + '* — ' + metrics;
      if (!s.isStructured) {
        const plain = s.raw.replace(/^#{1,3}\s+(.+)$/gm, '*$1*').replace(/```[\s\S]*?```/g, '`<code block>`');
        return header + '\n\n' + plain.trim();
      }
      const lines = [header, ''];
      const bullets = s.what.split('\n').map(l => l.replace(/^-\s+/, '').trim()).filter(Boolean).map(l => '• ' + l);
      if (bullets.length > 0) { lines.push(...bullets); lines.push(''); }
      if (s.tests) lines.push('*Tests:* ' + s.tests);
      if (s.notes) lines.push('', '_Note: ' + s.notes + '_');
      return lines.join('\n');
    }

    // UI.6: Prompt format — paste-ready handoff to another AI.
    function formatSummaryPrompt(s, ctx) {
      if (ctx.category === 'error' && (ctx.filesChanged || []).length === 0) {
        const lines = ['A run was halted before any code change.', '', '**Status:** ' + ctx.userFacingMessage];
        if (s.isStructured && s.notes) lines.push('', '**Notes:** ' + s.notes);
        lines.push('', '## What I need from you', '[INSERT FOLLOWUP TASK HERE]');
        return lines.join('\n');
      }
      const lines = [
        'I just ran a coding agent and it ended with status: **' + ctx.category + '** (' + ctx.terminationReason + ').',
        '', '## What was done', s.isStructured ? s.what : s.raw, '',
      ];
      if (s.isStructured && s.why) lines.push('## Why', s.why, '');
      const files = ctx.filesChanged || [];
      if (files.length > 0) {
        lines.push('## Files changed');
        for (const f of files) lines.push('- `' + f.path + '` (+' + f.added + '/-' + f.removed + ')');
        lines.push('');
      }
      lines.push('## Tests', s.isStructured ? (s.tests || 'not_run') : 'not_run', '');
      const notes = s.isStructured ? s.notes : '';
      lines.push('## Notes / Open items', notes || '(none)', '');
      if (ctx.category === 'warning' || ctx.category === 'error') lines.push('> Do not re-do the work above. Start from the current repo state.', '');
      lines.push('## What I need from you', '[INSERT FOLLOWUP TASK HERE]');
      return lines.join('\n');
    }

    // UI.6: apply format transformer by id.
    function applyRunFormat(fmtId, structured, ctx) {
      switch (fmtId) {
        case 'brief':    return formatSummaryBrief(structured, ctx);
        case 'pr':       return formatSummaryPR(structured, ctx);
        case 'slack':    return formatSummarySlack(structured, ctx);
        case 'prompt':   return formatSummaryPrompt(structured, ctx);
        default:         return formatSummaryDetailed(structured, ctx);
      }
    }

    // UI.6: default format per termination reason / category.
    function defaultFormatFor(category, terminationReason) {
      switch (String(terminationReason || '')) {
        case 'natural_completion': return 'detailed';
        case 'max_iterations': case 'token_budget_exceeded': case 'compaction_exhausted': return 'prompt';
        case 'APPLY_ROLLED_BACK': return 'detailed';
        case 'upstream_unavailable': case 'loop_detected': case 'daily_usd_cap_exceeded':
        case 'revision_approval_timeout': case 'revision_rejected': return 'brief';
        default: return category === 'success' ? 'detailed' : 'brief';
      }
    }

    // UI.6: build RunSummaryContext from patch result.
    function getRunSummaryContext(result) {
      const terminationReason = String(result?.terminationReason || 'natural_completion');
      return {
        terminationReason,
        category: getRunCategory(terminationReason),
        filesChanged: (result?.fileDiffs || []).map(function(d) {
          return { path: String(d.filePath || d.path || ''), added: d.addedLines || 0, removed: d.removedLines || 0 };
        }),
        costUsd: typeof result?.costUsd === 'number' ? result.costUsd : null,
        cacheHitPct: typeof result?.cacheHitPct === 'number' ? result.cacheHitPct : null,
        userFacingMessage: String(result?.userFacingMessage || 'Run complete'),
      };
    }

    // UI.6: build the inline tab-row switcher below the summary bubble.
    // Returns the row element. Wires click handlers that swap bubble chat-body content in place.
    let _lastFormatCopyFn = null;

    function buildRunFormatSwitcher(structured, ctx, bubbleEl, initialFmt) {
      const FORMAT_DEFS = [
        { id: 'brief',    full: 'Brief',    short: 'B'  },
        { id: 'detailed', full: 'Detailed', short: 'D'  },
        { id: 'pr',       full: 'PR',       short: 'P'  },
        { id: 'slack',    full: 'Slack',    short: 'S'  },
        { id: 'prompt',   full: 'Prompt',   short: 'Pr' },
      ];
      const row = document.createElement('div');
      row.className = 'run-format-tabs';
      row.setAttribute('role', 'tablist');
      let currentFmt = initialFmt;
      for (const def of FORMAT_DEFS) {
        const tab = document.createElement('button');
        tab.className = 'fmt-tab' + (def.id === initialFmt ? ' active' : '');
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-selected', def.id === initialFmt ? 'true' : 'false');
        tab.setAttribute('aria-label', def.full + ' format');
        tab.innerHTML = '<span class="label-full">' + escapeHtml(def.full) + '</span><span class="label-short">' + escapeHtml(def.short) + '</span>';
        tab.addEventListener('click', function() {
          const formatted = applyRunFormat(def.id, structured, ctx);
          try {
            const body = bubbleEl.querySelector('.chat-body');
            if (body) body.innerHTML = renderChatMarkdown(formatted, true);
          } catch(e) { /* ignore */ }
          for (const t of row.querySelectorAll('.fmt-tab')) {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
          }
          tab.classList.add('active');
          tab.setAttribute('aria-selected', 'true');
          currentFmt = def.id;
        });
        row.appendChild(tab);
      }
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.type = 'button';
      copyBtn.setAttribute('aria-label', 'Copy current format');
      copyBtn.innerHTML = '📋 <span class="label">Copy</span>';
      const doCopyFormat = function() {
        const fmtDef = FORMAT_DEFS.find(d => d.id === currentFmt) || FORMAT_DEFS[0];
        const formatted = applyRunFormat(currentFmt, structured, ctx);
        writeClipboardText(formatted)
          .then(ok => showToast(ok ? 'success' : 'error', ok ? 'Copied as ' + fmtDef.full : 'Copy failed — select and copy manually', ok ? 1500 : 2000))
          .catch(() => showToast('error', 'Copy failed — select and copy manually', 2000));
      };
      copyBtn.addEventListener('click', doCopyFormat);
      row.appendChild(copyBtn);
      _lastFormatCopyFn = doCopyFormat;
      return row;
    }

    function handlePatchResult(result, runId){
      // Idempotent: replay SSE may deliver the final result even if the original fetch returns too.
      state.__runResultProcessed = state.__runResultProcessed || new Set();
      if (state.__runResultProcessed.has(runId)) return;
      state.__runResultProcessed.add(runId);

      if (result && result.ok && result.reason === 'already_implemented') {
        discardStreamUiForRun(runId);
      }
      stopLiveCoding({ runId });
      // Multi-active-thread Phase 1a: explicit clear for the run's owning
      // thread. In Phase 1a there's only ever one running thread at a time,
      // but use the lookup pattern that Phase 1b will rely on (a run may
      // have completed on a thread the user is no longer viewing).
      const _owningThreadId = getThreadIdForRunId(runId);
      // Phase 1b: clearRun closes the per-runId EventSource and removes
      // the thread's RunState. Other threads' runs continue unaffected.
      if (_owningThreadId) clearRun(_owningThreadId);
      state.runStartedAt = null;
      state.lastPatchResult = result;
      // Phase 1b: each runId owns its own EventSource. Close only this one.
      const _esForRun = state.eventSourcesByRunId.get(runId);
      try { _esForRun?.close(); } catch {}
      state.eventSourcesByRunId.delete(runId);
      // Keep state.eventSource (singular legacy field) in sync for any
      // remaining callers that read it; null if no other runs are active.
      if (state.eventSource === _esForRun) state.eventSource = null;

      setLogBlockDone(runId);
      try { setRunCost(runId, result && result.costUsd); } catch {}
      try { finalizeCostMeter(runId, result); } catch {}
      setRunningUI(false);
      completeExecutionSummary(runId);
      try { bgHideStickyPanel(runId); } catch {}

      // Finalize step timeline — primary call site (run_completed_with_result path).
      // The lifecycle 'run_completed' event may never arrive because eventSource is
      // already closed above; this ensures the spinner always stops.
      if (state.__useStepTimeline) {
        const _d = (result && (result.decisionMode || result.finalState || result.nextDecision)) || 'preview_only';
        const _outcome = _d === 'safe_to_apply' ? 'done' : 'warning';
        finalizeStepTimeline(runId, _outcome);
      }

      renderSidebar();
      renderBgTasks();

      if (result && result.cancelled) {
        // Phase J.2: removed "interrupted" verification banner. Cancellation
        // already surfaces via the toast/error log line; the timeline shows
        // exactly where the run stopped, so the redundant banner is gone.
        scrollChatIfFollowing(runId);
        dequeueAndRunNext(_owningThreadId);
        return;
      }

      if (!result || !result.ok) {
        if (result?.error === 'usage_limit_exceeded') {
          const label = result.reason === 'daily_limit' ? 'Daily' : 'Monthly';
          const used = typeof result.used === 'number' ? '$' + result.used.toFixed(2) : '';
          const limit = typeof result.limit === 'number' ? '$' + result.limit.toFixed(2) : '';
          showToast('error', `${label} spending limit reached (${used} / ${limit}). Update limits in Settings → Usage.`, 5000);
        } else if (state.__compactionExhaustedByRun?.[runId]) {
          // Amber notice already shown in log stream — suppress generic toast.
        } else {
          const msg = result?.message || result?.reason || 'Run failed';
          showToast('error', msg, 2400);
        }
        scrollChatIfFollowing(runId);
        dequeueAndRunNext(_owningThreadId);
        return;
      }

      // Keep a synchronous hint of what changed last run (for multi-turn memory).
      try {
        const fromDiffs = Array.isArray(result?.fileDiffs)
          ? result.fileDiffs.map((d) => String(d?.filePath ?? '').trim()).filter(Boolean)
          : [];
        const fromPatches = Array.isArray(result?.applyPatches)
          ? result.applyPatches.map((p) => String(p?.filePath ?? '').trim()).filter(Boolean)
          : [];
        state.__lastChangedFiles = (fromDiffs.length ? fromDiffs : fromPatches).slice(0, 20);
      } catch {
        state.__lastChangedFiles = [];
      }

      try {
        state.__lastAddedFunctions = Array.isArray(result?.addedFunctions)
          ? result.addedFunctions.map((s) => String(s ?? '').trim()).filter(Boolean).slice(0, 10)
          : [];
      } catch {
        state.__lastAddedFunctions = [];
      }

      const decision =
        (result && (result.decisionMode || result.finalState || result.nextDecision)) || 'preview_only';

      // Persist result message to the active thread.
      if (decision === 'chat') {
        upsertChatResponseMessage(runId, {
          responseText: result.chatResponse || '',
          responseHtml: result.responseHtml || '',
          contextFiles: result.contextFiles || [],
        });
      } else {
        try {
          const thread = getActiveThread();
          if (thread) {
            thread.messages = Array.isArray(thread.messages) ? thread.messages : [];
            const sp =
              state.__streamPreviewPersist && state.__streamPreviewPersist[runId]
                ? JSON.parse(JSON.stringify(state.__streamPreviewPersist[runId]))
                : null;
            thread.messages.push({
              type: 'result',
              ts: Date.now(),
              decisionMode: result.decisionMode || result.finalState || 'preview_only',
              finalState: result.finalState || null,
              verificationReason: normalizeVerificationReason(result.verificationReason || extractTrailingVerificationReason(result.chatResponse || '')) || '',
              fileDiffs: result.fileDiffs || [],
              appliedFiles: (result.applyPatches || []).map(p => p.filePath) || [],
              chatResponse: result.chatResponse || null,
              blocked: (result.decisionMode || result.finalState) === 'blocked',
              blockedMessage: result?.reason || result?.message || '',
              summary: String(state.lastTaskText || '').slice(0, 80),
              streamPreview: sp && Array.isArray(sp.lines) && sp.lines.length ? sp : null,
              handoffReport:
                result.reason === 'already_implemented'
                  ? null
                  : result.handoffReport ||
                    (state.__handoffReportByRun && state.__handoffReportByRun[runId]) ||
                    null,
            });
            saveThreads();
            try {
              if (state.__streamPreviewPersist && state.__streamPreviewPersist[runId]) {
                delete state.__streamPreviewPersist[runId];
              }
            } catch {}
          }
        } catch {}
      }

      if (decision === 'blocked') {
        const blockedReason = String(result?.reason || result?.message || 'Blocked for safety').trim();
        showToast('error', blockedReason || 'Blocked for safety.', 2600);
        const lb = document.getElementById(`logBlock-${runId}`);
        if (lb) appendLogLine(lb, { timestamp: nowTs(), message: '✗ Blocked for safety', status:'error' });

        // Phase J.2: replace verify-banner / no-changes-indicator / action-chip
        // with a single red banner that names the security reason. No diffs
        // are applied (the patch was hard-blocked) and no undo button is
        // shown (there's nothing to undo).
        appendToRunGroup(runId, createBlockedBanner(blockedReason));

        const diffsBlocked = Array.isArray(result.fileDiffs) ? result.fileDiffs : [];
        const blockedDiffState = getEffectiveDiffState(result);
        const blockedMsg = blockedReason || '✗ Blocked for safety';
        const maxShowBlocked = 3;
        try {
          if (diffsBlocked[0] && diffsBlocked[0].diff && Array.isArray(diffsBlocked[0].diff) && diffsBlocked[0].diff[0]) {
            console.log('[zone-ui][diff-shape]', JSON.stringify(diffsBlocked[0].diff[0]));
          }
        } catch {}
        if (!blockedDiffState.effectiveDiffsEmpty) {
          diffsBlocked.slice(0, maxShowBlocked).forEach((fd, i) => {
            const card = renderDiffCard(fd, i, diffsBlocked.length, {
              decisionMode: 'blocked',
              blockedMessage: blockedMsg,
            });
            if (card) appendToRunGroup(runId, card);
          });
        }
        if (!blockedDiffState.effectiveDiffsEmpty && diffsBlocked.length > maxShowBlocked) {
          const moreB = document.createElement('div');
          moreB.className = 'toast';
          moreB.innerHTML = `<div class="ticon" style="background:var(--blue)"></div><div>+${diffsBlocked.length - maxShowBlocked} more diffs in report</div>`;
          appendToRunGroup(runId, moreB);
        }
        scrollChatIfFollowing(runId);
        try {
          const g = document.getElementById(`runGroup-${runId}`);
          if (g) g.dataset.runStatus = 'completed';
        } catch {}
        stopDurationTicker(runId);
        handleCostStripRunComplete(runId);
        persistRunGroupHtmlToThread(runId, 'completed');
        dequeueAndRunNext(_owningThreadId);
        return;
      }
      // Phase J.3: post-apply verification regressed → staging was discarded
      // before reaching disk. Show amber banner with reason + top errors,
      // render diff for inspection ("what was attempted"), no undo button
      // (rollback was automatic).
      if (decision === 'rolled_back') {
        const rolledReason = String(result?.rolledBackReason || result?.verificationNote || 'Verification regressed after apply');
        const rolledErrors = Array.isArray(result?.rolledBackErrors) ? result.rolledBackErrors : [];
        appendToRunGroup(runId, createRolledBackBanner({
          reason: rolledReason,
          errors: rolledErrors,
        }));

        // Render diff cards (read-only inspection of what was attempted).
        const diffsRolled = Array.isArray(result.fileDiffs) ? result.fileDiffs : [];
        const maxShowRolled = 3;
        if (diffsRolled.length > 0) {
          diffsRolled.slice(0, maxShowRolled).forEach((fd, i) => {
            const card = renderDiffCard(fd, i, diffsRolled.length, {
              decisionMode: 'rolled_back',
              applied: false,
            });
            if (card) appendToRunGroup(runId, card);
          });
          if (diffsRolled.length > maxShowRolled) {
            const moreR = document.createElement('div');
            moreR.className = 'toast';
            moreR.innerHTML = `<div class="ticon" style="background:var(--blue)"></div><div>+${diffsRolled.length - maxShowRolled} more diffs in report</div>`;
            appendToRunGroup(runId, moreR);
          }
        }

        scrollChatIfFollowing(runId);
        try {
          const g = document.getElementById(`runGroup-${runId}`);
          if (g) g.dataset.runStatus = 'completed';
        } catch {}
        stopDurationTicker(runId);
        handleCostStripRunComplete(runId);
        persistRunGroupHtmlToThread(runId, 'completed');
        dequeueAndRunNext(_owningThreadId);
        return;
      }
      if (decision === 'investigation') {
        hideEmpty();
        const answerText = String(result.chatResponse || '');
        // Show informational pill when investigation hit the iteration budget
        if (result.finalState === 'max_iterations') {
          const pill = document.createElement('div');
          pill.className = 'toast';
          pill.style.cssText = 'margin:0 0 6px;opacity:0.85';
          pill.innerHTML = `<div class="ticon" style="background:var(--blue,#5b8af0)"></div><div>Investigation incomplete — iteration budget reached. Findings below are partial.</div>`;
          appendToRunGroup(runId, pill);
        }
        // Phase H.7: token-budget graceful exit pill
        if (result.finalState === 'token_budget_exceeded') {
          const pill = document.createElement('div');
          pill.className = 'toast';
          pill.style.cssText = 'margin:0 0 6px;opacity:0.85;border-color:rgba(212,168,90,0.4);background:rgba(212,168,90,0.08)';
          pill.innerHTML = `<div class="ticon" style="background:#d4a85a"></div><div>Token budget reached — findings below are partial. Re-dispatch with a more focused scope to continue.</div>`;
          appendToRunGroup(runId, pill);
        }
        // Belt-and-suspenders: strip any narration line whose collapsed text
        // matches the final answer (agentLoop now skips narration on the final
        // iter, but remove the duplicate if it slipped through).
        try {
          const lb = document.getElementById(`logBlock-${runId}`);
          if (lb && answerText) {
            const answerCollapsed = answerText.replace(/\s+/g, ' ').trim().slice(0, 200);
            lb.querySelectorAll('.narration-line').forEach((el) => {
              const msgEl = el.querySelector('.log-msg');
              const lineText = String(msgEl ? msgEl.textContent : '').replace(/\s+/g, ' ').trim();
              if (lineText && answerCollapsed.startsWith(lineText.slice(0, 80))) el.remove();
            });
          }
        } catch {}
        const bubble = createAgentBubbleFromMarkdown(answerText, {
          runId,
          html: result.responseHtml || '',
          contextFiles: result.contextFiles || [],
          userText: findUserTextForRun(runId),
        });
        bubble.id = `investigationBubble-${runId}`;
        appendToRunGroup(runId, bubble);
        scrollChatIfFollowing(runId);
        try {
          const g = document.getElementById(`runGroup-${runId}`);
          if (g) g.dataset.runStatus = 'completed';
        } catch {}
        stopDurationTicker(runId);
        handleCostStripRunComplete(runId);
        persistRunGroupHtmlToThread(runId, 'completed');
        dequeueAndRunNext(_owningThreadId);
        return;
      }
      if (decision === 'chat') {
        hideEmpty();
        try {
          const staleLog = document.getElementById(`logBlock-${runId}`);
          if (staleLog) staleLog.remove();
        } catch {}
        finalizeChatBubble(runId, {
          responseText: String(result.chatResponse || ''),
          responseHtml: result.responseHtml || '',
          contextFiles: result.contextFiles || [],
        });
        scrollChatIfFollowing(runId);
        try {
          const g = document.getElementById(`runGroup-${runId}`);
          if (g) g.dataset.runStatus = 'completed';
        } catch {}
        stopDurationTicker(runId);
        handleCostStripRunComplete(runId);
        persistRunGroupHtmlToThread(runId, 'completed');
        dequeueAndRunNext(_owningThreadId);
        return;
      }

      // Phase H.7: patch-flow token-budget graceful exit pill (surfaced
      // before the verify-banner so the reason for "Preview only" is clear).
      if (result?.tokenBudgetExceeded) {
        const pill = document.createElement('div');
        pill.className = 'toast';
        pill.style.cssText = 'margin:0 0 6px;opacity:0.9;border-color:rgba(212,168,90,0.4);background:rgba(212,168,90,0.08)';
        pill.innerHTML = `<div class="ticon" style="background:#d4a85a"></div><div>Token budget reached — agent stopped before completing. Patches above are partial; review carefully.</div>`;
        appendToRunGroup(runId, pill);
      }
      // Phase Q.2: loop-detected graceful exit notice.
      if (result?.loopDetected) {
        const { toolName, count } = result.loopDetected;
        const pill = document.createElement('div');
        pill.className = 'toast';
        pill.style.cssText = 'margin:0 0 6px;opacity:0.9;border-color:rgba(212,168,90,0.4);background:rgba(212,168,90,0.08)';
        pill.innerHTML = `<div class="ticon" style="background:#d4a85a"></div><div>Loop detected — <code>${escapeHtml(String(toolName))}</code> was called ${count}× with identical args. Agent stopped. Try rephrasing or narrowing the task.</div>`;
        appendToRunGroup(runId, pill);
      }

      // Phase J.2: removed verify-banner / verdict pill. After J.1 collapsed
      // preview_only into safe_to_apply, the verification banner only ever
      // showed "Safe to apply · Tests skipped" or similar redundant state.
      // The diff card + undo button now carry the entire post-completion UX.
      // Agent prosa bubble removed (Phase A.7e):
      // Narration events (A.7a/b) render agent text inline in the timeline
      // with marker stripping. The bubble path duplicated that content less
      // cleanly (markers like [step:done:N] leaked through) and produced
      // duplicate summaries at run completion. If fallback-source notes need
      // to surface again later (llm_patch_recovered, ast_fallback,
      // deterministic_fallback), do it via the chip row or verify-row, not
      // a bubble.

      // append diff blocks (first 3)
      const diffs = Array.isArray(result.fileDiffs) ? result.fileDiffs : [];
      const diffState = getEffectiveDiffState(result);
      try {
        if (diffs[0] && diffs[0].diff && Array.isArray(diffs[0].diff) && diffs[0].diff[0]) {
          console.log('[zone-ui][diff-shape]', JSON.stringify(diffs[0].diff[0]));
        }
      } catch {}
      const maxShow = 3;
      const handoffLive =
        result.handoffReport ||
        (state.__handoffReportByRun && state.__handoffReportByRun[runId]);
        const patchesAlreadyApplied = !!(result && result.patchesAlreadyApplied);
    const diffToolbarOpts =
        decision === 'safe_to_apply'
          ? { decisionMode: 'safe_to_apply', applied: patchesAlreadyApplied, handoffReport: handoffLive, verificationReason: result.verificationReason }
          : { decisionMode: 'preview_only', patchesAlreadyApplied, handoffReport: handoffLive, verificationReason: result.verificationReason };
      if (diffState.effectiveDiffsEmpty && decision !== 'investigation') {
        // Phase J.2: replaced "No changes made" yellow pill with a subtle
        // single-line indicator. Empty-diff is a legitimate success path
        // (e.g. agent decided no patch was needed) — not a warning.
        appendToRunGroup(runId, createApplyCompleteIndicator({ filesChanged: 0 }));
      } else if (!diffState.effectiveDiffsEmpty) {
        diffs.slice(0, maxShow).forEach((fd, i) => {
          const card = renderDiffCard(fd, i, diffs.length, diffToolbarOpts);
          if (card) appendToRunGroup(runId, card);
        });
      }
      if (!diffState.effectiveDiffsEmpty && diffs.length > maxShow) {
        const more = document.createElement('div');
        more.className = 'toast';
        more.innerHTML = `<div class="ticon" style="background:var(--blue)"></div><div>+${diffs.length - maxShow} more diffs in report</div>`;
        appendToRunGroup(runId, more);
      }


      // UI.6: inline prose run completion — format-aware summary bubble + switcher tabs + status line + next hint
      if (decision === 'safe_to_apply' || decision === 'preview_only') {
        try {
          // Summary text: captured agent summary or statusSummary fallback
          const _summaryText = (state.__agentSummaryByRun && state.__agentSummaryByRun[runId])
            || String(result?.finalRunReport?.statusSummary || '').trim();
          if (_summaryText) {
            // Parse structured summary + determine default format
            const _ctx = getRunSummaryContext(result);
            const _structured = parseAgentSummary(_summaryText);
            const _defaultFmt = defaultFormatFor(_ctx.category, _ctx.terminationReason);
            // Render bubble with default-format text
            const _displayText = applyRunFormat(_defaultFmt, _structured, _ctx);
            const _bubble = buildRunSummaryBubble(_displayText, runId);
            if (_bubble) {
              hideEmpty();
              appendToRunGroup(runId, _bubble);
              // Format switcher tab row (always shown when summary present in patch mode)
              try {
                const _switcher = buildRunFormatSwitcher(_structured, _ctx, _bubble, _defaultFmt);
                appendToRunGroup(runId, _switcher);
              } catch(swErr) {
                console.warn('[zone-ui-format-switcher]', swErr);
              }
            }
          }
          // Inline status line
          const _statusLine = createRunStatusLine(result);
          if (_statusLine) appendToRunGroup(runId, _statusLine);
          // Next hint (only when canResume + resumeHint)
          const _hint = createRunNextHint(result);
          if (_hint) appendToRunGroup(runId, _hint);
        } catch (err) {
          console.warn('[zone-ui-final-prose]', err);
        }
      }

      // Zone Undo Tur 2b: per-run revert affordance for safe_to_apply runs.
      // Hidden on preview_only / blocked / chat. The 404 path covers older
      // runs whose snapshots have been GC'd.
      try {
        if (decision === 'safe_to_apply' && !diffState.effectiveDiffsEmpty && runId && state.activeRepo?.path) {
          appendToRunGroup(runId, renderUndoControl(runId, state.activeRepo.path));
        }
      } catch {}
      // Phase J.2: removed action-chip row. Apply is automatic post-J.1;
      // diff card carries file count, undo control above covers revert.

      try {
        if (state.__handoffReportByRun && state.__handoffReportByRun[runId]) {
          delete state.__handoffReportByRun[runId];
        }
      } catch {}

      if (decision === 'safe_to_apply' && !diffState.effectiveDiffsEmpty) {
        if (patchesAlreadyApplied) {
          showToast('success', '✓ Applied by agent', 1600);
        }
      } else {
        if (decision === 'preview_only') {
          if (patchesAlreadyApplied) {
            const vn = result && result.verificationNote ? String(result.verificationNote) : '';
            showToast('warning', vn ? `⚠ ${vn}` : '⚠ Applied but unverified — review diff', 3000);
          }
        }
      }
      scrollChatIfFollowing(runId);

      try {
        const g = document.getElementById(`runGroup-${runId}`);
        if (g) g.dataset.runStatus = 'completed';
      } catch {}
      stopDurationTicker(runId);
      handleCostStripRunComplete(runId);
      persistRunGroupHtmlToThread(runId, 'completed');

      // If user queued tasks while this run was executing, start next automatically.
      dequeueAndRunNext(_owningThreadId);
    }

    // ---- Apply patches ----
    async function applyPatches(options){
      const patches = state.lastPatchResult?.applyPatches;
      if (!Array.isArray(patches) || !patches.length) {
        showToast('error', 'No applyable patches found in last result.', 2200);
        return;
      }
      const auto = !!options?.auto;
      if (!auto) showToast('', 'Applying patches…');
      try{
        const res = await apiFetch('/api/apply', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ patches, repoPath: state.activeRepo?.path })
        });
        const data = await res.json();
        const applied = Array.isArray(data?.applied) ? data.applied : [];
        const failed = Array.isArray(data?.failed) ? data.failed : [];
        const ok = res.ok && applied.length > 0 && failed.length === 0;
        const runId = String(options?.runId || state.runId || '');
        const logBlock = runId ? document.getElementById(`logBlock-${runId}`) : null;
        if (ok) {
          try {
            document.querySelectorAll('.diff-toolbar-status.applying').forEach((el) => {
              el.textContent = '✓ Applied';
              el.classList.remove('applying');
              el.classList.add('applied-done');
            });
          } catch {}
          if (logBlock) appendLogLine(logBlock, { timestamp: nowTs(), message: '✓ Applied successfully', status:'success' });
          showToast('success', `✓ Applied to ${applied[0] || 'file'}`, 1600);
        } else {
          if (logBlock) appendLogLine(logBlock, { timestamp: nowTs(), message: '✗ Apply failed', status:'error' });
          showToast('error', data?.message || 'Apply failed.', 2500);
        }
      }catch(e){
        const runId = String(options?.runId || state.runId || '');
        const logBlock = runId ? document.getElementById(`logBlock-${runId}`) : null;
        if (logBlock) appendLogLine(logBlock, { timestamp: nowTs(), message: '✗ Apply failed', status:'error' });
        showToast('error', `Apply request failed: ${e?.message || e}`, 2500);
      }
    }

    function renderAttachPreviewStrip() {
      const strip = els.attachPreviewStrip;
      if (!strip) return;
      strip.innerHTML = '';
      if (state.pendingAttachments.length === 0) { strip.style.display = 'none'; return; }
      strip.style.display = 'flex';
      state.pendingAttachments.forEach(function(att, i) {
        const wrap = document.createElement('div');
        wrap.className = 'attach-thumb-wrap';
        const img = document.createElement('img');
        img.className = 'attach-thumb';
        img.src = 'data:' + att.mediaType + ';base64,' + att.base64;
        img.alt = 'Image ' + (i + 1);
        const rm = document.createElement('button');
        rm.className = 'attach-thumb-remove';
        rm.title = 'Remove';
        rm.textContent = '×';
        rm.addEventListener('click', function() {
          state.pendingAttachments.splice(i, 1);
          renderAttachPreviewStrip();
        });
        wrap.appendChild(img);
        wrap.appendChild(rm);
        strip.appendChild(wrap);
      });

      state.pendingAttachments = [];

    function maybeSendFromEnter(e){
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const task = String(els.taskInput.value || '').trim();
        if (!task) {
          try { console.log('[send-debug] EARLY RETURN reason=empty_task_enter_submit'); } catch {}
          return;
        }
        try {
          console.log('[send-debug] button clicked, threadId=' + String(state.activeThreadId || ''), {
            projectPath: state.activeRepo?.path || '',
            inputText: task,
            source: 'enter',
          });
        } catch {}
        els.taskInput.value = '';
        autosizeTextarea();
        // Phase 1b: gate on the ACTIVE thread's run, not the global isRunning.
        // If another thread is mid-run but this thread is idle, dispatch a
        // fresh sendMessage rather than queueing — that's the headline
        // multi-active-thread behavior.
        if (getRun(state.activeThreadId)) {
          try { console.log('[send-debug] EARLY RETURN reason=active_thread_running_enqueued_from_enter', { activeThreadId: state.activeThreadId, queueLength: (state.taskQueuesByThread.get(state.activeThreadId) || []).length }); } catch {}
          enqueueTask(task);
          return;
        }
        sendMessage(task);
      }

      });

      Promise.all([
        fetch('/api/metrics?period=day').then(r => r.json()).catch(() => null),
        fetch('/api/usage-limits').then(r => r.json()).catch(() => null),
      ]).then(([metrics, limits]) => {
        const statsEl = document.getElementById('gen-stats-body');
        if (!statsEl) return;
        const runs = metrics && typeof metrics.totalRuns === 'number' ? metrics.totalRuns : null;
        const spent = metrics && typeof metrics.totalCostUsd === 'number' ? metrics.totalCostUsd : null;
        const cap = limits && typeof limits.dailyLimit === 'number' ? limits.dailyLimit : null;
        const remaining = (cap !== null && spent !== null) ? Math.max(0, cap - spent) : null;
        const fmtUsd = n => n !== null ? '$' + n.toFixed(4) : '—';
        statsEl.innerHTML = `
          <div class="row"><div class="k">Runs</div><div class="v">${runs !== null ? runs : '—'}</div></div>
          <div class="row"><div class="k">Total cost</div><div class="v">${fmtUsd(spent)}</div></div>
          <div class="row"><div class="k">Cap remaining</div><div class="v">${cap !== null ? fmtUsd(remaining) : '<span style="opacity:.5">No cap set</span>'}</div></div>
        `;
      });
    }

    function renderKeysSettings(){

      const activeProvider = getActiveProvider();

      function providerSection(opts) {
        const provider = opts.provider;
