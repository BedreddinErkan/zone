    :root{

    .icon-btn:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}

    .dropdown{

    .repo-form .browsebtn:hover{border-color:rgba(255,255,255,0.22);background:rgba(255,255,255,0.07)}
    .repo-form .browsebtn:disabled{opacity:.5;cursor:default}
    .repo-form-error{color:var(--color-error);font-size:var(--font-size-sm);padding:var(--space-xs) 2px 0;grid-column:1/-1}

    .group{margin-bottom:var(--space-lg)}

    .gbtn.del{opacity:0;pointer-events:none}

    .threads{display:none;padding:var(--space-xs) 2px var(--space-md)}

    .thread{
      width:100%;display:grid;grid-template-columns:10px 1fr auto auto;gap:var(--space-lg);align-items:center;
      padding:var(--space-md) var(--space-lg);border-radius:var(--radius-lg);border:1px solid transparent;background:transparent;color:var(--text-2);text-align:left;

    .bubble{max-width:720px;margin:var(--space-lg) 0;padding:var(--space-xl);border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface2);position:relative}
    .bubble.user{margin-left:0;background:transparent;border:none;color:var(--text);border-radius:0;padding-left:0}
    .bubble.user::before{content:'›';color:var(--amber);font-family:var(--font-family-mono);margin-right:var(--space-sm);font-size:1.1em;line-height:1}
    .user-bubble-thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
    .bubble-thumb{width:60px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid rgba(255,255,255,0.1);transition:opacity 0.15s}
    .bubble-thumb:hover{opacity:0.82}
    .bubble.agent{margin-right:auto;max-width:85%;background:transparent;color:var(--text-1);border:none;border-left:2px solid var(--green-dim);border-radius:0;padding:12px 18px}
    .bubble .text{font-size:var(--font-size-md);line-height:1.55;white-space:pre-wrap;word-break:break-word}
    .bubble .md{font-size:var(--font-size-md);line-height:1.55;word-break:break-word}
    .bubble.agent .zone-chat-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-xl);margin:0 0 var(--space-2xl)}
    .bubble.agent .zone-chat-brand{display:flex;align-items:center;gap:var(--space-md);min-width:0}
    .bubble.agent .zone-chat-label{font-size:var(--font-size-base);font-weight:500;color:var(--green);letter-spacing:.02em}
    .bubble.agent .zone-chat-model{font-size:var(--font-size-sm);color:var(--muted);white-space:nowrap}
    .bubble.agent .zone-chat-icon{width:14px;height:14px;color:var(--green);flex:0 0 14px}
    .bubble.agent .chat-body{font-family:var(--font-family-sans);font-size:var(--font-size-md);line-height:1.6;color:var(--text-2)}
    .bubble.agent .chat-body h3{margin:18px 0 var(--space-md);font-size:14px;line-height:1.35;color:var(--text-1);font-weight:600}
    .bubble.agent .chat-body h3:first-child{margin-top:0}
    .bubble.agent .chat-body p{margin:0 0 var(--space-xl)}
    .bubble.agent .chat-body ul{margin:0 0 var(--space-xl);padding-left:20px;line-height:1.5}
    .bubble.agent .chat-body li{margin:0 0 var(--space-sm)}
    .bubble.agent .chat-body li::marker{color:var(--muted)}
    .bubble.agent .chat-body code{font-family:var(--font-family-mono)}
    .bubble.agent .chat-codeblock{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-xl) var(--space-2xl);margin:var(--space-lg) 0;overflow-x:auto;font-family:var(--font-family-mono);font-size:var(--font-size-md);line-height:1.5;color:var(--text-2)}
    .bubble.agent .chat-codeblock code{background:transparent;padding:0;display:block}
    .bubble.agent .chat-codeblock.streaming{position:relative}
    .streaming-cursor{display:inline-block;color:var(--green);animation:zone-blink 1s step-end infinite;margin-left:2px;font-weight:bold}
    @keyframes zone-blink{50%{opacity:0}}
    .bubble.agent .inline-code{background:var(--surface2);padding:2px var(--space-sm);border-radius:4px;font-family:var(--font-family-mono);font-size:.9em;color:var(--green)}
    .bubble.agent .chat-body a{color:var(--green);text-decoration:none}
    .bubble.agent .chat-body a:hover{text-decoration:underline;color:var(--text-1)}
    .bubble.agent .chat-body h1,.bubble.agent .chat-body h2{margin:18px 0 var(--space-md);line-height:1.35;color:var(--text-1);font-weight:600}
    .bubble.agent .chat-body h1{font-size:1.1em}
    .bubble.agent .chat-body h2{font-size:1.05em}
    .bubble.agent .chat-body h1:first-child,.bubble.agent .chat-body h2:first-child{margin-top:0}
    .bubble.agent .chat-body ol{margin:0 0 var(--space-xl);padding-left:20px;line-height:1.5}
    .bubble.agent .chat-body table{border-collapse:collapse;margin:var(--space-md) 0;font-size:var(--font-size-sm);max-width:100%;display:block;overflow-x:auto}
    .bubble.agent .chat-body th,.bubble.agent .chat-body td{border:1px solid var(--border);padding:4px 10px;text-align:left}
    .bubble.agent .chat-body th{background:var(--surface2);font-weight:600;color:var(--text-1)}
    .bubble.agent .chat-body tr:nth-child(even) td{background:var(--surface-alpha-2)}
    .bubble.agent .chat-body pre{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-xl) var(--space-2xl);margin:var(--space-lg) 0;overflow-x:auto}
    .bubble.agent .chat-body pre code{background:transparent;padding:0;display:block;color:var(--text-2);line-height:1.5}
    .bubble.agent .chat-body :not(pre)>code{background:var(--surface2);padding:2px var(--space-sm);border-radius:4px;font-size:.9em;color:var(--green)}
    .bubble.agent .chat-footer{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-xl);margin-top:18px;padding-top:var(--space-2xl);border-top:1px solid var(--border)}
    .bubble.agent .chat-pills{display:flex;flex-wrap:wrap;gap:var(--space-sm)}
    .bubble.agent .chat-pill{display:inline-flex;align-items:center;padding:3px var(--space-md);border-radius:var(--radius-pill);background:var(--surface-alpha-3);border:1px solid var(--surface-alpha-5);color:var(--muted);font-size:var(--font-size-sm);line-height:1.2}
    .bubble.agent .chat-continue{border:1px solid var(--surface-alpha-6);background:transparent;color:var(--text-3);border-radius:var(--radius-pill);padding:var(--space-sm) var(--space-lg);font-size:var(--font-size-sm);font-weight:500;white-space:nowrap}
    .bubble.agent .chat-continue:hover{background:var(--surface-alpha-3);border-color:rgba(127,212,164,0.28);color:var(--text-1)}
    .bubble.agent .chat-typing{display:inline-flex;align-items:center;gap:5px;min-height:18px}
    .bubble.agent .chat-typing span{width:6px;height:6px;border-radius:var(--radius-pill);background:var(--green);opacity:.45;animation:chatTyping 1s ease-in-out infinite}
    .bubble.agent .chat-typing span:nth-child(2){animation-delay:.15s}
    .bubble.agent .chat-typing span:nth-child(3){animation-delay:.3s}
    @keyframes chatTyping{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
    /* Phase J.2: removed .verify-banner / .verify-pill* / .verify-row* /
       .verify-note CSS. The verify-banner UI surface is gone after the
       preview_only verdict path was collapsed in J.1. */
    .bubble .edit-btn{position:absolute;top:var(--space-md);right:var(--space-md);width:22px;height:22px;border-radius:var(--radius-sm);border:1px solid var(--surface-alpha-7);background:rgba(0,0,0,0.18);color:var(--muted);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .12s ease}
    .bubble.user .edit-btn{background:rgba(0,0,0,0.14);border-color:rgba(255,255,255,0.18)}
    .bubble:hover .edit-btn{opacity:1}
    .bubble.editing{border-color:var(--green-dim);box-shadow:0 0 0 2px rgba(127,212,164,0.15) inset}
    .bubble .edit-area{width:100%;min-height:60px;max-height:120px;resize:vertical;background:transparent;color:inherit;border:none;outline:none;font-family:var(--font-family-mono);font-size:var(--font-size-md);line-height:1.5;white-space:pre-wrap}
    .bubble .edit-actions{display:flex;gap:var(--space-md);justify-content:flex-end;margin-top:var(--space-lg)}
    .bubble .edit-actions button{border:1px solid var(--border);background:var(--surface-alpha-3);color:var(--text-1);padding:var(--space-sm) var(--space-lg);border-radius:var(--radius-md);font-size:var(--font-size-base);cursor:pointer}
    .bubble .edit-actions .primary{border-color:rgba(127,212,164,0.45);background:rgba(127,212,164,0.10)}
    .bubble .md .h{font-weight:700;color:var(--text-1);margin:2px 0 var(--space-md)}
    .bubble .md .p{margin:0 0 var(--space-lg);color:var(--text-2)}
    .bubble .md .li{margin:0 0 var(--space-sm);color:var(--text-2)}
    .bubble .md .code{font-family:var(--font-family-mono);color:var(--green);background:rgba(127,212,164,0.10);border:1px solid rgba(127,212,164,0.25);padding:1px var(--space-sm);border-radius:7px}
    /* Restored turn summaries */
    .turn-restored{border:1px solid var(--border);border-radius:var(--radius-sm);margin:0 0 var(--space-sm);overflow:hidden}
    .turn-restored-header{padding:var(--space-md) var(--space-xl);display:flex;align-items:center;gap:var(--space-md);cursor:pointer;background:var(--surface2);font-size:var(--font-size-base)}
    .turn-restored-header:hover{background:var(--surface-alpha-2)}
    .turn-restored .chevron{width:10px;height:10px;color:var(--text-4);transition:transform var(--transition-fast)}
    .turn-restored.open .chevron{transform:rotate(90deg)}
    .turn-restored-body{padding:var(--space-lg) var(--space-xl);background:var(--surface);font-size:var(--font-size-base);display:none}
    .turn-restored.open .turn-restored-body{display:block}

    /* Virtual history loader */
    .load-older{
      width:100%;
      display:flex;
      justify-content:center;
      padding:var(--space-lg) 0 var(--space-2xl);
    }
    .load-older button{
      border:none;
      background:transparent;
      color:var(--muted);
      font-size:var(--font-size-base);
      cursor:pointer;
      padding:var(--space-sm) var(--space-lg);
    }
    .load-older button:hover{color:var(--text-2);text-decoration:underline}
    .resume-badge{display:inline-flex;align-items:center;gap:var(--space-sm);font-size:var(--font-size-sm);color:var(--text-4);margin:var(--space-sm) 0 0}
    .resume-badge .dot{width:var(--space-sm);height:6px;border-radius:var(--radius-pill);background:var(--muted)}
    .resume-badge.live{color:var(--green)}
    .resume-badge.live .dot{background:var(--color-success)}
    .resume-badge.reconnecting{color:var(--amber)}
    .resume-badge.reconnecting .dot{background:var(--color-warning)}
    .resume-badge.interrupted{color:var(--red)}
    .resume-badge.interrupted .dot{background:var(--color-error)}
    .resume-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:none;
      background:var(--color-brand);
      color:var(--bg);
      border-radius:var(--radius-pill);
      padding:5px var(--space-xl);
      font-size:var(--font-size-sm);
      font-weight:600;
      line-height:1;
      cursor:pointer;
      white-space:nowrap;
      margin-left:var(--space-sm);
      box-shadow:0 1px 2px rgba(0,0,0,.18);
      transition:background var(--transition-fast),opacity var(--transition-fast),transform var(--transition-fast);
    }
    .resume-btn:hover{background:var(--green-dim);transform:translateY(-1px)}
    .resume-btn:disabled{opacity:.6;cursor:default}
    .run-group{border-left:0.5px solid var(--border);padding-left:var(--space-md);position:relative;margin-bottom:var(--space-lg)}
    .run-group.resumed-from{opacity:.56;filter:saturate(.72)}
    .zone-reply-header{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-3);margin-bottom:var(--space-sm);font-family:var(--font-family-mono)}
    .zone-reply-header-left{}
    .zone-reply-header-right{display:flex;align-items:center;gap:var(--space-xs)}
    .zone-reply-pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--violet)}
    @keyframes zonePulse{0%,100%{opacity:0.35}50%{opacity:1}}
    .zone-reply-pulse.active{animation:zonePulse 1.4s ease-in-out infinite}

    .turn-summary{flex:1;min-width:0;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .turn-meta{font-size:var(--font-size-xs);color:var(--text-5)}
    .turn-badge{font-size:var(--font-size-xs);padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap}
    .turn-badge.safe{background:var(--green-bg);color:var(--color-success);border-color:var(--green-dim)}
    .turn-badge.preview{background:var(--amber-glow);color:var(--color-warning);border-color:var(--amber-dim)}
    .turn-badge.blocked{background:var(--red-bg);color:var(--color-error);border-color:var(--red)}
    .turn-badge.chat{background:var(--surface2);color:var(--green);border-color:var(--border)}

    .log-block-container{max-width:820px;margin:var(--space-md) 0}
    .zone-todo-sidebar{position:fixed;top:92px;right:22px;width:292px;max-height:calc(100vh - 180px);overflow-y:auto;z-index:32;background:rgba(10,10,15,0.92);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 18px 48px rgba(0,0,0,0.28);padding:var(--space-md);backdrop-filter:blur(14px);display:none;flex-direction:column;gap:var(--space-sm)}
    .zone-todo-sidebar[data-state="visible"]{display:flex}
    /* F1.3: Plan content sticks to the top inside the side panel so it stays
       visible while the live-stream slot below scrolls. */
    .zone-todo-plan{position:sticky;top:0;z-index:1;background:rgba(10,10,15,0.92);padding-bottom:var(--space-sm)}
    /* F1.3: live activity slot — single active stream lives here, below the
       Plan. Hidden when empty so the Plan doesn't shift down. */
    .zone-side-stream-slot{display:none;flex-direction:column;max-height:320px;overflow-y:auto;padding:var(--space-sm);border-top:1px solid var(--border);border-left:3px solid var(--violet);border-radius:var(--radius-sm);background:rgba(0,0,0,0.18);transition:opacity 150ms ease}
    .zone-side-stream-slot[data-state="active"]{display:flex}
    .zone-side-stream-slot[data-state="fading"]{opacity:0}
    .zone-side-stream-slot .ss-hdr{display:flex;align-items:center;gap:var(--space-xs);color:var(--violet);font-weight:500;font-size:var(--font-size-sm);margin-bottom:var(--space-xs)}
    .zone-side-stream-slot .ss-dot{width:8px;height:8px;border-radius:var(--radius-pill);background:var(--violet);animation:liveDot 1.1s ease-in-out infinite;flex:0 0 8px}
    .zone-side-stream-slot .ss-body{font-family:var(--font-family-mono);font-size:0.72rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
    .zone-todo-header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm);margin-bottom:var(--space-sm);color:var(--text-2);font-weight:700}
    .zone-todo-count{font-family:var(--font-family-mono);font-size:var(--font-size-xs);font-weight:500;color:var(--text-4)}
    .zone-todo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-sm)}
    .zone-todo-item{display:grid;grid-template-columns:18px 1fr;gap:var(--space-sm);padding:var(--space-sm) 0;border-top:1px solid rgba(255,255,255,0.06)}
    .zone-todo-item:first-child{border-top:none}
    .zone-todo-icon{width:16px;height:16px;margin-top:2px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--font-family-mono);border:1.5px solid var(--text-5);color:var(--text-5)}
    .zone-todo-item[data-status="in_progress"] .zone-todo-icon{border-color:var(--color-warning);border-top-color:transparent;animation:zone-todo-spin 0.8s linear infinite;color:var(--color-warning)}
    .zone-todo-item[data-status="completed"] .zone-todo-icon{border-color:var(--color-success);background:rgba(34,197,94,0.12);color:var(--color-success)}
    .zone-todo-item[data-status="skipped"] .zone-todo-icon{border-color:var(--text-5);background:rgba(255,255,255,0.04);color:var(--text-5)}
    @keyframes zone-todo-spin{to{transform:rotate(360deg)}}
    .zone-todo-title{font-size:var(--font-size-sm);color:var(--text-1);line-height:1.35}
    .zone-todo-desc{font-size:var(--font-size-xs);color:var(--text-4);line-height:1.4;margin-top:2px}
    .zone-todo-files{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
    .zone-todo-file{font-family:var(--font-family-mono);font-size:10px;color:var(--text-3);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-sm);padding:1px 5px;background:rgba(255,255,255,0.04);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media (max-width:1180px){.zone-todo-sidebar{position:static;width:auto;max-height:none;margin:var(--space-lg) 0;box-shadow:none}}
    /* Tur P1-approval: sticky command-approval prompt. Lives inside .inputBar
       directly under the plan sticky, above the chat input. Inherits 760px
       max-width via `.inputBar > *`. Default focus is Approve; Y/T/N and
       Enter/Escape map to Approve/Trust all/Reject. */
    .zone-approval-sticky{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-md) var(--space-lg);margin-bottom:var(--space-md);font-size:var(--font-size-sm);font-family:var(--font-family-sans)}
    .zone-approval-sticky[data-state="hidden"]{display:none}
    .zone-approval-sticky[data-state="visible"]{display:block;animation:zone-approval-slide-up 200ms ease-out}
    @keyframes zone-approval-slide-up{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
    .zone-approval-sticky-header{display:flex;align-items:center;gap:var(--space-xs);color:var(--text-2);font-weight:600;margin-bottom:var(--space-sm);letter-spacing:0.02em}
    .zone-approval-sticky-header .bolt{color:var(--green);font-family:var(--font-family-mono)}
    .zone-approval-sticky-command{background:rgba(0,0,0,0.32);border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-sm) var(--space-md);font-family:var(--font-family-mono);font-size:var(--font-size-sm);color:var(--green);margin-bottom:var(--space-md);white-space:pre-wrap;word-break:break-word;max-height:140px;overflow-y:auto}
    .zone-approval-sticky-actions,.approval-widget{display:flex;align-items:center;gap:var(--space-md);flex-wrap:wrap}
    .approval-btn{display:inline-flex;align-items:center;gap:var(--space-xs);padding:var(--space-xs) var(--space-md);border-radius:var(--radius-sm);font-size:var(--font-size-sm);font-weight:600;cursor:pointer;border:1px solid transparent;transition:background var(--transition-fast),border-color var(--transition-fast),color var(--transition-fast),outline var(--transition-fast)}
    .approval-btn.approve{background:var(--green-dim);color:var(--text-1)}
    .approval-btn.approve:hover{filter:brightness(1.1)}
    .approval-btn.trust-all{background:transparent;color:var(--text-2);border-color:var(--border)}
    .approval-btn.trust-all:hover{border-color:var(--green-dim);color:var(--text-1)}
    .approval-btn.reject{background:transparent;color:var(--red);border-color:rgba(221,144,144,0.35)}
    .approval-btn.reject:hover{border-color:rgba(221,144,144,0.65);color:var(--red)}
    .approval-btn[data-focus="true"],.approval-btn:focus-visible{outline:2px solid var(--green-dim);outline-offset:2px}
    .approval-btn.reject[data-focus="true"]{outline-color:rgba(221,144,144,0.65)}
    .approval-btn[disabled]{opacity:0.5;cursor:not-allowed}
    .approval-btn kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.35em;height:1.35em;padding:0 0.3em;border:1px solid currentColor;border-radius:var(--radius-xs);font-family:var(--font-family-mono);font-size:0.78em;line-height:1;opacity:0.7}
    .zone-approval-sticky-status{margin-top:var(--space-xs);font-size:var(--font-size-xs);color:var(--text-3)}
    .zone-plan-section-label{font-size:var(--font-size-xs);color:var(--text-4);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:var(--space-xs)}
    /* ZoneScopeRevisionPrompt */
    .zone-rev-reason{font-size:var(--font-size-sm);color:var(--text-2);line-height:1.5;margin-bottom:var(--space-sm)}
    .zone-rev-file-group{margin-bottom:var(--space-sm)}
    .zone-rev-file-group .zone-plan-section-label{margin-bottom:4px}
    .zone-rev-file-group .zone-rev-files{display:flex;flex-wrap:wrap;gap:3px}
    .zone-rev-summary{font-size:var(--font-size-xs);color:var(--text-3);line-height:1.5;border-top:1px solid var(--border);padding-top:var(--space-sm);margin-bottom:var(--space-md)}
    .log-lines{font-family:var(--font-family-mono);font-size:var(--font-size-base);line-height:1.7}
    .log-line{display:flex;gap:var(--space-xl);padding:2px 0;opacity:1;animation:lineIn 150ms ease-out;color:var(--text-2)}
    @keyframes lineIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .log-lines{display:flex;flex-direction:column;gap:var(--space-sm);align-items:stretch}
    .log-ts{min-width:78px;color:var(--muted)}
    .log-msg{flex:1;min-width:0;word-break:break-word;color:var(--text-2)}
    .log-line.active .log-ts{color:var(--violet)}
    .log-line.active .log-msg{color:var(--text-1)}
    .log-line.c-active .log-msg{color:var(--green)}
    .log-line.c-done .log-msg{color:var(--green)}
    .log-line.success .log-msg{color:color-mix(in srgb, var(--green) 85%, var(--text-1))}
    .log-line.warning .log-msg{color:color-mix(in srgb, var(--amber) 90%, var(--text-1))}
    .log-line.error .log-msg{color:color-mix(in srgb, var(--red) 85%, var(--text-1))}
    .log-line.error,
    .log-line.warning {
      border-left: 2px solid currentColor;
      padding-left: 8px;
      margin-left: -10px;
    }
    .log-line.error { color: var(--red); }
    .log-line.warning { color: var(--amber); }

    .cmd-auto-approved{display:flex;align-items:center;gap:var(--space-sm);min-height:24px;max-width:100%;padding:2px var(--space-sm);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);background:rgba(255,255,255,0.035);font-family:var(--font-family-sans);font-size:12px;line-height:20px;color:var(--text-3)}

    .cmd-auto-approved .expand-toggle{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;border:0;border-radius:var(--radius-xs);background:transparent;color:var(--text-3);font-size:13px;line-height:1;cursor:pointer;opacity:0.6;transition:opacity var(--transition-fast),transform var(--transition-fast),background var(--transition-fast)}

    .cmd-full{margin:2px 0 0;padding:var(--space-sm) var(--space-md);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);background:rgba(0,0,0,0.22);font-family:var(--font-family-mono);font-size:12px;line-height:1.55;color:var(--muted);white-space:pre-wrap;word-break:break-word;overflow:auto}
    .log-line.subagent-line{padding-left:24px;border-left:1px solid rgba(127,212,164,.25)}
    .log-line.subagent-line .log-ts{min-width:64px;color:var(--green-dim)}
    .subagent-pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 7px;margin:0 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
    .subagent-pill.completed{background:var(--green-bg);color:var(--green)}
    .subagent-pill.partial{background:var(--amber-glow);color:var(--amber)}
    .subagent-pill.failed{background:var(--red-bg);color:var(--red)}
    .subagent-pill.max_iterations{background:rgba(224,197,133,.14);color:var(--amber)}
    .log-line.narration-line{font-family:var(--font-family-sans);font-size:13px;color:var(--text-3);padding:6px 0 2px;line-height:1.5}
    .log-line.narration-line .log-ts{display:none}
    .log-line.narration-line .log-msg{flex:1;white-space:normal;color:var(--text-3)}
    .log-line.narration-line .log-msg::after{content:none}
    .log-line.active .log-msg::after{
      content:"";display:inline-block;width:6px;height:13px;background:var(--green);
      margin-left:var(--space-sm);transform:translateY(2px);animation:blink 1s step-end infinite;
    }
    .log-block-container.done .log-line.active .log-msg::after{content:none}
    /* Compat: restored pre-A.7c run groups still contain .log-card card chrome HTML */
    .run-group.restored .log-card{border:none;background:transparent;padding:0;margin:0}
    .run-group.restored .exec-header,.run-group.restored .timeline-toggle{display:none}
    .run-group.restored .exec-raw-view{margin-top:0}
    @keyframes blink{50%{opacity:0}}
    /* ── Run Step Timeline ──────────────────────────────────────────────── */
    .step-timeline{display:flex;flex-direction:column;gap:var(--space-xs);padding:var(--space-sm) 0 2px}
    .run-step{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);overflow:hidden;margin-bottom:2px}
    .run-step-header{display:flex;align-items:center;gap:var(--space-lg);padding:var(--space-lg) var(--space-2xl);cursor:pointer;font-size:var(--font-size-md);color:var(--text-2);user-select:none}
    .run-step-header:hover{background:var(--surface2)}
    .run-step-icon{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:var(--font-size-xs)}
    .run-step-spinner{width:11px;height:11px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:zone-spin 0.7s linear infinite;display:inline-block}
    @keyframes zone-spin{to{transform:rotate(360deg)}}
    .run-step[data-status="active"] .run-step-icon{color:var(--color-brand)}
    .run-step[data-status="done"]   .run-step-icon{color:var(--color-success)}
    .run-step[data-status="failed"] .run-step-icon{color:var(--color-error)}
    .run-step[data-status="warning"] .run-step-icon{color:var(--color-warning)}
    .run-step-label{flex:1;font-weight:500;font-size:var(--font-size-md);color:var(--text-2)}
    .run-step-toggle{color:var(--muted);font-size:14px;transition:transform 0.15s;flex-shrink:0;padding-left:var(--space-xs)}
    .run-step[data-expanded="true"] .run-step-toggle{transform:rotate(90deg)}
    .run-step-details{border-top:1px solid var(--border);padding:var(--space-md) var(--space-2xl) var(--space-lg) 38px;font-family:var(--font-family-mono);font-size:var(--font-size-sm);color:var(--muted);line-height:1.7}
    .run-step-detail{margin:1px 0;white-space:pre-wrap;word-break:break-all}

    /* Live coding / stream preview (compact, 2–3 lines visible) */
    .livecode{
      margin-top:var(--space-lg);border:1px solid var(--surface-alpha-6);border-radius:var(--radius-lg);
      background:rgba(0,0,0,0.18);
      max-height:140px;
      overflow:hidden
    }
    .livecode-h{
      display:flex;align-items:center;gap:var(--space-md);padding:var(--space-xs) var(--space-md);
      border-bottom:1px solid var(--surface-alpha-5);background:rgba(127,212,164,0.06);
      font-family:var(--font-family-sans);font-size:var(--font-size-sm);color:var(--text-2)
    }
    .livecode-h .label{animation:liveHdr 1.0s ease-in-out infinite}
    @keyframes liveHdr{0%,100%{opacity:.40}50%{opacity:1}}
    .livecode-dot{
      width:8px;height:8px;border-radius:var(--radius-pill);background:var(--violet);
      animation:liveDot 1.1s ease-in-out infinite
    }
    @keyframes liveDot{0%,100%{opacity:.55;box-shadow:0 0 0 0 rgba(127,212,164,0.0)}50%{opacity:1;box-shadow:0 0 0 8px rgba(127,212,164,0.10)}}
    .livecode-body{
      padding:var(--space-xs) var(--space-md);font-family:var(--font-family-mono);font-size:var(--font-size-base);line-height:1.4;
      max-height:120px;
      overflow:hidden
    }
    .livecode-body pre,
    .livecode-body pre[id^="streamCode-"]{
      display:block;
      min-height:1.4em;
      margin:0;
      padding:var(--space-xs) var(--space-md);
      white-space:pre-wrap;
      word-break:break-word;
      font-family:var(--font-family-mono);
      font-size:var(--font-size-base);
      line-height:1.4;
      color:var(--text-2);
      background:transparent;
      max-height:120px !important;
      overflow-y:auto !important;
      scroll-behavior:smooth;
    }
    /* Dummy livecode typewriter removed; streaming uses <pre>. */
    /* F1.3: diff line spans rendered inside the side-panel live-stream slot.
       Previously F1/F1.1/F1.2 also styled a chat-embedded .tool-stream-block
       shell — that has been retired; the slot is now the only renderer. */
    .stream-diff-line{display:block;font-family:var(--font-family-mono);white-space:pre;padding:0 8px;line-height:1.5}
    .stream-diff-removed{color:var(--red);background:var(--red-bg)}
    .stream-diff-added{color:var(--green);background:var(--green-bg)}
    /* When streaming owns the block, suppress any dummy animations/lines. */
    .livecode.streaming .livecode-h .label{animation:none;opacity:1}
    .livecode.streaming .livecode-dot{display:none}
    .livecode-static .livecode-h .label{animation:none;opacity:1}
    .livecode-static .livecode-dot{display:none}
    .livecode-static .sd-cursor{display:none!important}
    .livecode-static .livecode-body pre{animation:none}
    @keyframes livecodeStaticReveal{0%{opacity:.55}40%{opacity:1}100%{opacity:1}}
    .livecode-static .livecode-body{animation:livecodeStaticReveal 1.1s ease forwards}
    /* UI.5: inline prose run completion */
    .run-status-line{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:14px}
    .run-status-line.category-success{color:var(--zone-success-fg,#4ade80)}
    .run-status-line.category-warning{color:var(--zone-warning-fg,#fbbf24)}
    .run-status-line.category-error{color:var(--zone-error-fg,#ef4444)}
    .run-status-line.category-neutral{color:var(--zone-muted-fg,#6b7280)}
    .run-next-hint{font-style:italic;font-size:13px;color:var(--zone-muted-fg,#6b7280);margin:0 0 12px}
    .run-format-tabs{display:flex;align-items:center;gap:12px;margin:4px 0 8px;font-size:13px;flex-wrap:wrap}
    .run-format-tabs .fmt-tab{cursor:pointer;padding:2px 0;color:var(--zone-muted-fg,#6b7280);background:none;border:none;border-bottom:1.5px solid transparent;font-size:13px;font-family:inherit;letter-spacing:0}
    .run-format-tabs .fmt-tab:hover{color:var(--zone-fg,#e5e7eb)}
    .run-format-tabs .fmt-tab.active{color:var(--zone-fg,#e5e7eb);border-bottom-color:var(--zone-accent,#7c3aed)}
    @media(max-width:600px){.run-format-tabs .fmt-tab .label-full{display:none}.run-format-tabs .fmt-tab .label-short{display:inline}}
    @media(min-width:601px){.run-format-tabs .fmt-tab .label-short{display:none}}
    .run-format-tabs .copy-btn{margin-left:auto;cursor:pointer;background:transparent;border:1px solid var(--zone-border,rgba(255,255,255,0.1));border-radius:6px;padding:4px 10px;font-size:13px;color:var(--zone-muted-fg);display:inline-flex;align-items:center;gap:4px}
    .run-format-tabs .copy-btn:hover{color:var(--zone-fg);background:var(--zone-hover-bg,rgba(255,255,255,0.05))}
    @media(max-width:600px){.run-format-tabs .copy-btn .label{display:none}}
    .turn-restored .livecode{max-height:140px}
    .turn-restored .livecode-body{max-height:120px}

    .stream-static-diff{margin:0;padding:0}
    .sd-line{padding:1px var(--space-xs);border-radius:4px;margin:0 0 1px 0}
    /* sd-line-add avoids collision with unrelated .add rules elsewhere */
    .stream-static-diff .sd-line.sd-line-add,
    .sd-line.add{background:var(--green-bg);color:var(--green)}
    .stream-static-diff .sd-line.sd-line-del,
    .sd-line.del{background:var(--red-bg);color:var(--red)}
    .sd-line.ctx{color:var(--muted);background:transparent}
    .sd-cursor{color:var(--text-2);padding:2px var(--space-sm)}

    .pills{display:flex;flex-wrap:wrap;gap:var(--space-md);margin-top:var(--space-lg)}
    .pill{display:inline-flex;align-items:center;gap:var(--space-md);padding:var(--space-sm) var(--space-lg);border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--surface-alpha-1);color:var(--text-2);font-size:var(--font-size-sm);opacity:0;transform:translateY(6px);animation:pillIn 150ms ease-out forwards}
    @keyframes pillIn{to{opacity:1;transform:translateY(0)}}
    .pdot{width:7px;height:7px;border-radius:var(--radius-pill);background:var(--blue)}

    .pill.more{color:var(--text-4);border-color:var(--surface-alpha-4)}

    .related-files{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm) var(--space-md);margin-top:var(--space-md)}
    .rf-label{font-size:var(--font-size-xs);color:var(--text-5);flex:0 0 auto}
    .rf-pill{
      display:inline-flex;align-items:center;gap:var(--space-xs);padding:5px 9px;border-radius:var(--radius-pill);
      border:1px solid var(--border);background:var(--surface-alpha-1);color:var(--text-4);font-size:var(--font-size-xs);
      font-family:var(--font-family-mono)

    .planner-dep-warnings{margin-top:var(--space-sm);display:flex;flex-direction:column;gap:var(--space-xs)}
    .rf-warn-line{font-size:var(--font-size-xs);color:var(--text-5);line-height:1.45;opacity:.92}

    .diff-card{max-width:920px;margin:var(--space-sm) 0;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;overflow:hidden}
    /* Phase J.3.1: amber-tinted framing for diffs rendered under the
       rolled-back banner. The diff data is in-memory (staging snapshot)
       and never reached disk — frame it as "what was attempted". */
    .diff-card.diff-card-rolled-back{
      border-left:3px solid var(--amber-dim);
      opacity:0.92;
      background:var(--amber-glow)
    }
    .diff-card.diff-card-rolled-back .diff-toolbar{
      background:var(--amber-glow);
      border-bottom-color:rgba(224,197,133,0.18)
    }
    .diff-card.diff-card-rolled-back .file-ico{
      border-color:rgba(224,197,133,0.55);
      color:var(--amber-dim)
    }
    .diff-attempted-label{
      font-family:var(--font-family-mono);
      font-size:var(--font-size-xs);
      color:var(--amber-dim);
      padding:2px 8px;
      border:1px solid rgba(224,197,133,0.45);
      border-radius:var(--radius-pill);
      background:rgba(224,197,133,0.08);
      white-space:nowrap;
      letter-spacing:0.02em
    }
    .diff-toolbar{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--border);background:transparent;position:sticky;top:0;z-index:2}
    .file-ico{width:18px;height:18px;border:1px solid rgba(127,212,164,0.45);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:var(--font-size-sm);flex-shrink:0}
    .diff-fname{flex:1;min-width:0;font-family:var(--font-family-mono);font-size:var(--font-size-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .diff-stat{font-family:var(--font-family-mono);font-size:var(--font-size-xs);color:var(--text-3);white-space:nowrap}
    .diff-copy{
      width:26px;height:26px;border-radius:var(--radius-md);border:1px solid var(--border);
      background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;
      transition:border-color var(--transition-base),background var(--transition-base),color var(--transition-base);
      padding:0;
    }
    .diff-copy:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}
    .diff-toggle{
      width:26px;height:26px;border-radius:var(--radius-md);border:1px solid var(--border);
      background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;
      transition:border-color var(--transition-base),background var(--transition-base),color var(--transition-base);
    }
    .diff-toggle:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}
    .diff-card.collapsed .diff-toggle{background:var(--surface-alpha-1)}
    /* Phase J.2: removed .zone-action-chips / .zone-action-chip* /
       .zone-tools-used CSS. Apply chip is gone; the diff card and undo
       control carry the entire post-completion UX. */
    /* Zone Undo Tur 2b: per-run revert affordance, sits adjacent to the
       safe_to_apply diff cards. Chip-style to match .diff-toggle. */
    .zone-undo-card{
      display:inline-flex;align-items:center;gap:var(--space-sm);
      margin:var(--space-sm) 0 0;font-size:var(--font-size-sm);
    }
    .zone-undo-btn{
      display:inline-flex;align-items:center;gap:var(--space-xs);
      border:1px solid var(--border);background:transparent;color:var(--text-2);
      border-radius:var(--radius-sm);padding:var(--space-xs) var(--space-sm);
      font-size:var(--font-size-sm);cursor:pointer;
      transition:border-color var(--transition-base),background var(--transition-base),color var(--transition-base);
    }
    .zone-undo-btn:hover{border-color:var(--border2);background:var(--surface-alpha-2);color:var(--text-1)}
    .zone-undo-btn:disabled{cursor:default;opacity:0.7}
    .zone-undo-spinner{
      width:10px;height:10px;border-radius:50%;
      border:1.5px solid var(--text-4);border-top-color:transparent;
      animation:zone-undo-spin 700ms linear infinite;
    }
    @keyframes zone-undo-spin{to{transform:rotate(360deg)}}
    .zone-undo-done{color:var(--color-success);font-size:var(--font-size-sm)}
    .zone-undo-warn{color:var(--text-4);font-size:var(--font-size-xs);margin-left:var(--space-xs)}
    .zone-undo-error{
      display:inline-flex;align-items:center;gap:var(--space-sm);
      color:var(--color-error);font-size:var(--font-size-sm);
      border:1px solid rgba(239,68,68,0.28);background:rgba(239,68,68,0.10);
      border-radius:var(--radius-sm);padding:var(--space-xs) var(--space-sm);
    }
    /* Zone Background-process aggregated card. One card per run, one row
       per handle. Read-only: pulse indicates running, gray indicates done. */
    .zone-bg-card{
      margin:var(--space-sm) 0;
      border:1px solid var(--border);
      background:var(--surface-alpha-1);
      border-radius:var(--radius-md);
      padding:var(--space-sm) var(--space-md);
    }
    .zone-bg-card-header{
      display:flex;align-items:center;gap:var(--space-sm);
      font-size:var(--font-size-sm);color:var(--text-3);
      padding-bottom:var(--space-xs);
    }
    .zone-bg-card-header .zone-bg-title{font-weight:500;color:var(--text-2)}
    .zone-bg-card-header .zone-bg-running-count{
      font-size:var(--font-size-xs);color:var(--color-success);
    }
    .zone-bg-row{
      display:grid;grid-template-columns:18px 1fr auto;gap:var(--space-sm);
      align-items:start;
      padding:var(--space-xs) 0;
    }

    .zone-bg-row-glyph{font-size:var(--font-size-sm);color:var(--text-4);line-height:1.4}
    .zone-bg-row.zone-bg-row-running .zone-bg-row-glyph{color:var(--color-success)}
    .zone-bg-row-body{display:flex;flex-direction:column;gap:2px;min-width:0}
    .zone-bg-row-title{font-size:var(--font-size-sm);color:var(--text-1);font-weight:500}
    .zone-bg-row-cmd{
      font-family:var(--font-family-mono);font-size:var(--font-size-xs);
      color:var(--text-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .zone-bg-row-meta{font-size:var(--font-size-xs);color:var(--text-4)}
    .zone-bg-row-output{
      font-family:var(--font-family-mono);font-size:var(--font-size-xs);
      color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      margin-top:2px;
    }
    .zone-bg-pill{
      display:inline-flex;align-items:center;gap:var(--space-xs);
      padding:2px var(--space-sm);
      border-radius:var(--radius-pill);
      font-size:var(--font-size-xs);
      white-space:nowrap;
    }

      background:rgba(34,197,94,0.10);
      color:var(--color-success);
      border:1px solid rgba(34,197,94,0.28);
    }
    .zone-bg-pill-running::before{
      content:"●";display:inline-block;line-height:1;
      animation:zone-bg-pulse 1.6s ease-in-out infinite;
    }
    @keyframes zone-bg-pulse{
      0%,100%{opacity:.45}
      50%{opacity:1}
    }
    .zone-bg-pill-killed{
      background:var(--surface-alpha-2);
      color:var(--text-3);
      border:1px solid var(--border);
    }
    .zone-bg-pill-exited{
      background:var(--surface-alpha-2);
      color:var(--color-success);

    }
    /* Sticky live-indicator panel: sibling of the Plan card inside .inputBar.
       Visible only while the active run has running bg processes; hidden
       otherwise. Reuses .zone-bg-row, .zone-bg-pill-* below. */
    .zone-bg-sticky-panel{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      padding:var(--space-sm) var(--space-md);
      margin-bottom:var(--space-sm);
      font-size:var(--font-size-sm);
      font-family:var(--font-family-sans);
      max-height:240px;
      overflow-y:auto;
    }
    .zone-bg-sticky-panel[data-state="hidden"]{display:none}
    .zone-bg-sticky-panel[data-state="visible"]{display:block;animation:zone-bg-slide-up 200ms ease-out}
    @keyframes zone-bg-slide-up{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
    .zone-bg-sticky-panel-header{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:var(--space-xs);color:var(--text-2);font-weight:600;
    }
    .zone-bg-sticky-panel-header .zone-bg-running-count{
      font-size:var(--font-size-xs);color:var(--color-success);font-weight:400;
    }
    .diff-area{max-height:200px;overflow:auto;font-family:var(--font-family-mono);font-size:var(--font-size-sm);line-height:1.65;background:rgba(0,0,0,0.16);transition:max-height var(--transition-base)}

    .no-apikey-banner button{background:var(--color-brand);color:var(--bg);border:none;border-radius:var(--radius-md);padding:var(--space-md) var(--space-xl);font-size:var(--font-size-base);font-weight:600;cursor:pointer;transition:opacity var(--transition-base)}
    .no-apikey-banner button:hover{opacity:0.85}

    /* === Zone agent bubble chrome cleanup ===
       Strips the card border, header (Zone label + gpt-4o badge),
       and footer (Continue with patch button) so the agent's final
       summary reads as flowing prose. Chrome elements stay in the
       DOM but are visually hidden — non-breaking change. */
    .bubble.agent {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 1rem 0 !important;
      max-width: 100% !important;
      border-radius: 0 !important;
    }
    .bubble.agent .zone-chat-head { display: none !important; }
    .bubble.agent .chat-footer { display: none !important; }
    .bubble.agent .chat-body {
      color: var(--text-2) !important;
    }

    .screenshot-modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;justify-content:center}
    .screenshot-modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.78)}
    .screenshot-modal-content{position:relative;max-width:92vw;max-height:92vh;background:var(--surface2,#1a1a23);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.5);overflow:hidden}
    .screenshot-modal-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border)}
    .screenshot-modal-title{font-size:0.9em;opacity:0.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80vw}
    .screenshot-modal-close{background:transparent;border:1px solid var(--border);color:var(--text-1);font-size:18px;line-height:1;cursor:pointer;padding:2px 10px;opacity:0.7;border-radius:4px;transition:opacity 0.15s}
    .screenshot-modal-close:hover{opacity:1}
    .screenshot-modal-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,0.2)}
    .screenshot-modal-image{max-width:100%;max-height:calc(92vh - 60px);object-fit:contain;border-radius:4px;display:block}
    .gen-link-btn{background:transparent;border:1px solid var(--border2,#333);border-radius:var(--radius-md);color:var(--text-2);font-size:var(--font-size-sm);padding:var(--space-md) var(--space-lg);text-align:left;cursor:pointer;transition:background var(--transition-base),color var(--transition-base)}
    .gen-link-btn:hover{background:rgba(255,255,255,.06);color:var(--text-1)}
    .metrics-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
    .metrics-tile{background:var(--surface-alpha-2,rgba(255,255,255,.05));border:1px solid var(--border,#333);border-radius:8px;padding:12px;text-align:center}
    .metrics-tile-val{font-size:20px;font-family:var(--font-mono,monospace);font-weight:600;color:var(--text-1,#eee);line-height:1.2}
    .metrics-tile-lbl{font-size:11px;color:var(--text-4,#888);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
    .metrics-chart-title{font-size:var(--font-size-sm,12px);font-weight:600;color:var(--text-3,#aaa);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
    .metrics-gauge-track{flex:1;max-width:120px;height:6px;border-radius:3px;background:var(--surface-alpha-3,rgba(255,255,255,.08))}
    .metrics-gauge-fill{height:100%;border-radius:3px;background:var(--violet,#7a5af8);transition:width .3s}
  </style>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/dompurify.min.js"></script>

  <script>
    // ---- Config ingestion (supports both new and existing server injections) ----
    (function hydrateGlobals(){
      const cfg = (window.__ZONE_PUBLIC_CONFIG__ && typeof window.__ZONE_PUBLIC_CONFIG__ === 'object') ? window.__ZONE_PUBLIC_CONFIG__ : null;
      if (cfg) {
        // best-effort mapping (keeps compatibility with older server shapes)
        if (!window.ZONE_USER_ID && cfg.userId) window.ZONE_USER_ID = cfg.userId;
        if (!window.ZONE_MODEL && (cfg.model || cfg.llmModel)) window.ZONE_MODEL = cfg.model || cfg.llmModel;
        if (!window.ZONE_REPOS && Array.isArray(cfg.repos)) window.ZONE_REPOS = cfg.repos;
      }
      window.ZONE_REPOS = Array.isArray(window.ZONE_REPOS) ? window.ZONE_REPOS : [];
      window.ZONE_USER_ID = window.ZONE_USER_ID || null;
      window.ZONE_MODEL = window.ZONE_MODEL || 'gpt-5.4';
    })();

    const state = {
      threads: [],          // { id, repoPath, repoName, title, messages: [], createdAt }
      activeThreadId: null,
      repos: window.ZONE_REPOS || [],
      activeRepo: null,     // { name, path }
      runId: null,
      runningThreadId: null,
      isRunning: false,
      chatScrollFollow: true,
      userId: window.ZONE_USER_ID || null,
      eventSource: null,
      lastPatchResult: null,
      lastTaskText: null,
      runStartedAt: null,
      bgTasksOpen: false,
      sidebarState: 'open',
      sidebarOpenWidth: 220,
      sidebarResizing: false,
      __resumeScanInProgress: false,
      __sendDebugByRun: {},
      __useStepTimeline: false,  // Summary view retired; raw log is the only view
      activeBranch: null,
      branchList: [],
      branchLoading: false,
      branchDropdownOpen: false,
      selectedMode: 'auto',
      pendingAttachments: []  // [{mediaType, base64}]
    };
    state.__durationTickersByRunId = state.__durationTickersByRunId || {};

    // === Multi-active-thread Phase 1b ===
    // Source of truth for per-thread run state, per-thread task queues,
    // and per-runId EventSource. Phase 1a's snapshot/buffer hack is gone:
    // each thread now owns a real DOM container that persists in #chatArea
    // (display:none when inactive), so SSE events flow into the run group
    // via getElementById regardless of which thread the user is viewing.
    state.runsByThread = new Map();          // Map<threadId, RunState>
    state.eventSourcesByRunId = new Map();   // Map<runId, EventSource>
    state.taskQueuesByThread = new Map();    // Map<threadId, Array<QueuedTask>>
    state.todosByRunId = new Map();          // Map<runId, Array<Todo>>
    state.summariesByRunId = state.summariesByRunId || {}; // { [runId]: RunSummaryPayload }

    // Legacy field shims. Each read logs once per session so we can audit
    // remaining callers in Phase 1b cleanup. Setters route into runsByThread
    // for transitional code that hasn't been migrated yet.
    const _legacyReadsSeen = new Set();
    function _logLegacyRead(field) {
      if (_legacyReadsSeen.has(field)) return;
      _legacyReadsSeen.add(field);
      try {
        const stack = new Error().stack?.split('\n').slice(2, 4).join(' | ') || '';
        console.warn(`[zone-multi-thread] legacy state.${field} read at: ${stack}`);
      } catch {}
    }

    Object.defineProperty(state, 'currentRunId', {
      get() {
        _logLegacyRead('currentRunId');
        const r = state.runsByThread.get(state.activeThreadId);
        return r ? r.runId : null;
      },
      set(v) {
        // Phase 1c: writes are loud no-ops. Every call logs (no silencing)
        // so live-smoke can verify there are no remaining callers. Run
        // lifecycle is managed exclusively via setRun/clearRun.
        state.__legacyCurrentRunId = v;
        if (typeof console !== 'undefined') {
          console.warn('[zone-multi-thread] legacy state.currentRunId(set) ignored', { value: v, stack: new Error().stack });
        }
      },
      configurable: true,
    });

    Object.defineProperty(state, 'runningThreadId', {
      get() {
        _logLegacyRead('runningThreadId');
        const k = state.runsByThread.keys().next().value;
        return k || null;
      },
      set(v) {
        state.__legacyRunningThreadId = v;
        if (typeof console !== 'undefined') {
          console.warn('[zone-multi-thread] legacy state.runningThreadId(set) ignored', { value: v, stack: new Error().stack });
        }
      },
      configurable: true,
    });

    Object.defineProperty(state, 'isRunning', {
      get() {
        _logLegacyRead('isRunning');
        return state.runsByThread.size > 0;
      },
      set(v) {
        // Phase 1b: setter is a no-op. Run lifecycle now flows through
        // explicit setRun/clearRun calls scoped to the owning thread.
        // setRunningUI(false) called from handlePatchResult after a
        // non-active thread's run completes used to incorrectly delete
        // the ACTIVE thread's RunState here.
        _logLegacyRead('isRunning(set)');
      },
      configurable: true,
    });

    function getActiveRun() {
      return state.activeThreadId ? state.runsByThread.get(state.activeThreadId) : null;
    }

    function getRun(threadId) {
      return threadId ? state.runsByThread.get(threadId) : null;
    }

    function setRun(threadId, runState) {
      if (!threadId) return;
      if (runState && runState.runId) {
        const meter = getCostMeterState(runState.runId);
        if (meter) runState.costMeter = meter;
        runState.todos = state.todosByRunId.get(String(runState.runId)) || [];
      }
      state.runsByThread.set(threadId, runState);
      refreshSidebarRunningStates();
      renderTodoSidebar();
    }

    function clearRun(threadId) {
      if (!threadId) return;
      // Phase 1b: close the per-runId EventSource as part of clearing the
      // thread's run. Without this, sibling EventSources accumulate when
      // the user starts new runs in other threads — causing zombie runs
      // on the backend (the agent loop only aborts when the SSE stream
      // closes cleanly).
      const run = state.runsByThread.get(threadId);
      if (run && run.runId) {
        const es = state.eventSourcesByRunId.get(run.runId);
        try { es?.close(); } catch {}
        state.eventSourcesByRunId.delete(run.runId);
      }
      const had = state.runsByThread.delete(threadId);
      if (had) refreshSidebarRunningStates();
      renderTodoSidebar();
    }

    function getOrCreateTaskQueueForThread(threadId) {
      if (!threadId) return [];
      let q = state.taskQueuesByThread.get(threadId);
      if (!q) {
        q = [];
        state.taskQueuesByThread.set(threadId, q);
      }
      return q;
    }

    // Phase 1b: state.taskQueue is now a getter alias that returns the
    // active thread's per-thread queue. Existing code that does
    // `state.taskQueue.push(x)` or `state.taskQueue = [...]` continues to
    // work but operates on the active thread's queue only — exactly what
    // the legacy code intended back when there was only one running thread.
    Object.defineProperty(state, 'taskQueue', {
      get() {
        if (!state.activeThreadId) return [];
        return getOrCreateTaskQueueForThread(state.activeThreadId);
      },
      set(v) {
        if (!state.activeThreadId) return;
        state.taskQueuesByThread.set(state.activeThreadId, Array.isArray(v) ? v : []);
      },
      configurable: true,
    });

    function getThreadIdForRunId(runId) {
      if (!runId) return null;
      for (const [tid, run] of state.runsByThread.entries()) {
        if (run && run.runId === runId) return tid;
      }
      return null;
    }

    function setRunSummaryForRun(runId, progress){
      const rid = String(runId || progress?.runId || '').trim();
      if (!rid) return;
      state.summariesByRunId = state.summariesByRunId || {};
      state.summariesByRunId[rid] = {
        filesChanged: Array.isArray(progress?.filesChanged) ? progress.filesChanged : [],
        toolsUsed: progress?.toolsUsed && typeof progress.toolsUsed === 'object' ? progress.toolsUsed : {},
        verification: progress?.verification && typeof progress.verification === 'object' ? progress.verification : null,
        cost: progress?.cost && typeof progress.cost === 'object' ? progress.cost : null,
      };
      // Phase J.2: action-chip row removed. Tools-used line is no longer
      // appended next to the diff; the execution summary panel surfaces this
      // information instead.
    }

    function getRunSummary(runId){
      const rid = String(runId || '').trim();
      if (!rid) return null;
      state.summariesByRunId = state.summariesByRunId || {};
      return state.summariesByRunId[rid] || null;
    }

    function sanitizeTodoStatus(status){
      return ['pending','in_progress','completed','skipped'].includes(status) ? status : 'pending';
    }

    function ensureTodoSidebar(){
      let el = document.getElementById('zoneTodoSidebar');
      if (!el) {
        el = document.createElement('aside');
        el.id = 'zoneTodoSidebar';
        el.className = 'zone-todo-sidebar';
        el.dataset.state = 'hidden';
        document.body.appendChild(el);
      }
      // F1.3: ensure the two child regions exist — Plan (sticky top) and
      // live-stream slot. renderTodoSidebar() only touches .zone-todo-plan
      // inner HTML, leaving the stream slot intact across re-renders.
      if (!el.querySelector('.zone-todo-plan')) {
        const plan = document.createElement('div');
        plan.className = 'zone-todo-plan';
        el.appendChild(plan);
      }
      if (!el.querySelector('.zone-side-stream-slot')) {
        const slot = document.createElement('section');
        slot.id = 'zone-live-stream';
        slot.className = 'zone-side-stream-slot';
        // Empty by default (CSS display:none); C2 toggles data-state="active".
        const slotHdr = document.createElement('div');
        slotHdr.className = 'ss-hdr';
        const slotDot = document.createElement('span');
        slotDot.className = 'ss-dot';
        const slotLbl = document.createElement('span');
        slotLbl.className = 'ss-label';
        slotHdr.appendChild(slotDot);
        slotHdr.appendChild(slotLbl);
        const slotBody = document.createElement('pre');
        slotBody.className = 'ss-body';
        slot.appendChild(slotHdr);

      const normalized = Array.isArray(todos) ? todos.map((todo, index) => ({
        id: String(todo.id || `todo-${index}`),
        text: String(todo.text || `Step ${index + 1}`),
        description: todo.description ? String(todo.description) : '',
        filesLikely: Array.isArray(todo.filesLikely) ? todo.filesLikely.map((f) => String(f)).filter(Boolean) : [],
        status: sanitizeTodoStatus(String(todo.status || 'pending')),
      })) : [];
      state.todosByRunId.set(rid, normalized);
      const tid = getThreadIdForRunId(rid);

    function updateTodoStatusForRun(runId, todoId, status){
      const rid = String(runId || '');

      const todos = getTodosForRun(rid);
      if (!todos.length) return;
      setTodosForRun(rid, todos.map((todo) => todo.id === id ? { ...todo, status: nextStatus } : todo));

    function renderTodoSidebar(){
      const sidebar = ensureTodoSidebar();

      const activeRun = getActiveRun();
      const runId = activeRun && activeRun.runId ? String(activeRun.runId) : '';
      const todos = runId ? getTodosForRun(runId) : [];

        if (planEl) planEl.innerHTML = '';

      if (planEl) planEl.innerHTML = `

      // container is display:block; all others are display:none. No
      // innerHTML rebuild on switch — content persists across switches,

      if (!threadId) return null;

      // Minimal CSS.escape shim for older browsers; the real CSS.escape is
      // widely available but we avoid the polyfill cost.
      if (typeof CSS !== 'undefined' && typeof CSS.escape === 'function') return CSS.escape(s);
      return String(s).replace(/[^a-zA-Z0-9_-]/g, (c) => '\\' + c);

      const activeRun = getActiveRun();
      const approvalContainer = document.getElementById('zoneApprovalStickyContainer');
      if (activeRun) {

      if (approvalContainer) {

    // ─── Tauri runtime helpers ────────────────────────────────────────────
    // Goal: keep zone-api UI as the single source of truth for both browser
    // and zone-desktop (Tauri webview). Every Tauri branch is gated by
    // isTauriRuntime() so browser behavior is byte-identical when the gate
    // returns false. Ported verbatim from zone-desktop's UI snapshot.
    function isTauriRuntime(){
      try {
        return Boolean(
          window.__TAURI__ ||
          window.__TAURI_INTERNALS__ ||
          /Tauri/i.test(navigator.userAgent || '')
        );
      } catch { return false; }
    }
    function getTauriCore(){ return window.__TAURI__?.core || null; }
    async function invokeTauriCommand(command, args){
      const core = getTauriCore();
      if (!isTauriRuntime() || !core?.invoke) return null;
      return await core.invoke(command, args ?? {});
    }
    async function openExternalUrl(url){
      try {
        if (window.__TAURI__?.opener?.openUrl) { await window.__TAURI__.opener.openUrl(url); return; }
        if (window.__TAURI__?.shell?.open) { await window.__TAURI__.shell.open(url); return; }
        if (getTauriCore()?.invoke) {
          await invokeTauriCommand('plugin:opener|open_url', { url });
          return;
        }
      } catch (_) {}
      window.open(url, '_blank', 'noopener,noreferrer');
    }
    async function writeClipboardText(text){
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {}
      try {
        const tauri = window.__TAURI__;
        if (tauri?.clipboardManager?.writeText) { await tauri.clipboardManager.writeText(text); return true; }
        if (tauri?.clipboard?.writeText) { await tauri.clipboard.writeText(text); return true; }
        if (tauri?.core?.invoke) {
          await tauri.core.invoke('plugin:clipboard-manager|write_text', { text });
          return true;
        }
      } catch (_) {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      } catch { return false; }
    }
    // Tauri-only: open the OS terminal at a given path. Returns false in
    // browser mode so callers can fall back (e.g. copy `cd` command to clipboard).
    async function openTerminalAtPath(repoPath){
      if (!isTauriRuntime()) return false;
      try {
        const Command = window.__TAURI__?.shell?.Command;
        if (Command?.create) {
          const platform = String(navigator.platform || '').toLowerCase();
          if (platform.includes('win')) {
            await Command.create('cmd', ['/c', 'start', 'cmd', '/K', `cd /d "${repoPath}"`]).execute();
            return true;
          }
          if (platform.includes('mac')) {
            await Command.create('open', ['-a', 'Terminal', repoPath]).execute();
            return true;
          }
          await Command.create('x-terminal-emulator', [`--working-directory=${repoPath}`]).execute();
          return true;
        }
      } catch (_) {}
      return false;
    }
    // ─── API base resolution + fetch wrapper ──────────────────────────────
    // Browser mode: getApiBase() returns '' → buildApiUrl('/api/x') === '/api/x'
    //   so apiFetch() is byte-identical to the previous bare fetch('/api/x').
    // Tauri mode: getApiBase() returns the configured hosted Render URL so
    //   the same UI bundled into zone-desktop hits the right origin.
    function getApiBase(){
      if (!isTauriRuntime()) return '';
      const cfg = window.__ZONE_PUBLIC_CONFIG__ || {};
      const configured = typeof cfg.zoneApiBaseUrl === 'string' ? cfg.zoneApiBaseUrl.trim() : '';
      if (configured) return configured.replace(/\/$/, '');
      return 'https://zone-api-prod.onrender.com';
    }
    function buildApiUrl(path){
      const p = String(path || '');
      const base = getApiBase();
      if (!base || /^https?:\/\//i.test(p)) return p || '/';
      return `${base}${p.startsWith('/') ? p : `/${p}`}`;
    }
    // Headers that go on every BYOK / hosted inference request. Browser
    // mode currently appends nothing; the function exists so when this UI
    // is bundled into zone-desktop the existing buildAuthHeaders() flow
    // and provider header injection can layer on top without changing
    // call sites.
    function getInferenceHeaders(){
      return { 'Content-Type': 'application/json' };
    }
    async function apiFetch(path, opts){
      return await fetch(buildApiUrl(path), opts);
    }
    // /api/patch bridge: Tauri uses zone_api_post (Rust-native HTTP, bypasses
    // webview CORS for the largest payload); browser uses native fetch.
    // Returns the same shape regardless: `{ res, body }` where body is the
    // parsed JSON response (or null on parse failure). Callers check res.ok /
    // res.status as if it were a Response object.
    function classifyDesktopBridgeErrorMessage(message){
      const raw = String(message || '');
      const low = raw.toLowerCase();
      if (/invalid args|missing required key/i.test(raw)) return 'malformed_invoke';
      if (raw.includes('ZONE_API_POST_SEND_FAILED') || /error sending request/i.test(raw)) return 'native_send_failed';
      if (raw.includes('ZONE_API_POST_CLIENT_BUILD_FAILED')) return 'native_client_failed';
      if (raw.includes('ZONE_API_POST_READ_BODY_FAILED')) return 'native_read_failed';
      if (/zone_api_post/i.test(low)) return 'native_unknown';
      return 'unknown';
    }
    async function postPatchApi(body, headers, signal, pathOverride){
      const path = pathOverride || '/api/patch';
      const fullUrl = buildApiUrl(path);
      if (isTauriRuntime()) {
        const core = getTauriCore();
        if (core?.invoke) {
          const invokeArgs = { path, body: JSON.stringify(body), headers: headers || {} };
          let wrapped;
          try {
            wrapped = await core.invoke('zone_api_post', { args: invokeArgs });
          } catch (e) {
            const msg = String(e?.message || e || '');
            console.warn('[zone-patch] zone_api_post invoke failed', e);
            const kind = classifyDesktopBridgeErrorMessage(msg);
            if (kind === 'malformed_invoke') throw new Error('Desktop bridge request was malformed before patch generation started.');
            if (kind === 'native_send_failed') throw new Error('Desktop bridge could not reach the hosted patch API (native HTTP send failed before a response was received).');
            if (kind === 'native_client_failed') throw new Error('Desktop bridge failed to initialize the native HTTP client for patch generation.');
            if (kind === 'native_read_failed') throw new Error('Desktop bridge received a response but could not read it (native HTTP body read failed).');
            throw new Error('Desktop bridge failed while contacting the hosted patch API. Check connectivity/VPN/firewall and retry.');
          }
          const httpStatus = Number(wrapped?.httpStatus ?? 0);
          let parsed = null;
          try { parsed = JSON.parse(String(wrapped?.bodyText ?? 'null')); }
          catch (e) { console.warn('[zone-patch] invalid JSON body', e); }
          return { res: { ok: httpStatus >= 200 && httpStatus < 300, status: httpStatus }, body: parsed };
        }
      }
      const r = await fetch(fullUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...(headers || {}) },
        body: JSON.stringify(body),
        signal,
      });
      const parsed = await r.json().catch(() => null);
      return { res: r, body: parsed };
    }

    function loadThreads(){
      try {
        const raw = localStorage.getItem(LS_THREADS);
        const arr = raw ? JSON.parse(raw) : [];
        const threads = Array.isArray(arr) ? arr : [];
        // Back-compat migration: older threads stored chat render instructions as {role,...}.
        state.threads = threads.map((t) => {
          if (!t || typeof t !== 'object') return t;
          const thread = t;
          const threadRepoPath = String(thread.repoPath || '').trim();
          const normalizedRepoName = basenameFromPath(threadRepoPath || String(thread.repoName || '').trim());
          if (normalizedRepoName) thread.repoName = normalizedRepoName;
          const msgs = Array.isArray(thread.messages) ? thread.messages : [];
          if (msgs.length > 0 && typeof msgs[0] === 'object' && msgs[0] && 'type' in msgs[0]) {
            return thread;
          }
          const migrated = [];
          for (const m of msgs) {
            if (!m || typeof m !== 'object') continue;
            if (m.role === 'user') {
              migrated.push({ type:'user', text: String(m.content || ''), ts: Number(m.ts || Date.now()) });
            } else if (m.role === 'assistant') {
              migrated.push({
                type:'result',
                ts: Number(m.ts || Date.now()),
                decisionMode:'chat',
                fileDiffs: [],
                appliedFiles: [],
                chatResponse: String(m.content || ''),
                blocked: false,
                summary: String(m.content || '').slice(0,80)

            } else if (m.role === 'diff' && m.fileDiff) {
              migrated.push({
                type:'result',
                ts: Number(m.ts || Date.now()),
                decisionMode:'preview_only',
                fileDiffs: [m.fileDiff],
                appliedFiles: [],
                chatResponse: null,
                blocked: false,
                summary: 'diff'

          thread.messages = migrated;
          return thread;
        });

          if (msgs.length > 50) thread.messages = msgs.slice(msgs.length - 50);

      }
      if (typeof repo !== 'object') return null;
      const path = String(repo.path || repo.repoPath || '').trim();
      if (!path) return null;
      return {
        ...repo,

    function normalizeRepoList(repos){
      const list = Array.isArray(repos) ? repos : [];
      const out = [];
      const seen = new Set();
      for (const repo of list) {
        const normalized = normalizeRepoRecord(repo);
        if (!normalized) continue;
        const key = String(normalized.path || '').trim();
        if (!key || seen.has(key)) continue;
        seen.add(key);
        out.push(normalized);
      }
      return out;
    }

    function loadReposFromStorage(){
      // If the server injected repos, keep them.
      if (Array.isArray(state.repos) && state.repos.length) return;

      const repoKeyDump = [];
      try {
        const keys = Object.keys(localStorage).filter(k => String(k).toLowerCase().includes('repo'));
        for (const k of keys) {
          const v = localStorage.getItem(k);
          repoKeyDump.push({ key: k, value: v });
        }
        if (repoKeyDump.length) console.log('[zone-ui] repo localStorage keys', repoKeyDump);
      } catch {}

      /** @type {{name:string,path:string}[]} */
      let repos = [];

      // New UI / future key
      try {
        const raw = localStorage.getItem(LS_REPOS);
        const parsed = raw ? JSON.parse(raw) : null;
        if (Array.isArray(parsed)) {
          repos = parsed
            .map((r) => {
              if (typeof r === 'string') return { name: basenameFromPath(r), path: r };
              if (r && typeof r === 'object') {
                const path = String(r.path || r.repoPath || '').trim();
                const name = String(r.name || r.repoName || basenameFromPath(path)).trim();
                return path ? { name, path } : null;
              }
              return null;
            })
            .filter(Boolean);
        }
      } catch {}

      // Old UI compatibility: repo history was stored as an array of paths.
      // Migrate on first load then delete the old key.
      if (!repos.length) {
        try {
          const raw = localStorage.getItem(LS_REPO_HISTORY);
          const parsed = raw ? JSON.parse(raw) : null;
          if (Array.isArray(parsed)) {
            repos = parsed
              .filter((p) => {
                if (typeof p === 'string') return String(p).trim();
                if (p && typeof p === 'object') return String(p.path || p.repoPath || '').trim();
                return false;
              })
              .map((p) => {
                if (typeof p === 'string') {
                  const pt = String(p).trim();
                  return { id: crypto.randomUUID(), name: basenameFromPath(pt), path: pt, createdAt: Date.now() };
                }
                const pt = String(p.path || p.repoPath || '').trim();
                return pt ? { id: crypto.randomUUID(), name: basenameFromPath(pt), path: pt, createdAt: Date.now() } : null;
              })
              .filter(Boolean);
            if (repos.length) {
              // Migrate: write canonical format and remove the legacy key.
              try { localStorage.setItem(LS_REPOS, JSON.stringify(repos)); } catch {}
              try { localStorage.removeItem(LS_REPO_HISTORY); } catch {}
            }
          }
        } catch {}
      }

      // De-dupe by path.
      repos = normalizeRepoList(repos);

      if (repos.length) {
        state.repos = repos;
        window.ZONE_REPOS = repos;
        try { localStorage.setItem(LS_REPOS, JSON.stringify(repos)); } catch {}
      }
    }

    function enableUserBubbleEditing(bubbleEl, opts){
      const bubble = bubbleEl;
      if (!bubble) return;
      if (bubble.classList.contains('editing')) return;
      const original = String(bubble.querySelector('.text')?.textContent || '');
      bubble.classList.add('editing');
      bubble.dataset.originalText = original;

      const textEl = bubble.querySelector('.text');
      if (textEl) textEl.style.display = 'none';
      const editBtn = bubble.querySelector('.edit-btn');
      if (editBtn) editBtn.style.display = 'none';

      const ta = document.createElement('textarea');
      ta.className = 'edit-area';
      ta.value = original;

      const actions = document.createElement('div');
      actions.className = 'edit-actions';

      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.textContent = 'Cancel';

      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'primary';
      saveBtn.textContent = 'Save & Run';

      actions.appendChild(cancelBtn);
      actions.appendChild(saveBtn);
      bubble.appendChild(ta);
      bubble.appendChild(actions);

      const cleanup = () => {
        try { ta.remove(); } catch {}
        try { actions.remove(); } catch {}
        bubble.classList.remove('editing');
        if (textEl) textEl.style.display = '';
        if (editBtn) editBtn.style.display = '';
      };

      cancelBtn.addEventListener('click', () => {
        cleanup();
      });

      saveBtn.addEventListener('click', async () => {
        const nextText = String(ta.value || '').trim();
        if (!nextText) return;
        // Update DOM bubble text immediately
        if (textEl) textEl.textContent = nextText;
        cleanup();

        if (opts && opts.mode === 'queue') {
          // queued prompt: update queue item only
          try {
            const qid = String(opts.queueId || '');
            state.taskQueue = Array.isArray(state.taskQueue) ? state.taskQueue : [];
            const it = state.taskQueue.find((x) => String(x?.id || '') === qid);
            if (it) it.task = nextText;
            renderQueuePanel();
          } catch {}
          return;
        }

        // active run: cancel + persist edit + re-run edited task as the next queued item
        const rid = String(opts?.runId || '');
        if (rid) {
          try {
            await apiFetch('/api/cancel', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ runId: rid }),
            });
          } catch {}
          updateThreadUserMessageText(rid, nextText);
          markRunCancelledForRerun(rid);
        }
        // Queue the edited prompt to run immediately after cancellation settles.
        // This prevents overlapping runs and avoids accidentally draining the existing queue.
        try {
          const item = { id: crypto.randomUUID(), task: nextText, repoPath: state.activeRepo?.path || '' };
          state.taskQueue = Array.isArray(state.taskQueue) ? state.taskQueue : [];
          state.taskQueue.unshift(item);
          renderQueuePanel();
          renderBgTasks();
        } catch {}
      });

      // focus
      setTimeout(() => { try { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } catch {} }, 0);
    }

    function applyChatLinks(html){

    function renderChatInline(text){
      const raw = String(text || '');
      const codeTokens = [];
      let next = raw.replace(/`([^`]+)`/g, (_m, code) => {
        const token = `__ZONE_INLINE_CODE_${codeTokens.length}__`;
        codeTokens.push(`<code class="inline-code">${escapeHtml(code)}</code>`);
        return token;
      });
      next = escapeHtml(next);
      next = applyChatLinks(next);
      next = next.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      next = next.replace(/\*(.+?)\*/g, '<em>$1</em>');
      for (let i = 0; i < codeTokens.length; i += 1) {
        next = next.replace(`__ZONE_INLINE_CODE_${i}__`, codeTokens[i]);
      }
      return next;
    }

    function extractChatCodeBlocks(text){
      const codeBlocks = [];
      const next = String(text || '').replace(/```(\w+)?\n([\s\S]*?)```/g, (_m, lang, code) => {
        const idx = codeBlocks.length;
        codeBlocks.push({ lang: String(lang || '').trim(), code: String(code || '') });
        return `\u0000CODEBLOCK${idx}\u0000`;
      });
      return { text: next, codeBlocks };
    }

    function restoreChatCodeBlocks(text, codeBlocks){
      return String(text || '').replace(/\u0000CODEBLOCK(\d+)\u0000/g, (_m, idxText) => {
        const block = codeBlocks[Number.parseInt(idxText, 10)];
        if (!block) return '';
        const dataLang = block.lang ? ` data-lang="${escapeHtml(block.lang)}"` : '';
        const codeClass = block.lang ? ` class="language-${escapeHtml(block.lang)}"` : '';
        return `<pre class="chat-codeblock"${dataLang}><code${codeClass}>${escapeHtml(block.code)}</code></pre>`;
      });
    }

    function stripTrailingVerificationTag(text){
      return String(text || '').replace(/\s*\[ZONE_VERIFICATION:\s*[a-z_]+\]\s*$/i, '').trim();
    }

    function extractTrailingVerificationReason(text){
      const m = String(text || '').match(/\s*\[ZONE_VERIFICATION:\s*([a-z_]+)\]\s*$/i);
      return m ? String(m[1] || '').toLowerCase() : '';
    }

    function normalizeVerificationReason(reason){
      const raw = String(reason || '').trim().toLowerCase();
      if (!raw) return '';
      if (raw === 'tests_failed_by_patch') return 'tests_failed_user_code';
      if (raw === 'tests_failed_user_code') return 'tests_failed_user_code';
      if (raw === 'tests_passed') return 'tests_passed';
      if (raw === 'tests_skipped_no_infra') return 'tests_skipped_no_infra';
      if (raw === 'no_verification_attempted') return 'no_verification_attempted';
      if (raw === 'tests_inconclusive') return 'tests_inconclusive';
      if (raw === 'tests_failed_unrelated') return 'tests_failed_unrelated';
      return raw;
    }

    // Phase J.2: removed deriveVerificationBannerOverride,
    // getVerificationBannerModel, and createVerificationBanner. The verify
    // banner UI surface is gone — completion state is conveyed via the
    // diff card, undo button, and Apply Complete indicator (success path)
    // or createBlockedBanner (security violations).


    function renderChatMarkdown(text, isFinal){
      const normalized = stripTrailingVerificationTag(String(text || '').replace(/\r\n/g, '\n')).trim();
      if (!normalized) return '<div class="md"><p></p></div>';

      // Detect an unclosed trailing code fence (odd number of ``` tokens).
      // Split it off so we can render it specially while streaming.
      let mainText = normalized;
      let trailingCodeHtml = '';
      const fenceParts = normalized.split('```');
      if (fenceParts.length % 2 === 0) {
        // Unclosed opening fence at the end.
        const lastFenceIdx = normalized.lastIndexOf('```');
        mainText = normalized.slice(0, lastFenceIdx).trim();
        const tailRaw = normalized.slice(lastFenceIdx);
        const fenceBodyMatch = tailRaw.match(/^```(\w+)?\n?([\s\S]*)$/);
        const tailLang = fenceBodyMatch ? String(fenceBodyMatch[1] || '').trim() : '';
        const tailCode = fenceBodyMatch ? String(fenceBodyMatch[2] || '') : tailRaw.replace(/^```\w*\n?/, '');
        const dataLang = tailLang ? ` data-lang="${escapeHtml(tailLang)}"` : '';
        const codeClass = tailLang ? ` class="language-${escapeHtml(tailLang)}"` : '';
        if (!isFinal) {
          trailingCodeHtml = `<pre class="chat-codeblock streaming"${dataLang}><code${codeClass}>${escapeHtml(tailCode)}<span class="streaming-cursor">&#x25AE;</span></code></pre>`;
        } else {
          trailingCodeHtml = `<pre class="chat-codeblock"${dataLang}><code${codeClass}>${escapeHtml(tailCode)}</code></pre>`;
        }
      }

      let parsed;
      try {
        const rawHtml = (typeof marked !== 'undefined' && marked.parse) ? marked.parse(mainText) : escapeHtml(mainText);
        parsed = (typeof DOMPurify !== 'undefined' && DOMPurify.sanitize) ? DOMPurify.sanitize(rawHtml) : rawHtml;
      } catch(_e) {
        parsed = '<p>' + escapeHtml(mainText) + '</p>';
      }
      return `<div class="md">${parsed}${trailingCodeHtml}</div>`;
    }
