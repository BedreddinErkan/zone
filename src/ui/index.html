        const m = t.match(/Ranked\s+(\d+)\s+paths?/i);
        if (m) { step.label = 'Ranked ' + m[1] + ' relevant files'; labelEl.textContent = step.label; }
      } else if (groupId === 'group3') {
        const m = t.match(/Planning complete\s*\((\d+)\s*execution\s*step/i);
        if (m) { step.label = 'Planned ' + m[1] + '-step approach'; labelEl.textContent = step.label; }
      } else if (groupId === 'group3_5') {
        // Track action count and update label in real-time.
        step.actionCount = (step.actionCount || 0) + 1;
        step.label = 'Explored codebase (' + step.actionCount + ' action' + (step.actionCount === 1 ? '' : 's') + ')';
        labelEl.textContent = step.label;
      } else if (groupId === 'group4') {
        const mWp = t.match(/writing patch[.\s]*(.+)/i);
        if (mWp) {
          const base = basenamePath(String(mWp[1] || '').trim());
          if (base && !step.files.includes(base)) step.files.push(base);
          step.label = step.files.length === 1
            ? 'Generated patch for ' + step.files[0]
            : 'Generated patch for ' + step.files.length + ' files';
          labelEl.textContent = step.label;
        }
      } else if (groupId === 'group5') {
        if (/warning/i.test(t)) step.warningFlag = true;
      } else if (groupId === 'group6') {
        const mRun = t.match(/Running verification:\s*(.+)/i);
        if (mRun) { step.label = 'Ran: ' + String(mRun[1] || '').trim().slice(0, 45); labelEl.textContent = step.label; }

        // Safety timer: if group6 is still active after 60s, force-finalize as warning
        if (!step.__safetyTimer) {
          step.__safetyTimer = setTimeout(function() {
            const steps = state.__runSteps && state.__runSteps[String(runId || '')];
            const g6 = steps && steps['group6'];
            if (g6 && g6.status === 'active') {
              if (g6.el) {
                const labelEl2 = g6.el.querySelector('.run-step-label');
                if (labelEl2 && g6.label === STEP_DEFAULT_LABELS.group6) {
                  g6.label = 'Tests inconclusive';
                  labelEl2.textContent = g6.label;
                }
              }
              finalizeStepTimeline(String(runId || ''), 'warning');
            }
          }, 60000);
        }
      }
    }

    function finalizeStepTimeline(runId, outcome) {
      const rid = String(runId || '');
      const steps = state.__runSteps && state.__runSteps[rid];
      if (!steps) return;
      STEP_GROUP_ORDER.forEach(gid => {
        const step = steps[gid];
        if (!step || step.status !== 'active') return;
        // For group5 (validation), use warning icon if warnings were seen.
        const finalOutcome = (gid === 'group5' && step.warningFlag) ? 'warning' : (outcome || 'done');
        step.status = finalOutcome;
        if (step.el) {
          step.el.dataset.status = finalOutcome;
          const ico = step.el.querySelector('.run-step-icon');
          if (ico) {
            if (finalOutcome === 'done')    ico.innerHTML = '&#x2713;';  // ✓
            else if (finalOutcome === 'warning') ico.innerHTML = '&#x26A0;'; // ⚠
            else if (finalOutcome === 'failed')  ico.innerHTML = '&#x2717;'; // ✗
          }
          // Finalize label for group5/6 if still at defaults.
          const labelEl = step.el.querySelector('.run-step-label');
          if (labelEl) {
            if (gid === 'group3_5' && step.label === STEP_DEFAULT_LABELS.group3_5) {
              step.label = 'Explored codebase';
              labelEl.textContent = step.label;
            }
            if (gid === 'group5' && step.label === STEP_DEFAULT_LABELS.group5) {
              step.label = finalOutcome === 'warning' ? 'Validated patch (warnings)' : 'Validated patch';
              labelEl.textContent = step.label;
            }
            if (gid === 'group6' && step.label === STEP_DEFAULT_LABELS.group6) {
              step.label = finalOutcome === 'done' ? 'Tests passed' : finalOutcome === 'failed' ? 'Tests failed' : 'Tests skipped';
              labelEl.textContent = step.label;
            }
          }
        }
      });
    }

    function simplifyLogMessage(raw) {
      const text = String(raw || '');
      if (!text) return text;

      // Drop entirely — pure noise:
      // (a) Long syntax-error explanations after a broken patch
      if (/Patch applied but broke file syntax \(line \d+/i.test(text)) {
        return null; // The simplified agent_loop failure line covers this.
      }
      // (b) FIND/REPLACE diagnostic detail
      if (/^Block \d+: FIND content not found in file/i.test(text)) {
        return null;
      }
      if (/^Block \d+: FIND content matches \d+ locations/i.test(text)) {
        return null;
      }
      if (/Re-read the file with read_file and copy the exact lines/i.test(text)) {
        return null;
      }
      // (c) Marker imbalance / patch dump leakage
      if (/--- FIND ---|--- REPLACE ---/.test(text) && text.length > 100) {
        return null;
      }
      // (d) Identifier-already-declared style errors (covered by parent simplification)
      if (/has already been declared/i.test(text) || /already declared/i.test(text)) {
        return null;
      }

      // Summarize — keep but simplify (NO attempt numbers shown to user):
      let m;
      m = text.match(/^\[agent_loop\]\s*Failure detected\s*\(([^)]+)\)/i);
      if (m) {
        const reason = String(m[1] || '').replace(/_/g, ' ').trim();
        return `Encountered ${friendlyReason(reason)}, retrying...`;
      }
      if (/^\[agent_loop\]\s*Max iterations reached/i.test(text)) {
        return 'Reached max iterations, finalizing...';
      }
      if (/^\[agent_loop\]\s*Iteration\s+\d+\/\d+/i.test(text)) {
        return null; // Iteration counters are internal — drop.
      }

      return text;
    }

    function friendlyReason(rawReason) {
      const r = String(rawReason || '').toLowerCase();
      if (/syntax broken/i.test(r) || /syntax error/i.test(r)) return 'a syntax error';
      if (/find not found/i.test(r) || /not found/i.test(r)) return 'a missing match';
      if (/multiple matches/i.test(r) || /matches \d+ locations/i.test(r)) return 'an ambiguous match';
      if (/marker imbalance/i.test(r)) return 'a malformed patch';
      if (/scope not found/i.test(r)) return 'an unknown scope';
      if (/test failed/i.test(r)) return 'test failures';
      if (/repeated failure/i.test(r)) return 'repeated failures';
      if (/blocked escalated/i.test(r)) return 'a blocked file';
      return 'an issue';
    }

    // UI.3.c: compose rich retry line from per-attempt llm_retry_in_progress payload.
    function formatRetryLine(progress) {
      const cls = String(progress.errorClass || '').trim();
      const delayS = progress.delayMs != null ? (Number(progress.delayMs) / 1000).toFixed(1) + 's' : '';
      const attempt = progress.attemptIndex != null ? Number(progress.attemptIndex) : '';
      const max = progress.maxAttempts != null ? Number(progress.maxAttempts) : '';
      const parts = ['Retry'];
      if (attempt && max) parts.push(`${attempt}/${max}`);
      if (cls) parts.push(`· ${cls}`);
      if (delayS) parts.push(`· wait ${delayS}`);
      return parts.join(' ');
    }

    // UI.4.1: map terminationReason to visual category (mirrors K.4 server-side mapping).
    function getRunCategory(terminationReason) {
      switch (String(terminationReason || '')) {
        case 'natural_completion': return 'success';
        case 'max_iterations': case 'token_budget_exceeded': case 'daily_usd_cap_exceeded': return 'warning';
        case 'upstream_unavailable': case 'APPLY_ROLLED_BACK': case 'loop_detected': case 'compaction_exhausted': return 'error';
        case 'revision_approval_timeout': case 'revision_rejected': return 'neutral';
        default: return 'error';
      }
    }

    // ── Tool line coalescer ─────────────────────────────────────────────
    // Groups consecutive same-category tool calls into a single line with a live count.
    // Categories: read, patch, find, search, run, list
    // State stored at state.__coalesceByRun[runId] = { category, count, target, lineEl, runId }

    function detectToolCategory(humanizedMessage) {
      const m = String(humanizedMessage || '');
      if (/^Reading\s/i.test(m)) return { category: 'read', verb: 'Reading', verbPast: 'Read', noun: 'file' };
      if (/^Patching\s/i.test(m)) return { category: 'patch', verb: 'Patching', verbPast: 'Patched', noun: 'file' };
      if (/^Fixing\s/i.test(m)) return { category: 'patch', verb: 'Fixing', verbPast: 'Fixed', noun: 'file' };
      if (/^Finding references/i.test(m)) return { category: 'find', verb: 'Finding references', verbPast: 'Found references', noun: '' };
      if (/^Searching codebase/i.test(m)) return { category: 'search', verb: 'Searching codebase', verbPast: 'Searched codebase', noun: '' };
      if (/^Running\s/i.test(m)) return { category: 'run', verb: 'Running', verbPast: 'Ran', noun: '' };
      if (/^Exploring directory/i.test(m)) return { category: 'list', verb: 'Exploring directory', verbPast: 'Explored directory', noun: '' };
      return null; // Not a coalesceable tool line
    }

    function extractToolTarget(humanizedMessage) {
      // "Reading lib/env.ts..." → "lib/env.ts"
      // "Running npm test..." → "npm test"
      // "Patching file..." → "file" (generic)
      const m = String(humanizedMessage || '');
      const match = m.match(/^(?:Reading|Patching|Fixing|Running)\s+(.+?)\.\.\.\s*$/i);
      return match ? match[1].trim() : '';
    }

    function finalizeCoalescedLine(runId) {
      state.__coalesceByRun = state.__coalesceByRun || {};
      const ctx = state.__coalesceByRun[runId];
      if (!ctx || !ctx.lineEl) {
        if (ctx) delete state.__coalesceByRun[runId];
        return;
      }
      const { count, verbPast, noun, lineEl } = ctx;
      const msgEl = lineEl.querySelector('.log-msg');
      if (msgEl) {
        let finalText;
        if (count > 1 && noun) {
          finalText = `✓ ${verbPast} ${count} ${noun}s`;
        } else if (count > 1) {
          finalText = `✓ ${verbPast}`;
        } else {
          finalText = `✓ ${verbPast}${ctx.target ? ` ${ctx.target}` : ''}`;
        }
        msgEl.textContent = finalText;
      }
      lineEl.classList.remove('active');
      lineEl.classList.add('c-done');
      lineEl.classList.remove('tool-line-active');
      delete state.__coalesceByRun[runId];
    }

    function tryCoalesceToolLine(logBlock, runId, humanizedMessage, timestamp) {
      // Returns true if the line was coalesced (caller should NOT call appendLogLine).
      // Returns false if it should be appended as a new line (caller appends normally).
      const cat = detectToolCategory(humanizedMessage);
      state.__coalesceByRun = state.__coalesceByRun || {};
      const existing = state.__coalesceByRun[runId];

      if (!cat) {
        // Check if this is an "ignorable" duplicate event that the coalescer should pass through
        // without finalizing the active group. These are the same patterns suppressed downstream
        // by appendLogLine but coalescer must not treat them as group-breakers.
        const text = String(humanizedMessage || '');
        const isIgnorableDuplicate =
          /^\[tool\]\s/i.test(text) ||
          /^\{"event":/i.test(text.trim());

        if (isIgnorableDuplicate) {
          // Leave existing group untouched; let downstream suppressors drop the line.
          return false;
        }
        // Genuine non-tool line — finalize the pending group and let it append normally.
        finalizeCoalescedLine(runId);
        return false;
      }

      // Detected a tool line.
      const target = extractToolTarget(humanizedMessage);

      if (existing && existing.category === cat.category) {
        // Same category — increment count and update existing line text.
        existing.count = (existing.count || 1) + 1;
        existing.target = target;
        if (existing.lineEl) {
          const msgEl = existing.lineEl.querySelector('.log-msg');
          if (msgEl) {
            if (cat.noun) {
              msgEl.textContent = `${cat.verb} ${existing.count} ${cat.noun}s...`;
            } else {
              msgEl.textContent = `${cat.verb}...`;
            }
          }
        }
        return true; // Coalesced.
      }

      // Different category (or no existing) — finalize previous, start new.
      finalizeCoalescedLine(runId);
      state.__coalesceByRun[runId] = {
        category: cat.category,
        count: 1,
        target,
        verb: cat.verb,
        verbPast: cat.verbPast,
        noun: cat.noun,
        lineEl: null, // Will be set by caller after append.
        runId,
      };
      return false;
    }

    function captureCoalescedLineEl(runId, lineEl) {
      state.__coalesceByRun = state.__coalesceByRun || {};
      const ctx = state.__coalesceByRun[runId];
      if (ctx && !ctx.lineEl) ctx.lineEl = lineEl;
    }

    function commandPreviewLine(command, maxLength = 80) {
      const singleLine = String(command || '').replace(/\s+/g, ' ').trim();
      if (singleLine.length <= maxLength) return singleLine;
      return singleLine.slice(0, Math.max(0, maxLength - 1)).trimEnd() + '…';
    }

    function appendCommandAutoApprovedLine(logBlock, { timestamp, command }) {
      if (!logBlock) return;
      const lines = logBlock.querySelector('.log-lines');
      if (!lines) return;
      const prev = lines.querySelector('.log-line.active');
      if (prev) prev.classList.remove('active');

      const row = document.createElement('div');
      row.className = 'log-line done cmd-auto-approved-line';

      const ts = document.createElement('div');
      ts.className = 'log-ts';
      ts.textContent = timestamp || nowTs();

      const msg = document.createElement('div');
      msg.className = 'log-msg';

      const compact = document.createElement('div');
      compact.className = 'cmd-auto-approved';

      const check = document.createElement('span');
      check.className = 'check';
      check.textContent = '✓';

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = 'Auto-approved';

      const preview = document.createElement('code');
      preview.className = 'cmd-preview';
      preview.textContent = commandPreviewLine(command);

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'expand-toggle';
      toggle.setAttribute('aria-label', 'Show full command');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.textContent = '⌄';

      const full = document.createElement('pre');
      full.className = 'cmd-full';
      full.hidden = true;
      full.textContent = String(command || '');

      toggle.addEventListener('click', () => {
        const willExpand = !!full.hidden;
        full.hidden = !willExpand;
        toggle.setAttribute('aria-expanded', willExpand ? 'true' : 'false');
        toggle.setAttribute('aria-label', willExpand ? 'Hide full command' : 'Show full command');
      });

      compact.appendChild(check);
      compact.appendChild(label);
      compact.appendChild(preview);
      compact.appendChild(toggle);
      msg.appendChild(compact);
      msg.appendChild(full);
      row.appendChild(ts);
      row.appendChild(msg);
      lines.appendChild(row);
      scrollChatIfFollowing(logBlock);
    }

    function appendLogLine(logBlock, { timestamp, message, messageHtml, status, className }){
      if (!logBlock) return;
      // render-only suppression of redundant dispatch/intent echoes
      const renderTitle = String(message || '');
      const redundantIntentPrefix = 'Task intent:';
      if (renderTitle.toLowerCase().startsWith(redundantIntentPrefix.toLowerCase())) return;
      if (renderTitle === 'Developer patch run started.') return;
      if (renderTitle === 'Run summary') return;
      // NEVER log streaming deltas as separate lines (stream is rendered in livecode block).
      if (String(message || '').toLowerCase().includes('streaming patch')) return;
      const msgText = String(message || '');
      // Simplify verbose developer-grade error/coaching messages into user-facing one-liners.
      const simplifiedMessage = simplifyLogMessage(msgText);
      if (simplifiedMessage === null) {
        return; // Drop entirely — purely internal noise.
      }
      // Use the simplified version for the rest of the function.
      const finalMessage = simplifiedMessage;
      // Suppress all raw [tool] lines — tool display is handled by the tool_call
      // event path (humanizeTool → coalescer → ✓ pill). Any [tool] that reaches
      // appendLogLine is a redundant duplicate from the onProgress callback.
      if (/^\[tool\]\s/i.test(finalMessage)) {
        return;
      }
      // Suppress raw event JSON dumps that occasionally leak through as messages.
      if (/^\{"event":/.test(finalMessage.trim())) {
        return;
      }

      // ── Step timeline routing ─────────────────────────────────────────
      try {
        if (state.__useStepTimeline) {
          const rid = String((logBlock.id || '').replace(/^logBlock-/, '') || '');
          if (rid) {
            // Skip lines that the verify-loop suppressor would absorb.
            const isVerifyLoopLine =
              /^\[agent_loop\]\s*Iteration\s+\d+\/\d+/i.test(finalMessage) ||
              /^\[fix\]\s*(read_file|list_files|search_in_files):/i.test(finalMessage) ||
              /^\[tool\]\s*(Reading|Listing|Searching):/i.test(finalMessage);
            if (!isVerifyLoopLine) {
              const group = classifyLogLine(finalMessage);
              if (group) {
                addLineToStep(logBlock, rid, group, String(timestamp || ''), finalMessage);
                scrollChatIfFollowing(logBlock);
                // Group4: also flush any buffered stream deltas as before.
                if (/^Generating a localized patch\b/i.test(finalMessage)) {
                  try {
                    state.__streamDeltaFlushed = state.__streamDeltaFlushed || {};
                    const buf = state.__streamDeltaBuffer && state.__streamDeltaBuffer[rid];
                    const fp = String(buf?.filePath || '');
                    const ds = Array.isArray(buf?.deltas) ? buf.deltas.slice(0) : [];
                    try { delete state.__streamDeltaBuffer[rid]; } catch {}
                    state.__streamDeltaFlushed[rid] = true;
                    ds.forEach((delta) => appendStreamToLiveCode(logBlock, rid, fp, delta));
                  } catch {}
                }
                return;  // skip the raw log-line append
              }
            }
          }
        }
      } catch {}
      // ─────────────────────────────────────────────────────────────────

      function ensureVerifySummary(lb, runId){
        if (!lb) return null;
        state.__verifySummary = state.__verifySummary || {};
        if (state.__verifySummary[runId] && state.__verifySummary[runId].el) {
          return state.__verifySummary[runId].el;
        }
        const linesEl = lb.querySelector('.log-lines');
        if (!linesEl) return null;
        const box = document.createElement('div');
        box.className = 'verify-sum collapsed';
        box.dataset.runId = String(runId || '');
        box.innerHTML = `
          <div class="verify-sum-h">
            <span class="ico">🔍</span>
            <span class="txt">Investigating test failure...</span>
            <span class="chev">›</span>
          </div>
          <div class="verify-sum-b"></div>
        `;
        const head = box.querySelector('.verify-sum-h');
        if (head) {
          head.addEventListener('click', () => {
            const isCollapsed = box.classList.contains('collapsed');
            box.classList.toggle('collapsed', !isCollapsed);
            box.classList.toggle('expanded', isCollapsed);
            const chev = box.querySelector('.verify-sum-h .chev');
            if (chev) chev.textContent = isCollapsed ? '˅' : '›';
          });
        }
        // Append in-order where log lines are appended.
        linesEl.appendChild(box);
        state.__verifySummary[runId] = { el: box };
        return box;
      }

      function addVerifySummaryLine(lb, runId, compactText, fullText){
        const box = ensureVerifySummary(lb, runId);
        if (!box) return;
        const body = box.querySelector('.verify-sum-b');
        if (!body) return;
        const line = document.createElement('div');
        line.className = 'verify-sum-line';
        line.innerHTML = `<span class="compact">• ${escapeHtml(compactText)}</span><span class="full">• ${escapeHtml(fullText)}</span>`;
        body.appendChild(line);
      }

      // Hide noisy fix-loop lines and fold them into the verification summary (if active).
      try {
        const rid = String((logBlock.id || '').replace(/^logBlock-/, '') || '');
        const hideAgentIter = /^\[agent_loop\]\s*Iteration\s+\d+\/\d+/i.test(finalMessage);
        const hideFixTool = /^\[fix\]\s*(read_file|list_files|search_in_files):/i.test(finalMessage);
        const hideTool = /^\[tool\]\s*(Reading|Listing|Searching):/i.test(finalMessage);
        if (hideAgentIter || hideFixTool || hideTool) {
          const vs = state.__verifySummary && state.__verifySummary[rid] && state.__verifySummary[rid].el;
          if (vs) {
            // Condense common tool lines.
            const mTool = finalMessage.match(/^\[(?:tool|fix)\]\s*(Reading|Listing|Searching|read_file|list_files|search_in_files):\s*(.*)$/i);
            if (mTool) {
              const kindRaw = String(mTool[1] || '').toLowerCase();
              const arg = String(mTool[2] || '').trim();
              const base = basenamePath(arg);
              if (kindRaw === 'reading' || kindRaw === 'read_file') {
                addVerifySummaryLine(logBlock, rid, `Reading ${base || 'file'}`, `Reading ${arg || base || 'file'}`);
              } else if (kindRaw === 'listing' || kindRaw === 'list_files') {
                addVerifySummaryLine(logBlock, rid, `Listed ${base || 'dir/'}`, `Listed ${arg || base || 'dir/'}`);
              } else if (kindRaw === 'searching' || kindRaw === 'search_in_files') {
                const term = arg || '';
                addVerifySummaryLine(logBlock, rid, `Searching for ${term}`, `Searching for ${term}`);
              }
            }
          }
          return;
        }
      } catch {}
      const lines = logBlock.querySelector('.log-lines');
      if (!lines) return;
      // mark previous active as done-ish
      const prev = lines.querySelector('.log-line.active');
      if (prev) prev.classList.remove('active');

      const row = document.createElement('div');
      row.className = `log-line ${status || 'active'}`;
      row.classList.add('active');
      if (status === 'done') row.classList.add('done');
      if (status === 'success') row.classList.add('success');
      if (status === 'warning') row.classList.add('warning');
      if (status === 'error') row.classList.add('error');
      // Allow callers to force design-system color classes (e.g. c-active, c-done).
      if (className) String(className).split(/\s+/).filter(Boolean).forEach((cls) => row.classList.add(cls));
      const ts = document.createElement('div');
      ts.className = 'log-ts';
      ts.textContent = timestamp || nowTs();
      const msg = document.createElement('div');
      msg.className = 'log-msg';
      if (messageHtml) {
        msg.innerHTML = String(messageHtml || '');
      } else {
        msg.textContent = finalMessage || '';
      }
      row.appendChild(ts);
      row.appendChild(msg);
      // Always append at bottom so log reads chronologically (top → bottom).
      lines.appendChild(row);
      scrollChatIfFollowing(logBlock);

      // Flush buffered stream deltas once "Generating a localized patch" is logged.
      try {
        const rid = String((logBlock.id || '').replace(/^logBlock-/, '') || '');
        const text = String(message || '');
        if (/^Generating a localized patch\b/i.test(text)) {
          state.__streamDeltaFlushed = state.__streamDeltaFlushed || {};
          const buf = state.__streamDeltaBuffer && state.__streamDeltaBuffer[rid];
          const fp = String(buf?.filePath || '');
          const ds = Array.isArray(buf?.deltas) ? buf.deltas.slice(0) : [];
          try { delete state.__streamDeltaBuffer[rid]; } catch {}
          state.__streamDeltaFlushed[rid] = true;
          ds.forEach((delta) => appendStreamToLiveCode(logBlock, rid, fp, delta));
        }
      } catch {}
    }

    function basenamePath(p){
      const s = String(p || '');
      const i = Math.max(s.lastIndexOf('/'), s.lastIndexOf('\\'));
      return i >= 0 ? s.slice(i + 1) : s;
    }

    function classifyPill(filePath){
      const low = String(filePath||'').toLowerCase();
      const config = low.endsWith('.json') || low.endsWith('.yml') || low.endsWith('.yaml') || low.endsWith('.toml') || low.endsWith('.env') || low.endsWith('.config.js') || low.endsWith('.config.ts');
      const dot = config ? 'config' : '';
      const ext = (low.split('.').pop() || '');
      const isTs = ['ts','tsx','js','jsx','mjs','cjs'].includes(ext);
      return { className: dot, dotColor: config ? 'violet' : (isTs ? 'blue' : 'blue') };
    }

    function renderPlannerCard(logBlock, planner){
      if (!logBlock || !planner) return;
      const oldRf = logBlock.querySelector('.related-files');
      if (oldRf) oldRf.remove();
      const oldRw = logBlock.querySelector('.planner-dep-warnings');
      if (oldRw) oldRw.remove();
      let pills = logBlock.querySelector('.pills');
      if (!pills) {
        pills = document.createElement('div');
        pills.className = 'pills';
        logBlock.appendChild(pills);
      } else {
        pills.innerHTML = '';
      }
      const files = Array.isArray(planner.filesToEdit) ? planner.filesToEdit : [];
      const max = 8;
      files.slice(0, max).forEach((fp, idx) => {
        const p = document.createElement('div');
        const cls = classifyPill(fp);
        p.className = 'pill ' + (cls.className || '');
        p.style.animationDelay = `${idx*45}ms`;
        const d = document.createElement('span');
        d.className = 'pdot';
        p.appendChild(d);
        const name = document.createElement('span');
        name.textContent = fp;
        p.appendChild(name);
        pills.appendChild(p);
      });
      if (files.length > max) {
        const more = document.createElement('div');
        more.className = 'pill more';
        more.style.animationDelay = `${max*45}ms`;
        more.textContent = `+${files.length - max} files`;
        pills.appendChild(more);
      }
      const related = Array.isArray(planner.relatedFiles) ? planner.relatedFiles : [];
      if (related.length > 0) {
        const rfWrap = document.createElement('div');
        rfWrap.className = 'related-files';
        const lbl = document.createElement('span');
        lbl.className = 'rf-label';
        lbl.textContent = 'Also analyzing:';
        rfWrap.appendChild(lbl);
        related.forEach((f) => {
          const fp = f && (f.filePath || f.path);
          if (!fp) return;
          const pill = document.createElement('span');
          pill.className = 'rf-pill';
          const nm = document.createElement('span');
          nm.textContent = basenamePath(fp);
          const rel = document.createElement('span');
          rel.className = 'rf-rel';
          rel.textContent = f.relationship || '';
          pill.appendChild(nm);
          pill.appendChild(rel);
          rfWrap.appendChild(pill);
        });
        logBlock.appendChild(rfWrap);
      }
      const warns = Array.isArray(planner.warnings) ? planner.warnings : [];
      if (warns.length > 0) {
        const wBox = document.createElement('div');
        wBox.className = 'planner-dep-warnings';
        warns.forEach((w) => {
          if (!w) return;
          const line = document.createElement('div');
          line.className = 'rf-warn-line';
          line.textContent = String(w);
          wBox.appendChild(line);
        });
        if (wBox.childNodes.length) logBlock.appendChild(wBox);
      }
      if (planner.strategy) appendLogLine(logBlock, { timestamp: nowTs(), message: `Strategy: ${planner.strategy}`, status: 'done' });
      if (planner.changeDescription) appendLogLine(logBlock, { timestamp: nowTs(), message: planner.changeDescription, status: 'done' });
      scrollChatIfFollowing(logBlock);
    }

    function createToast(kind, text){
      const t = document.createElement('div');
      t.className = 'toast ' + (kind || '');
      const i = document.createElement('div');
      i.className = 'ticon';
      t.appendChild(i);
      const m = document.createElement('div');
      m.textContent = text;
      t.appendChild(m);
      return t;
    }

    function showToast(kind, text, ms){
      const t = createToast(kind, text);
      els.chatArea.appendChild(t);
      scrollChatIfFollowing();
      if (typeof ms === 'number' && ms > 0) {
        setTimeout(() => { try { t.remove(); } catch {} }, ms);
      }
      return t;
    }

    function updateInputPlaceholder(){
      try {
        // Phase 1b: placeholder reflects ACTIVE thread's run state, so the
        // user sees "Ask Zone anything..." even when other threads are
        // running — they really can dispatch a new run from this thread.
        const activeRun = getActiveRun();
        const activeQueue = state.activeThreadId
          ? (state.taskQueuesByThread.get(state.activeThreadId) || [])
          : [];
        if (activeRun) {
          els.taskInput.placeholder = "Running... type to queue next task";
          return;
        }
        if (activeQueue.length > 0) {
          els.taskInput.placeholder = `${activeQueue.length} queued — type to add more`;
          return;
        }
        els.taskInput.placeholder = "Ask Zone anything...";
      } catch {}
    }

    function renderQueuePanel(){
      const q = Array.isArray(state.taskQueue) ? state.taskQueue : [];
      if (!els.queueBar) return;
      if (q.length === 0) {
        els.queueBar.classList.remove('show');
        els.queueBar.innerHTML = '';
        updateInputPlaceholder();
        return;
      }
      els.queueBar.classList.add('show');
      els.queueBar.innerHTML = '';
      q.forEach((it) => {
        const row = document.createElement('div');
        row.className = 'queueRow';
        const txt = document.createElement('div');
        txt.className = 'queueText';
        const full = String(it.task || '');
        txt.textContent = full;
        txt.title = full;
        txt.style.cursor = 'text';
        txt.addEventListener('click', () => {
          // Edit queued prompt (no cancel).
          const bubbleLike = document.createElement('div');
          bubbleLike.className = 'bubble user';
          const inner = document.createElement('div');
          inner.className = 'text';
          inner.textContent = full;
          bubbleLike.appendChild(inner);
          const placeholder = document.createElement('div');
          placeholder.style.width = '100%';
          placeholder.appendChild(bubbleLike);
          row.innerHTML = '';
          row.appendChild(placeholder);
          enableUserBubbleEditing(bubbleLike, { mode: 'queue', queueId: it.id });
        });
        const x = document.createElement('button');
        x.type = 'button';
        x.className = 'queueRemove';
        x.textContent = '✕';
        x.title = 'Remove';
        x.addEventListener('click', () => cancelQueuedTask(it.id));
        row.appendChild(txt);
        row.appendChild(x);
        els.queueBar.appendChild(row);
      });
      updateInputPlaceholder();
    }

    function enqueueTask(task){
      const id = crypto.randomUUID();
      // Phase 1b: each thread owns its own queue. A queued task always
      // belongs to the thread it was typed in — even after the user
      // navigates away.
      const tid = state.activeThreadId;
      const item = {
        id,
        task,
        repoPath: state.activeRepo?.path || '',
        threadId: tid,
        enqueuedAt: Date.now(),
      };
      const q = getOrCreateTaskQueueForThread(tid);
      q.push(item);
      renderQueuePanel();
      renderBgTasks();
      return item;
    }

    function cancelQueuedTask(id){
      // Search across all per-thread queues for the matching task id; remove it.
      for (const [tid, q] of state.taskQueuesByThread.entries()) {
        const idx = q.findIndex((t) => t && t.id === id);
        if (idx !== -1) {
          q.splice(idx, 1);
          if (q.length === 0) state.taskQueuesByThread.delete(tid);
          break;
        }
      }
      renderQueuePanel();
      renderBgTasks();
    }

    function dequeueAndRunNext(threadId){
      // Phase 1b: drain the queue belonging to a SPECIFIC thread (the one
      // whose run just finished). When called without arg, fall back to
      // the active thread for legacy callers.
      const tid = String(threadId || state.activeThreadId || '');
      if (!tid) return;
      const q = state.taskQueuesByThread.get(tid);
      if (!q || q.length === 0) {
        renderQueuePanel();
        renderBgTasks();
        return;
      }
      // If the owning thread already has a fresh in-flight run (e.g. the
      // user kicked one off manually before this drain fires), don't
      // double-dispatch — just leave the queued items for the next drain.
      if (getRun(tid)) {
        try { console.log('[send-debug] dequeue skipped — owning thread already has an in-flight run', { tid, queueLength: q.length }); } catch {}
        renderQueuePanel();
        renderBgTasks();
        return;
      }
      const next = q.shift();
      if (q.length === 0) state.taskQueuesByThread.delete(tid);
      renderQueuePanel();
      renderBgTasks();
      try { console.log('[send-debug] dequeued queued run', { queuedTaskId: next?.id || null, queueLengthAfterShift: q.length, task: String(next?.task || '').slice(0, 120), originThreadId: next?.threadId || null }); } catch {}
      // The queue is per-thread now, so the dequeued task's threadId
      // always equals tid. Switch the view if the user is elsewhere; the
      // sendMessage call sees activeThreadId === tid and routes correctly.
      // Re-check inside the setTimeout in case the user navigated away
      // again during the 600ms window.
      if (next.threadId && String(next.threadId) !== String(state.activeThreadId)) {
        try { activateThread(next.threadId); } catch {}
      }
      setTimeout(() => {
        if (next.threadId && String(next.threadId) !== String(state.activeThreadId)) {
          try { activateThread(next.threadId); } catch {}
        }
        sendMessage(next.task);
      }, 600);
    }

    function syntaxLite(line){
      // IMPORTANT: this output is later inserted via innerHTML. Escape first, then add spans.
      let s = escapeHtml(line);
      s = s.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="str">$1</span>');
      s = s.replace(/\b(function|const|let|var|return|if|else|for|while|try|catch|throw|class|new|import|export|async|await)\b/g, '<span class="kw">$1</span>');
      s = s.replace(/\b([A-Za-z_$][A-Za-z0-9_$]*)\s*\(/g, '<span class="fn">$1</span>(');
      return s;
    }

    function sanitizeDiffHtml(html){
      const allowed = new Set(['kw','fn','str','cm']);
      const t = document.createElement('template');
      t.innerHTML = String(html || '');
      const nodes = Array.from(t.content.querySelectorAll('*'));
      nodes.forEach((el) => {
        if (el.tagName !== 'SPAN') {
          el.replaceWith(document.createTextNode(el.textContent || ''));
          return;
        }
        const cls = String(el.getAttribute('class') || '').trim();
        if (!allowed.has(cls)) {
          el.replaceWith(document.createTextNode(el.textContent || ''));
          return;
        }
        Array.from(el.attributes).forEach((a) => {
          if (a.name !== 'class') el.removeAttribute(a.name);
        });
      });
      return t.innerHTML;
    }

    function buildDiffRowsUnified(diffText){
      const rows = [];
      const lines = String(diffText||'').split(/\r?\n/);
      let ln = 0;
      for (const raw of lines) {
        if (raw.startsWith('@@') || raw.startsWith('+++') || raw.startsWith('---')) continue;
        if (!raw) continue;
        const pm = raw[0];
        const code = raw.slice(1);
        let kind = 'unchanged';
        let pmChar = ' ';
        if (pm === '+') { kind = 'added'; pmChar = '+'; }
        else if (pm === '-') { kind = 'removed'; pmChar = '-'; }
        else { kind = 'unchanged'; pmChar = ' '; }
        ln += 1;
        rows.push({ ln, pm: pmChar, code, kind });
      }
      return rows;
    }

    function diffToUnifiedText(diff){
      if (!diff) return '';
      if (typeof diff === 'string') return diff;
      if (!Array.isArray(diff)) return String(diff);
      const lines = [];
      for (const it of diff) {
        if (typeof it === 'string') { lines.push(it); continue; }
        if (!it || typeof it !== 'object') { lines.push(String(it)); continue; }
        const t = String(it.type || it.kind || it.op || '').toLowerCase();
        const content = String(it.content ?? it.text ?? it.line ?? '');
        if (!content) continue;
        const pm =
          t === 'add' || t === 'added' || t === '+' ? '+' :
          t === 'remove' || t === 'removed' || t === '-' ? '-' :
          ' ';
        lines.push(pm + content);
      }
      return lines.join('\n');
    }

    function countChangedLinesInUnifiedText(diffText){
      let count = 0;
      const lines = String(diffText || '').split(/\r?\n/);
      for (const raw of lines) {
        if (!raw || raw.startsWith('@@') || raw.startsWith('+++') || raw.startsWith('---')) continue;
        if (raw[0] === '+' || raw[0] === '-') count += 1;
      }
      return count;
    }

    function getFileDiffChangedLineCount(fileDiff){
      if (!fileDiff || typeof fileDiff !== 'object') return 0;
      const added = Number(fileDiff.addedLines ?? fileDiff.additions ?? fileDiff.linesAdded ?? 0) || 0;
      const removed = Number(fileDiff.removedLines ?? fileDiff.deletions ?? fileDiff.linesRemoved ?? 0) || 0;
      if (added > 0 || removed > 0) return added + removed;
      const diffText = diffToUnifiedText(fileDiff.diff || fileDiff.unifiedDiff || fileDiff.patch || '');
      return countChangedLinesInUnifiedText(diffText);
    }

    function getFileDiffLineStats(fileDiff){
      const explicitAdded = Number(fileDiff?.addedLines ?? fileDiff?.additions ?? fileDiff?.linesAdded ?? NaN);
      const explicitRemoved = Number(fileDiff?.removedLines ?? fileDiff?.deletions ?? fileDiff?.linesRemoved ?? NaN);
      if (Number.isFinite(explicitAdded) || Number.isFinite(explicitRemoved)) {
        return {
          added: Number.isFinite(explicitAdded) ? Math.max(0, explicitAdded) : 0,
          removed: Number.isFinite(explicitRemoved) ? Math.max(0, explicitRemoved) : 0,
        };
      }
      const diffText = diffToUnifiedText(fileDiff?.diff || fileDiff?.unifiedDiff || fileDiff?.patch || '');
      let added = 0;
      let removed = 0;
      String(diffText || '').split(/\r?\n/).forEach((raw) => {
        if (!raw || raw.startsWith('@@') || raw.startsWith('+++') || raw.startsWith('---')) return;
        if (raw[0] === '+') added += 1;
        else if (raw[0] === '-') removed += 1;
      });
      return { added, removed };
    }

    function getEffectiveDiffState(result){
      const r = result && typeof result === 'object' ? result : {};
      const diffs = Array.isArray(r.fileDiffs) ? r.fileDiffs : [];
      const explicitTotalRaw =
        r.totalChangedLines ??
        r.patchScope?.totalChangedLines ??
        r.finalRunReport?.patchScope?.totalChangedLines;
      const explicitTotal = Number(explicitTotalRaw);
      const hasExplicitTotal = Number.isFinite(explicitTotal) && explicitTotal >= 0;
      const computedTotal = diffs.reduce((sum, fd) => sum + getFileDiffChangedLineCount(fd), 0);
      const totalChangedLines = hasExplicitTotal ? explicitTotal : computedTotal;
      const allDiffPatchesEmpty =
        diffs.length === 0 || diffs.every((fd) => getFileDiffChangedLineCount(fd) === 0);
      return {
        totalChangedLines,
        allDiffPatchesEmpty,
        effectiveDiffsEmpty: totalChangedLines === 0 || allDiffPatchesEmpty,
      };
    }

    // Phase J.2: removed createNoChangesIndicator. The yellow "No changes
    // made" pill is replaced by createApplyCompleteIndicator below, which
    // treats empty-diff runs as a successful no-op rather than a warning.

    // Phase I.5: full-size screenshot modal. ESC, backdrop click, and the
    // close button all dismiss; only one modal can be open at a time.
    function openScreenshotModal(url, title){
      const existing = document.querySelector('.screenshot-modal');
      if (existing) existing.remove();
      const modal = document.createElement('div');
      modal.className = 'screenshot-modal';
      modal.innerHTML = `
        <div class="screenshot-modal-backdrop"></div>
        <div class="screenshot-modal-content" role="dialog" aria-modal="true">
          <div class="screenshot-modal-header">
            <span class="screenshot-modal-title">${escapeHtml(title || 'Screenshot')}</span>
            <button class="screenshot-modal-close" aria-label="Close">×</button>
          </div>
          <div class="screenshot-modal-body">
            <img src="${escapeHtml(url)}" class="screenshot-modal-image" alt="${escapeHtml(title || 'Screenshot')}" />
          </div>
        </div>
      `;
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      const close = () => {
        modal.remove();
        document.removeEventListener('keydown', onKey);
      };
      modal.querySelector('.screenshot-modal-backdrop').onclick = close;
      modal.querySelector('.screenshot-modal-close').onclick = close;
      document.addEventListener('keydown', onKey);
      document.body.appendChild(modal);
    }

    // Phase J.2: minimal post-completion indicator. Appears once per run
    // when applyPatches finished successfully but produced no diffs (e.g.
    // agent decided no change was needed, or the change was idempotent).
    // Subtle styling — not a verdict pill, just a "the run is done" signal.
    function createApplyCompleteIndicator(opts){
      const filesChanged = Number(opts?.filesChanged) || 0;
      const text = filesChanged > 0
        ? `Apply complete · ${filesChanged} file${filesChanged === 1 ? '' : 's'} changed`
        : 'Apply complete · no changes needed';
      const el = document.createElement('div');
      el.className = 'toast';
      el.style.cssText = 'margin:6px 0;opacity:0.7;border-color:rgba(34,197,94,0.28);background:rgba(34,197,94,0.04)';
      el.innerHTML = `<div class="ticon" style="background:rgba(34,197,94,0.7)"></div><div>${escapeHtml(text)}</div>`;
      return el;
    }

    // Phase J.3: amber banner shown when decisionMode === "rolled_back".
    // Post-apply verification regressed (more typecheck/test errors than
    // before the patch), so the agent loop discarded staging — the patch
    // never reached disk permanently. The diff is still rendered below for
    // inspection ("what was attempted"), but no undo button (rollback was
    // automatic, there's nothing on disk to undo).
    function createRolledBackBanner(opts){
      const reason = String((opts && opts.reason) || 'Verification regressed after apply');
      const errors = Array.isArray(opts && opts.errors) ? opts.errors.slice(0, 5) : [];
      const el = document.createElement('div');
      el.className = 'toast warn';
      el.style.cssText = 'margin:6px 0;padding:12px 16px;align-items:flex-start;display:flex;gap:12px';
      const errorsHtml = errors.length
        ? `<ul style="font-family:var(--font-family-mono,monospace);font-size:0.85em;margin:8px 0 6px 0;padding-left:18px;color:var(--text-2)">${errors.map(e => `<li style="margin:2px 0">${escapeHtml(String(e))}</li>`).join('')}</ul>`
        : '';
      el.innerHTML = `
        <div style="font-size:18px;opacity:0.85;line-height:1">⟲</div>
        <div style="flex:1">
          <div style="font-weight:600;color:var(--amber-dim);margin-bottom:4px">Apply rolled back</div>
          <div style="font-size:var(--font-size-sm,12px);color:var(--text-2);line-height:1.45">${escapeHtml(reason)}</div>
          ${errorsHtml}
          <div style="font-size:var(--font-size-sm,12px);color:var(--text-3);margin-top:6px;line-height:1.45">Disk restored to pre-apply state. Inspect the diff below to see what was attempted, then re-dispatch with corrections.</div>
        </div>
      `;
      return el;
    }

    // Phase J.2: red banner shown when decisionMode === "blocked". Replaces
    // the verify-banner-with-blocked-pill render path. Names the security
    // reason directly so users see why the patch was hard-blocked.
    function createBlockedBanner(reason){
      const el = document.createElement('div');
      el.className = 'toast error';
      el.style.cssText = 'margin:6px 0;align-items:flex-start';
      const safeReason = escapeHtml(String(reason || 'Blocked for safety'));
      el.innerHTML = `
        <div class="ticon" style="background:var(--color-error);margin-top:4px"></div>
        <div>
          <div style="font-weight:600;color:var(--red);margin-bottom:2px">✗ Blocked for safety</div>
          <div style="font-size:var(--font-size-sm,12px);color:var(--text-2);line-height:1.45">${safeReason}</div>
          <div style="font-size:var(--font-size-sm,12px);color:var(--text-3);margin-top:4px;line-height:1.45">No changes were applied. Address the issue above and re-dispatch the task.</div>
        </div>
      `;
      return el;
    }

    function splitDiffToColumns(diffText){
      const left = [];
      const right = [];
      const lines = String(diffText||'').split(/\r?\n/);
      for (const raw of lines) {
        if (raw.startsWith('@@') || raw.startsWith('+++') || raw.startsWith('---')) continue;
        if (!raw) continue;
        const pm = raw[0];
        const code = raw.slice(1);
        if (pm === '+') { left.push({ pm:'', code:'', kind:'unchanged' }); right.push({ pm:'+', code, kind:'added' }); }
        else if (pm === '-') { left.push({ pm:'-', code, kind:'removed' }); right.push({ pm:'', code:'', kind:'unchanged' }); }
        else { left.push({ pm:'', code: raw.startsWith(' ') ? raw.slice(1) : raw, kind:'unchanged' }); right.push({ pm:'', code: raw.startsWith(' ') ? raw.slice(1) : raw, kind:'unchanged' }); }
      }
      return { left, right };
    }

    /**
     * @param {object} fileDiff
     * @param {number} idx
     * @param {number} total
     * @param {{ decisionMode?: string, applied?: boolean, blockedMessage?: string, handoffReport?: any, verificationReason?: string }|undefined} options
     */
    function renderDiffCard(fileDiff, idx, total, options){
      const opts = options && typeof options === 'object' ? options : {};
      const decisionMode = String(opts.decisionMode || 'preview_only');
      const applied = !!opts.applied;
      const blockedMessage = String(opts.blockedMessage || '').trim() || '✗ Blocked for safety';
      const handoffPrompt = String(opts?.handoffReport?.suggestedNextPrompt || '').trim();
      const verificationReason = String(opts.verificationReason || '');

      const filePath = fileDiff.filePath || fileDiff.path || fileDiff.file || `file-${idx+1}`;
      const diffText = diffToUnifiedText(fileDiff.diff || fileDiff.unifiedDiff || fileDiff.patch || '');
      const lineStats = getFileDiffLineStats(fileDiff);

      // If the diff is empty (no actual lines changed), skip rendering this card entirely.
      // Happens when staging was discarded (verification_failed_staged) or detected as no-op.
      if (getFileDiffChangedLineCount(fileDiff) === 0) {
        return null;
      }

      const card = document.createElement('div');
      // Phase J.3.1: amber-tinted "what was attempted" framing when the
      // diff is from a rolled-back run (staging discarded, disk untouched).
      const isRolledBack = decisionMode === 'rolled_back' || opts.applied === false;
      card.className = isRolledBack
        ? 'diff-card collapsed diff-card-rolled-back'
        : 'diff-card collapsed';
      card.dataset.filePath = filePath;

      const tb = document.createElement('div');
      tb.className = 'diff-toolbar';

      const ico = document.createElement('div');
      ico.className = 'file-ico';
      ico.textContent = '≡';
      tb.appendChild(ico);

      const fn = document.createElement('div');
      fn.className = 'diff-fname';
      fn.textContent = filePath;
      tb.appendChild(fn);

      if (isRolledBack && idx === 0) {
        const attemptedLabel = document.createElement('span');
        attemptedLabel.className = 'diff-attempted-label';
        attemptedLabel.textContent = 'attempted (rolled back)';
        tb.appendChild(attemptedLabel);
      }

      const stat = document.createElement('div');
      stat.className = 'diff-stat';
      stat.textContent = `+${lineStats.added} / -${lineStats.removed}`;
      tb.appendChild(stat);

      if (handoffPrompt) {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'diff-copy';
        copyBtn.type = 'button';
        copyBtn.title = 'Copy prompt';
        copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="8" y="2" width="8" height="4" rx="1" stroke="currentColor" stroke-width="1.6"/></svg>`;
        const doCopy = () => {
          const t = String(handoffPrompt);
          // writeClipboardText handles browser's navigator.clipboard, Tauri's
          // clipboard plugin, and the textarea + execCommand fallback in
          // one call. Browser path is functionally identical to the prior
          // navigator.clipboard.writeText branch.
          writeClipboardText(t)
            .then((ok) => showToast(ok ? 'success' : 'error', ok ? 'Copied to clipboard' : 'Copy failed', ok ? 1400 : 1600))
            .catch(() => showToast('error', 'Copy failed', 1600));
        };
        copyBtn.addEventListener('click', (e) => { e.stopPropagation(); doCopy(); });
        tb.appendChild(copyBtn);
      }

      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'diff-toggle';
      toggleBtn.type = 'button';
      toggleBtn.title = 'Expand';
      toggleBtn.textContent = '˅';
      tb.appendChild(toggleBtn);

      const area = document.createElement('div');
      area.className = 'diff-area';

      toggleBtn.addEventListener('click', () => {
        const nextCollapsed = !card.classList.contains('collapsed');
        card.classList.toggle('collapsed', nextCollapsed);
        toggleBtn.textContent = nextCollapsed ? '˅' : '˄';
        toggleBtn.title = nextCollapsed ? 'Expand' : 'Collapse';
      });

      function renderUnified(){
        area.innerHTML = '';
        const rows = buildDiffRowsUnified(diffText).slice(0, 240);
        rows.forEach(r => {
          const row = document.createElement('div');
          row.className = `drow ${r.kind}`;
          const ln = document.createElement('div');
          ln.className = 'ln';
          ln.textContent = String(r.ln);
          const pm = document.createElement('div');
          pm.className = 'pm';
          pm.textContent = r.pm;
          const code = document.createElement('div');
          code.className = 'code';
          code.innerHTML = sanitizeDiffHtml(syntaxLite(r.code));
          row.appendChild(ln); row.appendChild(pm); row.appendChild(code);
          area.appendChild(row);
        });
      }

      renderUnified();

      card.appendChild(tb);
      card.appendChild(area);
      return card;
    }

    function createToolsUsedLine(runId) {
      const rid = String(runId || '');
      if (!rid) return null;
      const summary = (typeof getRunSummary === 'function')
        ? getRunSummary(rid)
        : (state.summariesByRunId || {})[rid];
      if (!summary || !summary.toolsUsed || typeof summary.toolsUsed !== 'object') return null;

      const entries = Object.entries(summary.toolsUsed)
        .filter(([_, count]) => Number(count) > 0)
        .sort((a, b) => Number(b[1]) - Number(a[1]));
      if (entries.length === 0) return null;

      const line = document.createElement('span');
      line.className = 'zone-tools-used';
      line.textContent = entries.map(([tool, count]) => `${tool} × ${count}`).join(' · ');
      return line;
    }

    // Phase J.2: removed createActionChipRow. Apply is automatic post-J.1
    // (no explicit chip needed). Diff visibility is handled by the diff card
    // itself, and the undo control above the chip row already provides the
    // revert affordance. The tools-used line is now folded into the
    // execution summary panel rather than rendered next to the diff.

    // ---- Threads & sidebar rendering ----
    function fmtRelative(ts){
      const ms = Date.now() - ts;
      const m = Math.floor(ms/60000);
      if (m < 1) return 'now';
      if (m < 60) return `${m}m`;
      const h = Math.floor(m/60);
      if (h < 24) return `${h}h`;
      const d = Math.floor(h/24);
      return `${d}d`;
    }

    function getActiveThread(){
      return state.threads.find(t => t.id === state.activeThreadId) || null;
    }

    function renderSidebar(tab){
      const view = tab || document.querySelector('.tab.active')?.dataset?.tab || 'byRepo';
      els.leftScroll.innerHTML = '';
      if (normalizeSidebarState(state.sidebarState) !== 'open') return;

      const threads = state.threads.slice().sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
      if (view === 'all') {
        const g = document.createElement('div');
        g.className = 'group open';
        const gh = document.createElement('div');
        gh.className = 'group-h';
        gh.innerHTML = `<span style="color:var(--text-4)">All threads</span><span class="badge">${threads.length}</span><span class="chev">›</span>`;
        g.appendChild(gh);
        const list = document.createElement('div');
        list.className = 'threads';
        threads.forEach(t => list.appendChild(renderThreadItem(t)));
        g.appendChild(list);
        els.leftScroll.appendChild(g);
        return;
      }
      if (view === 'recent') {
        const today = [];
        const earlier = [];
        const start = new Date(); start.setHours(0,0,0,0);
        threads.forEach(t => ((t.createdAt||0) >= start.getTime() ? today : earlier).push(t));
        if (today.length) els.leftScroll.appendChild(renderSimpleGroup('Today', today, true));
        if (earlier.length) els.leftScroll.appendChild(renderSimpleGroup('Earlier', earlier, true));
        return;
      }
      // byRepo
      const by = new Map();
      threads.forEach(t => {
        const key = basenameFromPath(t.repoPath || t.repoName || '') || 'Unknown';
        if (!by.has(key)) by.set(key, []);
        by.get(key).push(t);
      });
      const keys = Array.from(by.keys()).sort();
      keys.forEach(k => {
        const list = by.get(k).slice();
        els.leftScroll.appendChild(renderRepoGroup(k, list));
      });
    }

    function renderSimpleGroup(title, threads, openByDefault){
      const g = document.createElement('div');
      g.className = 'group ' + (openByDefault ? 'open' : '');
      const gh = document.createElement('button');
      gh.className = 'group-h';
      gh.type = 'button';
      gh.innerHTML = `
        <span style="color:var(--text-4)">${title}</span>
        <span class="badge">${threads.length}</span>
        <span class="chev">›</span>
      `;
      gh.addEventListener('click', () => g.classList.toggle('open'));
      const list = document.createElement('div');
      list.className = 'threads';
      threads.forEach(t => list.appendChild(renderThreadItem(t)));
      g.appendChild(gh);
      g.appendChild(list);
      return g;
    }

    function renderRepoGroup(repoName, threads){
      const g = document.createElement('div');
      g.className = 'group open';
      const gh = document.createElement('button');
      gh.type = 'button';
      gh.className = 'group-h';
      const repo = (state.repos || []).find(r => (r?.name === repoName) || (r?.path === repoName)) || null;
      const repoPath = repo?.path || repoName;

      const confirming = state.__confirmRemoveProjectPath === repoPath;
      if (confirming) {
        gh.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-4)">
            <path d="M3 7h5l2 2h11v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"></path>
          </svg>
          <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${repoName}</span>

            <button type="button" class="y">Yes</button>
            <button type="button" class="n">No</button>
          </span>
        `;
      } else {
        gh.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-4)">
            <path d="M3 7h5l2 2h11v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"></path>
          </svg>
          <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${repoName}</span>
          <span class="badge">${threads.length}</span>
          <button type="button" class="gbtn new" title="New chat" aria-label="New chat">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
              <path d="M7.5 1.5l2 2L3 10H1V8L7.5 1.5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button type="button" class="gbtn del" title="Remove project" aria-label="Remove project">×</button>
          <span class="chev">›</span>
        `;
      }

      // default: clicking header toggles open/close (but not when clicking buttons)
      gh.addEventListener('click', (e) => {
        const t = e.target;
        if (t && t.closest && t.closest('button')) return;
        g.classList.toggle('open');
      });

      const newBtn = gh.querySelector('.gbtn.new');
      if (newBtn) {
        newBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.activeRepo = normalizeRepoRecord(repo || { path: repoPath }) || { name: repoName, path: repoPath };
          fetchBranchList();
          const thread = {
            id: crypto.randomUUID(),
            repoPath: state.activeRepo.path,
            repoName: state.activeRepo.name,
            title: `New thread for ${state.activeRepo.name}`,
            messages: [],
            createdAt: Date.now()
          };
          state.threads.unshift(thread);
          state.activeThreadId = thread.id;
          saveThreads();
          ensureRepos();
          renderSidebar();
          // Phase 1b: renderActiveThread lazily creates the new thread's
          // per-thread container and hides every other thread's container.
          renderActiveThread();
          els.threadTitle.textContent = thread.title;
          setIdleUI();
          // A brand-new thread can't own a run, so hide any sticky band
          // that belongs to another thread's run.
          if (typeof applyStickyBandForActiveThread === 'function') applyStickyBandForActiveThread();
          updateInputPlaceholder();
          focusInputSoon();
        });
      }

      const delBtn = gh.querySelector('.gbtn.del');
      if (delBtn) {
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.__confirmRemoveProjectPath = repoPath;
          renderSidebar();
        });
      }

      const yesBtn = gh.querySelector('.gconfirm .y');
      const noBtn = gh.querySelector('.gconfirm .n');
      if (noBtn) {
        noBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.__confirmRemoveProjectPath = '';
          renderSidebar();
        });
      }
      if (yesBtn) {
        yesBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          // remove project from state.repos
          state.repos = Array.isArray(state.repos) ? state.repos : [];
          state.repos = state.repos.filter(r => String(r?.path || '') !== String(repoPath));
          window.ZONE_REPOS = state.repos;

          // Persist updated list; also clean up the legacy key if present.
          try { localStorage.setItem(LS_REPOS, JSON.stringify(state.repos)); } catch {}
          try { localStorage.removeItem(LS_REPO_HISTORY); } catch {}

          // remove all threads for that project
          state.threads = (Array.isArray(state.threads) ? state.threads : []).filter(t => String(t?.repoPath || '') !== String(repoPath));
          saveThreads();
          if (state.activeThreadId && !state.threads.some(t => t.id === state.activeThreadId)) {
            state.activeThreadId = state.threads[0]?.id || null;
          }
          if (state.activeRepo && String(state.activeRepo.path) === String(repoPath)) {
            state.activeRepo = state.repos[0] || null;
            els.repoChipName.textContent = state.activeRepo?.name || 'No project';
          }
          state.__confirmRemoveProjectPath = '';
          ensureRepos();
          renderSidebar();
          renderActiveThread();
        });
      }

      const list = document.createElement('div');
      list.className = 'threads';
      threads.forEach(t => list.appendChild(renderThreadItem(t)));
      g.appendChild(gh);
      g.appendChild(list);
      return g;
    }

    function renderThreadItem(t){
      const b = document.createElement('button');
      b.type = 'button';
      // Multi-active-thread Phase 1a: pulse fires for any thread with an
      // in-flight run (will scale to N concurrent threads in Phase 1b).
      const isRunningThread = state.runsByThread.has(t.id);
      b.className = 'thread ' + (t.id === state.activeThreadId ? 'active ' : '') + (isRunningThread ? 'thread-running' : '');
      b.dataset.threadId = String(t.id || '');
      b.innerHTML = `
        <span class="tdot"></span>
        <span class="tname">${escapeHtml(t.title || 'Untitled')}</span>
        <span class="ttime">${fmtRelative(t.createdAt || Date.now())}</span>
        <button type="button" class="gbtn del t-del" title="Delete thread" aria-label="Delete thread">×</button>
      `;
      const delBtn = b.querySelector('.t-del');
      if (delBtn) {
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.threads = (Array.isArray(state.threads) ? state.threads : []).filter(x => x.id !== t.id);
          saveThreads();
          if (state.activeThreadId === t.id) state.activeThreadId = state.threads[0]?.id || null;
          renderSidebar();
          renderActiveThread();
        });
      }
      b.addEventListener('click', () => activateThread(t.id));
      return b;
    }

    function escapeHtml(s){
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ---- LLM provider + API key management (Tur 3) ----
    function getApiKeys(){
      try { return JSON.parse(localStorage.getItem('zoneApiKeys') || '{}') || {}; }
      catch { return {}; }
    }
    function setApiKey(provider, value){
      const keys = getApiKeys();
      const trimmed = (value || '').trim();
      if (trimmed) {
        keys[provider] = trimmed;
      } else {
        delete keys[provider];
      }
      try {
        if (Object.keys(keys).length === 0) {
          localStorage.removeItem('zoneApiKeys');
        } else {
          localStorage.setItem('zoneApiKeys', JSON.stringify(keys));
        }

    }
    function getActiveProvider(){

      try { v = localStorage.getItem('zoneActiveProvider'); } catch {}
      return v === 'openai' ? 'openai' : 'anthropic';
    }
    function setActiveProvider(provider){
      if (provider !== 'openai' && provider !== 'anthropic') return;
      try { localStorage.setItem('zoneActiveProvider', provider); } catch {}
    }
    function getActiveApiKey(){
      return getApiKeys()[getActiveProvider()] || '';
    }

    function getModelOption(provider, modelId){

    function getActiveModels(){

    /**
     * Tur P1-approval: ApprovalPrompt — sticky command-approval UI.
     * Replaces the inline "Run this command?" card. One prompt at a time;
     * additional approvals queue. Approve/Reject POST to /api/approve-command
     * with the same payload shape as the inline path. Trust all is scoped
     * server-side to the active run.
     * Keyboard: Approve focused by default; Y/T/N and Enter/Escape trigger the
     * visible approval widget unless the user is typing in a text field.
     */
    const __zoneApprovalQueue = [];
    let __zoneActiveApproval = null;

    function getActiveApprovalWidget(){
      const sticky = document.querySelector('#zoneApprovalStickyContainer[data-state="visible"] .approval-widget');
      if (sticky) return sticky;
      return document.querySelector('.exec-summary-approval-widget .approval-widget');
    }

    function cleanupApprovalHotkeys(widget){
      if (!widget) return;
      try {
        if (typeof widget._cleanupHotkeys === 'function') widget._cleanupHotkeys();
      } catch {}
      try { widget._cleanupHotkeys = null; } catch {}
    }

    function attachApprovalHotkeys(widget){
      if (!widget) return () => {};
      cleanupApprovalHotkeys(widget);
      const handler = (e) => {
        if (!document.body.contains(widget)) {
          cleanupApprovalHotkeys(widget);
          return;
        }
        if (getActiveApprovalWidget() !== widget) return;
        const tag = String(document.activeElement?.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea') return;
        let action = null;
        if (e.key === 'y' || e.key === 'Y' || e.key === 'Enter') action = 'approve';
        else if (e.key === 't' || e.key === 'T') action = 'trust_all';
        else if (e.key === 'n' || e.key === 'N' || e.key === 'Escape') action = 'reject';
        if (!action) return;
        e.preventDefault();
        const btn = widget.querySelector(`[data-action="${action}"]`);
        if (btn) btn.click();
      };
      document.addEventListener('keydown', handler);
      const cleanup = () => document.removeEventListener('keydown', handler);
      widget._cleanupHotkeys = cleanup;
      return cleanup;
    }

    class ZoneApprovalPrompt {
      constructor(containerEl, payload, callbacks){
        this.container = containerEl;
        this.payload = payload;
        this.callbacks = callbacks || {};
        this._dismissed = false;
        this._render();
        this._hotkeyCleanup = attachApprovalHotkeys(this._widget);
        this._setFocus(this._approveBtn);
      }
      _render(){
        const cmd = String(this.payload.command || '');
        this.container.innerHTML =
          '<div class="zone-approval-sticky-header"><span class="bolt">$</span><span>Run this command?</span></div>' +
          '<div class="zone-approval-sticky-command">' + escapeHtml('$ ' + cmd) + '</div>' +
          '<div class="zone-approval-sticky-actions approval-widget" data-run-id="' + escapeHtml(String(this.payload.runId || '')) + '">' +
            '<button type="button" class="approval-btn approve" data-action="approve" title="Approve (Y)"><kbd>Y</kbd> Approve</button>' +
            '<button type="button" class="approval-btn trust-all" data-action="trust_all" title="Trust all commands for this run (T)"><kbd>T</kbd> Trust all session</button>' +
            '<button type="button" class="approval-btn reject" data-action="reject" title="Reject (N)"><kbd>N</kbd> Reject</button>' +
          '</div>' +
          '<div class="zone-approval-sticky-status" data-role="status"></div>';
        this._widget = this.container.querySelector('.approval-widget');

        this._approveBtn.addEventListener('click', () => { this._decide('approve'); });
        this._trustAllBtn.addEventListener('click', () => { this._decide('trust_all'); });
        this._rejectBtn.addEventListener('click', () => { this._decide('reject'); });
      }
      _setFocus(btn){
        this._approveBtn?.removeAttribute('data-focus');
        this._trustAllBtn?.removeAttribute('data-focus');
        this._rejectBtn?.removeAttribute('data-focus');
        if (btn){
          btn.setAttribute('data-focus', 'true');
          try { btn.focus({ preventScroll: true }); } catch { try { btn.focus(); } catch {} }
        }
      }
      _decide(action){
        if (this._dismissed) return;
        this._dismissed = true;
        const approved = action === 'approve' || action === 'trust_all';
        if (this._approveBtn) this._approveBtn.disabled = true;
        if (this._trustAllBtn) this._trustAllBtn.disabled = true;
        if (this._rejectBtn) this._rejectBtn.disabled = true;
        if (this.callbacks.onDecide){
          try { this.callbacks.onDecide(this.payload, action, !!approved); } catch {}
        }
        this._teardown();
      }
      _teardown(){
        cleanupApprovalHotkeys(this._widget);
        const stickyContainer = this.container;
        if (stickyContainer && stickyContainer.id === 'zoneApprovalStickyContainer'){
          stickyContainer.dataset.state = 'hidden';
          stickyContainer.innerHTML = '';
          // Multi-active-thread Phase 1a: clear ownership tags so stale
          // runId/threadId don't trigger gating on the next thread switch.
          try { delete stickyContainer.dataset.runId; } catch {}
          try { delete stickyContainer.dataset.threadId; } catch {}
        }
      }
      forceDismiss(){
        if (this._dismissed) return;
        this._dismissed = true;
        this._teardown();
      }
    }

    function handleZoneApprovalEvent(approvalEvt, runId, logBlock){
      const approvalId = String(approvalEvt.approvalId || '');
      const command = String(approvalEvt.command || '');
      if (!approvalId || !command) return;
      const payload = { approvalId, command, runId };
      if (__zoneActiveApproval){
        __zoneApprovalQueue.push(payload);
        return;
      }
      __zoneRenderApproval(payload);
    }

    function __zoneRenderApproval(payload){
      const container = document.getElementById('zoneApprovalStickyContainer');
      if (!container) return;
      // Multi-active-thread Phase 1a: tag the container with the run/thread
      // that owns this approval so applyStickyBandForActiveThread can hide
      // it when the user switches to a different thread.
      try {
        const apprRunId = String(payload?.runId || '');
        if (apprRunId) {
          container.dataset.runId = apprRunId;
          const owner = (typeof getThreadIdForRunId === 'function')
            ? (getThreadIdForRunId(apprRunId) || state.activeThreadId)
            : state.activeThreadId;
          if (owner) container.dataset.threadId = String(owner);
        }
      } catch {}
      container.dataset.state = approvalIsForActiveThread(payload?.runId) ? 'visible' : 'hidden';
      __zoneActiveApproval = new ZoneApprovalPrompt(container, payload, {
        onDecide: (p, action, approved) => {
          // Mirror the summary-widget cleanup so the per-run summary stops
          // showing the duplicate approval entry once the decision is made.
          try {
            const summary = (typeof ensureExecutionSummaryState === 'function') ? ensureExecutionSummaryState(p.runId) : null;
            if (summary && summary.categories && summary.categories.run){
              for (const entry of Object.values(summary.categories.run.entries || {})){
                const idx = (entry.pendingApprovals || []).indexOf(p.approvalId);
                if (idx !== -1) entry.pendingApprovals.splice(idx, 1);
              }
              try { renderExecutionSummaryCategory(p.runId, 'run'); } catch {}
            }
          } catch {}
          // Status line in the run log.
          try {
            const lb = document.getElementById('logBlock-' + p.runId);
            if (lb) {
              if (action === 'trust_all') {
                appendCommandAutoApprovedLine(lb, { timestamp: nowTs(), command: p.command });
              } else {
                appendLogLine(lb, { timestamp: nowTs(), message: (approved ? 'Approved: $ ' : 'Rejected: $ ') + p.command, status: approved ? 'done' : 'warning' });
              }
            }
          } catch {}
          void (async () => {
            try {
              await apiFetch('/api/approve-command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  approvalId: p.approvalId,
                  action,
                  approved: !!approved,
                  runId: p.runId,
                })
              });
            } catch {}
          })();
          __zoneActiveApproval = null;
          __zoneProcessApprovalQueue();
        },
      });
    }

    function __zoneProcessApprovalQueue(){
      if (__zoneApprovalQueue.length === 0) return;
      const next = __zoneApprovalQueue.shift();
      // Tiny gap so the dismiss-then-show transition reads visually.
      setTimeout(() => { __zoneRenderApproval(next); }, 100);
    }

    function dismissAllZoneApprovalsForRun(runId){
      const container = document.getElementById('zoneApprovalStickyContainer');
      if (__zoneActiveApproval){
        if (!runId || (__zoneActiveApproval.payload && __zoneActiveApproval.payload.runId === runId)){
          __zoneActiveApproval.forceDismiss();
          __zoneActiveApproval = null;
        }
      }
      if (runId){
        for (let i = __zoneApprovalQueue.length - 1; i >= 0; i -= 1){
          if (__zoneApprovalQueue[i].runId === runId) __zoneApprovalQueue.splice(i, 1);
        }
      } else {
        __zoneApprovalQueue.length = 0;
      }
      if (container && !__zoneActiveApproval){
        container.querySelectorAll('.approval-widget').forEach((widget) => cleanupApprovalHotkeys(widget));
        container.dataset.state = 'hidden';
        container.innerHTML = '';
      }
    }
