<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zone execution prototype</title>
  <style>
    :root {
      --bg-primary: #13171c;
      --bg-secondary: rgba(148, 163, 184, 0.04);
      --bg-tertiary: rgba(148, 163, 184, 0.08);
      --text-primary: #e5e7eb;
      --text-secondary: #9ca3af;
      --text-tertiary: #6b7280;
      --border-subtle: rgba(148, 163, 184, 0.15);
      --border-medium: rgba(148, 163, 184, 0.25);
      --success-bg: rgba(34, 197, 94, 0.12);
      --success-fg: rgb(74, 222, 128);
      --warning-bg: rgba(234, 179, 8, 0.12);
      --warning-fg: rgb(250, 204, 21);
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-fg: rgb(248, 113, 113);
      --neutral-bg: rgba(148, 163, 184, 0.12);
      --neutral-fg: rgb(148, 163, 184);
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "Menlo", monospace;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * { box-sizing: border-box; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }

    .scenario-picker {
      margin-bottom: 2rem;
      padding: 1rem;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .scenario-picker label {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .scenario-picker select {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 0.5px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-family: inherit;
      font-size: 13px;
    }

    .user-row {
      display: flex;
      justify-content: flex-end;
      margin: 1rem 0;
    }
    .user-bubble {
      max-width: 80%;
      background: var(--bg-tertiary);
      border: 0.5px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .user-bubble code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: rgba(148, 163, 184, 0.08);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .zone-prose {
      font-size: 14px;
      line-height: 1.7;
      margin: 1rem 0;
      color: var(--text-primary);
    }
    .zone-prose p { margin: 0 0 0.75rem; }
    .zone-prose code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: rgba(148, 163, 184, 0.10);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .timeline {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      margin: 1rem 0;
      padding-left: 12px;
      border-left: 2px solid var(--border-subtle);
    }
    .timeline-line { padding: 3px 0; }
    .timeline-line.active { color: var(--text-primary); }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .status-pill {
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 12px;
    }
    .status-pill.success { background: var(--success-bg); color: var(--success-fg); }
    .status-pill.warning { background: var(--warning-bg); color: var(--warning-fg); }
    .status-pill.danger { background: var(--danger-bg); color: var(--danger-fg); }
    .status-pill.neutral { background: var(--neutral-bg); color: var(--neutral-fg); }
    .status-dot { color: var(--text-tertiary); }
    .status-note { color: var(--text-secondary); }
    .status-spacer { flex: 1; }
    .status-files { color: var(--text-secondary); }
    .status-add { color: var(--success-fg); }
    .status-del { color: var(--danger-fg); }

    .diff-list { display: flex; flex-direction: column; gap: 6px; margin: 0.5rem 0; }
    .diff-item { display: flex; flex-direction: column; }
    .diff-card {
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      box-shadow: none;
      color: inherit;
      font-family: inherit;
    }
    .diff-card:hover { border-color: rgba(148, 163, 184, 0.2); }
    .diff-card .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .diff-card .chevron { width: 12px; height: 12px; color: var(--text-tertiary); transition: transform 0.15s; flex: 0 0 12px; }
    .diff-card.expanded .chevron { transform: rotate(90deg); }
    .diff-card .path { font-family: var(--font-mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .diff-card .right { display: flex; align-items: center; gap: 10px; font-size: 12px; flex: 0 0 auto; }
    .diff-expanded {
      padding: 12px 16px;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-subtle);
      border-top: none;
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      margin-top: -1px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
    }
    .diff-expanded[hidden] { display: none; }

    .auto-applied-note {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 0.5px solid var(--border-subtle);
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 0.5px solid var(--border-subtle);
    }
    .btn {
      padding: 8px 16px;
      font-size: 13px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: inherit;
      border: 0.5px solid var(--border-medium);
    }
    .btn-secondary { background: transparent; color: var(--text-primary); }
    .btn-secondary:hover { background: var(--bg-tertiary); }
    .btn-primary { background: var(--text-primary); color: var(--bg-primary); border-color: var(--text-primary); font-weight: 500; }
    .btn-primary:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="scenario-picker">
    <label for="scenario">Scenario:</label>
    <select id="scenario">
      <option value="active">Active execution (running)</option>
      <option value="success" selected>Completed - tests passed</option>
      <option value="skipped">Completed - tests skipped (no infra)</option>
      <option value="inconclusive">Completed - tests inconclusive</option>
      <option value="failed">Completed - tests failed (user code)</option>
      <option value="blocked">Completed - blocked</option>
    </select>
  </div>

  <div id="root"></div>

  <script>
    const SCENARIOS = {
      active: {
        state: 'running',
        userPrompt: 'Rename the exported function `hasClerkEnv` in `lib/env.ts` to `isClerkConfigured`',
        zoneProse: 'Renaming `hasClerkEnv` across the project. Finding consumers, updating each import and call site, then running tests.',
        timeline: [
          { text: 'read lib/env.ts', active: false },
          { text: 'found 5 consumers via find_references', active: false },
          { text: 'patched lib/env.ts', active: false },
          { text: 'patched app/page.tsx', active: false },
          { text: 'patching app/dashboard/page.tsx...', active: true },
        ],
      },
      success: {
        state: 'completed',
        decision: 'safe_to_apply',
        userPrompt: 'Rename the exported function `hasClerkEnv` in `lib/env.ts` to `isClerkConfigured`',
        zoneProse: 'Renamed `hasClerkEnv` to `isClerkConfigured` across the codebase. The export in `lib/env.ts` and the import + call site in `app/page.tsx` are updated. All 13 tests pass.',
        status: {
          decision: { label: 'Safe to apply', tone: 'success' },
          reason: { label: 'Tests passed', tone: 'success' },
          note: 'ready to merge',
          fileCount: 2,
          linesAdded: 1,
          linesRemoved: 1,
        },
        files: [
          { path: 'lib/env.ts', added: 1, removed: 1, body: 'diff content stub' },
          { path: 'app/page.tsx', added: 1, removed: 1, body: 'diff content stub' },
        ],
      },
      skipped: {
        state: 'completed',
        decision: 'safe_to_apply',
        userPrompt: 'Rename `hasClerkEnv` to `isClerkConfigured` across the codebase',
        zoneProse: 'Renamed `hasClerkEnv` to `isClerkConfigured` in 6 files. No test infrastructure detected, so verification was skipped - disk writes look clean.',
        status: {
          decision: { label: 'Safe to apply', tone: 'success' },
          reason: { label: 'Tests skipped', tone: 'warning' },
          note: 'no test infrastructure',
          fileCount: 6,
          linesAdded: 6,
          linesRemoved: 6,
        },
        files: [
          { path: 'lib/env.ts', added: 1, removed: 1, body: 'stub' },
          { path: 'proxy.ts', added: 1, removed: 1, body: 'stub' },
          { path: 'app/page.tsx', added: 1, removed: 1, body: 'stub' },
          { path: 'app/dashboard/page.tsx', added: 1, removed: 1, body: 'stub' },
          { path: 'app/sign-in/[[...sign-in]]/page.tsx', added: 1, removed: 1, body: 'stub' },
          { path: 'app/sign-up/[[...sign-up]]/page.tsx', added: 1, removed: 1, body: 'stub' },
        ],
      },
      inconclusive: {
        state: 'completed',
        decision: 'preview_only',
        userPrompt: 'Refactor the data layer to use the new query builder',
        zoneProse: 'Updated 3 files to use the new query builder. Tests failed because of a missing OPENAI_API_KEY in the test environment, which is unrelated to the changes.',
        status: {
          decision: { label: 'Preview only', tone: 'warning' },
          reason: { label: 'Tests inconclusive', tone: 'warning' },
          note: 'review diff before applying',
          fileCount: 3,
          linesAdded: 8,
          linesRemoved: 4,
        },
        files: [
          { path: 'lib/queries/users.ts', added: 4, removed: 2, body: 'stub' },
          { path: 'lib/queries/projects.ts', added: 3, removed: 1, body: 'stub' },
          { path: 'lib/queries/index.ts', added: 1, removed: 1, body: 'stub' },
        ],
      },
      failed: {
        state: 'completed',
        decision: 'preview_only',
        userPrompt: 'Add validation to the signup form',
        zoneProse: 'Added Zod validation to the signup form. Two tests failed in the signup test suite - the validation rules conflict with the existing test fixtures, which use shorter passwords than the new minimum.',
        status: {
          decision: { label: 'Preview only', tone: 'warning' },
          reason: { label: 'Tests failed (user code)', tone: 'danger' },
          note: 'do not apply',
          fileCount: 2,
          linesAdded: 14,
          linesRemoved: 2,
        },
        files: [
          { path: 'app/signup/form.tsx', added: 12, removed: 1, body: 'stub' },
          { path: 'app/signup/validation.ts', added: 2, removed: 1, body: 'stub' },
        ],
      },
      blocked: {
        state: 'completed',
        decision: 'blocked',
        userPrompt: 'Delete all migration files older than 6 months',
        zoneProse: 'Identified 12 migration files older than 6 months. Deletion blocked by the safety policy because removing migrations can corrupt downstream environments - defer to a manual review.',
        status: {
          decision: { label: 'Blocked', tone: 'danger' },
          reason: { label: 'Safety policy', tone: 'danger' },
          note: 'manual review required',
          fileCount: 0,
        },
        files: [],
      },
    };

    const root = document.getElementById('root');
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const renderInlineCode = (text) => escapeHtml(text).replace(/`([^`]+)`/g, (_match, code) => `<code>${escapeHtml(code)}</code>`);

    function renderUserBubble(text) {
      return `<div class="user-row"><div class="user-bubble">${renderInlineCode(text)}</div></div>`;
    }

    function renderZoneProse(text) {
      return `<div class="zone-prose"><p>${renderInlineCode(text)}</p></div>`;
    }

    function renderTimeline(lines) {
      const items = (Array.isArray(lines) ? lines : [])
        .map((line) => `<div class="timeline-line ${line.active ? 'active' : ''}">${escapeHtml(line.text)}</div>`)
        .join('');
      return `<div class="timeline">${items}</div>`;
    }

    function renderStatusBar(status) {
      if (!status) return '';
      const hasFiles = Number(status.fileCount || 0) > 0;
      const fileSeg = hasFiles
        ? `<span class="status-spacer"></span>
           <span class="status-files">${status.fileCount} file${status.fileCount === 1 ? '' : 's'}</span>
           <span class="status-dot">&middot;</span>
           <span class="status-add">+${Math.abs(Number(status.linesAdded || 0))}</span>
           <span class="status-del">&minus;${Math.abs(Number(status.linesRemoved || 0))}</span>`
        : '<span class="status-spacer"></span>';
      return `
        <div class="status-bar">
          <span class="status-pill ${escapeHtml(status.decision.tone)}">${escapeHtml(status.decision.label)}</span>
          <span class="status-pill ${escapeHtml(status.reason.tone)}">${escapeHtml(status.reason.label)}</span>
          ${status.note ? `<span class="status-dot">&middot;</span><span class="status-note">${escapeHtml(status.note)}</span>` : ''}
          ${fileSeg}
        </div>
      `;
    }

    function renderDiffCards(files) {
      const list = Array.isArray(files) ? files : [];
      if (list.length === 0) return '';
      return `<div class="diff-list">${list.map((file, i) => `
        <div class="diff-item">
          <button class="diff-card" data-idx="${i}">
            <span class="left">
              <svg class="chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4 4 7 7 4 10"/></svg>
              <span class="path">${escapeHtml(file.path)}</span>
            </span>
            <span class="right">
              <span class="status-add">+${Math.abs(Number(file.added || 0))}</span>
              <span class="status-del">&minus;${Math.abs(Number(file.removed || 0))}</span>
            </span>
          </button>
          <div class="diff-expanded" hidden>${escapeHtml(file.path)} - ${escapeHtml(file.body || 'diff content here')}</div>
        </div>
      `).join('')}</div>`;
    }

    function renderAutoAppliedNote(scenario) {
      if (scenario.state !== 'completed' || scenario.decision !== 'safe_to_apply') return '';
      return `
        <div class="auto-applied-note">
          Applied automatically.
        </div>
      `;
    }

    function renderFooter(scenario) {
      if (scenario.state !== 'completed') return '';
      if (scenario.decision !== 'preview_only') return '';
      return `
        <div class="footer-actions">
          <button class="btn btn-secondary">Reject</button>
          <button class="btn btn-primary">Apply patch</button>
        </div>
      `;
    }

    function render(scenarioKey) {
      const scenario = SCENARIOS[scenarioKey] || SCENARIOS.success;
      root.innerHTML = [
        renderUserBubble(scenario.userPrompt),
        renderZoneProse(scenario.zoneProse),
        scenario.state === 'running' ? renderTimeline(scenario.timeline) : '',
        scenario.state === 'completed' ? renderStatusBar(scenario.status) : '',
        scenario.state === 'completed' ? renderDiffCards(scenario.files) : '',
        renderAutoAppliedNote(scenario),
        renderFooter(scenario),
      ].join('');
      root.querySelectorAll('.diff-card').forEach((button) => {
        button.addEventListener('click', () => {
          button.classList.toggle('expanded');
          const expanded = button.parentElement ? button.parentElement.querySelector('.diff-expanded') : null;
          if (expanded) expanded.hidden = !expanded.hidden;
        });
      });
    }

    document.getElementById('scenario').addEventListener('change', (event) => render(event.target.value));
    render('success');
  </script>
</body>
</html>
